                }
            }
        }

        function hitTestKeypad(canvasX, canvasY) {
            if (keypadSlideProgress < 1) return -1;
            for (let i = 0; i < KEYPAD_BUTTONS.length; i++) {
                const rect = getKeypadButtonRect(i);
                if (canvasX >= rect.x && canvasX <= rect.x + rect.w &&
                    canvasY >= rect.y && canvasY <= rect.y + rect.h) {
                    return i;
                }
            }
            return -1;
        }

        function hitTestKeypadReset(canvasX, canvasY) {
            if (keypadSlideProgress < 1) return false;
            const rect = getKeypadResetButtonRect();
            return canvasX >= rect.x && canvasX <= rect.x + rect.w &&
                   canvasY >= rect.y && canvasY <= rect.y + rect.h;
        }

        function hitTestKeypadLevelSelect(canvasX, canvasY) {
            if (keypadSlideProgress < 1) return false;
            const rect = getKeypadLevelSelectButtonRect();
            return canvasX >= rect.x && canvasX <= rect.x + rect.w &&
                   canvasY >= rect.y && canvasY <= rect.y + rect.h;
        }

        function isPointInKeypadPanel(canvasX, canvasY) {
            const { panelW, panelH } = getKeypadDimensions();
            const { x: panelX, y: panelY } = getKeypadPosition();
            return canvasX >= panelX && canvasX <= panelX + panelW &&
                   canvasY >= panelY && canvasY <= panelY + panelH;
        }

        function handleKeypadPress(index) {
            const btn = KEYPAD_BUTTONS[index];
            if (btn.type === 'number') {
                if (keypadInputValue.length < 2) {
                    keypadInputValue += btn.label;
                }
            } else if (btn.type === 'delete') {
                keypadInputValue = keypadInputValue.slice(0, -1);
            } else if (btn.type === 'submit') {
                if (keypadInputValue && selectedRunMathFact) {
                    startFeedbackAnimation();
                }
            }
        }

        function startFeedbackAnimation() {
            const train = trainAnimations.find(t => t.trainId === selectedRunMathFact.trainId);
            if (!train) return;

            const mid = selectedRunMathFact.middleCarIndex;
            const term1 = train.text[mid - 1];
            const operation = train.text[mid];
            const term2 = train.text[mid + 1];

            let correctAnswer;
            if (operation === '+') {
                correctAnswer = parseInt(term1) + parseInt(term2);
            } else if (operation === '×') {
                correctAnswer = parseInt(term1) * parseInt(term2);
            } else if (operation === '÷') {
                correctAnswer = parseInt(term1) / parseInt(term2);
            } else {
                correctAnswer = parseInt(term1) - parseInt(term2);
            }

            const playerAnswer = parseInt(keypadInputValue);
            const isCorrect = playerAnswer === correctAnswer;

            // Get the input box screen position (center)
            const contentTop = getKeypadContentTop();
            const { panelW, contentW } = getKeypadDimensions();
            const { x: panelX, y: panelY } = getKeypadPosition();
            const inputX = panelX + KEYPAD_PADDING + (contentW - KEYPAD_INPUT_WIDTH) / 2 + KEYPAD_INPUT_WIDTH / 2;
            const inputY = contentTop + KEYPAD_INPUT_HEIGHT / 2;

            // Get the operation car world position
            let cumulativeSpacing = 0;
            for (let i = 0; i < mid; i++) {
                const spacingVal = train.spacing[i] != null ? train.spacing[i] : 59;
                cumulativeSpacing += spacingVal;
            }
            const carDist = Math.max(0, train.headDistance - cumulativeSpacing);
            const opCarWorldPos = getPositionAlongPath(train.path, carDist);

            // Convert operation car world pos to screen coords
            const opCarScreenX = opCarWorldPos.x - cameraX;
            const opCarScreenY = opCarWorldPos.y - cameraY;

            feedbackAnim = {
                step: 1,
                frame: 0,
                trainId: selectedRunMathFact.trainId,
                middleCarIndex: mid,
                playerAnswer: keypadInputValue,
                isCorrect: isCorrect,
                // Step 1: animate from input to operation car
                startX: inputX,
                startY: inputY,
                endX: opCarScreenX,
                endY: opCarScreenY,
                // Durations (in frames at 60fps)
                step1Duration: 20,
                step2Duration: 13,
                step3Duration: 30,
                step4Duration: isCorrect ? 13 : 13
            };

            // Enter animation state
            runModeState = 'animation';
            keypadVisible = false;
            keypadInputValue = '';
        }

        function updateFeedbackAnimation() {
            if (!feedbackAnim) return;

            feedbackAnim.frame += dt;

            if (feedbackAnim.step === 1 && feedbackAnim.frame > feedbackAnim.step1Duration) {
                feedbackAnim.step = 2;
                feedbackAnim.frame = 0;
            } else if (feedbackAnim.step === 2 && feedbackAnim.frame > feedbackAnim.step2Duration) {
                feedbackAnim.step = 3;
                feedbackAnim.frame = 0;
            } else if (feedbackAnim.step === 3 && feedbackAnim.frame > feedbackAnim.step3Duration) {
                feedbackAnim.step = 4;
                feedbackAnim.frame = 0;
            } else if (feedbackAnim.step === 4 && feedbackAnim.frame > feedbackAnim.step4Duration) {
                finishFeedbackAnimation();
            }
        }

        function finishFeedbackAnimation() {
            if (!feedbackAnim) return;

            if (feedbackAnim.isCorrect) {
                solved_count++;

                // Tile reveal and spawn animations run side by side. The train
                // itself still waits for the reveal to finish — see
                // updateSpawnAnimations().
                startTileFadeIn();
                checkSpawnOnSolvedCount();
                checkBurnOutOnSolvedCount();
                const train = trainAnimations.find(t => t.trainId === feedbackAnim.trainId);
                if (train) {
                    const mid = feedbackAnim.middleCarIndex;
                    const carsToRemove = [mid - 1, mid, mid + 1].filter(i => i >= 0 && i < train.numCars);

                    if (carsToRemove.length >= train.numCars) {
                        // All cars removed — delete the entire train
                        const idx = trainAnimations.indexOf(train);
                        if (idx !== -1) trainAnimations.splice(idx, 1);
                    } else {
                        // Calculate headDistance adjustment if front cars are removed
                        // The new car 0 should stay at its current position
                        const firstRemainingCar = Math.max(...carsToRemove) + 1 < train.numCars
                            ? 0 : carsToRemove[0]; // which end are we removing from?
                        // Find the first car index that will remain after removal
                        let newHeadIndex = 0;
                        while (carsToRemove.includes(newHeadIndex) && newHeadIndex < train.numCars) {
                            newHeadIndex++;
                        }
                        // If front cars are being removed, adjust headDistance
                        if (newHeadIndex > 0) {
                            let distToNewHead = 0;
                            for (let i = 0; i < newHeadIndex; i++) {
                                const spacingVal = train.spacing[i] != null ? train.spacing[i] : 59;
                                distToNewHead += spacingVal;
                            }
                            train.headDistance -= distToNewHead;
                        }

                        // Remove the 3 cars from the train arrays (splice from highest index first)
                        for (let r = carsToRemove.length - 1; r >= 0; r--) {
                            const ci = carsToRemove[r];
                            if (train.text) train.text.splice(ci, 1);
                            if (train.drag) train.drag.splice(ci, 1);
                            // Spacing: remove the gap that connected this car
                            // For car ci, remove spacing[ci-1] if it exists (gap before this car)
                            // except for car 0, remove spacing[0] (gap after it)
                            if (train.spacing) {
                                const si = ci > 0 ? ci - 1 : 0;
                                if (si < train.spacing.length) train.spacing.splice(si, 1);
                            }
                        }
                        train.numCars -= carsToRemove.length;
                    }

                    // Splice mathFacts on the instance
                    if (train.mathFacts) {
                        for (let r = carsToRemove.length - 1; r >= 0; r--) {
                            train.mathFacts.splice(carsToRemove[r], 1);
                        }
                    }
                }
            }

            if (feedbackAnim.isCorrect) {
                // The solved triplet is gone, so drop the selection and look for
                // the next train waiting at a stop.
                selectedRunMathFact = null;

                for (let i = 0; i < trainAnimations.length; i++) {
                    const t = trainAnimations[i];
                    if (t.speed !== 0) continue;
                    const atFrontStop = hasStopTileBeyond(t.frontGridX, t.frontGridY, t.frontDirection);
                    const atBackStop = hasStopTileBeyond(t.backGridX, t.backGridY, t.backDirection);
                    if (atFrontStop || atBackStop) {
                        const dir = atFrontStop ? 'forward' : 'backward';
                        const closestMathFact = findClosestMathFactToStop(t, dir);
                        if (closestMathFact !== null) {
                            selectedRunMathFact = { trainId: t.trainId, middleCarIndex: closestMathFact };
                            keypadVisible = true;
                            calculateKeypadTargetCamera();
                            break;
                        }
                    }
                }
            } else {
                // Wrong answer: keep the problem selected and the keypad up so it
                // can be answered again straight away.
                keypadVisible = true;
                keypadInputValue = '';
            }

            feedbackAnim = null;
            runModeState = 'gameplay';
        }

        function drawFeedbackAnimation(ctx) {
            if (!feedbackAnim) return;

            const train = trainAnimations.find(t => t.trainId === feedbackAnim.trainId);
            if (!train) return;

            const mid = feedbackAnim.middleCarIndex;
            const progress = feedbackAnim.frame / (feedbackAnim.step === 1 ? feedbackAnim.step1Duration :
                feedbackAnim.step === 2 ? feedbackAnim.step2Duration :
                feedbackAnim.step === 3 ? feedbackAnim.step3Duration : feedbackAnim.step4Duration);
            const clampedProgress = Math.min(1, Math.max(0, progress));

            // Get current car positions in world space
            const carPositions = [];
            const carDistances = [];
            let cumulativeSpacing = 0;
            for (let i = 0; i < train.numCars; i++) {
                if (i > 0) {
                    const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                    cumulativeSpacing += spacingVal;
                }
                const carDist = Math.max(0, train.headDistance - cumulativeSpacing);
                carPositions.push(getPositionAlongPath(train.path, carDist));
                carDistances.push(carDist);
            }

            const opCarWorld = carPositions[mid];
            const opCarScreenX = opCarWorld.x - cameraX;
            const opCarScreenY = opCarWorld.y - cameraY;

            // Determine color for steps 2-4
            const feedbackColor = feedbackAnim.isCorrect ? '#4ECEC5' : '#FF714E'; // train highlight

            const fontSize = train.textFontSize != null ? train.textFontSize : 22;

            if (feedbackAnim.step === 1) {
                // Step 1: math fact text fades out, answer animates from input to operation car
                const fadeAlpha = 1 - clampedProgress;

                // Draw fading math fact text in world space (camera is applied)
                const swap = mid - 1 >= 0 && mid + 1 < carPositions.length &&
                    shouldSwapMathFactTerms(carPositions[mid - 1], carPositions[mid]);
                ctx.save();
                ctx.translate(-cameraX, -cameraY);
                ctx.globalAlpha = fadeAlpha;
                ctx.fillStyle = '#000000';
                for (let i = mid - 1; i <= mid + 1; i++) {
                    let text = train.text[i];
                    if (swap && i === mid - 1) text = train.text[mid + 1];
                    else if (swap && i === mid + 1) text = train.text[mid - 1];
                    if (text && i < carPositions.length) {
                        fillCenteredTrainText(ctx, text, carPositions[i].x, carPositions[i].y, fontSize);
                    }
                }
                ctx.restore();

                // Draw answer animating from input panel to operation car (screen space)
                const eased = easeInOutCubic(clampedProgress);
                const animX = feedbackAnim.startX + (opCarScreenX - feedbackAnim.startX) * eased;
                const animY = feedbackAnim.startY + (opCarScreenY - feedbackAnim.startY) * eased;

                ctx.save();
                ctx.fillStyle = '#4ECEC5';
                fillCenteredTrainText(ctx, feedbackAnim.playerAnswer, animX, animY, fontSize);
                ctx.restore();

            } else if (feedbackAnim.step === 2) {
                // Step 2: answer is on the operation car (black text), cars turn feedback color
                // Draw colored car overlays in world space
                ctx.save();
                ctx.translate(-cameraX, -cameraY);
                // Correct answers fade the overlay in as the same-coloured highlight
                // fades out, so it doesn't pop on top of an identical colour.
                if (feedbackAnim.isCorrect) ctx.globalAlpha = clampedProgress;
                const size = TILE_SIZE - 4;
                const cornerRadius = 5;
                for (let i = mid - 1; i <= mid + 1; i++) {
                    if (i >= 0 && i < carPositions.length) {
                        const pos = carPositions[i];
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(pos.angle);
                        ctx.fillStyle = feedbackColor;
                        ctx.beginPath();
                        ctx.moveTo(-size/2 + cornerRadius, -size/2);
                        ctx.lineTo(size/2 - cornerRadius, -size/2);
                        ctx.arcTo(size/2, -size/2, size/2, -size/2 + cornerRadius, cornerRadius);
                        ctx.lineTo(size/2, size/2 - cornerRadius);
                        ctx.arcTo(size/2, size/2, size/2 - cornerRadius, size/2, cornerRadius);
                        ctx.lineTo(-size/2 + cornerRadius, size/2);
                        ctx.arcTo(-size/2, size/2, -size/2, size/2 - cornerRadius, cornerRadius);
                        ctx.lineTo(-size/2, -size/2 + cornerRadius);
                        ctx.arcTo(-size/2, -size/2, -size/2 + cornerRadius, -size/2, cornerRadius);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Draw colored connector stroke between the 3 cars
                if (mid - 1 >= 0 && mid + 1 < carDistances.length) {
                    const startDist = carDistances[mid + 1];
                    const endDist = carDistances[mid - 1];
                    if (endDist > startDist) {
                        drawPathStroke(ctx, train.path, startDist, endDist, feedbackColor, 12);
                    }
                }

                ctx.restore();

                // Draw answer in black on operation car (screen space)
                ctx.save();
                ctx.fillStyle = '#000000';
                fillCenteredTrainText(ctx, feedbackAnim.playerAnswer, opCarScreenX, opCarScreenY, fontSize);
                ctx.restore();

            } else if (feedbackAnim.step === 3) {
                // Step 3: nod or shake animation, colored cars persist
                // Draw colored car overlays in world space
                ctx.save();
                ctx.translate(-cameraX, -cameraY);
                const size = TILE_SIZE - 4;
                const cornerRadius = 5;
                for (let i = mid - 1; i <= mid + 1; i++) {
                    if (i >= 0 && i < carPositions.length) {
                        const pos = carPositions[i];
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(pos.angle);
                        ctx.fillStyle = feedbackColor;
                        ctx.beginPath();
                        ctx.moveTo(-size/2 + cornerRadius, -size/2);
                        ctx.lineTo(size/2 - cornerRadius, -size/2);
                        ctx.arcTo(size/2, -size/2, size/2, -size/2 + cornerRadius, cornerRadius);
                        ctx.lineTo(size/2, size/2 - cornerRadius);
                        ctx.arcTo(size/2, size/2, size/2 - cornerRadius, size/2, cornerRadius);
                        ctx.lineTo(-size/2 + cornerRadius, size/2);
                        ctx.arcTo(-size/2, size/2, -size/2, size/2 - cornerRadius, cornerRadius);
                        ctx.lineTo(-size/2, -size/2 + cornerRadius);
                        ctx.arcTo(-size/2, -size/2, -size/2 + cornerRadius, -size/2, cornerRadius);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Draw colored connector stroke between the 3 cars
                if (mid - 1 >= 0 && mid + 1 < carDistances.length) {
                    const startDist = carDistances[mid + 1];
                    const endDist = carDistances[mid - 1];
                    if (endDist > startDist) {
                        drawPathStroke(ctx, train.path, startDist, endDist, feedbackColor, 12);
                    }
                }

                ctx.restore();

                // Nod or shake the answer text
                let offsetX_anim = 0;
                let offsetY_anim = 0;
                const amplitude = 8;
                const cycles = 3;
                const t = clampedProgress * cycles * Math.PI * 2;

                if (feedbackAnim.isCorrect) {
                    // Nodding: up and down
                    offsetY_anim = Math.sin(t) * amplitude;
                } else {
                    // Shaking: left and right
                    offsetX_anim = Math.sin(t) * amplitude;
                }

                ctx.save();
                ctx.fillStyle = '#000000';
                fillCenteredTrainText(ctx, feedbackAnim.playerAnswer, opCarScreenX + offsetX_anim, opCarScreenY + offsetY_anim, fontSize);
                ctx.restore();

            } else if (feedbackAnim.step === 4) {
                // Step 4: answer fades out, car colors return to normal, cars fade if correct
                const fadeAlpha = 1 - clampedProgress;

                ctx.save();
                ctx.translate(-cameraX, -cameraY);
                ctx.globalAlpha = fadeAlpha;
                const size = TILE_SIZE - 4;
                const cornerRadius = 5;

                // If correct, draw the fading train connector and cars
                if (feedbackAnim.isCorrect) {
                    // Draw fading gray connector stroke for the deleted segment
                    if (mid - 1 >= 0 && mid + 1 < carDistances.length) {
                        const gapStart = carDistances[mid + 1];
                        const gapEnd = carDistances[mid - 1];
                        if (gapEnd > gapStart) {
                            const fadedGray = hexToRgba('#252525', fadeAlpha);
                            drawPathStroke(ctx, train.path, gapStart, gapEnd, fadedGray, 16);
                        }
                    }

                    // Draw fading train cars
                    const trainType = TILE_TYPES.find(t => t.id === 'train');
                    for (let i = mid - 1; i <= mid + 1; i++) {
                        if (i >= 0 && i < carPositions.length) {
                            const pos = carPositions[i];
                            ctx.save();
                            ctx.translate(pos.x, pos.y);
                            ctx.rotate(pos.angle);
                            trainType.render(ctx, -size / 2, -size / 2, size);
                            ctx.restore();
                        }
                    }

                    // Draw fading black connector stroke for the deleted segment
                    if (mid - 1 >= 0 && mid + 1 < carDistances.length) {
                        const gapStart = carDistances[mid + 1];
                        const gapEnd = carDistances[mid - 1];
                        if (gapEnd > gapStart) {
                            const fadedBlack = hexToRgba('#000000', fadeAlpha);
                            drawPathStroke(ctx, train.path, gapStart, gapEnd, fadedBlack, 12);
                        }
                    }
                }

                // Draw fading colored car overlays
                for (let i = mid - 1; i <= mid + 1; i++) {
                    if (i >= 0 && i < carPositions.length) {
                        const pos = carPositions[i];
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(pos.angle);
                        ctx.fillStyle = feedbackColor;
                        ctx.beginPath();
                        ctx.moveTo(-size/2 + cornerRadius, -size/2);
                        ctx.lineTo(size/2 - cornerRadius, -size/2);
                        ctx.arcTo(size/2, -size/2, size/2, -size/2 + cornerRadius, cornerRadius);
                        ctx.lineTo(size/2, size/2 - cornerRadius);
                        ctx.arcTo(size/2, size/2, size/2 - cornerRadius, size/2, cornerRadius);
                        ctx.lineTo(-size/2 + cornerRadius, size/2);
                        ctx.arcTo(-size/2, size/2, -size/2, size/2 - cornerRadius, cornerRadius);
                        ctx.lineTo(-size/2, -size/2 + cornerRadius);
                        ctx.arcTo(-size/2, -size/2, -size/2 + cornerRadius, -size/2, cornerRadius);
                        ctx.closePath();
                        ctx.fill();
                        ctx.restore();
                    }
                }

                // Draw fading colored connector stroke between the 3 cars
                if (mid - 1 >= 0 && mid + 1 < carDistances.length) {
                    const startDist = carDistances[mid + 1];
                    const endDist = carDistances[mid - 1];
                    if (endDist > startDist) {
                        const fadedColor = hexToRgba(feedbackColor, fadeAlpha);
                        drawPathStroke(ctx, train.path, startDist, endDist, fadedColor, 12);
                    }
                }

                ctx.restore();

                // Draw fading answer text
                ctx.save();
                ctx.globalAlpha = fadeAlpha;
                ctx.fillStyle = '#000000';
                fillCenteredTrainText(ctx, feedbackAnim.playerAnswer, opCarScreenX, opCarScreenY, fontSize);
                ctx.restore();

                // Draw expanding afterimage (correct answers only)
                if (feedbackAnim.isCorrect) {
                    const baseSize = TILE_SIZE - 4;
                    const maxGrowth = 80;
                    const currentSize = baseSize + maxGrowth * clampedProgress;
                    const aiCornerRadius = 5 + 3 * clampedProgress;
                    const aiAlpha = 1 - clampedProgress;

                    ctx.save();
                    ctx.translate(-cameraX, -cameraY);
                    ctx.globalAlpha = aiAlpha;
                    ctx.strokeStyle = '#4ECEC5';
                    ctx.lineWidth = 4;

                    for (let i = mid - 1; i <= mid + 1; i++) {
                        if (i >= 0 && i < carPositions.length) {
                            const pos = carPositions[i];
                            ctx.save();
                            ctx.translate(pos.x, pos.y);
                            ctx.rotate(pos.angle);
                            const half = currentSize / 2;
                            ctx.beginPath();
                            ctx.moveTo(-half + aiCornerRadius, -half);
                            ctx.lineTo(half - aiCornerRadius, -half);
                            ctx.arcTo(half, -half, half, -half + aiCornerRadius, aiCornerRadius);
                            ctx.lineTo(half, half - aiCornerRadius);
                            ctx.arcTo(half, half, half - aiCornerRadius, half, aiCornerRadius);
                            ctx.lineTo(-half + aiCornerRadius, half);
                            ctx.arcTo(-half, half, -half, half - aiCornerRadius, aiCornerRadius);
                            ctx.lineTo(-half, -half + aiCornerRadius);
                            ctx.arcTo(-half, -half, -half + aiCornerRadius, -half, aiCornerRadius);
                            ctx.closePath();
                            ctx.stroke();
                            ctx.restore();
                        }
                    }

                    ctx.restore();
                }
            }
        }

        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function lerpColor(color1, color2, t) {
            // Blend two hex colors by t (0 = color1, 1 = color2)
            const r1 = parseInt(color1.slice(1, 3), 16);
            const g1 = parseInt(color1.slice(3, 5), 16);
            const b1 = parseInt(color1.slice(5, 7), 16);
            const r2 = parseInt(color2.slice(1, 3), 16);
            const g2 = parseInt(color2.slice(3, 5), 16);
            const b2 = parseInt(color2.slice(5, 7), 16);

            const r = Math.round(r1 + (r2 - r1) * t);
            const g = Math.round(g1 + (g2 - g1) * t);
            const b = Math.round(b1 + (b2 - b1) * t);

            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        // Lit rails belong to the track under them, so they fade in with it.
        function getLitPointAlpha(pt) {
            if (!isRunMode) return 1;
            const px = pt.tileCenterX != null ? pt.tileCenterX : pt.x;
            const py = pt.tileCenterY != null ? pt.tileCenterY : pt.y;
            const tile = getTileAtGrid(Math.floor((px - offsetX) / TILE_SIZE),
                                       Math.floor((py - offsetY) / TILE_SIZE), 'tracks');
            return tile ? getTileAlpha(tile) : 1;
        }

        function drawLitRailsSprites(ctx, litPoints) {
            const straightType = TILE_TYPES.find(t => t.id === 'lit_rails_straight');
            const curveType = TILE_TYPES.find(t => t.id === 'lit_rails_curve');

            const halfSize = TILE_SIZE / 2;
            litPoints.forEach(pt => {
                if (!pt.trackId) return;

                const alpha = getLitPointAlpha(pt);
                if (alpha <= 0) return;
                const faded = alpha < 1;
                if (faded) {
                    ctx.save();
                    ctx.globalAlpha = alpha;
                }

                if (pt.trackId === 'horizontal_track' && straightType && straightType.image && straightType.image.complete) {
                    ctx.drawImage(straightType.image, pt.x - halfSize, pt.y - halfSize, TILE_SIZE, TILE_SIZE);
                } else if (pt.trackId === 'vertical_track' && straightType && straightType.image && straightType.image.complete) {
                    ctx.save();
                    ctx.translate(pt.x, pt.y);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(straightType.image, -halfSize, -halfSize, TILE_SIZE, TILE_SIZE);
                    ctx.restore();
                } else if (pt.trackId === 'cross_track' && straightType && straightType.image && straightType.image.complete) {
                    ctx.drawImage(straightType.image, pt.x - halfSize, pt.y - halfSize, TILE_SIZE, TILE_SIZE);
                    ctx.save();
                    ctx.translate(pt.x, pt.y);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(straightType.image, -halfSize, -halfSize, TILE_SIZE, TILE_SIZE);
                    ctx.restore();
                } else if (pt.trackId === 'curved_track_tl' && curveType && curveType.image && curveType.image.complete) {
                    ctx.drawImage(curveType.image, pt.tileCenterX - halfSize, pt.tileCenterY - halfSize, TILE_SIZE, TILE_SIZE);
                } else if (pt.trackId === 'curved_track_tr' && curveType && curveType.image && curveType.image.complete) {
                    ctx.save();
                    ctx.translate(pt.tileCenterX, pt.tileCenterY);
                    ctx.rotate(Math.PI / 2);
                    ctx.drawImage(curveType.image, -halfSize, -halfSize, TILE_SIZE, TILE_SIZE);
                    ctx.restore();
                } else if (pt.trackId === 'curved_track_br' && curveType && curveType.image && curveType.image.complete) {
                    ctx.save();
                    ctx.translate(pt.tileCenterX, pt.tileCenterY);
                    ctx.rotate(Math.PI);
                    ctx.drawImage(curveType.image, -halfSize, -halfSize, TILE_SIZE, TILE_SIZE);
                    ctx.restore();
                } else if (pt.trackId === 'curved_track_bl' && curveType && curveType.image && curveType.image.complete) {
                    ctx.save();
                    ctx.translate(pt.tileCenterX, pt.tileCenterY);
                    ctx.rotate(Math.PI * 3 / 2);
                    ctx.drawImage(curveType.image, -halfSize, -halfSize, TILE_SIZE, TILE_SIZE);
                    ctx.restore();
                }

                if (faded) ctx.restore();
            });
        }

        function lightTrainCars(ctx) {
            const cornerRadius = 5;
            const trainSize = 49;
            const baseFill = '#000000';
            const baseStroke = '#252525';
            const litColor = '#FFF4AD';

            trainAnimations.forEach(train => {
                let cumulativeSpacing = 0;
                for (let i = 0; i < train.numCars; i++) {
                    if (i > 0) {
                        const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                        cumulativeSpacing += spacingVal;
                    }

                    // Find lit value for this car
                    const litEntry = trainCarLitValues.find(
                        v => v.trainId === train.trainId && v.carIndex === i
                    );
                    const lit = litEntry ? litEntry.lit : 0;
                    if (lit <= 0) continue;

                    const carDistance = Math.max(0, train.headDistance - cumulativeSpacing);
                    const pos = getPositionAlongPath(train.path, carDistance);

                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(pos.angle);

                    const halfSize = trainSize / 2;
                    ctx.fillStyle = lerpColor(baseFill, litColor, lit);
                    ctx.strokeStyle = lerpColor(baseStroke, litColor, lit);
                    ctx.lineWidth = 2;

                    ctx.beginPath();
                    ctx.moveTo(-halfSize + cornerRadius, -halfSize);
                    ctx.lineTo(halfSize - cornerRadius, -halfSize);
                    ctx.arcTo(halfSize, -halfSize, halfSize, -halfSize + cornerRadius, cornerRadius);
                    ctx.lineTo(halfSize, halfSize - cornerRadius);
                    ctx.arcTo(halfSize, halfSize, halfSize - cornerRadius, halfSize, cornerRadius);
                    ctx.lineTo(-halfSize + cornerRadius, halfSize);
                    ctx.arcTo(-halfSize, halfSize, -halfSize, halfSize - cornerRadius, cornerRadius);
                    ctx.lineTo(-halfSize, -halfSize + cornerRadius);
                    ctx.arcTo(-halfSize, -halfSize, -halfSize + cornerRadius, -halfSize, cornerRadius);
                    ctx.closePath();

                    ctx.fill();
                    ctx.stroke();

                    ctx.restore();
                }
            });
        }

        function computeConnectorLitValue(x, y, litPoints) {
            const connector_not_lit_dist = TILE_SIZE * (1 / 3);
            const maxAlpha = 1;

            let minDist = Infinity;
            litPoints.forEach(pt => {
                const dx = x - pt.x;
                const dy = y - pt.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) minDist = dist;
            });

            if (minDist >= connector_not_lit_dist) return 0;
            if (minDist <= full_lit_dist) return maxAlpha;
            return (1 - (minDist - full_lit_dist) / (connector_not_lit_dist - full_lit_dist)) * maxAlpha;
        }

        function lightTrainConnectors(ctx, litPoints) {
            const connectorWidth = 16; // Same width as grey connector stroke

            trainAnimations.forEach(train => {
                if (train.numCars <= 1) return;
                if (!train.path || train.path.length < 2) return;

                // Get the tail and head distances along the path
                let totalSpacing = 0;
                for (let i = 0; i < train.numCars - 1; i++) {
                    totalSpacing += (train.spacing[i] != null ? train.spacing[i] : 59);
                }
                const tailDist = Math.max(0, train.headDistance - totalSpacing);
                const headDist = train.headDistance;

                if (headDist <= tailDist) return;

                // Walk along the connector path in connector_lit_width increments
                for (let d = tailDist; d < headDist; d += connector_lit_width) {
                    const pos = getPositionAlongPath(train.path, d);

                    // Compute lit value at this point (using 1px for full_lit threshold)
                    const lit = computeConnectorLitValue(pos.x, pos.y, litPoints);
                    if (lit <= 0) continue;

                    // Get the next point to determine stroke direction
                    const nextD = Math.min(d + connector_lit_width, headDist);
                    const nextPos = getPositionAlongPath(train.path, nextD);

                    ctx.save();
                    ctx.globalAlpha = lit;
                    ctx.strokeStyle = '#FFF4AD';
                    ctx.lineWidth = connectorWidth;
                    ctx.lineCap = 'butt';
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                    ctx.lineTo(nextPos.x, nextPos.y);
                    ctx.stroke();
                    ctx.restore();
                }
            });
        }

        let animationFrameId = null;

        function getTrackExitSides(trackId) {
            // Returns array of sides where this track type has exits
            const exits = {
                'horizontal_track': ['left', 'right'],
                'vertical_track': ['top', 'bottom'],
                'curved_track_br': ['right', 'bottom'],
                'curved_track_bl': ['left', 'bottom'],
                'curved_track_tr': ['right', 'top'],
                'curved_track_tl': ['left', 'top'],
                'cross_track': ['top', 'bottom', 'left', 'right']
            };
            return exits[trackId] || [];
        }

        function isTrackConnected(gridX, gridY, side) {
            // Check if there's a connecting track in the given direction
            const pos = getNextPositionInDirection(gridX, gridY, side);
            if (pos.x < 0 || pos.x >= GRID_COLS || pos.y < 0 || pos.y >= GRID_ROWS) return false;

            const neighborTrack = getTileAtGrid(pos.x, pos.y, 'tracks');
            if (!neighborTrack || !neighborTrack.tileType) return false;
            // A neighbour that hasn't faded in yet isn't there yet, so the
            // visible track gets an end cap until it appears.
            if (!isTileVisible(neighborTrack)) return false;

            const entryDir = getOppositeDirection(side);
            const exitDir = getExitDirection(neighborTrack, entryDir);
            return exitDir !== null;
        }

        function drawTrackEndCap(ctx, gridX, gridY, side) {
            const tilePixelX = offsetX + gridX * TILE_SIZE;
            const tilePixelY = offsetY + gridY * TILE_SIZE;
            const half = TILE_SIZE / 2;

            ctx.fillStyle = '#004C43';

            // 16x2 rectangle centered on the exit side
            const capWidth = 16;
            const capHeight = 2;

            let x, y;
            switch(side) {
                case 'top':
                    x = tilePixelX + half - capWidth / 2;
                    y = tilePixelY - capHeight / 2;
                    break;
                case 'bottom':
                    x = tilePixelX + half - capWidth / 2;
                    y = tilePixelY + TILE_SIZE - capHeight / 2;
                    break;
                case 'left':
                    x = tilePixelX - capHeight / 2;
                    y = tilePixelY + half - capWidth / 2;
                    ctx.save();
                    ctx.translate(x + capHeight / 2, y + capWidth / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.fillRect(-capWidth / 2, -capHeight / 2, capWidth, capHeight);
                    ctx.restore();
                    return;
                case 'right':
                    x = tilePixelX + TILE_SIZE - capHeight / 2;
                    y = tilePixelY + half - capWidth / 2;
                    ctx.save();
                    ctx.translate(x + capHeight / 2, y + capWidth / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.fillRect(-capWidth / 2, -capHeight / 2, capWidth, capHeight);
                    ctx.restore();
                    return;
            }

            ctx.fillRect(x, y, capWidth, capHeight);
        }

        function getPathTangentAt(path, distance) {
            if (path.length < 2) return { x: 1, y: 0 };

            let remaining = distance;
            for (let i = 0; i < path.length - 1; i++) {
                const dx = path[i + 1].x - path[i].x;
                const dy = path[i + 1].y - path[i].y;
                const segLen = Math.sqrt(dx * dx + dy * dy);
                if (segLen === 0) continue;

                if (remaining <= segLen) {
                    return { x: dx / segLen, y: dy / segLen };
                }
                remaining -= segLen;
            }

            const last = path.length - 1;
            const dx = path[last].x - path[last - 1].x;
            const dy = path[last].y - path[last - 1].y;
            const len = Math.sqrt(dx * dx + dy * dy);
            return len > 0 ? { x: dx / len, y: dy / len } : { x: 1, y: 0 };
        }

        function getRunModeCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            // Map CSS pixels to the logical 900x600 coordinate space, not the
            // (devicePixelRatio-scaled) backing store size.
            const scaleX = CAMERA_WIDTH / rect.width;
            const scaleY = CAMERA_HEIGHT / rect.height;
            const canvasX = (e.clientX - rect.left) * scaleX;
            const canvasY = (e.clientY - rect.top) * scaleY;
            return { x: canvasX, y: canvasY };
        }

        function getRunModeWorldCoords(e) {
            const coords = getRunModeCanvasCoords(e);
            return { x: coords.x + cameraX, y: coords.y + cameraY };
        }

        function getCarMathFactTriplet(train, carIndex) {
            const mf = train.mathFacts;
            if (!mf) return null;
            // Check if this car is the middle of a triplet (mathFacts[carIndex] is true)
            if (mf[carIndex]) return carIndex;
            // Check if this car is the left neighbor (carIndex+1 is a checked middle)
            if (mf[carIndex + 1]) return carIndex + 1;
            // Check if this car is the right neighbor (carIndex-1 is a checked middle)
            if (mf[carIndex - 1]) return carIndex - 1;
            return null;
        }

        function handleRunMouseDown(e) {
            if (runModeState === 'animation') return;
            if (isTileFadeBlockingInput()) return;
            if (runFadePhase) return;

            const screenCoords = getRunModeCanvasCoords(e);

            // Check keypad button clicks first (screen space)
            if (keypadSlideProgress >= 1) {
                const btnIdx = hitTestKeypad(screenCoords.x, screenCoords.y);
                if (btnIdx >= 0) {
                    keypadPressedButton = btnIdx;
                    handleKeypadPress(btnIdx);
                    return;
                }
                if (hitTestKeypadReset(screenCoords.x, screenCoords.y)) {
                    keypadResetPressed = true;
                    startRunFadeOut(resetLevel);
                    return;
                }
                if (hitTestKeypadLevelSelect(screenCoords.x, screenCoords.y)) {
                    keypadLevelSelectPressed = true;
                    returnToLevelSelect();
                    return;
                }
                // If clicking inside the keypad panel but not on a button, consume the click
                if (isPointInKeypadPanel(screenCoords.x, screenCoords.y)) {
                    return;
                }
            }

            const world = getRunModeWorldCoords(e);
            const hitRadius = TILE_SIZE / 2;

            // Check for math fact car selection
            for (const train of trainAnimations) {
                const mf = train.mathFacts;
                if (!mf || !mf.some(v => v)) continue;

                let cumulativeSpacing = 0;
                for (let i = 0; i < train.numCars; i++) {
                    if (i > 0) {
                        const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                        cumulativeSpacing += spacingVal;
                    }

                    const carDist = Math.max(0, train.headDistance - cumulativeSpacing);
                    const pos = getPositionAlongPath(train.path, carDist);
                    const dx = world.x - pos.x;
                    const dy = world.y - pos.y;

                    if (dx * dx + dy * dy <= hitRadius * hitRadius) {
                        const middleIdx = getCarMathFactTriplet(train, i);
                        if (middleIdx !== null) {
                            if (selectedRunMathFact &&
                                selectedRunMathFact.trainId === train.trainId &&
                                selectedRunMathFact.middleCarIndex === middleIdx) {
                                selectedRunMathFact = null;
                                keypadVisible = false;
                                keypadInputValue = '';
                            } else {
                                selectedRunMathFact = { trainId: train.trainId, middleCarIndex: middleIdx };
                                const wasKeypadOpen = keypadSlideProgress >= 1;
                                keypadVisible = true;
                                keypadInputValue = '';
                                if (!wasKeypadOpen) {
                                    calculateKeypadTargetCamera();
                                }
                            }
                            return;
                        }
                    }
                }
            }

            // Clear selection if clicking elsewhere
            selectedRunMathFact = null;
            keypadVisible = false;
            keypadInputValue = '';

            for (const train of trainAnimations) {
                if (!trainHasDrag(train)) continue;

                let cumulativeSpacing = 0;
                for (let i = 0; i < train.numCars; i++) {
                    if (i > 0) {
                        const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                        cumulativeSpacing += spacingVal;
                    }

                    // Only check cars with drag enabled
                    if (!train.drag[i]) continue;

                    const carDist = Math.max(0, train.headDistance - cumulativeSpacing);
                    const pos = getPositionAlongPath(train.path, carDist);
                    const dx = world.x - pos.x;
                    const dy = world.y - pos.y;

                    if (dx * dx + dy * dy <= hitRadius * hitRadius) {
                        runDragTrain = train;
                        runDragLastWorld = world;
                        runDragCarIndex = i;
                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }
            }
        }

        function handleRunMouseMove(e) {
            if (runModeState === 'animation') return;
            if (isTileFadeBlockingInput()) return;

            const screenCoords = getRunModeCanvasCoords(e);

            // Update keypad hover state
            if (keypadSlideProgress >= 1) {
                const btnIdx = hitTestKeypad(screenCoords.x, screenCoords.y);
                keypadHoveredButton = btnIdx >= 0 ? btnIdx : null;
                keypadResetHovered = hitTestKeypadReset(screenCoords.x, screenCoords.y);
                keypadLevelSelectHovered = hitTestKeypadLevelSelect(screenCoords.x, screenCoords.y);
                if (btnIdx >= 0 || keypadResetHovered || keypadLevelSelectHovered || isPointInKeypadPanel(screenCoords.x, screenCoords.y)) {
                    canvas.style.cursor = (btnIdx >= 0 || keypadResetHovered || keypadLevelSelectHovered) ? 'pointer' : 'default';
                    return;
                }
            } else {
                keypadHoveredButton = null;
                keypadResetHovered = false;
                keypadLevelSelectHovered = false;
            }

            if (!runDragTrain) {
                // Update cursor based on hover over draggable or math fact cars
                const world = getRunModeWorldCoords(e);
                const hitRadius = TILE_SIZE / 2;
                let overDraggable = false;
                let overMathFact = false;

                for (const train of trainAnimations) {
                    const mf = train.mathFacts;
                    const hasMathFacts = mf && mf.some(v => v);

                    let cumulativeSpacing = 0;
                    for (let i = 0; i < train.numCars; i++) {
                        if (i > 0) {
                            const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                            cumulativeSpacing += spacingVal;
                        }

                        const carDist = Math.max(0, train.headDistance - cumulativeSpacing);
                        const pos = getPositionAlongPath(train.path, carDist);
                        const dx = world.x - pos.x;
                        const dy = world.y - pos.y;

                        if (dx * dx + dy * dy <= hitRadius * hitRadius) {
                            if (train.drag && train.drag[i]) {
                                overDraggable = true;
                                break;
                            }
                            if (hasMathFacts && getCarMathFactTriplet(train, i) !== null) {
                                overMathFact = true;
                                break;
                            }
                        }
                    }
                    if (overDraggable || overMathFact) break;
                }

                canvas.style.cursor = overDraggable ? 'grab' : (overMathFact ? 'pointer' : 'default');
                return;
            }

            const world = getRunModeWorldCoords(e);

            // Extend path so dragging has room
            extendPathForward(runDragTrain);
            extendPathBackward(runDragTrain);

            // Compute mouse delta projected onto path tangent at the dragged car
            let dragCarSpacing = 0;
            for (let i = 0; i < runDragCarIndex; i++) {
                const spacingVal = runDragTrain.spacing[i] != null ? runDragTrain.spacing[i] : 59;
                dragCarSpacing += spacingVal;
            }
            const dragCarDist = Math.max(0, runDragTrain.headDistance - dragCarSpacing);
            const tangent = getPathTangentAt(runDragTrain.path, dragCarDist);
            const mouseDX = world.x - runDragLastWorld.x;
            const mouseDY = world.y - runDragLastWorld.y;
            const delta = mouseDX * tangent.x + mouseDY * tangent.y;

            let newHeadDistance = runDragTrain.headDistance + delta;

            // Clamp: tail can't go below 0
            let totalSpacing = 0;
            for (let i = 0; i < runDragTrain.numCars - 1; i++) {
                const spacingVal = runDragTrain.spacing[i] != null ? runDragTrain.spacing[i] : 59;
                totalSpacing += spacingVal;
            }
            newHeadDistance = Math.max(totalSpacing, newHeadDistance);

            // Clamp: head can't exceed path length
            newHeadDistance = Math.min(runDragTrain.totalLength, newHeadDistance);

            runDragTrain.headDistance = newHeadDistance;
            runDragLastWorld = world;
        }

        function handleRunMouseUp(e) {
            // Always clear pressed state, even if this mouseup lands after the
            // submit button's mousedown already kicked off the feedback
            // animation — otherwise the button is stuck looking pressed.
            keypadPressedButton = null;
            keypadResetPressed = false;
            keypadLevelSelectPressed = false;

            if (runModeState === 'animation') return;
            if (runDragTrain) {
                runDragTrain = null;
                runDragLastWorld = null;
                runDragCarIndex = 0;
                canvas.style.cursor = 'default';
            }
        }

        function handleRunWheel(e) {
            if (runModeState === 'animation') return;
            if (isTileFadeBlockingInput()) return;

            // Only handle wheel events when keypad is open
            if (keypadSlideProgress < 1) return;

            e.preventDefault();

            // Calculate scroll delta
            const scrollSpeed = 1.0;
            const deltaX = e.deltaX * scrollSpeed;
            const deltaY = e.deltaY * scrollSpeed;

            // Update camera position
            let newCameraX = cameraX + deltaX;
            let newCameraY = cameraY + deltaY;

            // Clamp camera to boundaries
            // When keypad is open, allow panning further right so content
            // behind the panel can be revealed
            const { panelW } = getKeypadDimensions();
            const minCameraX = 0;
            const maxCameraX = gridWidth - CAMERA_WIDTH + panelW;
            const minCameraY = 0;
            const maxCameraY = gridHeight - CAMERA_HEIGHT;

            cameraX = Math.max(minCameraX, Math.min(maxCameraX, newCameraX));
            cameraY = Math.max(minCameraY, Math.min(maxCameraY, newCameraY));

            // baseCameraX/Y stay put: they are the level's home view, which the
            // camera returns to when the keypad closes and on reset. Panning must
            // not redefine home, or the pan is never undone.
        }

        function gameLoop(timestamp) {
            if (lastFrameTime === 0) lastFrameTime = timestamp;
            const elapsed = timestamp - lastFrameTime;
            lastFrameTime = timestamp;
            dt = elapsed / 16.667; // 1.0 at 60fps, 2.0 at 30fps, etc.
            if (dt > 3) dt = 3; // cap to prevent huge jumps after tab-away

            if (runModeState === 'gameplay') {
                updateTrainAnimations();
                stopLightAnimationTime += dt;
            } else if (runModeState === 'animation') {
                updateFeedbackAnimation();
            }

            // Tile reveals and spawn animations play over whatever else is happening
            updateTileFadeIn();
            updateSpawnAnimations();
            updateLightBurnout();
            updateRunFade();

            draw();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function draw() {
            // Clear canvas (in logical coordinates; the backing store may be
            // larger than CAMERA_WIDTH/CAMERA_HEIGHT due to devicePixelRatio scaling)
            ctx.fillStyle = isRunMode ? '#000000' : '#1a1a1a';
            ctx.fillRect(0, 0, isRunMode ? CAMERA_WIDTH : canvas.width, isRunMode ? CAMERA_HEIGHT : canvas.height);

            // Apply camera transform in run mode
            if (isRunMode) {
                ctx.save();
                ctx.translate(-cameraX, -cameraY);
            }

            // Draw grid lines (only in edit mode)
            if (!isRunMode) {
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 1;

                for (let row = 0; row <= GRID_ROWS; row++) {
                    const y = offsetY + row * TILE_SIZE;
                    ctx.beginPath();
                    ctx.moveTo(offsetX, y);
                    ctx.lineTo(offsetX + gridWidth, y);
                    ctx.stroke();
                }

                for (let col = 0; col <= GRID_COLS; col++) {
                    const x = offsetX + col * TILE_SIZE;
                    ctx.beginPath();
                    ctx.moveTo(x, offsetY);
                    ctx.lineTo(x, offsetY + gridHeight);
                    ctx.stroke();
                }

                // Draw white border around inner 10x15 play area
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(
                    offsetX + TILE_SIZE,
                    offsetY + TILE_SIZE,
                    TILE_SIZE * 15,
                    TILE_SIZE * 10
                );
            }

            // Draw track tiles on top of grid lines
            trackTiles.forEach(tile => {
                const pixelX = offsetX + tile.gridX * TILE_SIZE;
                const pixelY = offsetY + tile.gridY * TILE_SIZE;

                // Tiles waiting on (or part-way through) their fade in
                const tileAlpha = getTileAlpha(tile);
                const faded = tileAlpha < 1;
                if (faded) {
                    ctx.save();
                    ctx.globalAlpha = tileAlpha;
                }

                if (tileAlpha <= 0) {
                    // Fully hidden: nothing to draw
                } else if (tile.tileType && tile.tileType.type === 'track' && tile.tileType.render) {
                    // Render track with full tile size (edge to edge)
                    tile.tileType.render(ctx, pixelX, pixelY, TILE_SIZE, false, tile.gridX, tile.gridY);

                    // Draw end caps for unconnected exits
                    const exitSides = getTrackExitSides(tile.tileType.id);
                    exitSides.forEach(side => {
                        if (!isTrackConnected(tile.gridX, tile.gridY, side)) {
                            drawTrackEndCap(ctx, tile.gridX, tile.gridY, side);
                        }
                    });
                } else if (tile.tileType && tile.tileType.type === 'custom' && tile.tileType.render) {
                    // Render custom tiles on tracks layer (like light_pole)
                    tile.tileType.render(ctx, pixelX, pixelY, TILE_SIZE, false, tile.gridX, tile.gridY);
                }

                if (faded) ctx.restore();

                // Draw border if this tile is hovered and we're on tracks tab
                if (hoveredTile && hoveredTile.gridX === tile.gridX && hoveredTile.gridY === tile.gridY &&
                    hoveredTile.layer === 'tracks' && currentPaletteTab === 'tracks') {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(pixelX, pixelY, TILE_SIZE, TILE_SIZE);
                }

                // Draw border if this tile is selected
                if (selectedTile && selectedTile.gridX === tile.gridX && selectedTile.gridY === tile.gridY &&
                    selectedTile.layer === 'tracks') {
                    ctx.strokeStyle = '#4ecdc4';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pixelX, pixelY, TILE_SIZE, TILE_SIZE);
                }
            });

            // Lighting system: use persistent lit_points (computed once at level start)
            // In edit mode, compute them each frame for preview. While tiles are
            // fading in the cached set is stale — it was built without them.
            let litPoints;
            if (!isRunMode) {
                litPoints = computeLitPoints();
            } else if (tileFadeAnim || lightBurnoutAnimations.length > 0 || lightBurnoutQueue.length > 0) {
                litPoints = addInterpolatedLitPoints(computeLitPoints());
            } else {
                litPoints = persistentLitPoints;
            }

            // Draw lit_rails_straight sprite at lit points on straight/cross tracks
            drawLitRailsSprites(ctx, litPoints);

            // Draw object tiles on top of tracks
            objectTiles.forEach(tile => {
                const pixelX = offsetX + tile.gridX * TILE_SIZE;
                const pixelY = offsetY + tile.gridY * TILE_SIZE;

                // If this is a train, draw the cars following the track
                if (tile.tileType && tile.tileType.id === 'train') {
                    // In run mode, trains are drawn by the animation system
                    if (isRunMode) return;

                    const trainId = getTrainId(tile);
                    const trainData = getTrainCarPixelPositions(tile, trainId);
                    const carPixelPositions = trainData.positions;

                    // Draw gray connection stroke beneath cars
                    if (carPixelPositions.length > 1 && trainData.path.length >= 2) {
                        drawPathStroke(ctx, trainData.path, 0, trainData.lastCarDistance, '#252525', 14);
                    }

                    // Draw each car with orientation
                    const dragLinesType = TILE_TYPES.find(t => t.id === 'drag_lines_car');
                    carPixelPositions.forEach((pos, i) => {
                        if (pos.x >= offsetX - TILE_SIZE && pos.x < offsetX + gridWidth + TILE_SIZE &&
                            pos.y >= offsetY - TILE_SIZE && pos.y < offsetY + gridHeight + TILE_SIZE) {
                            const size = TILE_SIZE - 4;
                            ctx.save();
                            ctx.translate(pos.x, pos.y);
                            ctx.rotate(pos.angle || 0);
                            tile.tileType.render(ctx, -size / 2, -size / 2, size);
                            ctx.restore();
                        }
                    });

                    // Draw black connection stroke on top of cars
                    if (carPixelPositions.length > 1 && trainData.path.length >= 2) {
                        drawPathStroke(ctx, trainData.path, 0, trainData.lastCarDistance);
                    }

                    // Draw drag lines on top of everything
                    carPixelPositions.forEach((pos, i) => {
                        if (pos.x >= offsetX - TILE_SIZE && pos.x < offsetX + gridWidth + TILE_SIZE &&
                            pos.y >= offsetY - TILE_SIZE && pos.y < offsetY + gridHeight + TILE_SIZE) {
                            const dragEnabled = trainId && trainProperties[trainId] && trainProperties[trainId].drag && trainProperties[trainId].drag[i];
                            if (dragEnabled && dragLinesType) {
                                const size = TILE_SIZE - 4;
                                ctx.save();
                                ctx.translate(pos.x, pos.y);
                                ctx.rotate(pos.angle || 0);
                                dragLinesType.render(ctx, -size / 2, -size / 2, size);
                                ctx.restore();
                            }
                        }
                    });

                } else if (tile.tileType) {
                    if (tile.tileType.type === 'solid') {
                        ctx.fillStyle = tile.tileType.color;
                        ctx.fillRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (tile.tileType.type === 'custom' && tile.tileType.render) {
                        tile.tileType.render(ctx, pixelX + 2, pixelY + 2, TILE_SIZE - 4);
                    }
                } else {
                    // Legacy color-only tiles
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                }

                // Draw border if this tile is hovered and we're on objects tab
                if (hoveredTile && hoveredTile.gridX === tile.gridX && hoveredTile.gridY === tile.gridY &&
                    hoveredTile.layer === 'objects' && currentPaletteTab === 'objects') {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                }

                // Draw border if this tile is selected
                if (selectedTile && selectedTile.gridX === tile.gridX && selectedTile.gridY === tile.gridY &&
                    selectedTile.layer === 'objects') {
                    ctx.strokeStyle = '#4ecdc4';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                }
            });

            // Draw dragged tile
            if (isDragging && draggedTile) {
                if (draggedTile.tileType) {
                    // Use the original grid position if dragging from grid, otherwise null
                    const dragGridX = draggedTile.originalGridX !== undefined ? draggedTile.originalGridX : null;
                    const dragGridY = draggedTile.originalGridY !== undefined ? draggedTile.originalGridY : null;

                    if (draggedTile.tileType.type === 'solid') {
                        ctx.fillStyle = draggedTile.tileType.color;
                        ctx.fillRect(dragPixelX, dragPixelY, TILE_SIZE, TILE_SIZE);
                    } else if (draggedTile.tileType.type === 'track' && draggedTile.tileType.render) {
                        // Track tiles render edge to edge
                        draggedTile.tileType.render(ctx, dragPixelX, dragPixelY, TILE_SIZE, false, dragGridX, dragGridY);
                    } else if (draggedTile.tileType.type === 'custom' && draggedTile.tileType.render) {
                        draggedTile.tileType.render(ctx, dragPixelX, dragPixelY, TILE_SIZE, false, dragGridX, dragGridY);
                    }
                } else {
                    // Legacy color-only
                    ctx.fillStyle = draggedTile.color;
                    ctx.fillRect(dragPixelX, dragPixelY, TILE_SIZE, TILE_SIZE);
                }

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(dragPixelX, dragPixelY, TILE_SIZE, TILE_SIZE);
            }

            // Draw animated trains in run mode
            if (isRunMode) {
                drawAnimatedTrains(ctx);
            }

            // Compute lit value for each train car
            computeTrainCarLit(litPoints);

            // Draw lighting overlay on train connectors and cars in run mode
            if (isRunMode) {
                lightTrainConnectors(ctx, litPoints);
                lightTrainCars(ctx);
            }

            // Draw train text as the very last layer
            drawTrainText(ctx);

            // Stack badges go above the train text, which would otherwise be
            // drawn straight over the number in the middle of the square
            drawTrainStackBadges(ctx);

            // Spawn animations sit on top, still in world space
            if (isRunMode) {
                drawSpawnAnimations(ctx);
            }

            // Restore transform in run mode
            if (isRunMode) {
                ctx.restore();

                // Draw keypad UI in screen space
                updateKeypadAnimation();
                drawKeypad(ctx);

                // Draw feedback animation in screen space
                drawFeedbackAnimation(ctx);

                // Fade-to-black overlay (restarting a level / leaving run mode)
                const fadeAlpha = runFadeAlpha();
                if (fadeAlpha > 0) {
                    ctx.save();
                    ctx.globalAlpha = fadeAlpha;
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, CAMERA_WIDTH, CAMERA_HEIGHT);
                    ctx.restore();
                }
            }
        }

        function getGridPosition(mouseX, mouseY) {
            const gridX = Math.floor((mouseX - offsetX) / TILE_SIZE);
            const gridY = Math.floor((mouseY - offsetY) / TILE_SIZE);

            // Clamp to grid bounds
            const clampedX = Math.max(0, Math.min(GRID_COLS - 1, gridX));
            const clampedY = Math.max(0, Math.min(GRID_ROWS - 1, gridY));

            return { x: clampedX, y: clampedY };
        }

        function isInGrid(mouseX, mouseY) {
            return mouseX >= offsetX && mouseX < offsetX + gridWidth &&
                   mouseY >= offsetY && mouseY < offsetY + gridHeight;
        }

        let paletteTiles = [];
        let currentPaletteTab = 'objects';

        function createPalette() {
            // Create tracks palette
            const tracksGrid = document.getElementById('tracksGrid');
            tracksGrid.innerHTML = '';

            // Create objects palette
            const objectsGrid = document.getElementById('objectsGrid');
            objectsGrid.innerHTML = '';

            TILE_TYPES.forEach((tileType, index) => {
                // Skip drag_lines_car - it's only used as an overlay, not a placeable tile
                if (tileType.id === 'drag_lines_car') return;
                // Skip sprite-only tiles - they're only used as sprites, not placeable tiles
                if (tileType.id === 'mm_light_pole' || tileType.id === 'mm_light_pole_dead' || tileType.id === 'mm_light' || tileType.id === 'mm_light_dead' || tileType.id === 'mm_light_flash' ||
                    tileType.id === 'lit_rails_straight' || tileType.id === 'lit_rails_curve' ||
                    tileType.id === 'mm_stop_background' || tileType.id === 'mm_stop_light1' || tileType.id === 'mm_stop_light2') return;

                const tile = document.createElement('canvas');
                tile.className = 'palette-tile';
                tile.width = 60;
                tile.height = 60;
                tile.dataset.tileIndex = index;

                const tileCtx = tile.getContext('2d');

                // Draw tile preview
                tileCtx.fillStyle = '#1a1a1a';
                tileCtx.fillRect(0, 0, 60, 60);

                if (tileType.type === 'solid') {
                    tileCtx.fillStyle = tileType.color;
                    tileCtx.fillRect(2, 2, 56, 56);
                } else if (tileType.type === 'track' && tileType.render) {
                    // Track tiles render edge to edge in preview too
                    tileType.render(tileCtx, 0, 0, 60, true, null, null);
                } else if (tileType.type === 'custom' && tileType.render) {
                    tileType.render(tileCtx, 2, 2, 56, true, null, null);
                }

                // Add to appropriate grid based on layer
                if (tileType.layer === 'tracks') {
                    tracksGrid.appendChild(tile);
                } else if (tileType.layer === 'objects') {
                    objectsGrid.appendChild(tile);
                }

                // Store position info
                paletteTiles.push({
                    element: tile,
                    tileType: tileType,
                    index: index
                });

                // Add mouse events
                tile.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    draggedTile = {
                        tileType: tileType,
                        fromPalette: true,
                        // Assign new train ID if dragging a train from palette
                        trainId: tileType.id === 'train' ? nextTrainId++ : undefined
                    };

                    const rect = canvas.getBoundingClientRect();
                    dragPixelX = e.clientX - rect.left - TILE_SIZE / 2;
                    dragPixelY = e.clientY - rect.top - TILE_SIZE / 2;

                    draw();
                });
            });
        }

        function switchPaletteTab(tabName) {
            currentPaletteTab = tabName;

            // Update tab buttons
            document.querySelectorAll('.palette-tab').forEach(tab => {
                if (tab.dataset.tab === tabName) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // Update panel visibility
            document.querySelectorAll('.palette-panel').forEach(panel => {
                if (panel.id === tabName + 'Panel') {
                    panel.classList.add('active');
                } else {
                    panel.classList.remove('active');
                }
            });
        }

        function getTileAtGrid(gridX, gridY, layer) {
            const tiles = layer === 'tracks' ? trackTiles : objectTiles;
            return tiles.find(tile => tile.gridX === gridX && tile.gridY === gridY);
        }

        // Any number of trains can share a square on the objects layer. Sorted by
        // train ID so the stack order — and therefore click cycling — stays put
        // even as tiles are pulled out of the array and pushed back while dragging.
        function getTrainStackAt(gridX, gridY) {
            return objectTiles
                .filter(tile => tile.gridX === gridX && tile.gridY === gridY &&
                                tile.tileType && tile.tileType.id === 'train')
                .sort((a, b) => (a.trainId || 0) - (b.trainId || 0));
        }

        // Authoring aid for squares holding more than one train: a count badge in
        // the upper left, plus which one of them the inspector is showing.
        function drawTrainStackBadges(ctx) {
            if (isRunMode) return;

            const drawn = new Set();
            objectTiles.forEach(tile => {
                if (!tile.tileType || tile.tileType.id !== 'train') return;

                const key = tile.gridX + ',' + tile.gridY;
                if (drawn.has(key)) return;
                drawn.add(key);

                const stack = getTrainStackAt(tile.gridX, tile.gridY);
                if (stack.length < 2) return;

                const pixelX = offsetX + tile.gridX * TILE_SIZE;
                const pixelY = offsetY + tile.gridY * TILE_SIZE;

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Count badge, upper left corner
                const radius = 9;
                const badgeX = pixelX + radius + 3;
                const badgeY = pixelY + radius + 3;
                ctx.fillStyle = '#4ecdc4';
                ctx.beginPath();
                ctx.arc(badgeX, badgeY, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a1a';
                ctx.font = "600 12px 'Nunito', Arial, sans-serif";
                ctx.fillText(String(stack.length), badgeX, badgeY);

                // Selected train's position in the stack, centred on the square
                const selectedIndex = getSelectedStackIndex(tile.gridX, tile.gridY);
                if (selectedIndex > 0) {
                    const centerX = pixelX + TILE_SIZE / 2;
                    const centerY = pixelY + TILE_SIZE / 2;
                    ctx.fillStyle = 'rgba(26, 26, 26, 0.8)';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#4ecdc4';
                    ctx.font = "600 18px 'Nunito', Arial, sans-serif";
                    ctx.fillText(String(selectedIndex), centerX, centerY);
                }

                ctx.restore();
            });
        }

        // Which tile a click on this square should grab. Clicking a stack that is
        // already selected advances to the next train in it, so repeated clicks
        // cycle through the whole stack and wrap around.
        function pickTileForClick(gridX, gridY) {
            if (currentPaletteTab === 'objects') {
                const stack = getTrainStackAt(gridX, gridY);
                if (stack.length > 0) {
                    let index = 0;
                    if (selectedTile && selectedTile.layer === 'objects' &&
                        selectedTile.gridX === gridX && selectedTile.gridY === gridY) {
                        const current = stack.findIndex(t => t.trainId === selectedTile.trainId);
                        if (current >= 0) index = (current + 1) % stack.length;
                    }
                    return stack[index];
                }
            }
            return getTileAtGrid(gridX, gridY, currentPaletteTab);
        }

        // 1-based position of the selected train within the stack on that square,
        // or 0 when the square's stack isn't the current selection.
        function getSelectedStackIndex(gridX, gridY) {
            if (!selectedTile || selectedTile.layer !== 'objects') return 0;
            if (selectedTile.gridX !== gridX || selectedTile.gridY !== gridY) return 0;

            const index = getTrainStackAt(gridX, gridY)
                .findIndex(tile => tile.trainId === selectedTile.trainId);
            return index >= 0 ? index + 1 : 0;
        }

        function getTrackUnderTrain(trainTile) {
            if (!trainTile || trainTile.layer !== 'objects') return null;
            return getTileAtGrid(trainTile.gridX, trainTile.gridY, 'tracks');
        }

        function getDirectionOptionsForTrack(trackTile) {
            if (!trackTile || !trackTile.tileType) return [];

            const trackId = trackTile.tileType.id;

            // Directions represent the side of the tile the train can EXIT from.
            // The checkbox is placed on the corresponding side of the direction grid square.
            // Based on actual arc geometry (where tracks meet tile edges):
            //   BR: arc centered bottom-right, track exits at right edge and bottom edge
            //   BL: arc centered bottom-left, track exits at left edge and bottom edge
            //   TR: arc centered top-right, track exits at right edge and top edge
            //   TL: arc centered top-left, track exits at left edge and top edge
            switch(trackId) {
                case 'horizontal_track':
                    return ['left', 'right'];
                case 'vertical_track':
                    return ['top', 'bottom'];
                case 'curved_track_br':
                    return ['right', 'bottom'];
                case 'curved_track_bl':
                    return ['left', 'bottom'];
                case 'curved_track_tr':
                    return ['right', 'top'];
                case 'curved_track_tl':
                    return ['left', 'top'];
                case 'cross_track':
                    return ['top', 'right', 'bottom', 'left'];
                default:
                    return [];
            }
        }

        function getOppositeDirection(direction) {
            const opposites = {
                'top': 'bottom',
                'bottom': 'top',
                'left': 'right',
                'right': 'left'
            };
            return opposites[direction];
        }

        function getNextPositionInDirection(gridX, gridY, direction) {
            switch(direction) {
                case 'top': return { x: gridX, y: gridY - 1 };
                case 'bottom': return { x: gridX, y: gridY + 1 };
                case 'left': return { x: gridX - 1, y: gridY };
                case 'right': return { x: gridX + 1, y: gridY };
                default: return { x: gridX, y: gridY };
            }
        }

        function getExitDirection(trackTile, entryDirection) {
            if (!trackTile || !trackTile.tileType) return null;

            const trackId = trackTile.tileType.id;

            // Map of track types to their connections (entry side → exit side)
            // Based on actual geometry of where arcs meet tile edges:
            // BR: arc centered bottom-right, connects right edge and bottom edge
            // BL: arc centered bottom-left, connects left edge and bottom edge
            // TR: arc centered top-right, connects right edge and top edge
            // TL: arc centered top-left, connects left edge and top edge
            const connections = {
                'horizontal_track': { 'left': 'right', 'right': 'left' },
                'vertical_track': { 'top': 'bottom', 'bottom': 'top' },
                'curved_track_br': { 'right': 'bottom', 'bottom': 'right' },
                'curved_track_bl': { 'left': 'bottom', 'bottom': 'left' },
                'curved_track_tr': { 'right': 'top', 'top': 'right' },
                'curved_track_tl': { 'left': 'top', 'top': 'left' },
                'cross_track': { 'top': 'bottom', 'bottom': 'top', 'left': 'right', 'right': 'left' }
            };

            const trackConnections = connections[trackId];
            if (!trackConnections) return null;

            return trackConnections[entryDirection] || null;
        }

        function getActualExitSide(trackId, directionValue) {
            // The direction UI checkbox position indicates where the train is HEADING.
            // For curved tracks the checkbox positions (from getDirectionOptionsForTrack)
            // are placed at the opposite visual side, so we map them to the actual
            // tile edge the train exits from.
