            ctx.clearRect(0, 0, LEVEL_SELECT_IMAGE_WIDTH, LEVEL_SELECT_IMAGE_HEIGHT);
            if (!bigTrainDarkSprite || !bigTrainDarkSprite.complete) return;

            const w = bigTrainDarkSprite.naturalWidth * BIG_TRAIN_SPRITE_SCALE;
            const h = bigTrainDarkSprite.naturalHeight * BIG_TRAIN_SPRITE_SCALE;
            const bgW = (bigTrainBackgroundSprite && bigTrainBackgroundSprite.naturalWidth) ? bigTrainBackgroundSprite.naturalWidth * BIG_TRAIN_SPRITE_SCALE : 0;
            const bgH = (bigTrainBackgroundSprite && bigTrainBackgroundSprite.naturalHeight) ? bigTrainBackgroundSprite.naturalHeight * BIG_TRAIN_SPRITE_SCALE : 0;

            ctx.save();
            ctx.translate(0, -settingsCameraY);

            if (bigTrainAnimStartTimestamp !== null && !bigTrainAnimDone) {
                const y = BIG_TRAIN_BOTTOM_Y - h;
                const hiddenWalkers = bigTrainDoorOpenAmount < 1
                    ? mathSettingsButtons
                        .filter(btn => btn.bigTrainDoorIndex >= 0 && !btn.bigTrainArrived)
                        .map(btn => ({ btn, pos: getBigTrainButtonWalkPosition(btn, bigTrainPauseElapsed, bigTrainX, y) }))
                    : [];
                drawBigTrainVisual(ctx, bigTrainX, y, w, h, bgW, bgH, bigTrainDoorOpenAmount, bigTrainLightAlpha, hiddenWalkers);
            } else if (bigTrainShuffleActive) {
                const y = BIG_TRAIN_BOTTOM_Y - h;
                // Buttons that have finished walking in sit at their door,
                // still visible, drawn below the door layer so they're only
                // actually hidden once the door closes back over them (not
                // the instant they arrive) - and once the door is FULLY
                // closed, they blink out of existence entirely rather than
                // continuing to rely on the door's geometry to cover them
                // (jitter can place a button close enough to the door's
                // closing edge to peek out for a frame or two otherwise).
                const tuckedWalkers = bigTrainShuffleDoorOpenAmount > 0
                    ? mathSettingsButtons
                        .filter(btn => btn.shuffleDoorIndex >= 0 && btn.shuffleTucked)
                        .map(btn => ({ btn, pos: getBigTrainShuffleButtonPosition(btn, bigTrainShufflePauseElapsed, bigTrainShuffleX, y) }))
                    : [];
                drawBigTrainVisual(ctx, bigTrainShuffleX, y, w, h, bgW, bgH, bigTrainShuffleDoorOpenAmount, bigTrainShuffleLightAlpha, tuckedWalkers);
            }

            ctx.restore();
        }

        // --- Level select buttons ------------------------------------------
        const LEVEL_SELECT_IMAGE_WIDTH = 901;
        const LEVEL_SELECT_IMAGE_HEIGHT = 601;
        const LEVEL_SELECT_BUTTON_RADIUS = 11; // 22px diameter

        // Given as (x, y) from the upper left of the screen, with y negative
        // going down the screen -> stored here as normal top-left/down-positive
        // canvas coordinates.
        const levelSelectButtons = [
            { x: 314.5, y: 191.8 }, { x: 458.8, y: 191.8 }, { x: 604.5, y: 191.8 },
            { x: 314.5, y: 274 }, { x: 458.8, y: 274 }, { x: 604.5, y: 274 },
            { x: 314.5, y: 356.2 }, { x: 458.8, y: 356.2 }, { x: 604.5, y: 356.2 }
        ].map((pos, index) => ({
            index,
            x: pos.x,
            y: pos.y,
            finished: false,
            hovered: false,
            pressed: false
        }));

        const LEVEL_SELECT_TITLES = [
            'Lights Out', 'Directions', 'Slow Trains',
            'Moscow Rules', 'I Love Joan', 'Oreo Cookie',
            "Apollo's Adventure", 'Pam is Queen', 'Oliver is cool'
        ];

        let levelStarSprite = null;

        function darkenColor(hex, factor) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `#${Math.round(r * factor).toString(16).padStart(2, '0')}${Math.round(g * factor).toString(16).padStart(2, '0')}${Math.round(b * factor).toString(16).padStart(2, '0')}`;
        }

        function drawLevelSelectButtons() {
            const canvas = document.getElementById('levelSelectCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            // Clear in logical coordinates; the backing store may be larger than
            // LEVEL_SELECT_IMAGE_WIDTH/HEIGHT due to devicePixelRatio scaling.
            ctx.clearRect(0, 0, LEVEL_SELECT_IMAGE_WIDTH, LEVEL_SELECT_IMAGE_HEIGHT);

            // Buttons fade in as the dark overlay fades out.
            const buttonAlpha = 1 - level_select_dark_fade;
            if (buttonAlpha <= 0) return;

            ctx.save();
            ctx.globalAlpha = buttonAlpha;
            ctx.translate(0, -settingsCameraY);

            levelSelectButtons.forEach(btn => {
                ctx.beginPath();
                ctx.arc(btn.x, btn.y, LEVEL_SELECT_BUTTON_RADIUS, 0, Math.PI * 2);

                if (btn.finished) {
                    ctx.fillStyle = btn.pressed ? darkenColor('#ffffff', 0.5) : '#ffffff';
                    ctx.fill();

                    if (levelStarSprite && levelStarSprite.complete) {
                        const starSize = LEVEL_SELECT_BUTTON_RADIUS * 2;
                        ctx.save();
                        if (btn.pressed) ctx.globalAlpha = buttonAlpha * 0.5;
                        ctx.drawImage(levelStarSprite, btn.x - starSize / 2, btn.y - starSize / 2, starSize, starSize);
                        ctx.restore();
                    }
                } else {
                    ctx.lineWidth = 1;
                    const baseColor = btn.hovered ? '#000000' : '#ffffff';
                    ctx.strokeStyle = btn.pressed ? darkenColor(baseColor, 0.5) : baseColor;
                    ctx.stroke();
                }
            });

            // Hover label: level number (small) above the title (above the button).
            // Fades in/out like the settings hover text, and only while math
            // settings are valid - otherwise that warning text shows instead.
            if (levelTitleAlpha > 0 && lastHoveredLevelButton) {
                const hovered = lastHoveredLevelButton;
                ctx.save();
                ctx.globalAlpha = buttonAlpha * levelTitleAlpha;
                ctx.textAlign = 'center';
                ctx.fillStyle = '#000000';

                const titleY = hovered.y - LEVEL_SELECT_BUTTON_RADIUS - 11;
                ctx.font = "600 16pt 'Nunito'";
                ctx.textBaseline = 'alphabetic';
                ctx.fillText(LEVEL_SELECT_TITLES[hovered.index] || '', hovered.x, titleY);

                const labelY = titleY - 23;
                ctx.font = "600 10pt 'Nunito'";
                ctx.fillText(`level ${hovered.index + 1}`, hovered.x, labelY);
                ctx.restore();
            }

            ctx.restore();
        }

        function getLevelSelectCanvasCoords(e) {
            const canvas = document.getElementById('levelSelectCanvas');
            const rect = canvas.getBoundingClientRect();
            // Map CSS pixels to the logical LEVEL_SELECT_IMAGE_WIDTH/HEIGHT
            // coordinate space, not the (devicePixelRatio-scaled) backing store size.
            const scaleX = LEVEL_SELECT_IMAGE_WIDTH / rect.width;
            const scaleY = LEVEL_SELECT_IMAGE_HEIGHT / rect.height;
            return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
        }

        function hitTestLevelSelectButton(x, y) {
            return levelSelectButtons.find(btn => {
                const dx = x - btn.x;
                const dy = y - btn.y;
                return dx * dx + dy * dy <= LEVEL_SELECT_BUTTON_RADIUS * LEVEL_SELECT_BUTTON_RADIUS;
            }) || null;
        }

        // --- Math settings buttons ------------------------------------------
        // 4 operator buttons (+, –, ×, ÷), a gap the size of one button, 13
        // number buttons (0-12), a gap the size of one button, then a gear
        // settings button - all evenly spaced across one row.
        const MATH_SETTINGS_SIZE = 31.4;
        const MATH_SETTINGS_RADIUS = 4;
        const MATH_SETTINGS_LEFT_X = 118;
        const MATH_SETTINGS_RIGHT_X = 782;
        const MATH_SETTINGS_Y = 516.1;
        const MATH_SETTINGS_OPERATORS_SLOT = 0;
        const MATH_SETTINGS_NUMBERS_SPACE_SLOT = 4;
        const MATH_SETTINGS_NUMBERS_SLOT = 5;
        const MATH_SETTINGS_GEAR_SPACE_SLOT = 18;
        const MATH_SETTINGS_GEAR_SLOT = 19;
        const MATH_SETTINGS_SLOT_COUNT = 4 + 1 + 13 + 1 + 1;
        const MATH_SETTINGS_SPACING = (MATH_SETTINGS_RIGHT_X - MATH_SETTINGS_LEFT_X) / (MATH_SETTINGS_SLOT_COUNT - 1);
        const MATH_SETTINGS_DEFAULT_ON = new Set(['1', '2', '3', '4', '5', '6', '7', '8', '9', '+', '–']);
        const MATH_SETTINGS_GEAR_LABEL = 'gear';

        function mathSettingsSlotX(slot) {
            return MATH_SETTINGS_LEFT_X + slot * MATH_SETTINGS_SPACING;
        }

        const mathSettingsButtons = [];
        [
            { label: '+', slot: MATH_SETTINGS_OPERATORS_SLOT + 0 },
            { label: '–', slot: MATH_SETTINGS_OPERATORS_SLOT + 1 },
            { label: '×', slot: MATH_SETTINGS_OPERATORS_SLOT + 2 },
            { label: '÷', slot: MATH_SETTINGS_OPERATORS_SLOT + 3 }
        ].forEach(op => {
            mathSettingsButtons.push({ slot: op.slot, label: op.label, on: MATH_SETTINGS_DEFAULT_ON.has(op.label), hovered: false, pressed: false, bigTrainDoorIndex: -1, bigTrainWalkDelay: 0, bigTrainArrived: false, bigTrainDoorJitterX: 0, bigTrainDoorJitterY: 0, shuffleDoorIndex: -1, shuffleWalkDelay: 0, shuffleTucked: false, shuffleDoorJitterX: 0, shuffleDoorJitterY: 0 });
        });
        for (let n = 0; n <= 12; n++) {
            const label = String(n);
            mathSettingsButtons.push({ slot: MATH_SETTINGS_NUMBERS_SLOT + n, label, on: MATH_SETTINGS_DEFAULT_ON.has(label), hovered: false, pressed: false, bigTrainDoorIndex: -1, bigTrainWalkDelay: 0, bigTrainArrived: false, bigTrainDoorJitterX: 0, bigTrainDoorJitterY: 0, shuffleDoorIndex: -1, shuffleWalkDelay: 0, shuffleTucked: false, shuffleDoorJitterX: 0, shuffleDoorJitterY: 0 });
        }
        mathSettingsButtons.push({ slot: MATH_SETTINGS_GEAR_SLOT, label: MATH_SETTINGS_GEAR_LABEL, on: false, hovered: false, pressed: false, bigTrainDoorIndex: -1, bigTrainWalkDelay: 0, bigTrainArrived: false, bigTrainDoorJitterX: 0, bigTrainDoorJitterY: 0, shuffleDoorIndex: -1, shuffleWalkDelay: 0, shuffleTucked: false, shuffleDoorJitterX: 0, shuffleDoorJitterY: 0 });

        let mathButtonFeetSprite = null;

        // --- Math fact generation queues ---------------------------------------
        // operationsList/secondTermList hold the currently enabled operations/
        // second-term numbers in a shuffled order. generateMathFact() draws from
        // the top of each, so every enabled value is used once before any value
        // repeats - repopulated+reshuffled whenever a value is consumed from an
        // empty list, or whenever the underlying settings change.
        let operationsList = [];
        let secondTermList = [];

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function getEnabledOperations() {
            return mathSettingsButtons.filter(b => ['+', '–', '×', '÷'].includes(b.label) && b.on).map(b => b.label);
        }

        function getEnabledSecondTerms() {
            return mathSettingsButtons.filter(b => /^\d+$/.test(b.label) && b.on).map(b => parseInt(b.label, 10));
        }

        function isMathSettingsValid() {
            return getEnabledOperations().length > 0 && getEnabledSecondTerms().length > 0;
        }

        function repopulateOperationsList() {
            operationsList = shuffleArray(getEnabledOperations());
        }

        function repopulateSecondTermList() {
            secondTermList = shuffleArray(getEnabledSecondTerms());
        }

        repopulateOperationsList();
        repopulateSecondTermList();

        // --- Settings view ----------------------------------------------------
        // Opened by toggling the gear button. A camera pans downward, sliding
        // the whole level-select scene up and revealing a new settings view
        // beneath the level select sprite. All coordinates for settings view
        // content are given from the upper-left of that view, i.e. the point
        // the camera scrolls to once fully open - so world Y for settings view
        // content is SETTINGS_CAMERA_MAX + localY.
        const SETTINGS_CAMERA_MAX = 390;
        const SETTINGS_CAMERA_SPEED = 0.016; // progress per frame at 60fps
        let settingsCameraProgress = 0; // 0 = closed, 1 = fully open
        let settingsCameraY = 0;
        let settingsArrowsSprite = null;

        function updateSettingsCamera(frameDt) {
            const gearBtn = mathSettingsButtons.find(b => b.label === MATH_SETTINGS_GEAR_LABEL);
            const target = (gearBtn && gearBtn.on) ? 1 : 0;
            if (target === 0 && equationStepperInputTarget) closeEquationStepperInput();
            if (settingsCameraProgress < target) {
                settingsCameraProgress = Math.min(1, settingsCameraProgress + SETTINGS_CAMERA_SPEED * frameDt);
            } else if (settingsCameraProgress > target) {
                settingsCameraProgress = Math.max(0, settingsCameraProgress - SETTINGS_CAMERA_SPEED * frameDt);
            }
            // settingsCameraProgress is a plain linear 0-1 driver; ease it for
            // display so the pan accelerates/decelerates like the example
            // problem trains' swap animation, instead of moving at a constant
            // rate with an abrupt start/stop.
            settingsCameraY = easeInOutCubic(settingsCameraProgress) * SETTINGS_CAMERA_MAX;
        }

        function drawSettingsView() {
            const canvas = document.getElementById('levelSelectCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            ctx.save();
            ctx.translate(0, -settingsCameraY);

            // Background fill for everything below the level select sprite -
            // always drawn (only ever scrolled into view up to SETTINGS_CAMERA_MAX
            // below the sprite's bottom edge).
            ctx.fillStyle = '#15140E';
            ctx.fillRect(0, LEVEL_SELECT_IMAGE_HEIGHT - 5, LEVEL_SELECT_IMAGE_WIDTH, SETTINGS_CAMERA_MAX + 5);

            if (settingsCameraProgress <= 0) {
                ctx.restore();
                return;
            }

            ctx.save();
            ctx.globalAlpha = settingsCameraProgress;

            const originY = SETTINGS_CAMERA_MAX;

            if (settingsArrowsSprite && settingsArrowsSprite.complete) {
                ctx.drawImage(settingsArrowsSprite, 47, originY + 157.1,
                    settingsArrowsSprite.width / SPRITE_SCALE, settingsArrowsSprite.height / SPRITE_SCALE);
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';

            const row1Y = originY + 204.6;
            ctx.font = "600 14pt 'Nunito'";
            ctx.fillText('1st Term Range', 159.8, row1Y);
            ctx.fillText('2nd Term', 447.4, row1Y);
            ctx.fillText('answer range', 733.9, row1Y);

            ctx.font = "600 9pt 'Nunito'";
            ctx.fillStyle = '#ffffff';
            ctx.fillText('include', 856.6, row1Y - 8);
            ctx.fillText('turn-arounds', 856.6, row1Y + 8);

            drawProblemsHeader(ctx, originY);

            drawEquationSettingsPanels(ctx, originY);
            drawEquationTracks(ctx, originY);
            drawEquationTrains(ctx, originY);

            ctx.restore();
            ctx.restore();
        }

        // --- Equation settings panels ------------------------------------------
        // One panel per operation, showing its 1st term range, operator, 2nd
        // term list (from the enabled number buttons), equals sign, answer
        // range, and (addition/multiplication only) an "include turn-arounds"
        // checkbox. Active/inactive styling follows the matching operator
        // toggle in mathSettingsButtons.
        const EQUATION_PANEL_RANGE_W = 160.9;
        const EQUATION_PANEL_RANGE_H = 40.9;
        const EQUATION_PANEL_SECOND_TERM_W = 326.2;
        const EQUATION_PANEL_RADIUS = 8;
        const EQUATION_PANEL_TERM_RANGE_X = 159.8;
        const EQUATION_PANEL_OP_X = 261.8;
        const EQUATION_PANEL_SECOND_TERM_X = 446.6;
        const EQUATION_PANEL_EQUALS_X = 631.3;
        const EQUATION_PANEL_ANSWER_RANGE_X = 733.4;
        const EQUATION_PANEL_CHECKBOX_X = 856.6;
        const EQUATION_PANEL_CHECKBOX_SIZE = 18;

        const EQUATION_PANELS = [
            { op: '+', y: 238.9, hasTurnArounds: true },
            { op: '–', y: 290.6, hasTurnArounds: false },
            { op: '×', y: 342, hasTurnArounds: true },
            { op: '÷', y: 393.9, hasTurnArounds: false }
        ];

        // Starting ranges/turn-arounds for each operation.
        const equationSettingsState = {
            '+': { termMin: 1, termMax: 10, answerMin: 0, answerMax: 20, turnArounds: true },
            '–': { termMin: 1, termMax: 10, answerMin: 0, answerMax: 10, turnArounds: false },
            '×': { termMin: 2, termMax: 10, answerMin: 0, answerMax: 144, turnArounds: true },
            '÷': { termMin: 0, termMax: 144, answerMin: 2, answerMax: 10, turnArounds: false }
        };

        // The equationStepper/equationCheckbox hit result from the last mousedown,
        // so mouseup can confirm the pointer is still over the same control.
        let pressedEquationControl = null;
        // The equationStepper/equationCheckbox currently under the pointer.
        let hoveredEquationControl = null;

        // Last mouse position within the canvas, re-tested every frame (not
        // just on mousemove) so hover states stay correct while the settings
        // camera is animating buttons out from under a stationary cursor.
        let lastLevelSelectMouseCoords = null;

        function updateLevelSelectHover() {
            const canvas = document.getElementById('levelSelectCanvas');
            if (!canvas) return;
            const coords = lastLevelSelectMouseCoords;
            const hit = coords ? hitTestLevelSelectScreen(coords.x, coords.y) : null;
            levelSelectButtons.forEach(btn => { btn.hovered = (hit && hit.kind === 'level' && hit.btn === btn); });
            mathSettingsButtons.forEach(btn => { btn.hovered = (hit && hit.kind === 'math' && hit.btn === btn); });
            newProblemsButtonState.hovered = !!(hit && hit.kind === 'newProblemsButton');
            hoveredEquationControl = (hit && (hit.kind === 'equationStepper' || hit.kind === 'equationCheckbox' || hit.kind === 'equationStepperNumber')) ? hit : null;
            canvas.style.cursor = hit ? (hit.kind === 'equationStepperNumber' ? 'text' : 'pointer') : 'default';
        }

        function isEquationControlHovered(kind, op, field, bound, dir) {
            const h = hoveredEquationControl;
            if (!h || h.kind !== kind || h.op !== op) return false;
            if (kind === 'equationStepper') return h.field === field && h.bound === bound && h.dir === dir;
            return true;
        }

        const STEPPER_CARET_OFFSET = 22;
        const STEPPER_CARET_HALF_W = 6;
        const STEPPER_CARET_H = 8;
        const STEPPER_BOX_HALF_W = 35;
        const STEPPER_BOX_RADIUS = 6;
        const PANEL_RANGE_H_PADDING = 6; // gap between the stepper box and the panel edge
        const PANEL_RANGE_V_PADDING = 5;

        // Left edge of the caret column (relative to a stepper's cx) - the
        // number area is everything in the stepper box to the left of this.
        const STEPPER_CARET_AREA_LEFT_EDGE = STEPPER_CARET_OFFSET - STEPPER_CARET_HALF_W - 3;
        // Width of that number area, from the box's left edge to the caret column.
        const STEPPER_NUMBER_AREA_WIDTH = STEPPER_BOX_HALF_W + STEPPER_CARET_AREA_LEFT_EDGE;

        function drawStepperValue(ctx, cx, y, value, color, op, field, bound) {
            const boxH = EQUATION_PANEL_RANGE_H - PANEL_RANGE_V_PADDING * 2;

            // Filled white background behind the whole stepper (number + carets)
            roundRectPath(ctx, cx - STEPPER_BOX_HALF_W, y - boxH / 2, STEPPER_BOX_HALF_W * 2, boxH, STEPPER_BOX_RADIUS);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Center the number in the leftover space to the left of the carets,
            // rather than in the middle of the whole stepper box.
            const numberCx = cx - STEPPER_BOX_HALF_W + STEPPER_NUMBER_AREA_WIDTH / 2;

            ctx.fillStyle = color;
            fillCenteredTrainText(ctx, String(value), numberCx, y, 14);

            // Up/down carets to the right of the number
            const caretX = cx + STEPPER_CARET_OFFSET;
            const w = STEPPER_CARET_HALF_W;
            const h = STEPPER_CARET_H;

            if (isEquationControlHovered('equationStepper', op, field, bound, 'up')) {
                roundRectPath(ctx, caretX - w - 3, y - 3 - h - 3, (w + 3) * 2, h + 3, 3);
                ctx.fillStyle = '#DDDDDD';
                ctx.fill();
            }
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(caretX - w, y - 3);
            ctx.lineTo(caretX + w, y - 3);
            ctx.lineTo(caretX, y - 3 - h);
            ctx.closePath();
            ctx.fill();

            if (isEquationControlHovered('equationStepper', op, field, bound, 'down')) {
                roundRectPath(ctx, caretX - w - 3, y + 3, (w + 3) * 2, h + 3, 3);
                ctx.fillStyle = '#DDDDDD';
                ctx.fill();
            }
            ctx.beginPath();
            ctx.moveTo(caretX - w, y + 3);
            ctx.lineTo(caretX + w, y + 3);
            ctx.lineTo(caretX, y + 3 + h);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawRangeBox(ctx, cx, y, min, max, fillColor, strokeColor, textColor, op, field) {
            const w = EQUATION_PANEL_RANGE_W, h = EQUATION_PANEL_RANGE_H;
            roundRectPath(ctx, cx - w / 2, y - h / 2, w, h, EQUATION_PANEL_RADIUS);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();

            const offset = w / 2 - PANEL_RANGE_H_PADDING - STEPPER_BOX_HALF_W;
            drawStepperValue(ctx, cx - offset, y, min, textColor, op, field, 'min');

            ctx.fillStyle = textColor;
            fillCenteredTrainText(ctx, '-', cx, y, 14);

            drawStepperValue(ctx, cx + offset, y, max, textColor, op, field, 'max');
        }

        function drawSecondTermBox(ctx, cx, y, fillColor, strokeColor, textColor, op) {
            const w = EQUATION_PANEL_SECOND_TERM_W, h = EQUATION_PANEL_RANGE_H;
            roundRectPath(ctx, cx - w / 2, y - h / 2, w, h, EQUATION_PANEL_RADIUS);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();

            const onNumbers = mathSettingsButtons
                .filter(b => /^\d+$/.test(b.label) && b.on)
                .filter(b => !(op === '÷' && b.label === '0')) // division by 0 is never used
                .map(b => b.label);

            ctx.fillStyle = textColor;
            fillCenteredTrainText(ctx, onNumbers.join(', '), cx, y, 14);
        }

        function drawTurnAroundsCheckbox(ctx, cx, y, checked, fillColor, strokeColor, textColor, hovered) {
            const s = EQUATION_PANEL_CHECKBOX_SIZE;
            roundRectPath(ctx, cx - s / 2, y - s / 2, s, s, 4);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();

            if (checked) {
                ctx.strokeStyle = textColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx - s * 0.28, y);
                ctx.lineTo(cx - s * 0.06, y + s * 0.22);
                ctx.lineTo(cx + s * 0.3, y - s * 0.25);
                ctx.stroke();
            }

            if (hovered) {
                roundRectPath(ctx, cx - s / 2, y - s / 2, s, s, 4);
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }
        }

        function drawEquationSettingsPanels(ctx, originY) {
            EQUATION_PANELS.forEach(panel => {
                const btn = mathSettingsButtons.find(b => b.label === panel.op);
                const active = !!(btn && btn.on);
                const fillColor = active ? '#FFF4AD' : '#4ECEC5';
                const strokeColor = active ? '#CDB020' : '#04473F';
                const opColor = fillColor;
                const textColor = active ? '#000000' : '#2FAFA0';
                const y = originY + panel.y;
                const state = equationSettingsState[panel.op];

                drawRangeBox(ctx, EQUATION_PANEL_TERM_RANGE_X, y, state.termMin, state.termMax, fillColor, strokeColor, textColor, panel.op, 'term');

                ctx.fillStyle = opColor;
                fillCenteredTrainText(ctx, panel.op, EQUATION_PANEL_OP_X, y, 32);

                drawSecondTermBox(ctx, EQUATION_PANEL_SECOND_TERM_X, y, fillColor, strokeColor, textColor, panel.op);

                ctx.fillStyle = opColor;
                fillCenteredTrainText(ctx, '=', EQUATION_PANEL_EQUALS_X, y, 32);

                drawRangeBox(ctx, EQUATION_PANEL_ANSWER_RANGE_X, y, state.answerMin, state.answerMax, fillColor, strokeColor, textColor, panel.op, 'answer');

                if (panel.hasTurnArounds) {
                    const hovered = isEquationControlHovered('equationCheckbox', panel.op);
                    drawTurnAroundsCheckbox(ctx, EQUATION_PANEL_CHECKBOX_X, y, state.turnArounds, fillColor, strokeColor, textColor, hovered);
                }
            });
        }

        // --- Equation settings tracks & trains ---------------------------------
        // Two tracks below the panels, each holding 4 still, evenly-spaced
        // fully-lit 3-car trains (1st term / operator / 2nd term = answer)
        // built from the currently enabled operations and number buttons.
        // Whenever a setting changes (or "New Problems" is pressed), all 8
        // swap out at once: the old set slides off to the right while a
        // freshly generated set slides in from the left.
        const EQUATION_TRACK_YS_LOCAL = [490.2, 560.7];
        const EQUATION_TRAIN_CAR_SIZE = 49;
        const EQUATION_TRAIN_CAR_SPACING = 59;
        const EQUATION_TRAIN_CAR_RADIUS = 5;
        const EQUATION_TRAIN_CARS = 3;
        const EQUATION_SLOTS_PER_TRACK = 4;
        const EQUATION_TRAIN_PITCH = 210; // center-to-center spacing between trains in a track
        const EQUATION_REFRESH_DURATION_MS = 1200;
        const EQUATION_REFRESH_TRAVEL = LEVEL_SELECT_IMAGE_WIDTH; // far enough to clear the screen

        let equationTrains = []; // 8 resting trains: {trackIndex, slot, texts}
        let equationOutgoingTrains = []; // previous set, sliding out during a refresh
        let equationRefreshing = false;
        let equationRefreshElapsed = 0;
        // If a setting changes (or "New Problems" is pressed) while a swap is
        // already in progress, the new swap is queued here instead of cutting
        // the current animation short - it fires immediately once the current
        // animation finishes.
        let replaceExampleTrains = false;

        function getEquationSlotX(slot) {
            const totalWidth = (EQUATION_SLOTS_PER_TRACK - 1) * EQUATION_TRAIN_PITCH;
            const startX = LEVEL_SELECT_IMAGE_WIDTH / 2 - totalWidth / 2;
            return startX + slot * EQUATION_TRAIN_PITCH;
        }

        function generateEquationTrainTexts() {
            // Uses the same operations_list/second_term_list draw as real
            // gameplay math facts, so the preview trains demonstrate the
            // actual generation process (including its no-more-than-2-in-a-
            // row-per-operation behavior) rather than a separate pure-random pick.
            const fact = generateMathFact();
            return [fact.term1, fact.operation, fact.term2];
        }

        function buildEquationTrainSet() {
            const trains = [];
            for (let slot = 0; slot < EQUATION_SLOTS_PER_TRACK; slot++) {
                for (let trackIndex = 0; trackIndex < EQUATION_TRACK_YS_LOCAL.length; trackIndex++) {
                    trains.push({ trackIndex, slot, texts: generateEquationTrainTexts() });
                }
            }
            return trains;
        }

        function initEquationTrains() {
            equationTrains = buildEquationTrainSet();
            equationOutgoingTrains = [];
            equationRefreshing = false;
            equationRefreshElapsed = 0;
            replaceExampleTrains = false;
        }

        // Called whenever a math setting changes, or "New Problems" is pressed.
        // If a swap is already playing, queue it via replaceExampleTrains
        // instead of restarting the animation mid-flight.
        function triggerEquationRefresh() {
            if (equationRefreshing) {
                replaceExampleTrains = true;
                return;
            }
            equationOutgoingTrains = equationTrains;
            equationTrains = buildEquationTrainSet();
            equationRefreshing = true;
            equationRefreshElapsed = 0;
        }

        function updateEquationTrains(elapsedMs) {
            if (!equationRefreshing) return;
            equationRefreshElapsed += elapsedMs;
            if (equationRefreshElapsed >= EQUATION_REFRESH_DURATION_MS) {
                equationRefreshing = false;
                equationRefreshElapsed = 0;
                equationOutgoingTrains = [];
                if (replaceExampleTrains) {
                    replaceExampleTrains = false;
                    triggerEquationRefresh();
                }
            }
        }

        function drawEquationTracks(ctx, originY) {
            ctx.strokeStyle = '#004C43';
            ctx.lineWidth = 2;
            EQUATION_TRACK_YS_LOCAL.forEach(localY => {
                const y = originY + localY;
                ctx.beginPath();
                ctx.moveTo(0, y - 5);
                ctx.lineTo(LEVEL_SELECT_IMAGE_WIDTH, y - 5);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, y + 5);
                ctx.lineTo(LEVEL_SELECT_IMAGE_WIDTH, y + 5);
                ctx.stroke();
            });
        }

        // Matches the run mode fully-lit train look exactly - see
        // lightTrainConnectors()/lightTrainCars() (#FFF4AD fill+stroke cars,
        // #FFF4AD connector) and drawTrainText() (black text).
        function drawOneEquationTrain(ctx, originY, trackIndex, centerX, texts) {
            const litColor = '#FFF4AD';
            const y = originY + EQUATION_TRACK_YS_LOCAL[trackIndex];
            const carCenters = [];
            for (let c = 0; c < EQUATION_TRAIN_CARS; c++) {
                carCenters.push(centerX + (c - 1) * EQUATION_TRAIN_CAR_SPACING);
            }
            const firstX = carCenters[0];
            const lastX = carCenters[carCenters.length - 1];

            ctx.strokeStyle = litColor;
            ctx.lineWidth = 16;
            ctx.lineCap = 'butt';
            ctx.beginPath();
            ctx.moveTo(firstX, y);
            ctx.lineTo(lastX, y);
            ctx.stroke();

            carCenters.forEach((cx, i) => {
                roundRectPath(ctx, cx - EQUATION_TRAIN_CAR_SIZE / 2, y - EQUATION_TRAIN_CAR_SIZE / 2, EQUATION_TRAIN_CAR_SIZE, EQUATION_TRAIN_CAR_SIZE, EQUATION_TRAIN_CAR_RADIUS);
                ctx.fillStyle = litColor;
                ctx.fill();
                ctx.strokeStyle = litColor;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#000000';
                fillCenteredTrainText(ctx, texts[i], cx, y, 22);
            });
        }

        // Holds flat at 0 for the first PAUSE_FRACTION of the duration, eases
        // through the middle, then holds flat at 1 for the last PAUSE_FRACTION -
        // a short, deliberate pause at each end rather than just an instant of
        // zero velocity.
        const EQUATION_REFRESH_PAUSE_FRACTION = 0.01;

        function easeInOutWithPauses(t) {
            const p = EQUATION_REFRESH_PAUSE_FRACTION;
            if (t <= p) return 0;
            if (t >= 1 - p) return 1;
            return easeInOutCubic((t - p) / (1 - 2 * p));
        }

        function drawEquationTrains(ctx, originY) {
            // Both sets share one eased progress value, applied as equal and
            // opposite offsets from rest - so at every instant the outgoing
            // and incoming trains are moving at exactly the same speed.
            const linear = equationRefreshing ? Math.min(1, equationRefreshElapsed / EQUATION_REFRESH_DURATION_MS) : 1;
            const eased = equationRefreshing ? easeInOutWithPauses(linear) : 1;

            if (equationRefreshing) {
                equationOutgoingTrains.forEach(train => {
                    const x = getEquationSlotX(train.slot) + eased * EQUATION_REFRESH_TRAVEL;
                    drawOneEquationTrain(ctx, originY, train.trackIndex, x, train.texts);
                });
            }

            equationTrains.forEach(train => {
                const restX = getEquationSlotX(train.slot);
                const x = restX - (1 - eased) * EQUATION_REFRESH_TRAVEL;
                drawOneEquationTrain(ctx, originY, train.trackIndex, x, train.texts);
            });
        }

        // --- "Problems created..." header + New Problems button ----------------
        // The header text and the button next to it are centered together as
        // a single horizontal group. Pressing the button (or changing any math
        // setting) re-rolls all 8 example problems via triggerEquationRefresh().
        const PROBLEMS_HEADER_Y_LOCAL = 440.7;
        const PROBLEMS_HEADER_CENTER_X = 447.4;
        const PROBLEMS_HEADER_GAP = 16;
        const PROBLEMS_HEADER_TEXT = 'Problems created with these settings:';
        const NEW_PROBLEMS_BUTTON_LABEL = 'New Problems';
        const NEW_PROBLEMS_BUTTON_HEIGHT = 24;
        const NEW_PROBLEMS_BUTTON_PADDING_X = 14;
        const NEW_PROBLEMS_BUTTON_RADIUS = MATH_SETTINGS_RADIUS;

        let newProblemsButtonState = { hovered: false, pressed: false };
        let problemsHeaderLayoutCache = null;

        function getProblemsHeaderLayout(ctx) {
            if (problemsHeaderLayoutCache) return problemsHeaderLayoutCache;
            ctx.font = "600 14pt 'Nunito'";
            const headerWidth = ctx.measureText(PROBLEMS_HEADER_TEXT).width;
            const buttonTextWidth = ctx.measureText(NEW_PROBLEMS_BUTTON_LABEL).width;
            const buttonW = buttonTextWidth + NEW_PROBLEMS_BUTTON_PADDING_X * 2;
            const buttonH = NEW_PROBLEMS_BUTTON_HEIGHT;
            const totalWidth = headerWidth + PROBLEMS_HEADER_GAP + buttonW;
            const groupLeft = PROBLEMS_HEADER_CENTER_X - totalWidth / 2;
            const textCenterX = groupLeft + headerWidth / 2;
            const buttonLeft = groupLeft + headerWidth + PROBLEMS_HEADER_GAP;
            const buttonCenterX = buttonLeft + buttonW / 2;
            problemsHeaderLayoutCache = { textCenterX, buttonLeft, buttonCenterX, buttonW, buttonH };
            return problemsHeaderLayoutCache;
        }

        function drawProblemsHeader(ctx, originY) {
            const layout = getProblemsHeaderLayout(ctx);
            const y = originY + PROBLEMS_HEADER_Y_LOCAL;

            // fillCenteredTrainText centers on actual glyph bounds (ascent/descent)
            // rather than canvas's 'middle' baseline, which sits visibly off-center
            // for bold Nunito - needed here so the button background lines up with
            // its label instead of looking shifted down.
            ctx.fillStyle = '#ffffff';
            fillCenteredTrainText(ctx, PROBLEMS_HEADER_TEXT, layout.textCenterX, y, 14);

            const bx = layout.buttonLeft;
            const by = y - layout.buttonH / 2;
            roundRectPath(ctx, bx, by, layout.buttonW, layout.buttonH, NEW_PROBLEMS_BUTTON_RADIUS);
            let fillColor = '#FFF4AD';
            let strokeColor = '#CDB020';
            if (newProblemsButtonState.pressed) {
                fillColor = darkenColor(fillColor, 0.5);
                strokeColor = darkenColor(strokeColor, 0.5);
            }
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();

            ctx.fillStyle = '#000000';
            fillCenteredTrainText(ctx, NEW_PROBLEMS_BUTTON_LABEL, layout.buttonCenterX, y, 14);

            if (newProblemsButtonState.hovered) {
                roundRectPath(ctx, bx, by, layout.buttonW, layout.buttonH, NEW_PROBLEMS_BUTTON_RADIUS);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }
        }

        function hitTestNewProblemsButton(x, y) {
            const canvas = document.getElementById('levelSelectCanvas');
            if (!canvas) return false;
            const ctx = canvas.getContext('2d');
            const layout = getProblemsHeaderLayout(ctx);
            const originY = SETTINGS_CAMERA_MAX;
            const cy = originY + PROBLEMS_HEADER_Y_LOCAL;
            const bx = layout.buttonLeft;
            const by = cy - layout.buttonH / 2;
            return x >= bx && x <= bx + layout.buttonW && y >= by && y <= by + layout.buttonH;
        }

        function roundRectPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + r, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function hitTestMathSettingsButton(x, y) {
            const half = MATH_SETTINGS_SIZE / 2;
            return mathSettingsButtons.find(btn => {
                const cx = mathSettingsSlotX(btn.slot);
                return x >= cx - half && x <= cx + half && y >= MATH_SETTINGS_Y - half && y <= MATH_SETTINGS_Y + half;
            }) || null;
        }

        // Shared button-body draw (fill, stroke, label/gear glyph) used both
        // for a button resting in its real row slot and for one still
        // hopping in from behind a big-train door - callers handle alpha,
        // feet sprite, and the hover outline themselves since those only
        // apply to a button at rest.
        function drawMathSettingsButtonBody(ctx, btn, cx, cy, pressed) {
            const half = MATH_SETTINGS_SIZE / 2;
            const x = cx - half;
            const y = cy - half;

            roundRectPath(ctx, x, y, MATH_SETTINGS_SIZE, MATH_SETTINGS_SIZE, MATH_SETTINGS_RADIUS);
            let fillColor = btn.on ? '#FFF4AD' : '#4ECEC5';
            if (pressed) fillColor = darkenColor(fillColor, 0.5);
            ctx.fillStyle = fillColor;
            ctx.fill();

            let strokeColor = btn.on ? '#CDB020' : '#04473F';
            if (pressed) strokeColor = darkenColor(strokeColor, 0.5);
            ctx.lineWidth = 2;
            ctx.strokeStyle = strokeColor;
            ctx.stroke();

            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            if (btn.label === MATH_SETTINGS_GEAR_LABEL) {
                ctx.fillStyle = btn.on ? '#000000' : '#2FAFA0';
                const gearFont = `${MATH_SETTINGS_SIZE * 1.3}px sans-serif`;
                ctx.font = gearFont;
                ctx.fillText('⚙︎', cx, cy + getCenteredTextHalfOffset(ctx, gearFont, '⚙︎'));
            } else {
                ctx.fillStyle = btn.on ? '#000000' : '#2FAFA0';
                const labelFont = "600 14pt 'Nunito'";
                ctx.font = labelFont;
                ctx.fillText(btn.label, cx, cy + getCenteredTextHalfOffset(ctx, labelFont, btn.label));
            }
        }

        function drawMathSettingsButtonFeet(ctx, cx, cy) {
            if (!mathButtonFeetSprite || !mathButtonFeetSprite.complete) return;
            const feetW = mathButtonFeetSprite.naturalWidth;
            const feetH = mathButtonFeetSprite.naturalHeight;
            ctx.drawImage(mathButtonFeetSprite, cx - feetW / 2, cy + MATH_SETTINGS_SIZE / 2, feetW, feetH);
        }

        function drawMathSettingsButtons() {
            const canvas = document.getElementById('levelSelectCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const half = MATH_SETTINGS_SIZE / 2;

            ctx.save();
            ctx.translate(0, -settingsCameraY);

            const visible = mathSettingsButtons
                .map(btn => {
                    // Button-shuffle (triggered by a level click) takes
                    // priority: walking from its row slot toward its newly
                    // assigned door, vanishing the instant it arrives (no
                    // hiding-behind-a-door needed on the way in - see
                    // drawBigTrainVisual()).
                    if (bigTrainShuffleActive && btn.shuffleDoorIndex >= 0) {
                        if (btn.shuffleTucked) return null;
                        const pos = getBigTrainShuffleButtonPosition(btn, bigTrainShufflePauseElapsed, bigTrainShuffleX, getBigTrainTopY());
                        return { btn, cx: pos.x, cy: pos.y, resting: false };
                    }

                    // Otherwise, the original intro reveal: still hidden
                    // behind a closed/opening big-train door - see
                    // drawBigTrain(). Once a door is fully open, this layer
                    // takes over drawing the button (still walking if not
                    // arrived yet).
                    const doorOpen = btn.bigTrainDoorIndex >= 0 && bigTrainDoorOpenAmount >= 1;
                    if (!btn.bigTrainArrived && !doorOpen) return null;

                    if (btn.bigTrainArrived) {
                        return { btn, cx: mathSettingsSlotX(btn.slot), cy: MATH_SETTINGS_Y, resting: true };
                    }
                    const pos = getBigTrainButtonWalkPosition(btn, bigTrainPauseElapsed, bigTrainX, getBigTrainTopY());
                    return { btn, cx: pos.x, cy: pos.y, resting: false };
                })
                .filter(Boolean);

            // Sorted so a button further down the screen (larger y) is
            // always drawn in front of one further up, regardless of array
            // order - matters while buttons are still walking at varying
            // heights; buttons at rest all share the same y anyway.
            visible.sort((a, b) => a.cy - b.cy);

            visible.forEach(({ btn, cx, cy, resting }) => {
                const x = cx - half;
                const y = cy - half;

                drawMathSettingsButtonFeet(ctx, cx, cy);
                drawMathSettingsButtonBody(ctx, btn, cx, cy, btn.pressed);

                if (resting && btn.hovered) {
                    roundRectPath(ctx, x, y, MATH_SETTINGS_SIZE, MATH_SETTINGS_SIZE, MATH_SETTINGS_RADIUS);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                }
            });

            drawMathSettingsHoverText(ctx);
            drawMathSettingsGroupHoverText(ctx);

            ctx.restore();
        }

        // --- Math settings hover text -------------------------------------------
        // Summarizes the currently enabled operations/numbers, e.g.
        // "Add & subtract" / "1, 2, & 3". Shown while hovering
        // any operation/number button, and always while settings mode is open.
        const MATH_SETTINGS_HOVER_TEXT_Y = 432.2;
        const MATH_SETTINGS_HOVER_LINE_GAP = 22;
        const MATH_OPERATION_WORDS = {
            '+': 'add',
            '–': 'subtract',
            '×': 'multiply by',
            '÷': 'divide by'
        };

        function joinWithAmpersand(items) {
            if (items.length === 0) return '';
            if (items.length === 1) return items[0];
            if (items.length === 2) return `${items[0]} & ${items[1]}`;
            return `${items.slice(0, -1).join(', ')}, & ${items[items.length - 1]}`;
        }

        const MATH_SETTINGS_WARNING_COLOR = '#FF714E'; // same red used for wrong-answer train feedback

        function getMathSettingsHoverLines() {
            const opWords = getEnabledOperations().map(op => MATH_OPERATION_WORDS[op]);
            const numbers = getEnabledSecondTerms().map(String);
            const joinedOps = joinWithAmpersand(opWords);

            const line1 = joinedOps
                ? { text: joinedOps.charAt(0).toUpperCase() + joinedOps.slice(1), color: '#ffffff' }
                : { text: 'Choose at least one operation', color: MATH_SETTINGS_WARNING_COLOR };
            const line2 = numbers.length
                ? { text: joinWithAmpersand(numbers), color: '#ffffff' }
                : { text: 'Choose at least one number', color: MATH_SETTINGS_WARNING_COLOR };

            return [line1, line2];
        }

        function isAnyMathSettingsButtonHovered() {
            return mathSettingsButtons.some(b => b.hovered);
        }

        function shouldShowMathSettingsHoverText() {
            const gearBtn = mathSettingsButtons.find(b => b.label === MATH_SETTINGS_GEAR_LABEL);
            if (gearBtn && gearBtn.on) return true;
            if (isAnyMathSettingsButtonHovered()) return true;
            // A level button hovered while settings are incomplete borrows
            // this same warning text instead of showing the level title.
            if (!isMathSettingsValid() && levelSelectButtons.some(b => b.hovered)) return true;
            return false;
        }

        // Quick fade in/out (not an instant toggle) for the hover text below.
        const MATH_SETTINGS_HOVER_FADE_SPEED = 0.12; // alpha change per frame-unit at 60fps (~8-frame fade)
        let mathSettingsHoverTextAlpha = 0;
        let mathSettingsGroupHoverTextAlpha = 0;

        function moveToward(value, target, maxDelta) {
            if (value < target) return Math.min(target, value + maxDelta);
            if (value > target) return Math.max(target, value - maxDelta);
            return value;
        }

        // Level title hover label fades the same way, and only when settings
        // are valid - otherwise the warning text above takes its place.
        let levelTitleAlpha = 0;
        let lastHoveredLevelButton = null;

        function updateMathSettingsHoverTextFade(frameDt) {
            const step = MATH_SETTINGS_HOVER_FADE_SPEED * frameDt;
            mathSettingsHoverTextAlpha = moveToward(mathSettingsHoverTextAlpha, shouldShowMathSettingsHoverText() ? 1 : 0, step);
            mathSettingsGroupHoverTextAlpha = moveToward(mathSettingsGroupHoverTextAlpha, shouldShowMathSettingsGroupHoverText() ? 1 : 0, step);

            const hoveredLevelBtn = levelSelectButtons.find(b => b.hovered);
            if (hoveredLevelBtn) lastHoveredLevelButton = hoveredLevelBtn;
            const levelTitleTarget = (hoveredLevelBtn && isMathSettingsValid()) ? 1 : 0;
            levelTitleAlpha = moveToward(levelTitleAlpha, levelTitleTarget, step);
        }

        function drawMathSettingsHoverText(ctx) {
            if (mathSettingsHoverTextAlpha <= 0) return;

            const [line1, line2] = getMathSettingsHoverLines();
            ctx.save();
            ctx.globalAlpha = mathSettingsHoverTextAlpha;
            ctx.font = "600 14pt 'Nunito'";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = line1.color;
            ctx.fillText(line1.text, LEVEL_SELECT_IMAGE_WIDTH / 2, MATH_SETTINGS_HOVER_TEXT_Y - MATH_SETTINGS_HOVER_LINE_GAP / 2);
            ctx.fillStyle = line2.color;
            ctx.fillText(line2.text, LEVEL_SELECT_IMAGE_WIDTH / 2, MATH_SETTINGS_HOVER_TEXT_Y + MATH_SETTINGS_HOVER_LINE_GAP / 2);
            ctx.restore();
        }

        // --- Math settings group hover labels -----------------------------------
        // "Operation settings" / "Number settings" / "More settings" - all
        // three shown together, each centered below its respective button
        // group, while hovering any math settings button - but only while
        // the settings view is closed (replaced by the full hover summary
        // once the view is open).
        const MATH_SETTINGS_GROUP_LABEL_GAP = 26;

        const MATH_SETTINGS_GROUP_LABELS = [
            { text: 'Operation settings', slotStart: MATH_SETTINGS_OPERATORS_SLOT, slotEnd: MATH_SETTINGS_OPERATORS_SLOT + 3 },
            { text: 'Number settings', slotStart: MATH_SETTINGS_NUMBERS_SLOT, slotEnd: MATH_SETTINGS_NUMBERS_SLOT + 12 },
            { text: 'More settings', slotStart: MATH_SETTINGS_GEAR_SLOT, slotEnd: MATH_SETTINGS_GEAR_SLOT }
        ];

        function shouldShowMathSettingsGroupHoverText() {
            const gearBtn = mathSettingsButtons.find(b => b.label === MATH_SETTINGS_GEAR_LABEL);
            if (gearBtn && gearBtn.on) return false;
            return isAnyMathSettingsButtonHovered();
        }

        function drawMathSettingsGroupHoverText(ctx) {
            if (mathSettingsGroupHoverTextAlpha <= 0) return;

            const y = MATH_SETTINGS_Y + MATH_SETTINGS_SIZE / 2 + MATH_SETTINGS_GROUP_LABEL_GAP;
            ctx.save();
            ctx.globalAlpha = mathSettingsGroupHoverTextAlpha;
            ctx.fillStyle = '#ffffff';
            ctx.font = "600 9pt 'Nunito'";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            MATH_SETTINGS_GROUP_LABELS.forEach(info => {
                const cx = mathSettingsSlotX((info.slotStart + info.slotEnd) / 2);
                ctx.fillText(info.text, cx, y);
            });
            ctx.restore();
        }

        function getRangeBoxStepperCenters(cx) {
            const offset = EQUATION_PANEL_RANGE_W / 2 - PANEL_RANGE_H_PADDING - STEPPER_BOX_HALF_W;
            return { minCx: cx - offset, maxCx: cx + offset };
        }

        function hitTestStepperCaret(x, y, stepperCx, rowY) {
            const caretX = stepperCx + STEPPER_CARET_OFFSET;
            if (x < caretX - STEPPER_CARET_HALF_W - 2 || x > caretX + STEPPER_CARET_HALF_W + 2) return null;
            if (y >= rowY - 3 - STEPPER_CARET_H - 2 && y <= rowY - 1) return 'up';
            if (y >= rowY + 1 && y <= rowY + 3 + STEPPER_CARET_H + 2) return 'down';
            return null;
        }

        function hitTestStepperNumber(x, y, stepperCx, rowY) {
            const boxH = EQUATION_PANEL_RANGE_H - PANEL_RANGE_V_PADDING * 2;
            if (y < rowY - boxH / 2 || y > rowY + boxH / 2) return false;
            if (x < stepperCx - STEPPER_BOX_HALF_W || x > stepperCx + STEPPER_BOX_HALF_W) return false;
            // Exclude the caret column - handled separately by hitTestStepperCaret.
            const caretX = stepperCx + STEPPER_CARET_OFFSET;
            if (x >= caretX - STEPPER_CARET_HALF_W - 2 && x <= caretX + STEPPER_CARET_HALF_W + 2) return false;
            return true;
        }

        function hitTestStepperPair(x, y, stepperX, rowY, op, field) {
            const centers = getRangeBoxStepperCenters(stepperX);
            const minDir = hitTestStepperCaret(x, y, centers.minCx, rowY);
            if (minDir) return { kind: 'equationStepper', op, field, bound: 'min', dir: minDir };
            const maxDir = hitTestStepperCaret(x, y, centers.maxCx, rowY);
            if (maxDir) return { kind: 'equationStepper', op, field, bound: 'max', dir: maxDir };

            if (hitTestStepperNumber(x, y, centers.minCx, rowY)) return { kind: 'equationStepperNumber', op, field, bound: 'min' };
            if (hitTestStepperNumber(x, y, centers.maxCx, rowY)) return { kind: 'equationStepperNumber', op, field, bound: 'max' };
            return null;
        }

        function hitTestEquationSettingsPanels(x, y) {
            const originY = SETTINGS_CAMERA_MAX;
            for (const panel of EQUATION_PANELS) {
                const rowY = originY + panel.y;

                const term = hitTestStepperPair(x, y, EQUATION_PANEL_TERM_RANGE_X, rowY, panel.op, 'term');
                if (term) return term;

                const answer = hitTestStepperPair(x, y, EQUATION_PANEL_ANSWER_RANGE_X, rowY, panel.op, 'answer');
                if (answer) return answer;

                if (panel.hasTurnArounds) {
                    const s = EQUATION_PANEL_CHECKBOX_SIZE;
                    const cx = EQUATION_PANEL_CHECKBOX_X;
                    if (x >= cx - s / 2 && x <= cx + s / 2 && y >= rowY - s / 2 && y <= rowY + s / 2) {
                        return { kind: 'equationCheckbox', op: panel.op };
                    }
                }
            }
            return null;
        }

        function adjustEquationRange(op, field, bound, dir) {
            const state = equationSettingsState[op];
            if (!state) return;
            const minKey = field === 'term' ? 'termMin' : 'answerMin';
            const maxKey = field === 'term' ? 'termMax' : 'answerMax';
            const delta = dir === 'up' ? 1 : -1;
            if (bound === 'min') {
                state[minKey] = Math.max(0, Math.min(state[minKey] + delta, state[maxKey]));
            } else {
                state[maxKey] = Math.max(state[minKey], Math.min(state[maxKey] + delta, 999));
            }
        }

        function setEquationRangeValue(op, field, bound, value) {
            const state = equationSettingsState[op];
            if (!state || !Number.isFinite(value)) return;
            value = Math.max(0, Math.min(Math.round(value), 999));
            const minKey = field === 'term' ? 'termMin' : 'answerMin';
            const maxKey = field === 'term' ? 'termMax' : 'answerMax';
            if (bound === 'min') {
                state[minKey] = Math.min(value, state[maxKey]);
            } else {
                state[maxKey] = Math.max(value, state[minKey]);
            }
        }

        function toggleEquationTurnArounds(op) {
            const state = equationSettingsState[op];
            if (!state) return;
            state.turnArounds = !state.turnArounds;
        }

        // --- Stepper text input -------------------------------------------------
        // Clicking a stepper's number (rather than its up/down carets) opens a
        // floating HTML input positioned over it, so the value can be typed
        // directly instead of only nudged one at a time.
        let equationStepperInputEl = null;
        let equationStepperInputTarget = null; // {op, field, bound}

        function ensureEquationStepperInput() {
            if (equationStepperInputEl) return equationStepperInputEl;
            const el = document.createElement('input');
            el.type = 'text';
            el.inputMode = 'numeric';
            el.autocomplete = 'off';
            el.style.position = 'fixed';
            el.style.zIndex = '1000';
            el.style.textAlign = 'center';
            el.style.fontFamily = "'Nunito', sans-serif";
            el.style.fontWeight = '600';
            el.style.color = '#000000';
            el.style.background = '#ffffff';
            el.style.border = '2px solid #000000';
            el.style.borderTopLeftRadius = '6px';
            el.style.borderBottomLeftRadius = '6px';
            el.style.borderTopRightRadius = '0';
            el.style.borderBottomRightRadius = '0';
            el.style.boxSizing = 'border-box';
            el.style.padding = '0';
            el.style.display = 'none';
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    commitEquationStepperInput();
                } else if (e.key === 'Escape') {
                    closeEquationStepperInput();
                }
            });
            el.addEventListener('blur', () => {
                commitEquationStepperInput();
            });
            document.body.appendChild(el);
            equationStepperInputEl = el;
            return el;
        }

        function openEquationStepperInput(op, field, bound) {
            const panel = EQUATION_PANELS.find(p => p.op === op);
            const canvas = document.getElementById('levelSelectCanvas');
            if (!panel || !canvas) return;

            const el = ensureEquationStepperInput();
            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width / LEVEL_SELECT_IMAGE_WIDTH;
            const scaleY = rect.height / LEVEL_SELECT_IMAGE_HEIGHT;

            const panelX = field === 'term' ? EQUATION_PANEL_TERM_RANGE_X : EQUATION_PANEL_ANSWER_RANGE_X;
            const centers = getRangeBoxStepperCenters(panelX);
            const stepperCx = bound === 'min' ? centers.minCx : centers.maxCx;

            const worldY = SETTINGS_CAMERA_MAX + panel.y;
            const canvasY = worldY - settingsCameraY; // screen-space y, matches what's drawn
            const boxH = EQUATION_PANEL_RANGE_H - PANEL_RANGE_V_PADDING * 2;

            el.style.left = (rect.left + (stepperCx - STEPPER_BOX_HALF_W) * scaleX) + 'px';
            el.style.top = (rect.top + (canvasY - boxH / 2) * scaleY) + 'px';
            el.style.width = (STEPPER_NUMBER_AREA_WIDTH * scaleX) + 'px';
            el.style.height = (boxH * scaleY) + 'px';
            el.style.fontSize = Math.max(10, boxH * scaleY * 0.5) + 'px';

            const state = equationSettingsState[op];
            const key = field === 'term' ? (bound === 'min' ? 'termMin' : 'termMax') : (bound === 'min' ? 'answerMin' : 'answerMax');
            el.value = String(state[key]);

            equationStepperInputTarget = { op, field, bound };
            el.style.display = 'block';
            el.focus();
            el.select();
        }

        function commitEquationStepperInput() {
            if (!equationStepperInputTarget || !equationStepperInputEl) return;
            const { op, field, bound } = equationStepperInputTarget;
            const value = parseInt(equationStepperInputEl.value.trim(), 10);
            if (Number.isFinite(value)) {
                setEquationRangeValue(op, field, bound, value);
                triggerEquationRefresh();
            }
            closeEquationStepperInput();
        }

        function closeEquationStepperInput() {
            equationStepperInputTarget = null;
            if (equationStepperInputEl) {
                equationStepperInputEl.style.display = 'none';
                equationStepperInputEl.blur();
            }
        }

        function hitTestLevelSelectScreen(x, y) {
            // No interaction while the fade-in / big train intro animation
            // is still playing.
            if (levelSelectInputLocked) return null;
            // Buttons are drawn in world space, shifted up on screen by
            // settingsCameraY - so add it back to map a screen click to world Y.
            const worldY = y + settingsCameraY;
            const level = hitTestLevelSelectButton(x, worldY);
            if (level) return { kind: 'level', btn: level };
            const math = hitTestMathSettingsButton(x, worldY);
            if (math) return { kind: 'math', btn: math };
            if (hitTestNewProblemsButton(x, worldY)) return { kind: 'newProblemsButton' };
            const equation = hitTestEquationSettingsPanels(x, worldY);
            if (equation) return equation;
            return null;
        }

        let levelSelectScreenPxPerUnit = 1;

        function resizeLevelSelectCanvas() {
            const aspect = LEVEL_SELECT_IMAGE_WIDTH / LEVEL_SELECT_IMAGE_HEIGHT;
            const maxW = window.innerWidth;
            const maxH = window.innerHeight;
            let w, h;
            if (maxW / maxH > aspect) {
                h = maxH;
                w = h * aspect;
            } else {
                w = maxW;
                h = w / aspect;
            }
            const left = (maxW - w) / 2;
            const top = (maxH - h) / 2;
            levelSelectScreenPxPerUnit = h / LEVEL_SELECT_IMAGE_HEIGHT;

            const dpr = window.devicePixelRatio || 1;
            // See MAX_CANVAS_RENDER_SCALE: cap the backing store at that many
            // times logical size, regardless of how large/high-DPI the actual
            // CSS display size is, so a big window doesn't multiply the pixel
            // count rasterized every frame.
            const renderScale = Math.min(dpr * (w / LEVEL_SELECT_IMAGE_WIDTH), MAX_CANVAS_RENDER_SCALE);

            ['levelSelectRailsCanvas', 'levelSelectBigTrainCanvas', 'levelSelectCanvas'].forEach(id => {
                const canvas = document.getElementById(id);
                if (!canvas) return;
                canvas.style.width = w + 'px';
                canvas.style.height = h + 'px';
                canvas.style.left = left + 'px';
                canvas.style.top = top + 'px';

                // Backing store matches logical size * renderScale; the logical
                // drawing/coordinate space stays LEVEL_SELECT_IMAGE_WIDTH x
                // LEVEL_SELECT_IMAGE_HEIGHT via the base transform below.
                canvas.width = Math.round(LEVEL_SELECT_IMAGE_WIDTH * renderScale);
                canvas.height = Math.round(LEVEL_SELECT_IMAGE_HEIGHT * renderScale);
                const ctx = canvas.getContext('2d');
                ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
            });

            updateSettingsViewBackgroundTransform();
        }

        function updateSettingsViewBackgroundTransform() {
            const offsetPx = -settingsCameraY * levelSelectScreenPxPerUnit;
            ['levelSelectBackground', 'levelSelectDarkOverlay'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.transform = `translateY(${offsetPx}px)`;
            });
        }

        let levelSelectLastFrameTime = 0;

        function levelSelectLoop(timestamp) {
            if (levelSelectLastFrameTime === 0) levelSelectLastFrameTime = timestamp;
            const elapsedMs = timestamp - levelSelectLastFrameTime;
            levelSelectLastFrameTime = timestamp;
            const frameDt = Math.min(elapsedMs / 16.667, 3);

            updateBigTrainAnim(timestamp);
            updateBigTrainShuffle(timestamp);
            updateLevelSelectDarkFade();
            updateLevelSelectTrains(elapsedMs, frameDt);
            updateEquationTrains(elapsedMs);
            updateSettingsCamera(frameDt);
            updateLevelSelectHover();
            updateMathSettingsHoverTextFade(frameDt);
            updateSettingsViewBackgroundTransform();
            drawLevelSelectRails();
            drawLevelSelectTrains();
            drawLevelSelectButtons();
            drawMathSettingsButtons();
            drawSettingsView();
            drawBigTrain();
            requestAnimationFrame(levelSelectLoop);
        }

                btn.shuffleTucked = false;
                btn.shuffleDoorJitterX = 0;
                btn.shuffleDoorJitterY = 0;
            });
            levelSelectInputLocked = true;

            resizeLevelSelectCanvas();
            window.addEventListener('resize', resizeLevelSelectCanvas);

            canvas.addEventListener('mousemove', (e) => {
                lastLevelSelectMouseCoords = getLevelSelectCanvasCoords(e);
                updateLevelSelectHover();
            });

            canvas.addEventListener('mousedown', (e) => {
                const coords = getLevelSelectCanvasCoords(e);
                const hit = hitTestLevelSelectScreen(coords.x, coords.y);
                if (hit && hit.btn) {
                    hit.btn.pressed = true;
                } else if (hit && hit.kind === 'newProblemsButton') {
                    newProblemsButtonState.pressed = true;
                } else if (hit && hit.kind === 'equationStepper') {
                    pressedEquationControl = { kind: 'equationStepper', op: hit.op, field: hit.field, bound: hit.bound, dir: hit.dir };
                } else if (hit && hit.kind === 'equationCheckbox') {
                    pressedEquationControl = { kind: 'equationCheckbox', op: hit.op };
                } else if (hit && hit.kind === 'equationStepperNumber') {
                    pressedEquationControl = { kind: 'equationStepperNumber', op: hit.op, field: hit.field, bound: hit.bound };
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                const coords = getLevelSelectCanvasCoords(e);
                const hit = hitTestLevelSelectScreen(coords.x, coords.y);
                if (hit && hit.kind === 'level' && hit.btn.pressed && isMathSettingsValid()) {
                    triggerBigTrainButtonShuffle();
                } else if (hit && hit.kind === 'math' && hit.btn.pressed) {
                    hit.btn.on = !hit.btn.on;
                    if (['+', '–', '×', '÷'].includes(hit.btn.label)) {
                        repopulateOperationsList();
                        triggerEquationRefresh();
                    } else if (/^\d+$/.test(hit.btn.label)) {
                        repopulateSecondTermList();
                        triggerEquationRefresh();
                    }
                } else if (hit && hit.kind === 'newProblemsButton' && newProblemsButtonState.pressed) {
                    triggerEquationRefresh();
                } else if (hit && hit.kind === 'equationStepper' && pressedEquationControl &&
                    pressedEquationControl.kind === 'equationStepper' &&
                    pressedEquationControl.op === hit.op && pressedEquationControl.field === hit.field &&
                    pressedEquationControl.bound === hit.bound && pressedEquationControl.dir === hit.dir) {
                    adjustEquationRange(hit.op, hit.field, hit.bound, hit.dir);
                    triggerEquationRefresh();
                } else if (hit && hit.kind === 'equationCheckbox' && pressedEquationControl &&
                    pressedEquationControl.kind === 'equationCheckbox' && pressedEquationControl.op === hit.op) {
                    toggleEquationTurnArounds(hit.op);
                    triggerEquationRefresh();
                } else if (hit && hit.kind === 'equationStepperNumber' && pressedEquationControl &&
                    pressedEquationControl.kind === 'equationStepperNumber' &&
                    pressedEquationControl.op === hit.op && pressedEquationControl.field === hit.field &&
                    pressedEquationControl.bound === hit.bound) {
                    openEquationStepperInput(hit.op, hit.field, hit.bound);
                }
                levelSelectButtons.forEach(btn => { btn.pressed = false; });
                mathSettingsButtons.forEach(btn => { btn.pressed = false; });
                newProblemsButtonState.pressed = false;
                pressedEquationControl = null;
            });

            canvas.addEventListener('mouseleave', () => {
                levelSelectButtons.forEach(btn => { btn.pressed = false; });
                mathSettingsButtons.forEach(btn => { btn.pressed = false; });
                newProblemsButtonState.pressed = false;
                pressedEquationControl = null;
                lastLevelSelectMouseCoords = null;
                updateLevelSelectHover();
            });

            requestAnimationFrame(levelSelectLoop);
        }

        // Camera for run mode
        const CAMERA_WIDTH = 900;
        const CAMERA_HEIGHT = 600;
        let cameraX = 0;
        let cameraY = 0;
        let baseCameraX = 0;
        let baseCameraY = 0;

        // Delta-time for consistent animation speed
        let lastFrameTime = 0;
        let dt = 1; // ratio relative to 60fps frame (1.0 = perfect 60fps)

        // Train animation state for run mode
        let trainAnimations = []; // Array of animated train objects

        // Run mode state: 'gameplay' or 'animation'
        let runModeState = 'gameplay';

        // Stop light animation state
        let stopLightAnimationTime = 0;

        // Solved count: reset at the start of each run mode level, incremented on correct answers
        let solved_count = 0;

        // Train spawn system: authored trains become invisible templates, instances are what's drawn
        let trainSpawnTemplates = []; // Array of spawn template objects
        let nextInstanceId = 1; // Unique ID counter for spawned instances

        // Light burn out system: authored lights with a "burn out on" value flicker
        // out and go permanently dead once solved_count hits that value (+ delay).
        let lightBurnoutTemplates = []; // {gridX, gridY, burnOutOnValues, burnOutDelay}
        let lightBurnoutQueue = []; // Templates waiting their turn, played one at a time
        let lightBurnoutAnimations = []; // Active flicker animations: {gridX, gridY, frame, phase}

        // Run mode drag state
        let runDragTrain = null; // The train animation object being dragged
        let runDragLastWorld = null; // Previous mouse world position
        let runDragCarIndex = 0; // Which car was clicked to initiate drag

        // Run mode math fact selection state
        let selectedRunMathFact = null; // {trainId, middleCarIndex} when a math fact triplet is selected

        // Keypad state
        let keypadVisible = false;
        let keypadSlideProgress = 0; // 0 = offscreen, 1 = fully visible
        let keypadInputValue = '';
        let keypadCursorBlink = 0; // frame counter for cursor blink
        let keypadPressedButton = null; // index of currently pressed button
        let keypadHoveredButton = null; // index of currently hovered button
        let keypadDeleteSprite = null;
        let keypadSubmitSprite = null;
        let keypadResetSprite = null;
        let keypadResetPressed = false;
        let keypadResetHovered = false;
        let keypadLevelSelectSprite = null;
        let keypadLevelSelectPressed = false;
        let keypadLevelSelectHovered = false;
        let keypadTargetWorldX = null; // World X position of math fact to center on
        let keypadStartCameraX = null; // Starting horizontal camera position when keypad opens
        let keypadClosingFromCameraX = null; // Camera X when keypad starts closing
        let keypadClosingFromCameraY = null; // Camera Y when keypad starts closing

        // Run-mode fade-to-black transition, used when restarting a level or
        // leaving run mode (e.g. back to level select) so the swap isn't a hard cut.
        const RUN_FADE_DURATION_MS = 350;
        let runFadePhase = null; // 'out' | 'in' | null
        let runFadeStart = 0;
        let runFadeOnComplete = null;

        function startRunFadeOut(onComplete) {
            runFadePhase = 'out';
            runFadeStart = performance.now();
            runFadeOnComplete = onComplete;
        }

        function runFadeAlpha() {
            if (!runFadePhase) return 0;
            const t = Math.min(1, (performance.now() - runFadeStart) / RUN_FADE_DURATION_MS);
            return runFadePhase === 'out' ? t : (1 - t);
        }

        function updateRunFade() {
            if (!runFadePhase) return;
            const t = (performance.now() - runFadeStart) / RUN_FADE_DURATION_MS;
            if (t >= 1) {
                if (runFadePhase === 'out') {
                    const callback = runFadeOnComplete;
                    runFadeOnComplete = null;
                    runFadePhase = 'in';
                    runFadeStart = performance.now();
                    if (callback) callback();
                } else {
                    runFadePhase = null;
                }
            }
        }

        // Returns to the level-select screen. In the editor's standalone run
        // tab (?mode=run) this just navigates back to it; a standalone export
        // (which keeps both screens in one page) overrides this to swap
        // screens in place instead.
        function returnToLevelSelect() {
            startRunFadeOut(() => {
                const levelSelectUrl = window.location.href.split('?')[0] + '?mode=levelselect';
                window.location.href = levelSelectUrl;
            });
        }

        // Feedback animation state
        let feedbackAnim = null; // null when not animating

        // Tile fade-in state (run mode). Tiles with a non-zero "fade in" start
        // hidden and fade in once solved_count reaches that value.
        const TILE_FADE_IN_DURATION = 45; // frames at 60fps (~0.75s)
        let tileFadeAnim = null; // {tiles: [...], frame} while a reveal is playing

        // Train spawn animation: rings of expanding circles play at the spawn
        // point, then the train itself appears.
        const SPAWN_ANIM_CIRCLES = 4;
        const SPAWN_ANIM_MAX_DIAMETER = 3 * TILE_SIZE; // 3 grid squares across
        const SPAWN_ANIM_EXPAND_FRAMES = 30; // point -> full size
        const SPAWN_ANIM_FADE_FRAMES = 10;   // quick fade once fully expanded
        const SPAWN_ANIM_STAGGER = 6;        // frames between successive circles
        const SPAWN_ANIM_DURATION = SPAWN_ANIM_STAGGER * (SPAWN_ANIM_CIRCLES - 1) +
                                    SPAWN_ANIM_EXPAND_FRAMES + SPAWN_ANIM_FADE_FRAMES;
        let spawnAnimations = []; // {x, y, frame, template} — one per pending train
        let pendingSpawnTemplates = []; // Templates waiting on fade in / burn out before their spawn animation starts

        // Light burn out animation: a brief steady pause, then flickers between
        // mm_light and mm_light_dead (starting fast and slowing down), then a
        // brief pause on mm_light_dead before it's treated as fully finished.
        const LIGHT_BURNOUT_PAUSE_FRAMES = 20; // frames at 60fps (~0.33s) held still, before and after the flicker
        const LIGHT_BURNOUT_FLICKER_DURATION = 70; // frames at 60fps (~1.17s) of actual flickering
        const LIGHT_BURNOUT_DURATION = LIGHT_BURNOUT_PAUSE_FRAMES * 2 + LIGHT_BURNOUT_FLICKER_DURATION;
        const LIGHT_BURNOUT_FREQ_START = 18; // flickers/sec at the start (fast)
        const LIGHT_BURNOUT_FREQ_END = 1;    // flickers/sec at the end (slow)
        const LIGHT_BURNOUT_FREQ_EASE_POWER = 3; // >1 biases the frequency toward FREQ_END earlier in the flicker

        // Sparks spawned once, on the first frame of the flicker. Origin is a
        // fixed point on the mm_light sprite itself, in the same "logical"
        // (pre-SPRITE_SCALE) pixel units as TILE_SIZE — see the light_pole
        // render function, which positions mm_light the same way.
        const LIGHT_SPARK_COUNT = 8;
        const LIGHT_SPARK_LOCAL_X = 29.55;
        const LIGHT_SPARK_LOCAL_Y = 29;
        const LIGHT_SPARK_MIN_SPEED = 300; // px/sec
        const LIGHT_SPARK_MAX_SPEED = 300; // px/sec
        const LIGHT_SPARK_GRAVITY = 800;   // px/sec^2, pulls sparks slightly downward
        const LIGHT_SPARK_RADIUS = 2.25;

        // mm_light_flash: a one-shot flash drawn the moment the flicker starts,
        // fading out over just a few frames.
        const LIGHT_FLASH_FADE_FRAMES = 10; // frames the flash takes to fade out
        const LIGHT_FLASH_PEAK_ALPHA = 0.4;

        // Snapshot of the level as loaded, used to reset run mode back to the start
        let initialRunLevelData = null;

        function getCurveArcPoints(trackId, entryDir, gridX, gridY, numSegments) {
            const half = TILE_SIZE / 2;
            const tilePixelX = offsetX + gridX * TILE_SIZE;
            const tilePixelY = offsetY + gridY * TILE_SIZE;
            let arcCX, arcCY;

            switch(trackId) {
                case 'curved_track_br': arcCX = tilePixelX + TILE_SIZE; arcCY = tilePixelY + TILE_SIZE; break;
                case 'curved_track_bl': arcCX = tilePixelX; arcCY = tilePixelY + TILE_SIZE; break;
                case 'curved_track_tr': arcCX = tilePixelX + TILE_SIZE; arcCY = tilePixelY; break;
                case 'curved_track_tl': arcCX = tilePixelX; arcCY = tilePixelY; break;
            }

            const edgeMid = {
                'right': { x: tilePixelX + TILE_SIZE, y: tilePixelY + half },
                'left': { x: tilePixelX, y: tilePixelY + half },
                'top': { x: tilePixelX + half, y: tilePixelY },
                'bottom': { x: tilePixelX + half, y: tilePixelY + TILE_SIZE }
            };

            const curveConnections = {
                'curved_track_br': { 'right': 'bottom', 'bottom': 'right' },
                'curved_track_bl': { 'left': 'bottom', 'bottom': 'left' },
                'curved_track_tr': { 'right': 'top', 'top': 'right' },
                'curved_track_tl': { 'left': 'top', 'top': 'left' }
            };
            const exitDir = curveConnections[trackId][entryDir];

            const entryPoint = edgeMid[entryDir];
            const exitPoint = edgeMid[exitDir];

            const entryAngle = Math.atan2(entryPoint.y - arcCY, entryPoint.x - arcCX);
            const exitAngle = Math.atan2(exitPoint.y - arcCY, exitPoint.x - arcCX);

            let sweep = exitAngle - entryAngle;
            while (sweep > Math.PI) sweep -= 2 * Math.PI;
            while (sweep < -Math.PI) sweep += 2 * Math.PI;

            const points = [];
            for (let i = 0; i <= numSegments; i++) {
                const t = i / numSegments;
                const angle = entryAngle + sweep * t;
                points.push({
                    x: arcCX + half * Math.cos(angle),
                    y: arcCY + half * Math.sin(angle)
                });
            }
            return points;
        }

        function buildTrackPath(startX, startY, direction, trackId) {
            const waypoints = [];
            const startPixelX = offsetX + startX * TILE_SIZE + TILE_SIZE / 2;
            const startPixelY = offsetY + startY * TILE_SIZE + TILE_SIZE / 2;
            waypoints.push({ x: startPixelX, y: startPixelY });

            let currentX = startX;
            let currentY = startY;

            const firstTrack = getTileAtGrid(currentX, currentY, 'tracks');
            let currentDirection = direction;

            if (!firstTrack) return waypoints;

            // If starting tile is curved, add exit edge midpoint
            if (firstTrack.tileType && firstTrack.tileType.id.startsWith('curved_track_')) {
                const half = TILE_SIZE / 2;
                const tilePixelX = offsetX + currentX * TILE_SIZE;
                const tilePixelY = offsetY + currentY * TILE_SIZE;
                const edgeMid = {
                    'right': { x: tilePixelX + TILE_SIZE, y: tilePixelY + half },
