                    'left': { x: tilePixelX, y: tilePixelY + half },
                    'top': { x: tilePixelX + half, y: tilePixelY },
                    'bottom': { x: tilePixelX + half, y: tilePixelY + TILE_SIZE }
                };
                waypoints.push(edgeMid[currentDirection]);
            }

            let maxSteps = 100;
            while (maxSteps-- > 0) {
                const nextPos = getNextPositionInDirection(currentX, currentY, currentDirection);

                if (nextPos.x < 0 || nextPos.x >= GRID_COLS || nextPos.y < 0 || nextPos.y >= GRID_ROWS) {
                    break;
                }

                const nextTrack = getTileAtGrid(nextPos.x, nextPos.y, 'tracks');
                if (!nextTrack) break;

                const entryDir = getOppositeDirection(currentDirection);
                const exitDir = getExitDirection(nextTrack, entryDir);
                if (!exitDir) break;

                if (nextTrack.tileType && nextTrack.tileType.id.startsWith('curved_track_')) {
                    const arcPoints = getCurveArcPoints(nextTrack.tileType.id, entryDir, nextPos.x, nextPos.y, 8);
                    // Skip first point if it duplicates the last waypoint
                    const start = (waypoints.length > 0 &&
                        Math.abs(arcPoints[0].x - waypoints[waypoints.length - 1].x) < 0.5 &&
                        Math.abs(arcPoints[0].y - waypoints[waypoints.length - 1].y) < 0.5) ? 1 : 0;
                    for (let i = start; i < arcPoints.length; i++) waypoints.push(arcPoints[i]);
                } else {
                    const nextPixelX = offsetX + nextPos.x * TILE_SIZE + TILE_SIZE / 2;
                    const nextPixelY = offsetY + nextPos.y * TILE_SIZE + TILE_SIZE / 2;
                    waypoints.push({ x: nextPixelX, y: nextPixelY });
                }

                currentX = nextPos.x;
                currentY = nextPos.y;
                currentDirection = exitDir;
            }

            return waypoints;
        }

        function buildFullTrainPath(trainTile) {
            const trainId = getTrainId(trainTile);
            const direction = trainId && trainProperties[trainId] && trainProperties[trainId].direction
                ? trainProperties[trainId].direction : 'right';

            const firstTrack = getTileAtGrid(trainTile.gridX, trainTile.gridY, 'tracks');
            if (!firstTrack || !firstTrack.tileType) return [];

            const actualExit = getActualExitSide(firstTrack.tileType.id, direction);

            // Build forward path
            const forwardPath = buildTrackPath(trainTile.gridX, trainTile.gridY, actualExit, firstTrack.tileType.id);

            // Build backward path (for trailing cars)
            const entrySide = getExitDirection(firstTrack, actualExit);
            let backwardPath = [];
            if (entrySide) {
                backwardPath = buildTrackPath(trainTile.gridX, trainTile.gridY, entrySide, firstTrack.tileType.id);
            }

            // Combine: reverse backward (excluding first point which is shared), then forward
            const reversedBackward = backwardPath.slice(1).reverse();
            const fullPath = [...reversedBackward, ...forwardPath];

            // The train head starts at the position of forwardPath[0] in the full path
            const headIndex = reversedBackward.length;

            return { path: fullPath, headIndex: headIndex };
        }

        function getPositionAlongPath(path, distance) {
            if (path.length === 0) return { x: 0, y: 0, angle: 0 };
            if (path.length === 1) return { x: path[0].x, y: path[0].y, angle: 0 };

            let remaining = distance;

            for (let i = 0; i < path.length - 1; i++) {
                const dx = path[i + 1].x - path[i].x;
                const dy = path[i + 1].y - path[i].y;
                const segmentLength = Math.sqrt(dx * dx + dy * dy);

                if (remaining <= segmentLength) {
                    const t = remaining / segmentLength;
                    return {
                        x: path[i].x + dx * t,
                        y: path[i].y + dy * t,
                        angle: Math.atan2(dy, dx)
                    };
                }

                remaining -= segmentLength;
            }

            // Past the end — use last segment's angle
            const last = path.length - 1;
            const dx = path[last].x - path[last - 1].x;
            const dy = path[last].y - path[last - 1].y;
            return { x: path[last].x, y: path[last].y, angle: Math.atan2(dy, dx) };
        }

        function getTotalPathLength(path) {
            let total = 0;
            for (let i = 0; i < path.length - 1; i++) {
                const dx = path[i + 1].x - path[i].x;
                const dy = path[i + 1].y - path[i].y;
                total += Math.sqrt(dx * dx + dy * dy);
            }
            return total;
        }

        function getRequiredPathLength(train) {
            let total = 0;
            for (let i = 0; i < train.numCars - 1; i++) {
                const spacingVal = train.spacing[i] != null ? train.spacing[i] : 59;
                total += spacingVal;
            }
            return total + TILE_SIZE * 2;
        }

        function extendPathForward(train) {
            const needed = train.headDistance + TILE_SIZE * 2;
            let steps = 0;
            while (train.totalLength < needed && steps < 50) {
                steps++;
                const nextPos = getNextPositionInDirection(train.frontGridX, train.frontGridY, train.frontDirection);

                if (nextPos.x < 0 || nextPos.x >= GRID_COLS || nextPos.y < 0 || nextPos.y >= GRID_ROWS) break;

                const nextTrack = getTileAtGrid(nextPos.x, nextPos.y, 'tracks');
                if (!nextTrack) break;

                const entryDir = getOppositeDirection(train.frontDirection);
                const exitDir = getExitDirection(nextTrack, entryDir);
                if (!exitDir) break;

                if (nextTrack.tileType && nextTrack.tileType.id.startsWith('curved_track_')) {
                    const arcPoints = getCurveArcPoints(nextTrack.tileType.id, entryDir, nextPos.x, nextPos.y, 8);
                    const lastWp = train.path[train.path.length - 1];
                    const start = (lastWp &&
                        Math.abs(arcPoints[0].x - lastWp.x) < 0.5 &&
                        Math.abs(arcPoints[0].y - lastWp.y) < 0.5) ? 1 : 0;
                    for (let i = start; i < arcPoints.length; i++) {
                        const prev = train.path[train.path.length - 1];
                        const dx = arcPoints[i].x - prev.x;
                        const dy = arcPoints[i].y - prev.y;
                        train.totalLength += Math.sqrt(dx * dx + dy * dy);
                        train.path.push(arcPoints[i]);
                    }
                } else {
                    const nextPixelX = offsetX + nextPos.x * TILE_SIZE + TILE_SIZE / 2;
                    const nextPixelY = offsetY + nextPos.y * TILE_SIZE + TILE_SIZE / 2;
                    const prev = train.path[train.path.length - 1];
                    const dx = nextPixelX - prev.x;
                    const dy = nextPixelY - prev.y;
                    train.totalLength += Math.sqrt(dx * dx + dy * dy);
                    train.path.push({ x: nextPixelX, y: nextPixelY });
                }

                train.frontGridX = nextPos.x;
                train.frontGridY = nextPos.y;
                train.frontDirection = exitDir;
            }
        }

        function trimPathTail(train) {
            const requiredBehind = getRequiredPathLength(train);
            const minDistance = train.headDistance - requiredBehind;

            if (minDistance <= TILE_SIZE) return;

            let trimDist = 0;
            let trimIndex = 0;
            for (let i = 0; i < train.path.length - 1; i++) {
                const dx = train.path[i + 1].x - train.path[i].x;
                const dy = train.path[i + 1].y - train.path[i].y;
                const segLen = Math.sqrt(dx * dx + dy * dy);
                if (trimDist + segLen >= minDistance - TILE_SIZE) break;
                trimDist += segLen;
                trimIndex = i + 1;
            }

            if (trimIndex > 0) {
                train.path.splice(0, trimIndex);
                train.headDistance -= trimDist;
                train.totalLength -= trimDist;
            }
        }

        function initTrainAnimations() {
            solved_count = 0;
            nextInstanceId = 1;
            trainAnimations = [];
            trainSpawnTemplates = [];
            spawnAnimations = [];
            pendingSpawnTemplates = [];

            objectTiles.forEach(tile => {
                if (tile.tileType && tile.tileType.id === 'train') {
                    const trainId = getTrainId(tile);
                    const props = trainId && trainProperties[trainId] ? trainProperties[trainId] : {};

                    const firstTrack = getTileAtGrid(tile.gridX, tile.gridY, 'tracks');
                    if (!firstTrack || !firstTrack.tileType) return;

                    const spawnOnRaw = props.spawnOn != null && String(props.spawnOn).trim() !== '' ? String(props.spawnOn) : '0';
                    const spawnOnValues = spawnOnRaw.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

                    trainSpawnTemplates.push({
                        tile: tile,
                        trainId: trainId,
                        firstTrack: firstTrack,
                        spawnOnValues: spawnOnValues,
                        spawnDelay: props.spawnDelay || 0
                    });

                    // Spawn immediately for templates that trigger on solved_count 0
                    if (spawnOnValues.includes(0)) {
                        spawnTrainInstance(trainSpawnTemplates[trainSpawnTemplates.length - 1]);
                    }
                }
            });
        }

        // Play the spawn animation at the train's spawn point, then put the train
        // on the track. Every caller goes through here, so simultaneous spawns
        // simply queue their own animation and run side by side.
        function spawnTrainInstance(template) {
            if (!isRunMode) {
                createTrainInstance(template);
                return;
            }

            // Queued, not played yet — updateSpawnAnimations() holds it here
            // until any tile reveal / light burn out finishes, so the spawn
            // circles themselves don't start early.
            pendingSpawnTemplates.push(template);
        }

        function updateSpawnAnimations() {
            // Order is fade in, then burn out, then spawns — don't even start
            // a queued spawn's circle animation until both are done. Burn outs
            // now play one at a time, so wait for the whole queue, not just
            // whichever one is currently playing.
            if (pendingSpawnTemplates.length > 0 && !tileFadeAnim && lightBurnoutAnimations.length === 0 && lightBurnoutQueue.length === 0) {
                pendingSpawnTemplates.forEach(template => {
                    spawnAnimations.push({
                        x: offsetX + template.tile.gridX * TILE_SIZE + TILE_SIZE / 2,
                        y: offsetY + template.tile.gridY * TILE_SIZE + TILE_SIZE / 2,
                        frame: 0,
                        template: template
                    });
                });
                pendingSpawnTemplates = [];
            }

            if (spawnAnimations.length === 0) return;

            spawnAnimations.forEach(anim => { anim.frame += dt; });

            const finished = spawnAnimations.filter(anim => anim.frame >= SPAWN_ANIM_DURATION);
            if (finished.length === 0) return;

            spawnAnimations = spawnAnimations.filter(anim => !finished.includes(anim));
            finished.forEach(anim => createTrainInstance(anim.template));
        }

        // Series of circles, each growing from a point to 3 grid squares across
        // before fading out. Drawn in world space so they sit on the spawn point.
        function drawSpawnAnimations(ctx) {
            if (spawnAnimations.length === 0) return;

            const maxRadius = SPAWN_ANIM_MAX_DIAMETER / 2;

            ctx.save();
            ctx.strokeStyle = '#4ECEC5'; // train highlight
            ctx.lineWidth = 3;

            spawnAnimations.forEach(anim => {
                for (let i = 0; i < SPAWN_ANIM_CIRCLES; i++) {
                    const frame = anim.frame - i * SPAWN_ANIM_STAGGER;
                    if (frame < 0) continue; // hasn't started yet

                    // Expands at a constant rate throughout. Reaching full size
                    // starts the fade but doesn't stop the growth; the circle is
                    // dropped once it has faded out completely.
                    const radius = maxRadius * (frame / SPAWN_ANIM_EXPAND_FRAMES);
                    const alpha = frame < SPAWN_ANIM_EXPAND_FRAMES
                        ? 1
                        : 1 - (frame - SPAWN_ANIM_EXPAND_FRAMES) / SPAWN_ANIM_FADE_FRAMES;

                    if (radius <= 0 || alpha <= 0) continue;

                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(anim.x, anim.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });

            ctx.restore();
        }

        function createTrainInstance(template) {
            const tile = template.tile;
            const trainId = template.trainId;
            const props = trainId && trainProperties[trainId] ? trainProperties[trainId] : {};

            const numCars = props.cars !== undefined ? props.cars : 3;
            const speed = props.speed !== undefined ? props.speed : 3;
            const spacing = props.spacing ? [...props.spacing] : [];
            const direction = props.direction || 'right';

            const firstTrack = template.firstTrack;
            const actualExit = getActualExitSide(firstTrack.tileType.id, direction);
            const entrySide = getExitDirection(firstTrack, actualExit);

            const startPixelX = offsetX + tile.gridX * TILE_SIZE + TILE_SIZE / 2;
            const startPixelY = offsetY + tile.gridY * TILE_SIZE + TILE_SIZE / 2;

            let backPath = [{ x: startPixelX, y: startPixelY }];
            if (entrySide) {
                const backWaypoints = buildTrackPath(tile.gridX, tile.gridY, entrySide, firstTrack.tileType.id);
                backPath = backWaypoints;
            }
            const reversedBack = backPath.slice(1).reverse();

            let forwardPath = [{ x: startPixelX, y: startPixelY }];
            if (firstTrack.tileType.id.startsWith('curved_track_')) {
                const half = TILE_SIZE / 2;
                const tilePixelX = offsetX + tile.gridX * TILE_SIZE;
                const tilePixelY = offsetY + tile.gridY * TILE_SIZE;
                const edgeMid = {
                    'right': { x: tilePixelX + TILE_SIZE, y: tilePixelY + half },
                    'left': { x: tilePixelX, y: tilePixelY + half },
                    'top': { x: tilePixelX + half, y: tilePixelY },
                    'bottom': { x: tilePixelX + half, y: tilePixelY + TILE_SIZE }
                };
                forwardPath.push(edgeMid[actualExit]);
            }

            const path = [...reversedBack, ...forwardPath];
            let headDist = 0;
            for (let i = 0; i < reversedBack.length; i++) {
                if (i < reversedBack.length - 1) {
                    const dx = reversedBack[i + 1].x - reversedBack[i].x;
                    const dy = reversedBack[i + 1].y - reversedBack[i].y;
                    headDist += Math.sqrt(dx * dx + dy * dy);
                }
            }
            if (reversedBack.length > 0) {
                const last = reversedBack[reversedBack.length - 1];
                const dx = startPixelX - last.x;
                const dy = startPixelY - last.y;
                headDist += Math.sqrt(dx * dx + dy * dy);
            }

            let backGridX = tile.gridX;
            let backGridY = tile.gridY;
            let backDirection = entrySide || getOppositeDirection(actualExit);
            if (entrySide) {
                let walkDir = entrySide;
                let wx = tile.gridX, wy = tile.gridY;
                for (let s = 0; s < 200; s++) {
                    const np = getNextPositionInDirection(wx, wy, walkDir);
                    if (np.x < 0 || np.x >= GRID_COLS || np.y < 0 || np.y >= GRID_ROWS) break;
                    const nt = getTileAtGrid(np.x, np.y, 'tracks');
                    if (!nt) break;
                    const ed = getOppositeDirection(walkDir);
                    const ex = getExitDirection(nt, ed);
                    if (!ex) break;
                    wx = np.x; wy = np.y; walkDir = ex;
                }
                backGridX = wx;
                backGridY = wy;
                backDirection = walkDir;
            }

            const drag = props.drag ? [...props.drag] : [];

            // Generate fresh random math facts for this instance
            const mathFacts = props.mathFacts ? [...props.mathFacts] : [];
            const text = [];
            for (let i = 0; i < mathFacts.length; i++) {
                if (mathFacts[i]) {
                    const fact = generateMathFact();
                    text[i - 1] = fact.term1;
                    text[i] = fact.operation;
                    text[i + 1] = fact.term2;
                }
            }

            const textFontSize = props.textFontSize != null ? props.textFontSize : 22;

            const instanceId = 'inst_' + nextInstanceId++;

            const trainAnim = {
                tile: tile,
                trainId: instanceId,
                sourceTrainId: trainId,
                path: path,
                headDistance: headDist,
                numCars: numCars,
                speed: speed,
                spacing: spacing,
                drag: drag,
                text: text,
                mathFacts: mathFacts,
                textFontSize: textFontSize,
                totalLength: getTotalPathLength(path),
                frontGridX: tile.gridX,
                frontGridY: tile.gridY,
                frontDirection: actualExit,
                backGridX: backGridX,
                backGridY: backGridY,
                backDirection: backDirection
            };

            extendPathForward(trainAnim);
            trainAnimations.push(trainAnim);
        }

        function checkSpawnOnSolvedCount() {
            trainSpawnTemplates.forEach(template => {
                if (template.spawnOnValues.includes(solved_count)) {
                    if (template.spawnDelay > 0) {
                        setTimeout(() => spawnTrainInstance(template), template.spawnDelay * 1000);
                    } else {
                        spawnTrainInstance(template);
                    }
                }
            });
        }

        // Light burn out system: authored lights become templates at level start,
        // mirroring trainSpawnTemplates. A light with no "burn out on" value never
        // burns out.
        function initLightBurnoutAnimations() {
            lightBurnoutTemplates = [];
            lightBurnoutQueue = [];
            lightBurnoutAnimations = [];
            window.lightBurnoutState = {};

            trackTiles.forEach(tile => {
                if (!tile.tileType || tile.tileType.id !== 'light_pole') return;

                const burnOutOnRaw = tile.burnOutOn != null ? String(tile.burnOutOn).trim() : '';
                if (burnOutOnRaw === '') return;

                const burnOutOnValues = burnOutOnRaw.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));
                if (burnOutOnValues.length === 0) return;

                lightBurnoutTemplates.push({
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    burnOutOnValues: burnOutOnValues,
                    burnOutDelay: tile.burnOutDelay || 0
                });
            });

            checkBurnOutOnSolvedCount();
        }

        function checkBurnOutOnSolvedCount() {
            lightBurnoutTemplates.forEach(template => {
                if (isLightAlreadyBurningOutOrQueued(template)) return;

                if (template.burnOutOnValues.includes(solved_count)) {
                    if (template.burnOutDelay > 0) {
                        setTimeout(() => startLightBurnout(template), template.burnOutDelay * 1000);
                    } else {
                        startLightBurnout(template);
                    }
                }
            });
        }

        function isLightAlreadyBurningOutOrQueued(template) {
            const key = `${template.gridX},${template.gridY}`;
            if (window.lightBurnoutState[key]) return true; // burning out or already dead
            return lightBurnoutQueue.some(t => t.gridX === template.gridX && t.gridY === template.gridY);
        }

        // Burn outs play one at a time, in the order they're triggered — a
        // light waits its turn here looking perfectly normal, rather than
        // several flickering out simultaneously.
        function startLightBurnout(template) {
            if (isLightAlreadyBurningOutOrQueued(template)) return;
            lightBurnoutQueue.push(template);
        }

        // Pulls the next queued light off the front of the line and actually
        // starts its flicker — called only when nothing else is currently
        // playing. See updateLightBurnout().
        function beginNextQueuedBurnout() {
            if (lightBurnoutAnimations.length > 0 || lightBurnoutQueue.length === 0) return;

            const template = lightBurnoutQueue.shift();
            const key = `${template.gridX},${template.gridY}`;
            window.lightBurnoutState[key] = { isOn: true, dead: false };
            lightBurnoutAnimations.push({ gridX: template.gridX, gridY: template.gridY, frame: 0, phase: 0, sparks: null });
        }

        // Advances every active flicker animation by dt, then retires any that
        // finished — their light stays dead and stops casting lit points/rails.
        function updateLightBurnout() {
            // Hold off flickering (and starting the next queued one) until any
            // tile reveal finishes — order is fade in, then burn out, then
            // spawns (see updateSpawnAnimations()).
            if (tileFadeAnim) return;

            if (lightBurnoutAnimations.length === 0) {
                beginNextQueuedBurnout();
            }
            if (lightBurnoutAnimations.length === 0) return;

            lightBurnoutAnimations.forEach(anim => {
                anim.frame += dt;

                const key = `${anim.gridX},${anim.gridY}`;
                const state = window.lightBurnoutState[key];
                if (!state) return;

                const flickerFrame = anim.frame - LIGHT_BURNOUT_PAUSE_FRAMES;

                if (flickerFrame < 0) {
                    // Brief steady pause before the flicker starts.
                    state.isOn = true;
                } else if (flickerFrame < LIGHT_BURNOUT_FLICKER_DURATION) {
                    const progress = flickerFrame / LIGHT_BURNOUT_FLICKER_DURATION;
                    // Eased so frequency drops toward FREQ_END earlier, then
                    // lingers there — same start/end rates, same total length.
                    const easedProgress = 1 - Math.pow(1 - progress, LIGHT_BURNOUT_FREQ_EASE_POWER);
                    const freq = LIGHT_BURNOUT_FREQ_START + (LIGHT_BURNOUT_FREQ_END - LIGHT_BURNOUT_FREQ_START) * easedProgress;
                    anim.phase += freq * (dt / 60);
                    state.isOn = (anim.phase % 1) < 0.5;

                    // Spawn the sparks once, on the first frame of the flicker —
                    // the flash below also starts fading from this same frame.
                    if (!anim.sparks) {
                        const origin = computeLightSparkOrigin(anim.gridX, anim.gridY);
                        anim.sparks = [];
                        for (let i = 0; i < LIGHT_SPARK_COUNT; i++) {
                            const sparkAngle = Math.random() * Math.PI * 2;
                            const speed = LIGHT_SPARK_MIN_SPEED + Math.random() * (LIGHT_SPARK_MAX_SPEED - LIGHT_SPARK_MIN_SPEED);
                            anim.sparks.push({
                                originX: origin.x,
                                originY: origin.y,
                                vx: Math.cos(sparkAngle) * speed,
                                vy: Math.sin(sparkAngle) * speed
                            });
                        }
                        anim.flashStartFrame = anim.frame;
                    }

                    // Sparks fade out over the flicker, reaching alpha 0 right
                    // at the end, and arc slightly downward as they fly out.
                    const tSec = flickerFrame / 60;
                    const alpha = 1 - progress;
                    state.sparks = anim.sparks.map(spark => ({
                        x: spark.originX + spark.vx * tSec,
                        y: spark.originY + spark.vy * tSec + 0.5 * LIGHT_SPARK_GRAVITY * tSec * tSec,
                        alpha: alpha
                    }));

                    // mm_light_flash fades out much faster than the sparks.
                    const flashElapsed = anim.frame - anim.flashStartFrame;
                    state.flashAlpha = LIGHT_FLASH_PEAK_ALPHA * Math.max(0, 1 - flashElapsed / LIGHT_FLASH_FADE_FRAMES);
                } else {
                    // Brief steady pause on mm_light_dead before the animation
                    // is considered finished (see the filter below).
                    state.isOn = false;
                    state.sparks = null;
                    state.flashAlpha = 0;
                    state.dead = true;
                }
            });

            const stillActive = lightBurnoutAnimations.filter(anim => anim.frame < LIGHT_BURNOUT_DURATION);
            if (stillActive.length !== lightBurnoutAnimations.length) {
                lightBurnoutAnimations = stillActive;
                // A light just died for good — it stops lighting rails/trains, so
                // refresh the cached lit points now rather than waiting on the
                // usual fade-in/reset triggers.
                persistentLitPoints = addInterpolatedLitPoints(computeLitPoints());
            }
        }

        function extendPathBackward(train) {
            let totalSpacing = 0;
            for (let i = 0; i < train.numCars - 1; i++) {
                const spacingVal = train.spacing[i] != null ? train.spacing[i] : 59;
                totalSpacing += spacingVal;
            }
            // Last car is at headDistance - totalSpacing from path start.
            // Need at least TILE_SIZE * 2 of buffer behind the last car.
            const lastCarDist = train.headDistance - totalSpacing;
            if (lastCarDist >= TILE_SIZE * 2) return;
            const needed = TILE_SIZE * 2 - lastCarDist;

            let steps = 0;
            let extended = 0;
            while (extended < needed && steps < 50) {
                steps++;
                const nextPos = getNextPositionInDirection(train.backGridX, train.backGridY, train.backDirection);

                if (nextPos.x < 0 || nextPos.x >= GRID_COLS || nextPos.y < 0 || nextPos.y >= GRID_ROWS) break;

                const nextTrack = getTileAtGrid(nextPos.x, nextPos.y, 'tracks');
                if (!nextTrack) break;

                const entryDir = getOppositeDirection(train.backDirection);
                const exitDir = getExitDirection(nextTrack, entryDir);
                if (!exitDir) break;

                if (nextTrack.tileType && nextTrack.tileType.id.startsWith('curved_track_')) {
                    const arcPoints = getCurveArcPoints(nextTrack.tileType.id, entryDir, nextPos.x, nextPos.y, 8);
                    // arcPoints goes entry_edge → exit_edge where entry_edge is the
                    // shared boundary with current backGrid tile (adjacent to path[0]).
                    // We need: [exit_edge, ..., entry_edge, path[0], ...] so exit (far
                    // side) is at lowest distance. Reverse the array for correct order.
                    arcPoints.reverse();
                    // Now: [exit_edge, ..., entry_edge]. Skip entry_edge if it
                    // duplicates path[0] (shared boundary).
                    const firstWp = train.path[0];
                    const lastPt = arcPoints[arcPoints.length - 1];
                    const end = (firstWp &&
                        Math.abs(lastPt.x - firstWp.x) < 0.5 &&
                        Math.abs(lastPt.y - firstWp.y) < 0.5) ? arcPoints.length - 1 : arcPoints.length;
                    const toInsert = arcPoints.slice(0, end);
                    if (toInsert.length > 0) {
                        train.path.splice(0, 0, ...toInsert);
                        let addedDist = 0;
                        for (let i = 0; i < toInsert.length; i++) {
                            const next = (i < toInsert.length - 1) ? toInsert[i + 1] : firstWp;
                            const dx = next.x - toInsert[i].x;
                            const dy = next.y - toInsert[i].y;
                            addedDist += Math.sqrt(dx * dx + dy * dy);
                        }
                        extended += addedDist;
                        train.totalLength += addedDist;
                        train.headDistance += addedDist;
                    }
                } else {
                    const nextPixelX = offsetX + nextPos.x * TILE_SIZE + TILE_SIZE / 2;
                    const nextPixelY = offsetY + nextPos.y * TILE_SIZE + TILE_SIZE / 2;
                    const next = train.path[0];
                    const dx = next.x - nextPixelX;
                    const dy = next.y - nextPixelY;
                    const segLen = Math.sqrt(dx * dx + dy * dy);
                    extended += segLen;
                    train.totalLength += segLen;
                    train.headDistance += segLen;
                    train.path.unshift({ x: nextPixelX, y: nextPixelY });
                }

                train.backGridX = nextPos.x;
                train.backGridY = nextPos.y;
                train.backDirection = exitDir;
            }
        }

        function trimPathAhead(train) {
            // When moving backward, the head is at headDistance and nothing is
            // needed beyond headDistance + some buffer. Trim from path end.
            const excess = train.totalLength - train.headDistance - TILE_SIZE * 2;
            if (excess <= 0) return;

            let trimDist = 0;
            let trimCount = 0;
            for (let i = train.path.length - 1; i > 0; i--) {
                const dx = train.path[i].x - train.path[i - 1].x;
                const dy = train.path[i].y - train.path[i - 1].y;
                const segLen = Math.sqrt(dx * dx + dy * dy);
                if (trimDist + segLen >= excess) break;
                trimDist += segLen;
                trimCount++;
            }

            if (trimCount > 0) {
                train.path.splice(train.path.length - trimCount, trimCount);
                train.totalLength -= trimDist;
            }
        }

        function recomputeBackFrontier(train) {
            const firstWp = train.path[0];
            let interiorX = firstWp.x;
            let interiorY = firstWp.y;
            if (train.path.length >= 2) {
                const next = train.path[1];
                const dx = firstWp.x - next.x;
                const dy = firstWp.y - next.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len > 0) {
                    interiorX = firstWp.x - (dx / len) * 1;
                    interiorY = firstWp.y - (dy / len) * 1;
                }
            }
            const gridX = Math.floor((interiorX - offsetX) / TILE_SIZE);
            const gridY = Math.floor((interiorY - offsetY) / TILE_SIZE);
            train.backGridX = Math.max(0, Math.min(GRID_COLS - 1, gridX));
            train.backGridY = Math.max(0, Math.min(GRID_ROWS - 1, gridY));

            // Determine backward travel direction using dot product
            let travelDx = 0, travelDy = 0;
            if (train.path.length >= 2) {
                travelDx = firstWp.x - train.path[1].x;
                travelDy = firstWp.y - train.path[1].y;
            }
            const backTrack = getTileAtGrid(train.backGridX, train.backGridY, 'tracks');
            if (backTrack && backTrack.tileType) {
                const exits = getTrackExitSides(backTrack.tileType.id);
                const dirVecs = { 'right': {x:1,y:0}, 'left': {x:-1,y:0}, 'top': {x:0,y:-1}, 'bottom': {x:0,y:1} };
                let bestExit = exits[0];
                let bestDot = -Infinity;
                for (const side of exits) {
                    const v = dirVecs[side];
                    const dot = travelDx * v.x + travelDy * v.y;
                    if (dot > bestDot) { bestDot = dot; bestExit = side; }
                }
                train.backDirection = bestExit;

                // For curve tiles, if path[0] is an intermediate arc point (not at
                // the backDirection edge), prepend the remaining arc to reach that edge
                // so that extendPathBackward connects smoothly to the next tile.
                if (backTrack.tileType.id.startsWith('curved_track_')) {
                    const half = TILE_SIZE / 2;
                    const tilePixelX = offsetX + train.backGridX * TILE_SIZE;
                    const tilePixelY = offsetY + train.backGridY * TILE_SIZE;
                    const edgeMids = {
                        'right': { x: tilePixelX + TILE_SIZE, y: tilePixelY + half },
                        'left': { x: tilePixelX, y: tilePixelY + half },
                        'top': { x: tilePixelX + half, y: tilePixelY },
                        'bottom': { x: tilePixelX + half, y: tilePixelY + TILE_SIZE }
                    };
                    const targetEdge = edgeMids[bestExit];
                    const distToEdge = Math.sqrt((firstWp.x - targetEdge.x) ** 2 + (firstWp.y - targetEdge.y) ** 2);

                    if (distToEdge > 1) {
                        // path[0] is inside the curve, not at the bestExit edge.
                        // Generate arc from bestExit edge toward the other edge.
                        // Collect points that are between the edge and path[0],
                        // then splice them before path[0] in correct order.
                        const arcPoints = getCurveArcPoints(backTrack.tileType.id, bestExit, train.backGridX, train.backGridY, 8);
                        // arcPoints[0] = bestExit edge, progressing toward other edge.
                        // Find how many points are before firstWp on this arc.
                        let prevDist = Infinity;
                        let endIdx = 0;
                        for (let i = 0; i < arcPoints.length; i++) {
                            const d = Math.sqrt((arcPoints[i].x - firstWp.x) ** 2 + (arcPoints[i].y - firstWp.y) ** 2);
                            if (d >= prevDist || d < 1) break;
                            prevDist = d;
                            endIdx = i + 1;
                        }
                        if (endIdx > 0) {
                            // Splice points [0..endIdx-1] before path[0] in order
                            const toInsert = arcPoints.slice(0, endIdx);
                            train.path.splice(0, 0, ...toInsert);
                            // Calculate added distance
                            let addedDist = 0;
                            for (let i = 0; i < toInsert.length; i++) {
                                const next = (i < toInsert.length - 1) ? toInsert[i + 1] : firstWp;
                                const dx = next.x - toInsert[i].x;
                                const dy = next.y - toInsert[i].y;
                                addedDist += Math.sqrt(dx * dx + dy * dy);
                            }
                            train.totalLength += addedDist;
                            train.headDistance += addedDist;
                        }
                    }
                }
            } else {
                if (Math.abs(travelDx) > Math.abs(travelDy)) {
                    train.backDirection = travelDx > 0 ? 'right' : 'left';
                } else {
                    train.backDirection = travelDy > 0 ? 'bottom' : 'top';
                }
            }
        }

        function recomputeFrontFrontier(train) {
            const lastWp = train.path[train.path.length - 1];
            let interiorX = lastWp.x;
            let interiorY = lastWp.y;
            if (train.path.length >= 2) {
                const prev = train.path[train.path.length - 2];
                const dx = lastWp.x - prev.x;
                const dy = lastWp.y - prev.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len > 0) {
                    interiorX = lastWp.x - (dx / len) * 1;
                    interiorY = lastWp.y - (dy / len) * 1;
                }
            }
            const gridX = Math.floor((interiorX - offsetX) / TILE_SIZE);
            const gridY = Math.floor((interiorY - offsetY) / TILE_SIZE);
            train.frontGridX = Math.max(0, Math.min(GRID_COLS - 1, gridX));
            train.frontGridY = Math.max(0, Math.min(GRID_ROWS - 1, gridY));

            let travelDx = 0, travelDy = 0;
            if (train.path.length >= 2) {
                const prev = train.path[train.path.length - 2];
                travelDx = lastWp.x - prev.x;
                travelDy = lastWp.y - prev.y;
            }
            const frontTrack = getTileAtGrid(train.frontGridX, train.frontGridY, 'tracks');
            if (frontTrack && frontTrack.tileType) {
                const exits = getTrackExitSides(frontTrack.tileType.id);
                const dirVecs = { 'right': {x:1,y:0}, 'left': {x:-1,y:0}, 'top': {x:0,y:-1}, 'bottom': {x:0,y:1} };
                let bestExit = exits[0];
                let bestDot = -Infinity;
                for (const side of exits) {
                    const v = dirVecs[side];
                    const dot = travelDx * v.x + travelDy * v.y;
                    if (dot > bestDot) { bestDot = dot; bestExit = side; }
                }
                train.frontDirection = bestExit;

                // For curve tiles, if path end is an intermediate arc point (not at
                // the frontDirection edge), append the remaining arc to reach that edge.
                if (frontTrack.tileType.id.startsWith('curved_track_')) {
                    const half = TILE_SIZE / 2;
                    const tilePixelX = offsetX + train.frontGridX * TILE_SIZE;
                    const tilePixelY = offsetY + train.frontGridY * TILE_SIZE;
                    const edgeMids = {
                        'right': { x: tilePixelX + TILE_SIZE, y: tilePixelY + half },
                        'left': { x: tilePixelX, y: tilePixelY + half },
                        'top': { x: tilePixelX + half, y: tilePixelY },
                        'bottom': { x: tilePixelX + half, y: tilePixelY + TILE_SIZE }
                    };
                    const targetEdge = edgeMids[bestExit];
                    const distToEdge = Math.sqrt((lastWp.x - targetEdge.x) ** 2 + (lastWp.y - targetEdge.y) ** 2);

                    if (distToEdge > 1) {
                        // Generate arc from the other connected side toward bestExit edge
                        const otherSide = getExitDirection(frontTrack, bestExit);
                        if (otherSide) {
                            const arcPoints = getCurveArcPoints(frontTrack.tileType.id, otherSide, train.frontGridX, train.frontGridY, 8);
                            // arcPoints go from otherSide edge to bestExit edge.
                            // Find where lastWp sits and append only the points after it.
                            let prevDist = Infinity;
                            let startIdx = 0;
                            for (let i = 0; i < arcPoints.length; i++) {
                                const d = Math.sqrt((arcPoints[i].x - lastWp.x) ** 2 + (arcPoints[i].y - lastWp.y) ** 2);
                                if (d < prevDist) {
                                    prevDist = d;
                                    startIdx = i;
                                } else {
                                    break;
                                }
                            }
                            // Append points after the closest point to lastWp
                            for (let i = startIdx + 1; i < arcPoints.length; i++) {
                                const prev = train.path[train.path.length - 1];
                                const dx = arcPoints[i].x - prev.x;
                                const dy = arcPoints[i].y - prev.y;
                                const segLen = Math.sqrt(dx * dx + dy * dy);
                                train.totalLength += segLen;
                                train.path.push(arcPoints[i]);
                            }
                        }
                    }
                }
            } else {
                if (Math.abs(travelDx) > Math.abs(travelDy)) {
                    train.frontDirection = travelDx > 0 ? 'right' : 'left';
                } else {
                    train.frontDirection = travelDy > 0 ? 'bottom' : 'top';
                }
            }
        }

        function trainHasDrag(train) {
            return train.drag && train.drag.some(v => v);
        }

        function hasStopTileBeyond(gridX, gridY, direction) {
            // Check if there's a stop tile in the direction specified from the given position
            let checkX = gridX;
            let checkY = gridY;

            if (direction === 'top') checkY--;
            else if (direction === 'bottom') checkY++;
            else if (direction === 'left') checkX--;
            else if (direction === 'right') checkX++;

            // Check bounds
            if (checkX < 0 || checkX >= GRID_COLS || checkY < 0 || checkY >= GRID_ROWS) return false;

            // Check for stop tile at that position
            const tile = getTileAtGrid(checkX, checkY, 'tracks');
            return tile && tile.tileType && tile.tileType.id === 'stop';
        }

        function findClosestMathFactToStop(train, stopDirection) {
            // Find which math fact is closest to the direction of the stop
            // stopDirection is the direction the train was heading when it hit the stop
            const mf = train.mathFacts;
            if (!mf) return null;

            // Find all math facts
            const mathFactIndices = [];
            for (let i = 1; i < train.numCars - 1; i++) {
                if (mf[i]) mathFactIndices.push(i);
            }

            if (mathFactIndices.length === 0) return null;

            // If moving forward (speed > 0), the head (car 0) is closest to the stop
            // If moving backward (speed < 0), the tail is closest
            // Find the math fact closest to the appropriate end
            if (stopDirection === 'forward') {
                // Head is closest - find lowest index math fact
                return Math.min(...mathFactIndices);
            } else {
                // Tail is closest - find highest index math fact
                return Math.max(...mathFactIndices);
            }
        }

        function updateTrainAnimations() {
            trainAnimations.forEach(train => {
                // Trains with drag-enabled cars are player-controlled
                if (trainHasDrag(train)) {
                    // Still extend path in both directions so dragging has room
                    extendPathForward(train);
                    extendPathBackward(train);
                    return;
                }

                train.headDistance += train.speed * dt;

                if (train.speed > 0) {
                    extendPathForward(train);
                    if (train.headDistance >= train.totalLength) {
                        train.headDistance = train.totalLength;
                        // Check if there's a stop tile beyond the track end
                        if (hasStopTileBeyond(train.frontGridX, train.frontGridY, train.frontDirection)) {
                            // Stop permanently and select closest math fact
                            train.speed = 0;
                            if (!selectedRunMathFact) {
                                const closestMathFact = findClosestMathFactToStop(train, 'forward');
                                if (closestMathFact !== null) {
                                    selectedRunMathFact = { trainId: train.trainId, middleCarIndex: closestMathFact };
                                    keypadVisible = true;
                                    calculateKeypadTargetCamera();
                                }
                            }
                        } else {
                            // Normal reversal
                            train.speed = -train.speed;
                            recomputeBackFrontier(train);
                        }
                    } else {
                        trimPathTail(train);
                    }
                } else {
                    extendPathBackward(train);
                    let totalSpacing = 0;
                    for (let i = 0; i < train.numCars - 1; i++) {
                        const spacingVal = train.spacing[i] != null ? train.spacing[i] : 59;
                        totalSpacing += spacingVal;
                    }
                    if (train.headDistance - totalSpacing <= 0) {
                        train.headDistance = totalSpacing;
                        // Check if there's a stop tile beyond the track end
                        if (hasStopTileBeyond(train.backGridX, train.backGridY, train.backDirection)) {
                            // Stop permanently and select closest math fact
                            train.speed = 0;
                            if (!selectedRunMathFact) {
                                const closestMathFact = findClosestMathFactToStop(train, 'backward');
                                if (closestMathFact !== null) {
                                    selectedRunMathFact = { trainId: train.trainId, middleCarIndex: closestMathFact };
                                    keypadVisible = true;
                                    calculateKeypadTargetCamera();
                                }
                            }
                        } else {
                            // Normal reversal
                            train.speed = -train.speed;
                            recomputeFrontFrontier(train);
                        }
                    } else {
                        trimPathAhead(train);
                    }
                }
            });
        }

        function drawAnimatedTrains(ctx) {
            const trainType = TILE_TYPES.find(t => t.id === 'train');
            const dragLinesType = TILE_TYPES.find(t => t.id === 'drag_lines_car');

            trainAnimations.forEach(train => {
                const positions = [];
                const carDistances = [];

                let cumulativeSpacing = 0;
                for (let i = 0; i < train.numCars; i++) {
                    if (i > 0) {
                        const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                        cumulativeSpacing += spacingVal;
                    }

                    let carDistance = Math.max(0, train.headDistance - cumulativeSpacing);
                    const pos = getPositionAlongPath(train.path, carDistance);
                    positions.push(pos);
                    carDistances.push(carDistance);
                }

                // Draw math fact selection highlight behind everything (visible during gameplay and step 1 of animation)
                // Correct answers use the same colour for the highlight and the
                // feedback overlay, so the overlay popping on at full opacity reads
                // as an abrupt jump. Hold the highlight through step 2 and fade it
                // out while the overlay fades in, crossfading between the two.
                const crossfadeHighlight = feedbackAnim && feedbackAnim.step === 2 && feedbackAnim.isCorrect &&
                    feedbackAnim.trainId === train.trainId;
                const showHighlight = selectedRunMathFact && selectedRunMathFact.trainId === train.trainId &&
                    (runModeState !== 'animation' || (feedbackAnim && feedbackAnim.step === 1) || crossfadeHighlight);
                if (showHighlight) {
                    const mid = selectedRunMathFact.middleCarIndex;
                    const highlightIndices = [mid - 1, mid, mid + 1];
                    const cornerRadius = 10;
                    const highlightSize = 57;

                    ctx.save();
                    if (crossfadeHighlight) {
                        ctx.globalAlpha = 1 - Math.min(1, Math.max(0, feedbackAnim.frame / feedbackAnim.step2Duration));
                    }

                    // Draw 23px connector stroke between the 3 selected cars
                    if (mid - 1 >= 0 && mid + 1 < positions.length) {
                        const startDist = carDistances[mid + 1];
                        const endDist = carDistances[mid - 1];
                        if (endDist > startDist) {
                            drawPathStroke(ctx, train.path, startDist, endDist, '#4ECEC5', 23);
                        }
                    }

                    // Draw 57x57 rounded rectangles behind each car in the triplet
                    highlightIndices.forEach(idx => {
                        if (idx >= 0 && idx < positions.length) {
                            const pos = positions[idx];
                            ctx.save();
                            ctx.translate(pos.x, pos.y);
                            ctx.rotate(pos.angle);
                            ctx.fillStyle = '#4ECEC5';
                            ctx.beginPath();
                            const half = highlightSize / 2;
                            ctx.moveTo(-half + cornerRadius, -half);
                            ctx.lineTo(half - cornerRadius, -half);
                            ctx.arcTo(half, -half, half, -half + cornerRadius, cornerRadius);
                            ctx.lineTo(half, half - cornerRadius);
                            ctx.arcTo(half, half, half - cornerRadius, half, cornerRadius);
                            ctx.lineTo(-half + cornerRadius, half);
                            ctx.arcTo(-half, half, -half, half - cornerRadius, cornerRadius);
                            ctx.lineTo(-half, -half + cornerRadius);
                            ctx.arcTo(-half, -half, -half + cornerRadius, -half, cornerRadius);
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }
                    });

                    ctx.restore();
                }

                // Determine if we need to skip connector segments for fading cars
                const skipConnector = feedbackAnim && feedbackAnim.step === 4 && feedbackAnim.isCorrect &&
                    feedbackAnim.trainId === train.trainId;
                const tailDist = Math.max(0, train.headDistance - cumulativeSpacing);

                // Draw gray connection stroke beneath cars
                if (positions.length > 1) {
                    if (skipConnector) {
                        const mid = feedbackAnim.middleCarIndex;
                        const gapStart = carDistances[mid + 1];
                        const gapEnd = carDistances[mid - 1];
                        if (tailDist < gapStart) drawPathStroke(ctx, train.path, tailDist, gapStart, '#252525', 16);
                        if (gapEnd < train.headDistance) drawPathStroke(ctx, train.path, gapEnd, train.headDistance, '#252525', 16);
                    } else {
                        drawPathStroke(ctx, train.path, tailDist, train.headDistance, '#252525', 16);
                    }
                }

                // Draw each car with orientation
                positions.forEach((pos, i) => {
                    // Skip cars being faded out by feedback animation (step 4, correct answer)
                    if (skipConnector) {
                        const mid = feedbackAnim.middleCarIndex;
                        if (i >= mid - 1 && i <= mid + 1) return;
                    }
                    const size = TILE_SIZE - 4;
                    ctx.save();
                    ctx.translate(pos.x, pos.y);
                    ctx.rotate(pos.angle);
                    trainType.render(ctx, -size / 2, -size / 2, size);
                    ctx.restore();
                });

                // Draw black connection stroke on top of cars
                if (positions.length > 1) {
                    if (skipConnector) {
                        const mid = feedbackAnim.middleCarIndex;
                        const gapStart = carDistances[mid + 1];
                        const gapEnd = carDistances[mid - 1];
                        if (tailDist < gapStart) drawPathStroke(ctx, train.path, tailDist, gapStart);
                        if (gapEnd < train.headDistance) drawPathStroke(ctx, train.path, gapEnd, train.headDistance);
                    } else {
                        drawPathStroke(ctx, train.path, tailDist, train.headDistance);
                    }
                }

                // Draw drag lines on top of everything
                positions.forEach((pos, i) => {
                    if (skipConnector) {
                        const mid = feedbackAnim.middleCarIndex;
                        if (i >= mid - 1 && i <= mid + 1) return;
                    }
                    const dragEnabled = train.drag && train.drag[i];
                    if (dragEnabled && dragLinesType) {
                        const size = TILE_SIZE - 4;
                        ctx.save();
                        ctx.translate(pos.x, pos.y);
                        ctx.rotate(pos.angle);
                        dragLinesType.render(ctx, -size / 2, -size / 2, size);
                        ctx.restore();
                    }
                });

            });
        }

        function shouldSwapMathFactTerms(termCarPos, opCarPos) {
            const dx = termCarPos.x - opCarPos.x;
            const dy = termCarPos.y - opCarPos.y;
            if (Math.abs(dx) > 1) return dx > 0;
            return dy > 0;
        }

        function getDisplayTextForCar(train, carIndex, positions) {
            const text = train.text && train.text[carIndex];
            if (!text) return null;
            const mf = train.mathFacts;
            if (!mf) return text;
            const numCars = train.numCars || train.text.length;
            let mid = -1;
            if (mf[carIndex]) {
                mid = carIndex;
            } else if (carIndex < numCars - 1 && mf[carIndex + 1]) {
                mid = carIndex + 1;
            } else if (carIndex > 0 && mf[carIndex - 1]) {
                mid = carIndex - 1;
            }
            if (mid < 0) return text;
            if (mid - 1 < 0 || mid + 1 >= positions.length) return text;
            const termPos = positions[mid - 1];
            const opPos = positions[mid];
            if (!termPos || !opPos) return text;
            if (shouldSwapMathFactTerms(termPos, opPos)) {
                if (carIndex === mid - 1) return train.text[mid + 1];
                if (carIndex === mid + 1) return train.text[mid - 1];
            }
            return text;
        }

        // Canvas 'middle' baseline centers on font metrics, not the glyph's actual
        // ink, which reads visually high for digits (no descender). This centers
        // on the glyph's true bounding box instead.
        // actualBoundingBoxAscent/Descent requires the engine to actually
        // rasterize the glyphs to find their ink bounds, which is far more
        // expensive than a plain measureText().width - and this gets queried
        // many times per frame (every equation-train digit, every stepper
        // value, every math-settings button label...). The result only
        // depends on the font string and the text itself, so it's cached
        // rather than recomputed every call.
        const centeredTextMetricsCache = new Map();

        // Vertical offset to add to y so text baseline-centers on its own ink
        // (ascent/descent), rather than canvas's 'middle' baseline which sits
        // visibly off-center for bold Nunito. Assumes ctx.font is already set.
        function getCenteredTextHalfOffset(ctx, font, text) {
            const cacheKey = font + '|' + text;
            let halfOffset = centeredTextMetricsCache.get(cacheKey);
            if (halfOffset === undefined) {
                const metrics = ctx.measureText(text);
                halfOffset = (metrics.actualBoundingBoxAscent - metrics.actualBoundingBoxDescent) / 2;
                centeredTextMetricsCache.set(cacheKey, halfOffset);
            }
            return halfOffset;
        }

        function fillCenteredTrainText(ctx, text, x, y, fontSize) {
            const font = `600 ${fontSize}pt 'Nunito'`;
            ctx.font = font;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText(text, x, y + getCenteredTextHalfOffset(ctx, font, text));
        }

        function drawTrainText(ctx) {
            if (isRunMode) {
                trainAnimations.forEach(train => {
                    const positions = [];
                    let cumulativeSpacing = 0;
                    for (let i = 0; i < train.numCars; i++) {
                        if (i > 0) {
                            const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                            cumulativeSpacing += spacingVal;
                        }
                        const carDistance = Math.max(0, train.headDistance - cumulativeSpacing);
                        positions.push(getPositionAlongPath(train.path, carDistance));
                    }

                    cumulativeSpacing = 0;
                    for (let i = 0; i < train.numCars; i++) {
                        if (i > 0) {
                            const spacingVal = train.spacing[i - 1] != null ? train.spacing[i - 1] : 59;
                            cumulativeSpacing += spacingVal;
                        }
                        if (feedbackAnim && feedbackAnim.trainId === train.trainId) {
                            const mid = feedbackAnim.middleCarIndex;
                            if (i >= mid - 1 && i <= mid + 1) continue;
                        }
                        const text = getDisplayTextForCar(train, i, positions);
                        if (text) {
                            const pos = positions[i];
                            const fontSize = train.textFontSize != null ? train.textFontSize : 22;
                            ctx.save();
                            ctx.fillStyle = '#000000';
                            fillCenteredTrainText(ctx, text, pos.x, pos.y, fontSize);
                            ctx.restore();
                        }
                    }
                });
            } else {
                objectTiles.forEach(tile => {
                    if (!tile.tileType || tile.tileType.id !== 'train') return;
                    const trainId = getTrainId(tile);
                    const trainData = getTrainCarPixelPositions(tile, trainId);
                    const carPixelPositions = trainData.positions;
                    const numCars = carPixelPositions.length;
                    const mf = trainId && trainProperties[trainId] && trainProperties[trainId].mathFacts;
                    carPixelPositions.forEach((pos, i) => {
                        if (pos.x >= offsetX - TILE_SIZE && pos.x < offsetX + gridWidth + TILE_SIZE &&
                            pos.y >= offsetY - TILE_SIZE && pos.y < offsetY + gridHeight + TILE_SIZE) {
                            let text = trainId && trainProperties[trainId] && trainProperties[trainId].text && trainProperties[trainId].text[i];
                            if (text && mf) {
                                let mid = -1;
                                if (mf[i]) mid = i;
                                else if (i < numCars - 1 && mf[i + 1]) mid = i + 1;
                                else if (i > 0 && mf[i - 1]) mid = i - 1;
                                if (mid >= 0 && mid - 1 >= 0 && mid + 1 < numCars) {
                                    if (shouldSwapMathFactTerms(carPixelPositions[mid - 1], carPixelPositions[mid])) {
                                        if (i === mid - 1) text = trainProperties[trainId].text[mid + 1];
                                        else if (i === mid + 1) text = trainProperties[trainId].text[mid - 1];
                                    }
                                }
                            }
                            if (text) {
                                const fontSize = trainId && trainProperties[trainId] && trainProperties[trainId].textFontSize != null
                                    ? trainProperties[trainId].textFontSize : 22;
                                ctx.save();
                                ctx.fillStyle = '#000000';
                                fillCenteredTrainText(ctx, text, pos.x, pos.y, fontSize);
                                ctx.restore();
                            }
                        }
                    });
                });
            }
        }

        // Keypad layout constants
        const KEYPAD_PADDING = 7;
        const KEYPAD_BUTTON_SIZE = 43;
        const KEYPAD_INPUT_WIDTH = 71;
        const KEYPAD_INPUT_HEIGHT = 61;
        const KEYPAD_COLS = 2;
        const KEYPAD_ROWS = 6;
        const KEYPAD_CORNER_RADIUS = 8;
        const KEYPAD_BUTTON_RADIUS = 3;
        const KEYPAD_INPUT_RADIUS = 6;
        const KEYPAD_RESET_BUTTON_SIZE = 60;
        const KEYPAD_RESET_GAP = 22.5; // Extra breathing room above the reset key, larger than KEYPAD_PADDING to set it apart from the rest of the keys
        const KEYPAD_LEVEL_SELECT_GAP = 14; // Gap between the restart key and the return-to-level-select key below it
        // Button layout: 2 columns × 6 rows
        // Col 0: 1,2,3,4,5,delete  Col 1: 6,7,8,9,0,submit
        const KEYPAD_BUTTONS = [
            { label: '1', type: 'number' }, { label: '6', type: 'number' },
            { label: '2', type: 'number' }, { label: '7', type: 'number' },
            { label: '3', type: 'number' }, { label: '8', type: 'number' },
            { label: '4', type: 'number' }, { label: '9', type: 'number' },
            { label: '5', type: 'number' }, { label: '0', type: 'number' },
            { label: 'del', type: 'delete' }, { label: 'sub', type: 'submit' }
        ];

        function getKeypadDimensions() {
            const gridW = KEYPAD_COLS * KEYPAD_BUTTON_SIZE + (KEYPAD_COLS - 1) * KEYPAD_PADDING;
            const gridH = KEYPAD_ROWS * KEYPAD_BUTTON_SIZE + (KEYPAD_ROWS - 1) * KEYPAD_PADDING;
            const contentW = Math.max(KEYPAD_INPUT_WIDTH, gridW, KEYPAD_RESET_BUTTON_SIZE);
            const contentH = KEYPAD_INPUT_HEIGHT + KEYPAD_PADDING + gridH + KEYPAD_RESET_GAP + KEYPAD_RESET_BUTTON_SIZE + KEYPAD_LEVEL_SELECT_GAP + KEYPAD_RESET_BUTTON_SIZE;
            const panelW = contentW + KEYPAD_PADDING * 2;
            const panelH = CAMERA_HEIGHT - KEYPAD_PADDING * 2;
            return { panelW, panelH, contentW, contentH, gridW, gridH };
        }

        function getKeypadPosition() {
            const { panelW, panelH } = getKeypadDimensions();
            const targetX = CAMERA_WIDTH - panelW - KEYPAD_PADDING;
            const offscreenX = CAMERA_WIDTH + 10;
            const x = offscreenX + (targetX - offscreenX) * keypadSlideProgress;
            const y = KEYPAD_PADDING;
            return { x, y };
        }

        function getKeypadContentTop() {
            const { panelH, contentH } = getKeypadDimensions();
            const { x: panelX, y: panelY } = getKeypadPosition();
            const contentTop = panelY + (panelH - contentH) / 2;
            return contentTop;
        }

        function getKeypadButtonRect(index) {
            const { panelW, contentW, gridW } = getKeypadDimensions();
            const { x: panelX, y: panelY } = getKeypadPosition();
            const contentTop = getKeypadContentTop();
            const col = index % KEYPAD_COLS;
            const row = Math.floor(index / KEYPAD_COLS);
            const gridOffsetX = panelX + KEYPAD_PADDING + (contentW - gridW) / 2;
            const gridOffsetY = contentTop + KEYPAD_INPUT_HEIGHT + KEYPAD_PADDING;
            const bx = gridOffsetX + col * (KEYPAD_BUTTON_SIZE + KEYPAD_PADDING);
            const by = gridOffsetY + row * (KEYPAD_BUTTON_SIZE + KEYPAD_PADDING);
            return { x: bx, y: by, w: KEYPAD_BUTTON_SIZE, h: KEYPAD_BUTTON_SIZE };
        }

        function getKeypadResetButtonRect() {
            const { contentW, gridH } = getKeypadDimensions();
            const { x: panelX } = getKeypadPosition();
            const contentTop = getKeypadContentTop();
            const gridOffsetY = contentTop + KEYPAD_INPUT_HEIGHT + KEYPAD_PADDING;
            const rx = panelX + KEYPAD_PADDING + (contentW - KEYPAD_RESET_BUTTON_SIZE) / 2;
            const ry = gridOffsetY + gridH + KEYPAD_RESET_GAP;
            return { x: rx, y: ry, w: KEYPAD_RESET_BUTTON_SIZE, h: KEYPAD_RESET_BUTTON_SIZE };
        }

        function getKeypadLevelSelectButtonRect() {
            const resetRect = getKeypadResetButtonRect();
            return {
                x: resetRect.x,
                y: resetRect.y + resetRect.h + KEYPAD_LEVEL_SELECT_GAP,
                w: KEYPAD_RESET_BUTTON_SIZE,
                h: KEYPAD_RESET_BUTTON_SIZE
            };
        }

        // Shared look for the reset and return-to-level-select keypad keys:
        // a rounded square, darkened while pressed, highlighted on hover,
        // with a sprite drawn on top.
        function drawKeypadRoundButton(ctx, rect, pressed, hovered, sprite) {
            let fillColor = '#212121';
            if (pressed) {
                const r = parseInt(fillColor.slice(1, 3), 16);
                const g = parseInt(fillColor.slice(3, 5), 16);
                const b = parseInt(fillColor.slice(5, 7), 16);
                fillColor = `#${Math.round(r * 0.5).toString(16).padStart(2, '0')}${Math.round(g * 0.5).toString(16).padStart(2, '0')}${Math.round(b * 0.5).toString(16).padStart(2, '0')}`;
            }

            ctx.fillStyle = fillColor;
            ctx.beginPath();
            ctx.moveTo(rect.x + KEYPAD_BUTTON_RADIUS, rect.y);
            ctx.lineTo(rect.x + rect.w - KEYPAD_BUTTON_RADIUS, rect.y);
            ctx.arcTo(rect.x + rect.w, rect.y, rect.x + rect.w, rect.y + KEYPAD_BUTTON_RADIUS, KEYPAD_BUTTON_RADIUS);
            ctx.lineTo(rect.x + rect.w, rect.y + rect.h - KEYPAD_BUTTON_RADIUS);
            ctx.arcTo(rect.x + rect.w, rect.y + rect.h, rect.x + rect.w - KEYPAD_BUTTON_RADIUS, rect.y + rect.h, KEYPAD_BUTTON_RADIUS);
            ctx.lineTo(rect.x + KEYPAD_BUTTON_RADIUS, rect.y + rect.h);
            ctx.arcTo(rect.x, rect.y + rect.h, rect.x, rect.y + rect.h - KEYPAD_BUTTON_RADIUS, KEYPAD_BUTTON_RADIUS);
            ctx.lineTo(rect.x, rect.y + KEYPAD_BUTTON_RADIUS);
            ctx.arcTo(rect.x, rect.y, rect.x + KEYPAD_BUTTON_RADIUS, rect.y, KEYPAD_BUTTON_RADIUS);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = hovered ? '#4ECEC5' : '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            if (sprite && sprite.complete) {
                ctx.drawImage(sprite, rect.x, rect.y, rect.w, rect.h);
            }
        }

        function drawKeypad(ctx) {
            if (keypadSlideProgress <= 0) return;

            const { panelW, panelH, contentW, gridW } = getKeypadDimensions();
            const { x: panelX, y: panelY } = getKeypadPosition();

            // Draw panel background
            ctx.fillStyle = '#313131';
            ctx.beginPath();
            ctx.moveTo(panelX + KEYPAD_CORNER_RADIUS, panelY);
            ctx.lineTo(panelX + panelW - KEYPAD_CORNER_RADIUS, panelY);
            ctx.arcTo(panelX + panelW, panelY, panelX + panelW, panelY + KEYPAD_CORNER_RADIUS, KEYPAD_CORNER_RADIUS);
            ctx.lineTo(panelX + panelW, panelY + panelH - KEYPAD_CORNER_RADIUS);
            ctx.arcTo(panelX + panelW, panelY + panelH, panelX + panelW - KEYPAD_CORNER_RADIUS, panelY + panelH, KEYPAD_CORNER_RADIUS);
            ctx.lineTo(panelX + KEYPAD_CORNER_RADIUS, panelY + panelH);
            ctx.arcTo(panelX, panelY + panelH, panelX, panelY + panelH - KEYPAD_CORNER_RADIUS, KEYPAD_CORNER_RADIUS);
            ctx.lineTo(panelX, panelY + KEYPAD_CORNER_RADIUS);
            ctx.arcTo(panelX, panelY, panelX + KEYPAD_CORNER_RADIUS, panelY, KEYPAD_CORNER_RADIUS);
            ctx.closePath();
            ctx.fill();

            // Draw input box (vertically centered with buttons as a group)
            const contentTop = getKeypadContentTop();
            const inputX = panelX + KEYPAD_PADDING + (contentW - KEYPAD_INPUT_WIDTH) / 2;
            const inputY = contentTop;
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.moveTo(inputX + KEYPAD_INPUT_RADIUS, inputY);
            ctx.lineTo(inputX + KEYPAD_INPUT_WIDTH - KEYPAD_INPUT_RADIUS, inputY);
            ctx.arcTo(inputX + KEYPAD_INPUT_WIDTH, inputY, inputX + KEYPAD_INPUT_WIDTH, inputY + KEYPAD_INPUT_RADIUS, KEYPAD_INPUT_RADIUS);
            ctx.lineTo(inputX + KEYPAD_INPUT_WIDTH, inputY + KEYPAD_INPUT_HEIGHT - KEYPAD_INPUT_RADIUS);
            ctx.arcTo(inputX + KEYPAD_INPUT_WIDTH, inputY + KEYPAD_INPUT_HEIGHT, inputX + KEYPAD_INPUT_WIDTH - KEYPAD_INPUT_RADIUS, inputY + KEYPAD_INPUT_HEIGHT, KEYPAD_INPUT_RADIUS);
            ctx.lineTo(inputX + KEYPAD_INPUT_RADIUS, inputY + KEYPAD_INPUT_HEIGHT);
            ctx.arcTo(inputX, inputY + KEYPAD_INPUT_HEIGHT, inputX, inputY + KEYPAD_INPUT_HEIGHT - KEYPAD_INPUT_RADIUS, KEYPAD_INPUT_RADIUS);
            ctx.lineTo(inputX, inputY + KEYPAD_INPUT_RADIUS);
            ctx.arcTo(inputX, inputY, inputX + KEYPAD_INPUT_RADIUS, inputY, KEYPAD_INPUT_RADIUS);
            ctx.closePath();
            ctx.fill();

            // Draw input text
            if (keypadInputValue) {
                ctx.save();
                ctx.font = "600 28pt 'Nunito'";
                ctx.fillStyle = '#4ECEC5';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'alphabetic';
                const metrics = ctx.measureText(keypadInputValue);
                const ascent = metrics.actualBoundingBoxAscent;
                const descent = metrics.actualBoundingBoxDescent;
                const textH = ascent + descent;
                ctx.fillText(keypadInputValue, inputX + KEYPAD_INPUT_WIDTH / 2, inputY + KEYPAD_INPUT_HEIGHT / 2 + ascent - textH / 2);
                ctx.restore();
            }

            // Draw cursor (blinking)
            keypadCursorBlink += dt;
            if (!keypadInputValue && Math.floor(keypadCursorBlink / 60) % 2 === 0) {
                const cursorX = inputX + KEYPAD_INPUT_WIDTH / 2;
                const cursorY = inputY + KEYPAD_INPUT_HEIGHT / 2;
                ctx.strokeStyle = '#4ECEC5';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(cursorX, cursorY - 21.5);
                ctx.lineTo(cursorX, cursorY + 21.5);
                ctx.stroke();
            }

            // Draw buttons
            KEYPAD_BUTTONS.forEach((btn, index) => {
                const rect = getKeypadButtonRect(index);
                const isHovered = keypadHoveredButton === index;
                const isPressed = keypadPressedButton === index;

                let fillColor;
                if (btn.type === 'number') {
                    fillColor = '#313131';
                } else if (btn.type === 'delete') {
                    fillColor = '#212121';
                } else {
                    fillColor = '#4ECEC5';
                }

                // Darken on press
                if (isPressed) {
                    const r = parseInt(fillColor.slice(1, 3), 16);
                    const g = parseInt(fillColor.slice(3, 5), 16);
                    const b = parseInt(fillColor.slice(5, 7), 16);
                    fillColor = `#${Math.round(r * 0.5).toString(16).padStart(2, '0')}${Math.round(g * 0.5).toString(16).padStart(2, '0')}${Math.round(b * 0.5).toString(16).padStart(2, '0')}`;
                }

                ctx.fillStyle = fillColor;
                ctx.beginPath();
                ctx.moveTo(rect.x + KEYPAD_BUTTON_RADIUS, rect.y);
                ctx.lineTo(rect.x + rect.w - KEYPAD_BUTTON_RADIUS, rect.y);
                ctx.arcTo(rect.x + rect.w, rect.y, rect.x + rect.w, rect.y + KEYPAD_BUTTON_RADIUS, KEYPAD_BUTTON_RADIUS);
                ctx.lineTo(rect.x + rect.w, rect.y + rect.h - KEYPAD_BUTTON_RADIUS);
                ctx.arcTo(rect.x + rect.w, rect.y + rect.h, rect.x + rect.w - KEYPAD_BUTTON_RADIUS, rect.y + rect.h, KEYPAD_BUTTON_RADIUS);
                ctx.lineTo(rect.x + KEYPAD_BUTTON_RADIUS, rect.y + rect.h);
                ctx.arcTo(rect.x, rect.y + rect.h, rect.x, rect.y + rect.h - KEYPAD_BUTTON_RADIUS, KEYPAD_BUTTON_RADIUS);
                ctx.lineTo(rect.x, rect.y + KEYPAD_BUTTON_RADIUS);
                ctx.arcTo(rect.x, rect.y, rect.x + KEYPAD_BUTTON_RADIUS, rect.y, KEYPAD_BUTTON_RADIUS);
                ctx.closePath();
                ctx.fill();

                // Stroke
                ctx.strokeStyle = isHovered ? '#4ECEC5' : '#000000';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Button content
                if (btn.type === 'number') {
                    ctx.save();
                    ctx.font = "18pt 'Nunito'";
                    ctx.fillStyle = '#4ECEC5';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'alphabetic';
                    const metrics = ctx.measureText(btn.label);
                    const ascent = metrics.actualBoundingBoxAscent;
                    const descent = metrics.actualBoundingBoxDescent;
                    const textH = ascent + descent;
                    ctx.fillText(btn.label, rect.x + rect.w / 2, rect.y + rect.h / 2 + ascent - textH / 2);
                    ctx.restore();
                } else if (btn.type === 'delete' && keypadDeleteSprite && keypadDeleteSprite.complete) {
                    ctx.drawImage(keypadDeleteSprite, rect.x, rect.y, rect.w, rect.h);
                } else if (btn.type === 'submit' && keypadSubmitSprite && keypadSubmitSprite.complete) {
                    ctx.drawImage(keypadSubmitSprite, rect.x, rect.y, rect.w, rect.h);
                }
            });

            // Draw reset button below the button grid, styled like the delete key
            const resetRect = getKeypadResetButtonRect();
            drawKeypadRoundButton(ctx, resetRect, keypadResetPressed, keypadResetHovered, keypadResetSprite);

            // Draw the return-to-level-select button beneath the reset button, same style
            const levelSelectRect = getKeypadLevelSelectButtonRect();
            drawKeypadRoundButton(ctx, levelSelectRect, keypadLevelSelectPressed, keypadLevelSelectHovered, keypadLevelSelectSprite);
        }

        function calculateKeypadTargetCamera() {
            if (!selectedRunMathFact) return;

            // Find the train and calculate operation car position
            const train = trainAnimations.find(t => t.trainId === selectedRunMathFact.trainId);
            if (!train) return;

            const mid = selectedRunMathFact.middleCarIndex;
            let cumulativeSpacing = 0;
            for (let i = 0; i < mid; i++) {
                const spacingVal = train.spacing[i] != null ? train.spacing[i] : 59;
                cumulativeSpacing += spacingVal;
            }

            const opCarDist = Math.max(0, train.headDistance - cumulativeSpacing);
            const opCarWorldPos = getPositionAlongPath(train.path, opCarDist);

            keypadTargetWorldX = opCarWorldPos.x;
            keypadStartCameraX = cameraX;
        }

        function updateKeypadAnimation() {
            const targetProgress = keypadVisible ? 1 : 0;

            if (keypadSlideProgress < targetProgress) {
                keypadSlideProgress = Math.min(1, keypadSlideProgress + 0.04 * dt);
            } else if (keypadSlideProgress > targetProgress) {
                if (keypadClosingFromCameraX === null) {
                    // Capture both axes: the player may have panned in any
                    // direction while the keypad was open.
                    keypadClosingFromCameraX = cameraX;
                    keypadClosingFromCameraY = cameraY;
                }
                keypadSlideProgress = Math.max(0, keypadSlideProgress - 0.04 * dt);
            }

            if (keypadTargetWorldX !== null && keypadStartCameraX !== null) {
                // Compute where cameraX needs to be to center the math fact
                // in the currently visible area (which shrinks as keypad slides in)
                const { panelW } = getKeypadDimensions();
                const currentPanelW = panelW * keypadSlideProgress;
                const visibleWidth = CAMERA_WIDTH - currentPanelW;
                let targetNow = keypadTargetWorldX - visibleWidth / 2;
                const maxCameraX = gridWidth - CAMERA_WIDTH + currentPanelW;
                targetNow = Math.max(0, Math.min(maxCameraX, targetNow));

                cameraX = keypadStartCameraX + (targetNow - keypadStartCameraX) * keypadSlideProgress;

                if (keypadSlideProgress >= 1 || keypadSlideProgress === 0) {
                    keypadTargetWorldX = null;
                    keypadStartCameraX = null;
                }
            } else if (keypadClosingFromCameraX !== null) {
                // Ease back to the level's home view on both axes, undoing any
                // panning the player did while the keypad was open.
                const closeProgress = 1 - keypadSlideProgress;
                cameraX = keypadClosingFromCameraX + (baseCameraX - keypadClosingFromCameraX) * closeProgress;
                cameraY = keypadClosingFromCameraY + (baseCameraY - keypadClosingFromCameraY) * closeProgress;

                if (keypadSlideProgress <= 0) {
                    keypadClosingFromCameraX = null;
                    keypadClosingFromCameraY = null;
                    // Land exactly on home rather than a hair off it
                    cameraX = baseCameraX;
                    cameraY = baseCameraY;
