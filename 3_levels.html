        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c2c2c;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-wrapper.run-mode .controls,
        .main-wrapper.run-mode .palette,
        .main-wrapper.run-mode .inspector {
            display: none;
        }

        .main-wrapper.run-mode .container {
            justify-content: center;
        }

        body:has(.main-wrapper.run-mode) {
            padding: 0;
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }

        .main-wrapper.run-mode {
            gap: 0;
        }

        .main-wrapper.run-mode canvas {
            width: var(--run-canvas-width);
            height: var(--run-canvas-height);
            border: none;
        }

        .level-select-screen {
            display: none;
        }

        .level-select-screen.active {
            display: block;
            position: fixed;
            inset: 0;
            background-color: #000;
        }

        body:has(.level-select-screen.active) {
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .level-select-bg {

        #levelSelectRailsCanvas, #levelSelectBigTrainCanvas {
            position: absolute;
            background: none;
            border: none;
            pointer-events: none;
        }

        #levelSelectCanvas {
            position: absolute;
            background: none;
            border: none;
            cursor: default;
        }

        .container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .inspector {
            background-color: #3a3a3a;
            padding: 20px;
            border-radius: 8px;
            width: 1493px;
            min-height: 150px;
            box-sizing: border-box;
        }

        .inspector-title-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .inspector-title-row h3 {
            margin: 0;
        }

        .inspector-title-row .inspector-tabs {
            margin-bottom: 0;
            flex: 1;
        }

        .inspector-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .inspector-tab {
            flex: 1;
            padding: 8px 12px;
            background-color: #2a2a2a;
            border: none;
            border-radius: 4px;
            color: #888;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .inspector-tab:hover {
            background-color: #3a3a3a;
            color: #fff;
        }

        .inspector-tab.active {
            background-color: #4ecdc4;
            color: #000;
            font-weight: bold;
        }

        .inspector-panel {
            display: none;
        }

        .inspector-panel.active {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .palette-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .palette-field label {
            font-size: 14px;
            color: #fff;
        }

        .inspector-field {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .inspector-field label {
            min-width: 60px;
            font-size: 14px;
            color: #fff;
        }

        .inspector-field-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 0;
        }

        .stepper button {
            width: 30px;
            height: 30px;
            padding: 0;
            background-color: #4a4a4a;
            border: 1px solid #555;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stepper button:hover {
            background-color: #5a5a5a;
        }

        .stepper button:active {
            background-color: #3a3a3a;
        }

        .stepper button:first-child {
            border-radius: 4px 0 0 4px;
        }

        .stepper button:last-child {
            border-radius: 0 4px 4px 0;
        }

        .stepper input[type="number"] {
            width: 50px;
            height: 30px;
            padding: 0;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-left: none;
            border-right: none;
            color: #fff;
            font-size: 14px;
            text-align: center;
            -moz-appearance: textfield;
        }

        .stepper input[type="number"]::-webkit-outer-spin-button,
        .stepper input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .stepper input[type="number"]:focus {
            outline: none;
            background-color: #3a3a3a;
        }

        .direction-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .direction-control label {
            min-width: 60px;
            font-size: 14px;
            color: #fff;
        }

        .direction-grid {
            position: relative;
            width: 59px;
            height: 59px;
            background-color: #1a1a1a;
            border: 2px solid #555;
        }

        .direction-checkbox {
            position: absolute;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4ecdc4;
        }

        .direction-checkbox.top {
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .direction-checkbox.bottom {
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .direction-checkbox.left {
            left: -8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .direction-checkbox.right {
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
        }

        .inspector-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .inspector-header h3 {
            margin: 0;
        }

        .inspector-grid {
            display: flex;
            justify-content: center;
        }

        .spacing-tab-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .spacing-inputs {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .spacing-field {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .spacing-field label {
            font-size: 12px;
            color: #888;
        }

        .spacing-field input {
            width: 45px;
            height: 26px;
            padding: 0 4px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            -moz-appearance: textfield;
        }

        .spacing-field input::-webkit-outer-spin-button,
        .spacing-field input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .spacing-field input:focus {
            outline: none;
            border-color: #4ecdc4;
        }

        .spacing-field input.text-input {
            width: 40px;
            text-align: center;
        }

        .drag-tab-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .drag-canvas-wrapper {
            position: relative;
            display: inline-block;
        }

        .drag-checkboxes {
            position: absolute;
            top: 2px;
            left: 2px;
            right: 2px;
            bottom: 2px;
            pointer-events: none;
        }

        .drag-checkbox {
            position: absolute;
            pointer-events: auto;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #4ecdc4;
        }

        #inspectorCanvas {
            border: 2px solid #555;
            background-color: #1a1a1a;
        }

        canvas {
            border: 2px solid #555;
            background-color: #1a1a1a;
            cursor: pointer;
        }

        .controls {
            background-color: #3a3a3a;
            padding: 20px;
            border-radius: 8px;
            width: 280px;
            height: 708px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .control-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
        }

        .control-row input {
            width: 100%;
        }

        input[type="text"] {
            padding: 10px;
            background-color: #2a2a2a;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px 20px;
            background-color: #4a4a4a;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #5a5a5a;
        }

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Grid settings
        const GRID_COLS = 17;
        const GRID_ROWS = 12;
        const TILE_SIZE = 59;

        // Sprite PNGs are authored at 2x pixel density (e.g. a logical 59x59
        // tile sprite is a 118x118 image). Most draw calls pass explicit
        // destination width/height so this is transparent, but a few draw
        // sprites at their natural intrinsic size and need to divide it out.
        const SPRITE_SCALE = 2;

        // Caps how much higher-than-logical-resolution a full-screen canvas's
        // backing store is allowed to be (CSS display size x devicePixelRatio).
        // Without this, a canvas whose CSS size is stretched to fill a large,
        // high-DPI window rasterizes at (cssSize x dpr)^2 pixels every frame -
        // on a 2x-retina display filling a ~1500x1000 window that's ~6M pixels
        // per canvas per frame, versus ~540K at the fixed pre-retina size - an
        // ~11x increase that visibly drops frame rate. Sprites themselves are
        // only authored at SPRITE_SCALE (2x) anyway, so capping render scale to
        // match loses no real detail.
        const MAX_CANVAS_RENDER_SCALE = SPRITE_SCALE;

        // Calculate grid dimensions
        const gridWidth = GRID_COLS * TILE_SIZE;
        const gridHeight = GRID_ROWS * TILE_SIZE;
        const offsetX = 0;
        const offsetY = 0;

        // Lighting system
        const beam_length = 100; // Light beam length in pixels
        const full_lit_dist = TILE_SIZE * 0.10; // 10% of grid square width
        const not_lit_dist = TILE_SIZE * 0.5; // 50% of grid square width
        const connector_lit_width = 2; // Check connector stroke every 2px
        let persistentLitPoints = []; // Computed once at level start in run mode

        // Tile types
        const TILE_TYPES = [
            {
                id: 'curved_track_br',
                name: 'Curved Track (BR)',
                type: 'track',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    ctx.strokeStyle = '#004C43';
                    ctx.lineWidth = 2;

                    const center = size / 2;
                    const innerRadius = center - 5;
                    const outerRadius = center + 5;

                    // Center point at bottom-right corner (connects left to top)
                    const centerX = x + size;
                    const centerY = y + size;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, innerRadius, Math.PI, Math.PI * 3 / 2);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, outerRadius, Math.PI, Math.PI * 3 / 2);
                    ctx.stroke();
                }
            },
            {
                id: 'curved_track_bl',
                name: 'Curved Track (BL)',
                type: 'track',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    ctx.strokeStyle = '#004C43';
                    ctx.lineWidth = 2;

                    const center = size / 2;
                    const innerRadius = center - 5;
                    const outerRadius = center + 5;

                    // Center point at bottom-left corner (connects right to top)
                    const centerX = x;
                    const centerY = y + size;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, innerRadius, -Math.PI / 2, 0);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, outerRadius, -Math.PI / 2, 0);
                    ctx.stroke();
                }
            },
            {
                id: 'curved_track_tr',
                name: 'Curved Track (TR)',
                type: 'track',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    ctx.strokeStyle = '#004C43';
                    ctx.lineWidth = 2;

                    const center = size / 2;
                    const innerRadius = center - 5;
                    const outerRadius = center + 5;

                    // Center point at top-right corner (connects left to bottom)
                    const centerX = x + size;
                    const centerY = y;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, innerRadius, Math.PI / 2, Math.PI);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, outerRadius, Math.PI / 2, Math.PI);
                    ctx.stroke();
                }
            },
            {
                id: 'curved_track_tl',
                name: 'Curved Track (TL)',
                type: 'track',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    ctx.strokeStyle = '#004C43';
                    ctx.lineWidth = 2;

                    const center = size / 2;
                    const innerRadius = center - 5;
                    const outerRadius = center + 5;

                    // Center point at top-left corner (connects right to bottom)
                    const centerX = x;
                    const centerY = y;

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, innerRadius, 0, Math.PI / 2);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(centerX, centerY, outerRadius, 0, Math.PI / 2);
                    ctx.stroke();

            },
            {
                id: 'horizontal_track',
                name: 'Horizontal Track',
                type: 'track',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    ctx.strokeStyle = '#004C43';
                    ctx.lineWidth = 2;

                    const centerY = y + size / 2;
                    const line1Y = centerY - 5;
                    const line2Y = centerY + 5;

                    ctx.beginPath();
                    ctx.moveTo(x, line1Y);
                    ctx.lineTo(x + size, line1Y);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(x, line2Y);
                    ctx.lineTo(x + size, line2Y);
                    ctx.stroke();
                }
            },
            {
                id: 'vertical_track',
                name: 'Vertical Track',
                type: 'track',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    ctx.strokeStyle = '#004C43';
                    ctx.lineWidth = 2;

                    const centerX = x + size / 2;
                    const line1X = centerX - 5;
                    const line2X = centerX + 5;

                    ctx.beginPath();
                    ctx.moveTo(line1X, y);
                    ctx.lineTo(line1X, y + size);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(line2X, y);
                    ctx.lineTo(line2X, y + size);
                    ctx.stroke();
                }
            },
            {
                id: 'cross_track',
                name: 'Cross Track',
                type: 'track',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    ctx.strokeStyle = '#004C43';
                    ctx.lineWidth = 2;

                    const centerX = x + size / 2;
                    const centerY = y + size / 2;
                    const line1X = centerX - 5;
                    const line2X = centerX + 5;
                    const line1Y = centerY - 5;
                    const line2Y = centerY + 5;

                    // Horizontal lines
                    ctx.beginPath();
                    ctx.moveTo(x, line1Y);
                    ctx.lineTo(x + size, line1Y);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(x, line2Y);
                    ctx.lineTo(x + size, line2Y);
                    ctx.stroke();

                    // Vertical lines
                    ctx.beginPath();
                    ctx.moveTo(line1X, y);
                    ctx.lineTo(line1X, y + size);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(line2X, y);
                    ctx.lineTo(line2X, y + size);
                    ctx.stroke();
                }
            },
            {
                id: 'mm_light_pole',
                name: 'Light Pole (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null, // Will be loaded
                render: (ctx, x, y, size) => {

                }
            },
            {
                id: 'mm_light_pole_dead',
                name: 'Light Pole Dead (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null, // Will be loaded
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'mm_light_pole_dead');
                    if (tileType && tileType.image && tileType.image.complete) {
                        ctx.drawImage(tileType.image, x, y, size, size);
                    }
                }
            },
            {
                id: 'mm_light',
                name: 'Light (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null, // Will be loaded
                render: (ctx, x, y, size, drawTopOnly = false) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'mm_light');
                    if (tileType && tileType.image && tileType.image.complete) {
                        if (drawTopOnly) {
                            // Draw only the top 59x59 (logical) portion
                            ctx.drawImage(
                                tileType.image,
                                0, 0, 59 * SPRITE_SCALE, 59 * SPRITE_SCALE,  // Source: top 59x59 of the image
                                x, y, size, size  // Destination
                            );
                        } else {
                            // Draw the full image (which may be larger than 59x59)
                            const imgWidth = tileType.image.width / SPRITE_SCALE;
                            const imgHeight = tileType.image.height / SPRITE_SCALE;
                            // Center the image horizontally, align to top
                            const drawX = x + (size - imgWidth) / 2;
                            const drawY = y;
                            ctx.drawImage(tileType.image, drawX, drawY, imgWidth, imgHeight);
                        }
                    }
                }
            },
            {
                id: 'mm_light_dead',
                name: 'Light Dead (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null, // Will be loaded
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'mm_light_dead');
                    if (tileType && tileType.image && tileType.image.complete) {
                        const imgWidth = tileType.image.width / SPRITE_SCALE;
                        const imgHeight = tileType.image.height / SPRITE_SCALE;
                        const drawX = x + (size - imgWidth) / 2;
                        const drawY = y;
                        ctx.drawImage(tileType.image, drawX, drawY, imgWidth, imgHeight);
                    }
                }
            },
            {
                id: 'mm_light_flash',
                name: 'Light Flash (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null, // Will be loaded
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'mm_light_flash');
                    if (tileType && tileType.image && tileType.image.complete) {
                        const imgWidth = tileType.image.width / SPRITE_SCALE;
                        const imgHeight = tileType.image.height / SPRITE_SCALE;
                        const drawX = x + (size - imgWidth) / 2;
                        const drawY = y;
                        ctx.drawImage(tileType.image, drawX, drawY, imgWidth, imgHeight);
                    }
                }
            },
            {
                id: 'lit_rails_straight',
                name: 'Lit Rails Straight (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null,
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'lit_rails_straight');
                    if (tileType && tileType.image && tileType.image.complete) {
                        ctx.drawImage(tileType.image, x, y, size, size);
                    }
                }
            },
            {
                id: 'lit_rails_curve',
                name: 'Lit Rails Curve (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null,
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'lit_rails_curve');
                    if (tileType && tileType.image && tileType.image.complete) {
                        ctx.drawImage(tileType.image, x, y, size, size);
                    }
                }
            },
            {
                id: 'mm_stop_background',
                name: 'Stop Background (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null,
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'mm_stop_background');
                    if (tileType && tileType.image && tileType.image.complete) {
                        ctx.drawImage(tileType.image, x, y, size, size);
                    }
                }
            },
            {
                id: 'mm_stop_light1',
                name: 'Stop Light 1 (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null,
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'mm_stop_light1');
                    if (tileType && tileType.image && tileType.image.complete) {
                        ctx.drawImage(tileType.image, x, y, size, size);
                    }
                }
            },
            {
                id: 'mm_stop_light2',
                name: 'Stop Light 2 (Sprite)',
                type: 'custom',
                layer: 'tracks',
                image: null,
                render: (ctx, x, y, size) => {
                    const tileType = TILE_TYPES.find(t => t.id === 'mm_stop_light2');
                    if (tileType && tileType.image && tileType.image.complete) {
                        ctx.drawImage(tileType.image, x, y, size, size);
                    }
                }
            },
            {
                id: 'light_pole',
                name: 'Light Pole',
                type: 'custom',
                layer: 'tracks',
                render: (ctx, x, y, size, isInPalette = false, gridX = null, gridY = null) => {
                    // Draw mm_light_pole sprite, then full mm_light (rotated and flipped by direction)
                    // Always render the same way in all modes (authoring grid, inspector, run mode)

                    // Get the sprite tile types
                    const poleType = TILE_TYPES.find(t => t.id === 'mm_light_pole');
                    const deadPoleType = TILE_TYPES.find(t => t.id === 'mm_light_pole_dead');
                    const lightType = TILE_TYPES.find(t => t.id === 'mm_light');
                    const deadLightType = TILE_TYPES.find(t => t.id === 'mm_light_dead');

                    // Burn out animation flickers the pole and light together
                    // between their normal and dead sprites, ending permanently
                    // on the dead pair. See updateLightBurnout().
                    const burnoutState = (gridX !== null && gridY !== null && window.lightBurnoutState)
                        ? window.lightBurnoutState[`${gridX},${gridY}`]
                        : null;
                    const showDead = burnoutState ? !burnoutState.isOn : false;
                    const activePoleType = (showDead && deadPoleType) ? deadPoleType : poleType;
                    const activeLightType = (showDead && deadLightType) ? deadLightType : lightType;

                    // Draw the pole sprite first
                    if (activePoleType && activePoleType.image && activePoleType.image.complete) {
                        ctx.drawImage(activePoleType.image, x, y, size, size);
                    }

                    // One-shot flash the moment the flicker starts, in the same
                    // place as the pole/light sprites, behind the sparks.
                    const flashType = TILE_TYPES.find(t => t.id === 'mm_light_flash');
                    if (burnoutState && burnoutState.flashAlpha > 0 && flashType && flashType.image && flashType.image.complete) {
                        const flashImgWidth = flashType.image.width / SPRITE_SCALE;
                        const flashImgHeight = flashType.image.height / SPRITE_SCALE;
                        // Centered on the same point the sparks spawn from.
                        const flashOrigin = (gridX !== null && gridY !== null)
                            ? computeLightSparkOrigin(gridX, gridY)
                            : { x: x + size / 2, y: y + flashImgHeight / 2 };
                        const flashCenterX = flashOrigin.x;
                        const flashCenterY = flashOrigin.y;
                        const flashDrawWidth = flashImgWidth * 2;
                        const flashDrawHeight = flashImgHeight * 2;
                        const flashDrawX = flashCenterX - flashDrawWidth / 2;
                        const flashDrawY = flashCenterY - flashDrawHeight / 2;
                        ctx.save();
                        ctx.globalAlpha = burnoutState.flashAlpha;
                        ctx.drawImage(flashType.image, flashDrawX, flashDrawY, flashDrawWidth, flashDrawHeight);
                        ctx.restore();
                    }

                    // Burn out sparks sit just beneath the flickering light sprite,
                    // on top of the pole. Positions are precomputed in world space
                    // by updateLightBurnout()/computeLightSparkOrigin().
                    if (burnoutState && burnoutState.sparks) {
                        ctx.save();
                        ctx.fillStyle = '#ffffff';
                        burnoutState.sparks.forEach(spark => {
                            if (spark.alpha <= 0) return;
                            ctx.globalAlpha = spark.alpha;
                            ctx.beginPath();
                            ctx.arc(spark.x, spark.y, LIGHT_SPARK_RADIUS, 0, Math.PI * 2);
                            ctx.fill();
                        });
                        ctx.restore();
                    }

                    // Get rotation angle and flip from direction property
                    const direction = (gridX !== null && gridY !== null) ? getLightPoleDirectionByPosition(gridX, gridY) : 'bottom';
                    const angle = lightPoleDirectionToAngle(direction);

                    // Determine if we need to flip horizontally
                    // Only 'top' and 'bottom' don't need flipping
                    const needsFlip = direction !== 'top' && direction !== 'bottom';

                    // Draw the light sprite on top with rotation and flipping
                    if (activeLightType && activeLightType.image && activeLightType.image.complete) {
                        ctx.save();

                        // Set rotation and flip center at the tile center
                        const centerX = x + size / 2;
                        const centerY = y + size / 2;
                        ctx.translate(centerX, centerY);

                        // Apply horizontal flip if needed (before rotation)
                        if (needsFlip) {
                            ctx.scale(-1, 1);
                        }

                        ctx.rotate(angle);
                        ctx.translate(-centerX, -centerY);

                        // Always draw the full image (same in all modes)
                        const imgWidth = activeLightType.image.width / SPRITE_SCALE;
                        const imgHeight = activeLightType.image.height / SPRITE_SCALE;
                        // Center the image horizontally, align to top
                        const drawX = x + (size - imgWidth) / 2;
                        const drawY = y;
                        ctx.drawImage(activeLightType.image, drawX, drawY, imgWidth, imgHeight);

                        ctx.restore();
                    }
                }
            },
            {
                id: 'stop',
                name: 'Stop',
                type: 'custom',
                layer: 'tracks',
                render: (ctx, x, y, size) => {
                    const bgType = TILE_TYPES.find(t => t.id === 'mm_stop_background');
                    const light1Type = TILE_TYPES.find(t => t.id === 'mm_stop_light1');
                    const light2Type = TILE_TYPES.find(t => t.id === 'mm_stop_light2');

                    // Always draw background
                    if (bgType && bgType.image && bgType.image.complete) {
                        ctx.drawImage(bgType.image, x, y, size, size);
                    }

                    // In run mode gameplay state, animate between light1 and light2
                    if (isRunMode && runModeState === 'gameplay') {
                        // Cycle duration: 120 frames at 60fps = 2 seconds per cycle
                        const cycleDuration = 120;
                        const cycleProgress = (stopLightAnimationTime % cycleDuration) / cycleDuration;

                        // Fade from light1 to light2 and back: 0->0.5 = light1 fades out, light2 fades in
                        // 0.5->1 = light2 fades out, light1 fades in
                        let light1Alpha, light2Alpha;
                        if (cycleProgress < 0.5) {
                            // First half: fade from light1 to light2
                            const t = cycleProgress * 2; // 0 to 1
                            light1Alpha = 1 - t;
                            light2Alpha = t;
                        } else {
                            // Second half: fade from light2 to light1
                            const t = (cycleProgress - 0.5) * 2; // 0 to 1
                            light1Alpha = t;
                            light2Alpha = 1 - t;
                        }

                        ctx.save();
                        if (light1Type && light1Type.image && light1Type.image.complete) {
                            ctx.globalAlpha = light1Alpha;
                            ctx.drawImage(light1Type.image, x, y, size, size);
                        }
                        if (light2Type && light2Type.image && light2Type.image.complete) {
                            ctx.globalAlpha = light2Alpha;
                            ctx.drawImage(light2Type.image, x, y, size, size);
                        }
                        ctx.restore();
                    } else {
                        // In edit mode or animation state, just show light1
                        if (light1Type && light1Type.image && light1Type.image.complete) {
                            ctx.drawImage(light1Type.image, x, y, size, size);
                        }
                    }
                }
            },
            {
                id: 'train',
                name: 'Train',
                type: 'custom',
                layer: 'objects',
                render: (ctx, x, y, size) => {
                    // Train is 49x49px centered in the tile
                    const trainSize = 49;
                    const offset = (size - trainSize) / 2;
                    const trainX = x + offset;
                    const trainY = y + offset;
                    const cornerRadius = 5;

                    ctx.fillStyle = '#000000';
                    ctx.strokeStyle = '#252525';
                    ctx.lineWidth = 2;

                    // Draw rounded rectangle
                    ctx.beginPath();
                    ctx.moveTo(trainX + cornerRadius, trainY);
                    ctx.lineTo(trainX + trainSize - cornerRadius, trainY);
                    ctx.arcTo(trainX + trainSize, trainY, trainX + trainSize, trainY + cornerRadius, cornerRadius);
                    ctx.lineTo(trainX + trainSize, trainY + trainSize - cornerRadius);
                    ctx.arcTo(trainX + trainSize, trainY + trainSize, trainX + trainSize - cornerRadius, trainY + trainSize, cornerRadius);
                    ctx.lineTo(trainX + cornerRadius, trainY + trainSize);
                    ctx.arcTo(trainX, trainY + trainSize, trainX, trainY + trainSize - cornerRadius, cornerRadius);
                    ctx.lineTo(trainX, trainY + cornerRadius);
                    ctx.arcTo(trainX, trainY, trainX + cornerRadius, trainY, cornerRadius);
                    ctx.closePath();

                    ctx.fill();
                    ctx.stroke();
                }
            },
            {
                id: 'drag_lines_car',
                name: 'Drag Lines',
                type: 'custom',
                layer: 'objects',
                render: (ctx, x, y, size) => {
                    // Draw three horizontal yellow lines centered in the car
                    const trainSize = 49;
                    const offset = (size - trainSize) / 2;
                    const centerX = x + size / 2;
                    const centerY = y + size / 2;

                    const lineWidth = 24;
                    const lineHeight = 2;
                    const gap = 4;

                    ctx.fillStyle = '#004C43';

                    // Draw three lines
                    for (let i = -1; i <= 1; i++) {
                        const lineY = centerY + i * (lineHeight + gap) - lineHeight / 2;
                        ctx.fillRect(centerX - lineWidth / 2, lineY, lineWidth, lineHeight);
                    }
                }
            }
        ];

        // Grid tiles - separate arrays for each layer
        let trackTiles = [];
        let objectTiles = [];

        // Drag state
        let isDragging = false;
        let draggedTile = null;
        let dragPixelX = 0;
        let dragPixelY = 0;
        let hoveredTile = null;

        // Selection state
        let selectedTile = null;
        let currentInspectorTab = 'basics';

        // The tile the inspector was built for. Fields write back to this rather
        // than to the live selection.
        let inspectorTile = null;

        // An inspector input only commits its value on blur, and the browser
        // blurs it *after* the click that selected another tile — by which point
        // both the selection and the rebuilt inspector point at the new tile, so
        // the edit landed on the wrong train. Flushing the field before the
        // selection changes makes it commit against the tile it was editing.
        function commitPendingInspectorEdits() {
            const el = document.activeElement;
            if (el && el.tagName === 'INPUT' && el.closest && el.closest('#inspectorContent')) {
                el.blur();
            }
        }

        // Train properties - store per train ID
        let trainProperties = {}; // Key: unique train ID
        let nextTrainId = 1;

        // Level management
        let levels = {};
        let levelOrder = []; // Array to track order of level names
        let currentLevelName = 'Untitled Level';
        let autoScrollSpeed = 0;
        let autoScrollActive = false;
        let scrollAnimationFrame = null;

        // Check if in run mode
        const urlParams = new URLSearchParams(window.location.search);
        let isRunMode = false; // standalone export: flips true once a level is picked
        const isLevelSelectMode = true; // standalone export: always start on the level-select screen

        // Fades from 1 to 0 in sync with the big train's entrance (not real
        // time): tracks how far bigTrainX has progressed from its off-screen
        // starting position to screen center, so it reaches 0 exactly when
        // the train arrives at center. "Dark" overlay elements (currently
        // just mm_level_select_dark.png) use this as their alpha, and are
        // removed once it reaches 0.
        let level_select_dark_fade = 1;

        function updateLevelSelectDarkFade() {
            const trainWidth = ((bigTrainDarkSprite && bigTrainDarkSprite.naturalWidth) || 906) * BIG_TRAIN_SPRITE_SCALE;
            const startX = -trainWidth;
            const centerX = (LEVEL_SELECT_IMAGE_WIDTH - trainWidth) / 2;
            const enterProgress = Math.max(0, Math.min(1, (bigTrainX - startX) / (centerX - startX)));
            level_select_dark_fade = 1 - enterProgress;

            document.querySelectorAll('.level-select-dark').forEach(el => {
                if (level_select_dark_fade <= 0) {
                    el.remove();
                } else {
                    el.style.opacity = level_select_dark_fade;
                }
            });
        }

        // --- Level select background rails ----------------------------------
        // 3 horizontal rail lines spanning the screen, re-randomized every time
        // the level select screen is opened. Drawn behind everything except the
        // black background.
        const LEVEL_SELECT_RAILS_Y_MIN = 137.9;
        const LEVEL_SELECT_RAILS_Y_MAX = 424.9;
        const LEVEL_SELECT_RAIL_COUNT = 3;
        let levelSelectRailYs = [];

        function randomizeLevelSelectRails() {
            // Keep rails at least a train car's width apart so trains on
            // different tracks never visually overlap.
            const ys = [];
            let attempts = 0;
            while (ys.length < LEVEL_SELECT_RAIL_COUNT && attempts < 1000) {
                attempts++;
                const candidate = LEVEL_SELECT_RAILS_Y_MIN + Math.random() * (LEVEL_SELECT_RAILS_Y_MAX - LEVEL_SELECT_RAILS_Y_MIN);
                if (ys.every(y => Math.abs(y - candidate) >= LEVEL_SELECT_CAR_SIZE)) {
                    ys.push(candidate);
                }
            }
            levelSelectRailYs = ys;
        }

        function drawLevelSelectRails() {
            const canvas = document.getElementById('levelSelectRailsCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            // Clear/draw in logical coordinates; the backing store may be larger
            // than LEVEL_SELECT_IMAGE_WIDTH/HEIGHT due to devicePixelRatio scaling.
            ctx.clearRect(0, 0, LEVEL_SELECT_IMAGE_WIDTH, LEVEL_SELECT_IMAGE_HEIGHT);

            ctx.save();
            ctx.translate(0, -settingsCameraY);

            ctx.strokeStyle = '#004C43';
            ctx.lineWidth = 2;

            levelSelectRailYs.forEach(y => {
                ctx.beginPath();
                ctx.moveTo(0, y - 5);
                ctx.lineTo(LEVEL_SELECT_IMAGE_WIDTH, y - 5);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, y + 5);
                ctx.lineTo(LEVEL_SELECT_IMAGE_WIDTH, y + 5);
                ctx.stroke();
            });

            ctx.restore();
        }

        // --- Level select background trains ---------------------------------
        // One train per rail. Each spawns after a random 3-8s wait, enters from
        // a random side with 3-6 cars at a random speed, crosses the screen, and
        // restarts its own timer once it's fully out of sight. Cars are drawn to
        // match run mode exactly: 49x49 rounded squares (radius 5, black fill,
        // #252525 stroke) spaced 59px apart (TILE_SIZE), with a gray connector
        // stroke beneath and a black one on top - see drawAnimatedTrains().
        const LEVEL_SELECT_CAR_SIZE = 49;
        const LEVEL_SELECT_CAR_SPACING = 59;
        const LEVEL_SELECT_CAR_RADIUS = 5;
        let levelSelectTrains = [];
        let levelSelectTrainTimers = [];

        function levelSelectTrainEdges(train) {
            const left = train.x - LEVEL_SELECT_CAR_SIZE / 2;
            const right = train.x + (train.numCars - 1) * LEVEL_SELECT_CAR_SPACING + LEVEL_SELECT_CAR_SIZE / 2;
            return { left, right };
        }

        function scheduleLevelSelectTrainSpawn(railIndex) {
            levelSelectTrainTimers[railIndex] = Math.random() * 4 * 1000; // 0-4s, in ms
        }

        function spawnLevelSelectTrain(railIndex) {
            const numCars = 3 + Math.floor(Math.random() * 6); // 3-8
            const speed = 1 + Math.random() * 9; // 1-10
            const fromLeft = Math.random() < 0.5;
            const direction = fromLeft ? 1 : -1;
            const x = fromLeft
                ? -(numCars - 1) * LEVEL_SELECT_CAR_SPACING - LEVEL_SELECT_CAR_SIZE / 2
                : LEVEL_SELECT_IMAGE_WIDTH + LEVEL_SELECT_CAR_SIZE / 2;
            return { railIndex, numCars, speed, direction, x };
        }

        function initLevelSelectTrains() {
            levelSelectTrains = new Array(LEVEL_SELECT_RAIL_COUNT).fill(null);
            levelSelectTrainTimers = new Array(LEVEL_SELECT_RAIL_COUNT).fill(0);
            for (let i = 0; i < LEVEL_SELECT_RAIL_COUNT; i++) scheduleLevelSelectTrainSpawn(i);
        }

        function updateLevelSelectTrains(elapsedMs, frameDt) {
            for (let i = 0; i < LEVEL_SELECT_RAIL_COUNT; i++) {
                const train = levelSelectTrains[i];
                if (train) {
                    train.x += train.direction * train.speed * frameDt;
                    const { left, right } = levelSelectTrainEdges(train);
                    const outOfSight = train.direction === 1 ? left > LEVEL_SELECT_IMAGE_WIDTH : right < 0;
                    if (outOfSight) {
                        levelSelectTrains[i] = null;
                        scheduleLevelSelectTrainSpawn(i);
                    }
                } else {
                    levelSelectTrainTimers[i] -= elapsedMs;
                    if (levelSelectTrainTimers[i] <= 0) {
                        levelSelectTrains[i] = spawnLevelSelectTrain(i);
                    }
                }
            }
        }

        function drawLevelSelectTrains() {
            const canvas = document.getElementById('levelSelectRailsCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.translate(0, -settingsCameraY);

            levelSelectTrains.forEach(train => {
                if (!train) return;
                const y = levelSelectRailYs[train.railIndex];
                const carCenters = [];
                for (let c = 0; c < train.numCars; c++) {
                    carCenters.push(train.x + c * LEVEL_SELECT_CAR_SPACING);
                }
                const firstX = carCenters[0];
                const lastX = carCenters[carCenters.length - 1];

                // Gray connection stroke beneath cars
                if (carCenters.length > 1) {
                    ctx.strokeStyle = '#252525';
                    ctx.lineWidth = 16;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(firstX, y);
                    ctx.lineTo(lastX, y);
                    ctx.stroke();
                }

                // Cars: 49x49 rounded rect, radius 5, black fill, #252525 stroke
                carCenters.forEach(cx => {
                    roundRectPath(ctx, cx - LEVEL_SELECT_CAR_SIZE / 2, y - LEVEL_SELECT_CAR_SIZE / 2, LEVEL_SELECT_CAR_SIZE, LEVEL_SELECT_CAR_SIZE, LEVEL_SELECT_CAR_RADIUS);
                    ctx.fillStyle = '#000000';
                    ctx.fill();
                    ctx.strokeStyle = '#252525';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                });

                // Black connection stroke on top of cars
                if (carCenters.length > 1) {
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 12;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    ctx.moveTo(firstX, y);
                    ctx.lineTo(lastX, y);
                    ctx.stroke();
                }
            });

            ctx.restore();
        }

        // --- Level select big train intro animation --------------------------
        // Plays once, starting immediately when the level select screen
        // opens (concurrently with the dark-overlay fade-in above, not
        // waiting for it to finish): mm_big_train enters from the left,
        // decelerates to a stop at screen center, pauses, then accelerates
        // off the right edge.
        //
        // Layers, bottom to top: mm_big_train_background, door rectangles,
        // mm_big_train_light - all always at full opacity - then
        // mm_big_train_dark on top, the only layer that fades: its alpha is
        // (1 - bigTrainLightAlpha), where bigTrainLightAlpha is 0 while the
        // train's leading edge is still left of BIG_TRAIN_LIGHT_ZERO_RIGHT_EDGE_X,
        // ramps to 1 when centered, and back to 0 once its trailing edge
        // passes BIG_TRAIN_LIGHT_ZERO_LEFT_EDGE_X - so mm_big_train_dark fades
        // OUT to reveal the layers beneath near center, and back IN as the
        // train moves away. No buttons respond to input until the whole
        // intro (fade + train) has finished.
        const BIG_TRAIN_BOTTOM_Y = 522.5;
        const BIG_TRAIN_ENTER_DURATION = 1800; // ms, enter + decelerate to a stop
        // While paused at center, each door pair opens (narrows outward from
        // its middle edge). The instant a door is open, the currently-"on"
        // math settings buttons hidden behind it (see BIG_TRAIN_BUTTON_*
        // below, split as evenly as possible across the 3 doors) walk out to
        // their real slot in the row in a straight line, every button at the
        // same constant speed - so a button with farther to go simply takes
        // longer, rather than all buttons arriving together. An "off"
        // button isn't part of this at all - it's already sitting in its
        // row slot from the very start. Doors only
        // start closing once every button has actually arrived, so the
        // hold/pause durations are computed dynamically
        // (bigTrainDoorHoldDuration/bigTrainPauseDuration below) from the
        // real door assignment + distances once they're known, not fixed
        // constants.
        const BIG_TRAIN_DOOR_OPEN_DURATION = 900; // ms
        const BIG_TRAIN_BUTTON_WALK_SPEED = 0.28; // px/ms, constant for every button
        const BIG_TRAIN_BUTTON_WALK_STAGGER_MAX = 400; // ms, random extra delay before a button starts walking
        // Repeated hops over the course of the walk, every hop identical:
        // each rises 20px above the path (accelerating then decelerating
        // into the peak), then drops back to the path (accelerating out of
        // the peak - faster than the rise - then decelerating to a stop
        // exactly on the path). A button travels the same number of px per
        // hop as any other (BIG_TRAIN_BUTTON_HOP_STRIDE), so one going
        // farther simply makes proportionally more of them.
        const BIG_TRAIN_BUTTON_HOP_HEIGHT = 10; // px above the straight-line path
        const BIG_TRAIN_BUTTON_HOP_UP_FRACTION = 0.6; // share of each hop spent rising (vs falling, which is quicker)
        const BIG_TRAIN_BUTTON_HOP_STRIDE = 40; // px of travel per hop - ~10 hops for the farthest-traveling button
        // Each button's door-side position (where it starts, for the intro;
        // where it ends up, for the shuffle) is jittered a little so the 6
        // sharing a door don't all sit exactly on top of each other -
        // centered on the door's own center point.
        const BIG_TRAIN_DOOR_JITTER_X_SPAN = 50; // px, total width of the random x range
        const BIG_TRAIN_DOOR_JITTER_Y_MIN = -13; // px, upward extent of the random y range
        const BIG_TRAIN_DOOR_JITTER_Y_MAX = 13; // px, downward extent
        // The 6 buttons sharing a door are spread across a 3x2 grid of cells
        // (one button per cell, cell order shuffled) rather than each
        // picking a fully independent random x/y - guarantees all 3 columns
        // and both rows are actually used instead of leaving pure chance to
        // possibly cluster everyone in a similar x or y range.
        const BIG_TRAIN_DOOR_JITTER_GRID_COLS = 3;
        const BIG_TRAIN_DOOR_JITTER_GRID_ROWS = 2;
        const BIG_TRAIN_DOOR_CLOSE_DURATION = 900; // ms
        const BIG_TRAIN_EXIT_DURATION = 1800; // ms, accelerate off the right edge
        const BIG_TRAIN_LIGHT_ZERO_RIGHT_EDGE_X = 398; // light alpha = 0 once right edge is left of this
        const BIG_TRAIN_LIGHT_ZERO_LEFT_EDGE_X = 502.3; // light alpha = 0 once left edge is right of this
        const BIG_TRAIN_SPRITE_SCALE = 0.5; // sprite assets are @2x
        // Centers of the 3 mm_big_train_background copies (and their matching
        // door pairs), as offsets from the scaled-down train sprite's
        // top-left corner (already in logical/post-scale pixels).
        const BIG_TRAIN_BACKGROUND_OFFSETS = [
            { x: 70.4, y: 68.5 },
            { x: 226.5, y: 68.5 },
            { x: 382.6, y: 68.5 }
        ];

        let bigTrainDarkSprite = null;
        let bigTrainLightSprite = null;
        let bigTrainBackgroundSprite = null;
        let bigTrainAnimStartTimestamp = null; // set once the dark fade-in has finished
        let bigTrainAnimDone = false;
        let bigTrainX = 0; // current left-edge x of the sprite, logical coords
        let bigTrainLightAlpha = 0;
        let bigTrainDoorOpenAmount = 0; // 0 = closed, 1 = fully open
        let bigTrainPauseElapsed = 0; // ms since the pause phase began, for the button walk
        let bigTrainButtonsAssigned = false; // whether the 18 buttons have been split into 3 door groups
        let bigTrainDoorHoldDuration = 0; // ms, computed once assigned: how long until every button has arrived
        let bigTrainPauseDuration = BIG_TRAIN_DOOR_OPEN_DURATION + BIG_TRAIN_DOOR_CLOSE_DURATION; // placeholder until the above is known
        let levelSelectInputLocked = true; // cleared once fade-in + big train intro finish

        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInCubic(t) { return t * t * t; }

        // Assigns each of a door's 6 buttons a jittered (x, y) offset from
        // the door's center, one per cell of a shuffled 3x2 grid spanning
        // BIG_TRAIN_DOOR_JITTER_X_SPAN / Y_MIN..Y_MAX - guarantees all 3
        // x-columns and both y-rows are used, then adds a small random
        // offset within each cell so it doesn't look like a rigid grid.
        function assignDoorJitter(groupButtons, xField, yField) {
            const cols = BIG_TRAIN_DOOR_JITTER_GRID_COLS;
            const rows = BIG_TRAIN_DOOR_JITTER_GRID_ROWS;
            const cellW = BIG_TRAIN_DOOR_JITTER_X_SPAN / cols;
            const cellH = (BIG_TRAIN_DOOR_JITTER_Y_MAX - BIG_TRAIN_DOOR_JITTER_Y_MIN) / rows;
            const cells = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    cells.push({
                        xMin: -BIG_TRAIN_DOOR_JITTER_X_SPAN / 2 + c * cellW,
                        xMax: -BIG_TRAIN_DOOR_JITTER_X_SPAN / 2 + (c + 1) * cellW,
                        yMin: BIG_TRAIN_DOOR_JITTER_Y_MIN + r * cellH,
                        yMax: BIG_TRAIN_DOOR_JITTER_Y_MIN + (r + 1) * cellH
                    });
                }
            }
            shuffleArray(cells);
            groupButtons.forEach((btn, i) => {
                const cell = cells[i % cells.length];
                btn[xField] = cell.xMin + Math.random() * (cell.xMax - cell.xMin);
                btn[yField] = cell.yMin + Math.random() * (cell.yMax - cell.yMin);
            });
        }

        // Randomly splits the currently-"on" math settings buttons as evenly
        // as possible across the 3 doors, each with its own small random
        // extra delay before it starts walking out (see
        // BIG_TRAIN_BUTTON_WALK_STAGGER_MAX). An "off" button isn't part of
        // this at all - it's already sitting in its row slot
        // (bigTrainArrived is initialized to true for it) and stays there
        // for the whole intro.
        function assignBigTrainButtonGroups() {
            const onButtons = shuffleArray(mathSettingsButtons.filter(btn => btn.on));
            onButtons.forEach((btn, i) => {
                btn.bigTrainDoorIndex = i % 3;
                btn.bigTrainWalkDelay = Math.random() * BIG_TRAIN_BUTTON_WALK_STAGGER_MAX;
                btn.bigTrainArrived = false;
            });
            for (let door = 0; door < 3; door++) {
                assignDoorJitter(onButtons.filter(btn => btn.bigTrainDoorIndex === door), 'bigTrainDoorJitterX', 'bigTrainDoorJitterY');
            }
        }

        // Top of the train sprite, in the same logical coords as bigTrainX -
        // usable anywhere (not just inside drawBigTrain) to place a walking
        // button relative to the train.
        function getBigTrainTopY() {
            const h = ((bigTrainDarkSprite && bigTrainDarkSprite.naturalHeight) || 214) * BIG_TRAIN_SPRITE_SCALE;
            return BIG_TRAIN_BOTTOM_Y - h;
        }

        // Every button travels in a straight line at the same constant speed
        // (BIG_TRAIN_BUTTON_WALK_SPEED), so a button with farther to go
        // simply takes longer, rather than all buttons arriving together.
        function getBigTrainButtonTravel(btn, trainX, trainY) {
            const offset = BIG_TRAIN_BACKGROUND_OFFSETS[btn.bigTrainDoorIndex];
            const startX = trainX + offset.x + btn.bigTrainDoorJitterX;
            const startY = trainY + offset.y + btn.bigTrainDoorJitterY;
            const destX = mathSettingsSlotX(btn.slot);
            const destY = MATH_SETTINGS_Y;
            const distance = Math.hypot(destX - startX, destY - startY);
            return {
                startX, startY, destX, destY, distance,
                walkDuration: distance / BIG_TRAIN_BUTTON_WALK_SPEED,
                hopCount: Math.max(1, Math.round(distance / BIG_TRAIN_BUTTON_HOP_STRIDE))
            };
        }

        // The longest it will take any assigned button to finish walking
        // (including its random start stagger) - doors stay open at least
        // this long after fully opening.
        function computeBigTrainDoorHoldDuration(trainX, trainY) {
            let maxFinish = 0;
            mathSettingsButtons.forEach(btn => {
                if (btn.bigTrainDoorIndex < 0) return;
                const travel = getBigTrainButtonTravel(btn, trainX, trainY);
                maxFinish = Math.max(maxFinish, btn.bigTrainWalkDelay + travel.walkDuration);
            });
            return maxFinish;
        }

        // Vertical offset (negative = up) of ONE hop at its own local
        // progress cycleT (0-1): rises to -BIG_TRAIN_BUTTON_HOP_HEIGHT over
        // the first BIG_TRAIN_BUTTON_HOP_UP_FRACTION share (ease-in-out:
        // accelerate up, decelerate into the peak), then falls back to 0
        // over the remaining, shorter share (ease-in-out again, so it
        // accelerates out of the peak - faster than the rise, since it has
        // less time to cover the same distance - then decelerates to a stop
        // exactly on the path).
        function getBigTrainButtonHopOffset(cycleT) {
            const upFraction = BIG_TRAIN_BUTTON_HOP_UP_FRACTION;
            if (cycleT < upFraction) {
                return -BIG_TRAIN_BUTTON_HOP_HEIGHT * easeInOutCubic(cycleT / upFraction);
            }
            const downFraction = 1 - upFraction;
            const downT = (cycleT - upFraction) / downFraction;
            return -BIG_TRAIN_BUTTON_HOP_HEIGHT * (1 - easeInOutCubic(downT));
        }

        // Current position of a not-yet-arrived button: starts clustered at
        // the center of its assigned door (hidden behind it until the door
        // opens), then moves in a straight line to its real slot, hopping
        // identically (same height/shape) hopCount times along the way - a
        // button traveling farther simply repeats the same hop more times.
        function getBigTrainButtonWalkPosition(btn, pauseElapsed, trainX, trainY) {
            const travel = getBigTrainButtonTravel(btn, trainX, trainY);

            const walkElapsed = pauseElapsed - BIG_TRAIN_DOOR_OPEN_DURATION - btn.bigTrainWalkDelay;
            const t = Math.max(0, Math.min(1, walkElapsed / travel.walkDuration));
            const cycleT = t >= 1 ? 0 : (t * travel.hopCount) % 1;

            return {
                x: travel.startX + (travel.destX - travel.startX) * t,
                y: travel.startY + (travel.destY - travel.startY) * t + getBigTrainButtonHopOffset(cycleT)
            };
        }

        // Marks any button that has reached its destination as arrived, so
        // drawMathSettingsButtons() picks it up at its resting slot and the
        // big-train canvas stops drawing it as a walker.
        function updateBigTrainButtonWalk(pauseElapsed, trainX, trainY) {
            mathSettingsButtons.forEach(btn => {
                if (btn.bigTrainDoorIndex < 0 || btn.bigTrainArrived) return;
                const travel = getBigTrainButtonTravel(btn, trainX, trainY);
                const walkElapsed = pauseElapsed - BIG_TRAIN_DOOR_OPEN_DURATION - btn.bigTrainWalkDelay;
                if (walkElapsed >= travel.walkDuration) {
                    btn.bigTrainArrived = true;
                }
            });
        }

        function updateBigTrainAnim(timestamp) {
            if (bigTrainAnimDone) return;

            if (bigTrainAnimStartTimestamp === null) bigTrainAnimStartTimestamp = timestamp;
            const elapsed = timestamp - bigTrainAnimStartTimestamp;

            const trainWidth = ((bigTrainDarkSprite && bigTrainDarkSprite.naturalWidth) || 906) * BIG_TRAIN_SPRITE_SCALE;
            const startX = -trainWidth;
            const centerX = (LEVEL_SELECT_IMAGE_WIDTH - trainWidth) / 2;
            const endX = LEVEL_SELECT_IMAGE_WIDTH;

            if (elapsed < BIG_TRAIN_ENTER_DURATION) {
                const t = easeOutCubic(elapsed / BIG_TRAIN_ENTER_DURATION);
                bigTrainX = startX + (centerX - startX) * t;
                bigTrainDoorOpenAmount = 0;
            } else if (elapsed < BIG_TRAIN_ENTER_DURATION + bigTrainPauseDuration) {
                bigTrainX = centerX;
                const pauseElapsed = elapsed - BIG_TRAIN_ENTER_DURATION;
                bigTrainPauseElapsed = pauseElapsed;
                const trainTopY = getBigTrainTopY();

                if (!bigTrainButtonsAssigned) {
                    assignBigTrainButtonGroups();
                    bigTrainButtonsAssigned = true;
                    bigTrainDoorHoldDuration = computeBigTrainDoorHoldDuration(centerX, trainTopY);
                    bigTrainPauseDuration = BIG_TRAIN_DOOR_OPEN_DURATION + bigTrainDoorHoldDuration + BIG_TRAIN_DOOR_CLOSE_DURATION;
                }
                updateBigTrainButtonWalk(pauseElapsed, centerX, trainTopY);

                // Buttons become interactable the instant the last one lands
                // - no need to wait for the doors to close or the train to
                // leave.
                if (bigTrainButtonsAssigned && mathSettingsButtons.every(btn => btn.bigTrainDoorIndex < 0 || btn.bigTrainArrived)) {
                    levelSelectInputLocked = false;
                }

                if (pauseElapsed < BIG_TRAIN_DOOR_OPEN_DURATION) {
                    // Opens gaining speed - quadratic rather than cubic so
                    // there's immediate visible motion instead of a near-
                    // stall at the very start.
                    const openT = pauseElapsed / BIG_TRAIN_DOOR_OPEN_DURATION;
                    bigTrainDoorOpenAmount = openT * openT;
                } else if (pauseElapsed < BIG_TRAIN_DOOR_OPEN_DURATION + bigTrainDoorHoldDuration) {
                    bigTrainDoorOpenAmount = 1;
                } else {
                    // Closes slowly losing speed.
                    const closeElapsed = pauseElapsed - BIG_TRAIN_DOOR_OPEN_DURATION - bigTrainDoorHoldDuration;
                    bigTrainDoorOpenAmount = 1 - easeOutCubic(closeElapsed / BIG_TRAIN_DOOR_CLOSE_DURATION);
                }
            } else if (elapsed < BIG_TRAIN_ENTER_DURATION + bigTrainPauseDuration + BIG_TRAIN_EXIT_DURATION) {
                const t = easeInCubic((elapsed - BIG_TRAIN_ENTER_DURATION - bigTrainPauseDuration) / BIG_TRAIN_EXIT_DURATION);
                bigTrainX = centerX + (endX - centerX) * t;
                bigTrainDoorOpenAmount = 0;
            } else {
                bigTrainX = endX;
                bigTrainDoorOpenAmount = 0;
                bigTrainAnimDone = true;
                levelSelectInputLocked = false;
            }

            bigTrainLightAlpha = computeBigTrainLightAlpha(bigTrainX, trainWidth, centerX);
        }

        // mm_big_train_dark's reveal fade: 0 while the train's leading edge
        // is still left of BIG_TRAIN_LIGHT_ZERO_RIGHT_EDGE_X, ramping to 1
        // when centered, back to 0 once its trailing edge passes
        // BIG_TRAIN_LIGHT_ZERO_LEFT_EDGE_X. Shared by the intro and the
        // button-shuffle, since both use the same train sprite and edges.
        function computeBigTrainLightAlpha(x, trainWidth, centerX) {
            const zeroLeftX = BIG_TRAIN_LIGHT_ZERO_RIGHT_EDGE_X - trainWidth;
            const zeroRightX = BIG_TRAIN_LIGHT_ZERO_LEFT_EDGE_X;
            if (x <= zeroLeftX || x >= zeroRightX) return 0;
            if (x <= centerX) return (x - zeroLeftX) / (centerX - zeroLeftX);
            return 1 - (x - centerX) / (zeroRightX - centerX);
        }

        // --- Level select big train button shuffle ----------------------------
        // Triggered by clicking any level button: identical train/door
        // movement to the intro (enters from the left, decelerates to a
        // stop at center, doors open/hold/close, accelerates off to the
        // right), but the currently-"on" math settings buttons walk the
        // opposite way - OUT of their row slots INTO newly (re-)randomized
        // door groups, vanishing the instant each one arrives ("off" buttons
        // sit out, same as the intro). No need to hide them under a door on
        // the way in, since the doors are already fully open by the time any
        // button starts moving, and they don't close again until every
        // button has vanished. Reuses all the same timing/hop/easing
        // constants and helpers as the intro.
        let bigTrainShuffleActive = false;
        let bigTrainShuffleStartTimestamp = null;
        let bigTrainShuffleX = 0;
        let bigTrainShuffleLightAlpha = 0;
        let bigTrainShuffleDoorOpenAmount = 0;
        let bigTrainShufflePauseElapsed = 0;
        let bigTrainShuffleButtonsAssigned = false;
        let bigTrainShuffleDoorHoldDuration = 0;
        let bigTrainShufflePauseDuration = BIG_TRAIN_DOOR_OPEN_DURATION + BIG_TRAIN_DOOR_CLOSE_DURATION; // placeholder until known

        // Same "off" buttons stay put here too - only currently-"on" buttons
        // get swept into the train and re-grouped behind new doors.
        function assignBigTrainShuffleGroups() {
            const onButtons = shuffleArray(mathSettingsButtons.filter(btn => btn.on));
            onButtons.forEach((btn, i) => {
                btn.shuffleDoorIndex = i % 3;
                btn.shuffleWalkDelay = Math.random() * BIG_TRAIN_BUTTON_WALK_STAGGER_MAX;
                btn.shuffleTucked = false;
            });
            for (let door = 0; door < 3; door++) {
                assignDoorJitter(onButtons.filter(btn => btn.shuffleDoorIndex === door), 'shuffleDoorJitterX', 'shuffleDoorJitterY');
            }
        }

        // Same shape as getBigTrainButtonTravel, but reversed: starts at the
        // button's current row slot, ends at its (newly assigned) door.
        function getBigTrainShuffleButtonTravel(btn, trainX, trainY) {
            const offset = BIG_TRAIN_BACKGROUND_OFFSETS[btn.shuffleDoorIndex];
            const doorX = trainX + offset.x + btn.shuffleDoorJitterX;
            const doorY = trainY + offset.y + btn.shuffleDoorJitterY;
            const slotX = mathSettingsSlotX(btn.slot);
            const slotY = MATH_SETTINGS_Y;
            const distance = Math.hypot(doorX - slotX, doorY - slotY);
            return {
                startX: slotX, startY: slotY, destX: doorX, destY: doorY, distance,
                walkDuration: distance / BIG_TRAIN_BUTTON_WALK_SPEED,
                hopCount: Math.max(1, Math.round(distance / BIG_TRAIN_BUTTON_HOP_STRIDE))
            };
        }

        function computeBigTrainShuffleDoorHoldDuration(trainX, trainY) {
            let maxFinish = 0;
            mathSettingsButtons.forEach(btn => {
                if (btn.shuffleDoorIndex < 0) return;
                const travel = getBigTrainShuffleButtonTravel(btn, trainX, trainY);
                maxFinish = Math.max(maxFinish, btn.shuffleWalkDelay + travel.walkDuration);
            });
            return maxFinish;
        }

        // Current position of a button walking from its slot toward its
        // newly assigned door, hopping along the way exactly like the intro.
        function getBigTrainShuffleButtonPosition(btn, pauseElapsed, trainX, trainY) {
            const travel = getBigTrainShuffleButtonTravel(btn, trainX, trainY);
            const walkElapsed = pauseElapsed - BIG_TRAIN_DOOR_OPEN_DURATION - btn.shuffleWalkDelay;
            const t = Math.max(0, Math.min(1, walkElapsed / travel.walkDuration));
            const cycleT = t >= 1 ? 0 : (t * travel.hopCount) % 1;
            return {
                x: travel.startX + (travel.destX - travel.startX) * t,
                y: travel.startY + (travel.destY - travel.startY) * t + getBigTrainButtonHopOffset(cycleT)
            };
        }

        function updateBigTrainShuffleButtons(pauseElapsed, trainX, trainY) {
            mathSettingsButtons.forEach(btn => {
                if (btn.shuffleDoorIndex < 0 || btn.shuffleTucked) return;
                const travel = getBigTrainShuffleButtonTravel(btn, trainX, trainY);
                const walkElapsed = pauseElapsed - BIG_TRAIN_DOOR_OPEN_DURATION - btn.shuffleWalkDelay;
                if (walkElapsed >= travel.walkDuration) {
                    btn.shuffleTucked = true;
                    // Also clears bigTrainArrived (left over, permanently
                    // true, from the intro) - otherwise the instant
                    // bigTrainShuffleActive goes false once the train is
                    // gone, drawMathSettingsButtons() falls back to the
                    // intro's "arrived -> draw at rest" logic and resurrects
                    // this button at its old slot instead of leaving it gone.
                    btn.bigTrainArrived = false;
                }
            });
        }

        // Starts the shuffle - called when any level button is clicked.
        // Ignored if one is already playing.
        function triggerBigTrainButtonShuffle() {
            if (bigTrainShuffleActive) return;
            bigTrainShuffleActive = true;
            bigTrainShuffleStartTimestamp = null;
            bigTrainShuffleButtonsAssigned = false;
            bigTrainShuffleDoorOpenAmount = 0;
            bigTrainShufflePauseElapsed = 0;
            bigTrainShuffleDoorHoldDuration = 0;
            bigTrainShufflePauseDuration = BIG_TRAIN_DOOR_OPEN_DURATION + BIG_TRAIN_DOOR_CLOSE_DURATION;
            mathSettingsButtons.forEach(btn => {
                btn.shuffleDoorIndex = -1;
                btn.shuffleWalkDelay = 0;
                btn.shuffleTucked = false;
            });
            levelSelectInputLocked = true;
        }

        function updateBigTrainShuffle(timestamp) {
            if (!bigTrainShuffleActive) return;
            // Level buttons unlock before the intro's own train has fully
            // left the screen (math settings buttons unlock as soon as the
            // last one lands, well before the exit finishes) - if a level
            // button is clicked in that window, wait for the intro to be
            // completely done before starting the shuffle's clock, so it
            // can never tick forward (and tuck buttons away) while hidden
            // behind the still-finishing intro train.
            if (!bigTrainAnimDone) return;
            if (bigTrainShuffleStartTimestamp === null) bigTrainShuffleStartTimestamp = timestamp;
            const elapsed = timestamp - bigTrainShuffleStartTimestamp;

            const trainWidth = ((bigTrainDarkSprite && bigTrainDarkSprite.naturalWidth) || 906) * BIG_TRAIN_SPRITE_SCALE;
            const startX = -trainWidth; // fully off-screen left, same as the intro's entrance
            const centerX = (LEVEL_SELECT_IMAGE_WIDTH - trainWidth) / 2;
            const endX = LEVEL_SELECT_IMAGE_WIDTH; // fully off-screen right, same as the intro's exit

            if (elapsed < BIG_TRAIN_ENTER_DURATION) {
                const t = easeOutCubic(elapsed / BIG_TRAIN_ENTER_DURATION);
                bigTrainShuffleX = startX + (centerX - startX) * t;
                bigTrainShuffleDoorOpenAmount = 0;
            } else if (elapsed < BIG_TRAIN_ENTER_DURATION + bigTrainShufflePauseDuration) {
                bigTrainShuffleX = centerX;
                const pauseElapsed = elapsed - BIG_TRAIN_ENTER_DURATION;
                bigTrainShufflePauseElapsed = pauseElapsed;
                const trainTopY = getBigTrainTopY();

                if (!bigTrainShuffleButtonsAssigned) {
                    assignBigTrainShuffleGroups();
                    bigTrainShuffleButtonsAssigned = true;
                    bigTrainShuffleDoorHoldDuration = computeBigTrainShuffleDoorHoldDuration(centerX, trainTopY);
                    bigTrainShufflePauseDuration = BIG_TRAIN_DOOR_OPEN_DURATION + bigTrainShuffleDoorHoldDuration + BIG_TRAIN_DOOR_CLOSE_DURATION;
                }
                updateBigTrainShuffleButtons(pauseElapsed, centerX, trainTopY);

                if (pauseElapsed < BIG_TRAIN_DOOR_OPEN_DURATION) {
                    const openT = pauseElapsed / BIG_TRAIN_DOOR_OPEN_DURATION;
                    bigTrainShuffleDoorOpenAmount = openT * openT;
                } else if (pauseElapsed < BIG_TRAIN_DOOR_OPEN_DURATION + bigTrainShuffleDoorHoldDuration) {
                    bigTrainShuffleDoorOpenAmount = 1;
                } else {
                    const closeElapsed = pauseElapsed - BIG_TRAIN_DOOR_OPEN_DURATION - bigTrainShuffleDoorHoldDuration;
                    bigTrainShuffleDoorOpenAmount = 1 - easeOutCubic(closeElapsed / BIG_TRAIN_DOOR_CLOSE_DURATION);
                }
            } else if (elapsed < BIG_TRAIN_ENTER_DURATION + bigTrainShufflePauseDuration + BIG_TRAIN_EXIT_DURATION) {
                const t = easeInCubic((elapsed - BIG_TRAIN_ENTER_DURATION - bigTrainShufflePauseDuration) / BIG_TRAIN_EXIT_DURATION);
                bigTrainShuffleX = centerX + (endX - centerX) * t;
                bigTrainShuffleDoorOpenAmount = 0;
            } else {
                bigTrainShuffleX = endX;
                bigTrainShuffleDoorOpenAmount = 0;
                bigTrainShuffleActive = false;
                levelSelectInputLocked = false;
            }

            bigTrainShuffleLightAlpha = computeBigTrainLightAlpha(bigTrainShuffleX, trainWidth, centerX);
        }

        // Shared visual compositing for one frame of the train, reused by
        // both the intro (entering from the left, buttons walking OUT of
        // doors) and the button-shuffle triggered by a level click (entering
        // from the right, buttons walking INTO doors). `x`/`y` are the
        // sprite's current top-left; `hiddenWalkers` is only non-empty for
        // the intro direction, where a button must stay hidden under a
        // still-closing door rather than simply popping into existence.
        function drawBigTrainVisual(ctx, x, y, w, h, bgW, bgH, doorOpenAmount, lightAlpha, hiddenWalkers) {
            // Layers, bottom to top, all at full opacity except
            // mm_big_train_dark: mm_big_train_background, door rectangles,
            // mm_big_train_light. mm_big_train_dark on top is the only thing
            // that fades - it fades OUT (revealing the layers beneath) as the
            // train nears center, and back IN as it leaves.
            if (bgW > 0 && bgH > 0 && bigTrainBackgroundSprite && bigTrainBackgroundSprite.complete) {
                BIG_TRAIN_BACKGROUND_OFFSETS.forEach(offset => {
                    ctx.drawImage(
                        bigTrainBackgroundSprite,
                        x + offset.x - bgW / 2,
                        y + offset.y - bgH / 2,
                        bgW, bgH
                    );
                });
            }

            // Buttons meant to be concealable by a door: drawn below the
            // door layer so it can hide them whenever it covers their spot -
            // whether that's a still-opening door revealing an intro button
            // (not yet picked up by drawMathSettingsButtons() on the normal
            // top canvas), or a since-closed/closing door covering a
            // shuffle button that already walked in and is waiting there.
            if (hiddenWalkers && hiddenWalkers.length) {
                // Sorted so a button further down the screen (larger y) is
                // always drawn in front of one further up, regardless of
                // array order.
                hiddenWalkers
                    .slice()
                    .sort((a, b) => a.pos.y - b.pos.y)
                    .forEach(({ btn, pos }) => {
                        drawMathSettingsButtonFeet(ctx, pos.x, pos.y);
                        drawMathSettingsButtonBody(ctx, btn, pos.x, pos.y, false);
                    });
            }

            if (bgW > 0 && bgH > 0) {
                const doorW = bgW / 2;
                // Each door's outer edge stays put; its middle (inner) edge
                // slides outward as doorOpenAmount goes 0 (closed, full
                // doorW wide) -> 1 (open, 0 wide, collapsed onto the outer
                // edge).
                const openDoorW = doorW * (1 - doorOpenAmount);
                ctx.fillStyle = '#D4C88B';
                ctx.strokeStyle = '#6A6340';
                ctx.lineWidth = 2;
                BIG_TRAIN_BACKGROUND_OFFSETS.forEach(offset => {
                    const left = x + offset.x - bgW / 2;
                    const top = y + offset.y - bgH / 2;
                    const rightDoorX = left + doorW + (doorW - openDoorW);
                    ctx.fillRect(left, top, openDoorW, bgH);
                    ctx.strokeRect(left, top, openDoorW, bgH);
                    ctx.fillRect(rightDoorX, top, openDoorW, bgH);
                    ctx.strokeRect(rightDoorX, top, openDoorW, bgH);
                });
            }

            if (bigTrainLightSprite && bigTrainLightSprite.complete) {
                ctx.drawImage(bigTrainLightSprite, x, y, w, h);
            }

            const darkAlpha = 1 - lightAlpha;
            if (darkAlpha > 0 && bigTrainDarkSprite && bigTrainDarkSprite.complete) {
                ctx.globalAlpha = darkAlpha;
                ctx.drawImage(bigTrainDarkSprite, x, y, w, h);
                ctx.globalAlpha = 1;
            }
        }

        function drawBigTrain() {
            const canvas = document.getElementById('levelSelectBigTrainCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            // Always clear first - whichever sequence (intro or shuffle) is
            // active draws fresh every frame, and once both are done nothing
            // should linger from the last frame either drew.
