                        <div class="inspector-header">
                            <h3>${selectedTile.tileType.name}</h3>
                            <div class="inspector-grid">
                                <canvas id="inspectorCanvas" width="${23 * TILE_SIZE}" height="${TILE_SIZE}"></canvas>
                            </div>
                        </div>${renderFadeInField()}
                    `;

                    // Draw the inspector grid
                    drawInspectorGrid();

                    setupStepper('tileFadeIn', setSelectedFadeIn);
                }
            } else {
                inspectorContent.innerHTML = '';
            }
        }

        function switchInspectorTab(tabName) {
            currentInspectorTab = tabName;
            updateInspector();
        }

        // Wire one stepper's +/- buttons and its input. Used for steppers outside
        // the train inspector, which does its own blanket wiring.
        function setupStepper(inputId, onChange) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const min = parseFloat(input.min);
            const max = parseFloat(input.max);
            const step = parseFloat(input.step) || 1;
            const clamp = (value) => isNaN(value) ? min : Math.max(min, Math.min(max, value));

            const commit = (value) => {
                input.value = value;
                if (onChange) onChange(value);
            };

            input.addEventListener('change', () => commit(clamp(parseInt(input.value, 10))));

            document.querySelectorAll(`.stepper button[data-input="${inputId}"]`).forEach(button => {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const delta = button.dataset.action === 'increment' ? step : -step;
                    commit(clamp(parseFloat(input.value) + delta));
                });
            });
        }

        // Value new track pieces get for "fade in" when dragged out of the palette.
        function getDefaultFadeIn() {
            const input = document.getElementById('fadeInDefault');
            if (!input) return 0;
            const value = parseInt(input.value, 10);
            return isNaN(value) ? 0 : value;
        }

        // Tiles that carry a per-tile "fade in" value: track pieces, lights and stops.
        function supportsFadeIn(tileType) {
            if (!tileType) return false;
            return tileType.type === 'track' ||
                   tileType.id === 'light_pole' ||
                   tileType.id === 'stop';
        }

        // The tile object at a selection's position, so edits hit the real tile.
        // Lights and stops declare layer 'tracks', so they live here too.
        function findGridTile(ref) {
            if (!ref) return null;
            return trackTiles.find(t => t.gridX === ref.gridX &&
                                        t.gridY === ref.gridY) || null;
        }

        function getSelectedFadeIn() {
            const tile = findGridTile(selectedTile);
            return tile && tile.fadeIn != null ? tile.fadeIn : 0;
        }

        // Writes to the tile the inspector was built for, not the live selection
        function setSelectedFadeIn(value) {
            const tile = findGridTile(inspectorTile);
            if (tile) tile.fadeIn = value;
        }

        function getSelectedBurnOutOn() {
            const tile = findGridTile(selectedTile);
            return tile && tile.burnOutOn != null ? tile.burnOutOn : '';
        }

        // Writes to the tile the inspector was built for, not the live selection
        function setSelectedBurnOutOn(value) {
            const tile = findGridTile(inspectorTile);
            if (tile) tile.burnOutOn = value;
        }

        function getSelectedBurnOutDelay() {
            const tile = findGridTile(selectedTile);
            return tile && tile.burnOutDelay != null ? tile.burnOutDelay : 0;
        }

        // Writes to the tile the inspector was built for, not the live selection
        function setSelectedBurnOutDelay(value) {
            const tile = findGridTile(inspectorTile);
            if (tile) tile.burnOutDelay = value;
        }

        // Shared "Fade in" inspector row, used by track pieces, lights and stops.
        function renderFadeInField() {
            if (!selectedTile || !supportsFadeIn(selectedTile.tileType)) return '';
            return `
                        <div class="inspector-field">
                            <label for="tileFadeIn">Fade in:</label>
                            <div class="stepper">
                                <button type="button" data-input="tileFadeIn" data-action="decrement">−</button>
                                <input type="number" id="tileFadeIn" min="0" max="50" step="1" value="${getSelectedFadeIn()}">
                                <button type="button" data-input="tileFadeIn" data-action="increment">+</button>
                            </div>
                        </div>`;
        }

        function getTrainId(tile) {
            if (!tile || !tile.trainId) return null;
            return tile.trainId;
        }

        function getTrainProperty(property, defaultValue) {
            if (!selectedTile) return defaultValue;
            const trainId = getTrainId(selectedTile);
            if (!trainId || !trainProperties[trainId]) return defaultValue;
            return trainProperties[trainId][property] !== undefined ? trainProperties[trainId][property] : defaultValue;
        }

        function setTrainProperty(property, value) {
            if (!inspectorTile) return;
            const trainId = getTrainId(inspectorTile);
            if (!trainId) return;

            if (!trainProperties[trainId]) {
                trainProperties[trainId] = {};
            }
            trainProperties[trainId][property] = value;
        }

        function setupLightInputListeners() {
            const burnOutOnInput = document.getElementById('lightBurnOutOn');
            if (burnOutOnInput) {
                burnOutOnInput.addEventListener('change', (e) => {
                    setSelectedBurnOutOn(e.target.value);
                });
                burnOutOnInput.addEventListener('input', (e) => {
                    setSelectedBurnOutOn(e.target.value);
                });
            }

            const burnOutDelayInput = document.getElementById('lightBurnOutDelay');
            if (burnOutDelayInput) {
                burnOutDelayInput.addEventListener('change', (e) => {
                    let value = parseFloat(e.target.value);
                    if (isNaN(value) || value < 0) value = 0;
                    if (value > 9999) value = 9999;
                    value = Math.round(value * 10) / 10;
                    e.target.value = value;
                    setSelectedBurnOutDelay(value);
                });
            }

            // Setup stepper buttons for burn out delay only — the fade in
            // stepper's buttons are wired separately via setupStepper().
            document.querySelectorAll('.stepper button[data-input="lightBurnOutDelay"]').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const input = document.getElementById('lightBurnOutDelay');
                    if (!input) return;

                    let value = parseFloat(input.value);
                    const min = parseFloat(input.min);
                    const max = parseFloat(input.max);
                    const step = parseFloat(input.step) || 1;

                    if (button.dataset.action === 'increment' && value < max) {
                        value = Math.min(value + step, max);
                    } else if (button.dataset.action === 'decrement' && value > min) {
                        value = Math.max(value - step, min);
                    }

                    // Round to avoid floating point issues
                    value = Math.round(value * 10) / 10;
                    input.value = value;

                    // Trigger change event to save the value
                    input.dispatchEvent(new Event('change'));
                });
            });
        }

        function setupTrainInputListeners() {
            const carsInput = document.getElementById('trainCars');
            const speedInput = document.getElementById('trainSpeed');

            if (carsInput) {
                carsInput.addEventListener('change', (e) => {
                    let value = parseInt(e.target.value);
                    const min = parseInt(e.target.min);
                    const max = parseInt(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    e.target.value = value;
                    setTrainProperty('cars', value);

                    // Rebuild inspector to update spacing inputs
                    draw();
                    updateInspector();
                });
            }

            if (speedInput) {
                speedInput.addEventListener('change', (e) => {
                    let value = parseFloat(e.target.value);
                    const min = parseFloat(e.target.min);
                    const max = parseFloat(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    value = Math.round(value * 10) / 10;
                    e.target.value = value;
                    setTrainProperty('speed', value);
                });
            }

            const spawnOnInput = document.getElementById('trainSpawnOn');
            if (spawnOnInput) {
                spawnOnInput.addEventListener('change', (e) => {
                    setTrainProperty('spawnOn', e.target.value);
                });
                spawnOnInput.addEventListener('input', (e) => {
                    setTrainProperty('spawnOn', e.target.value);
                });
            }

            const spawnDelayInput = document.getElementById('trainSpawnDelay');
            if (spawnDelayInput) {
                spawnDelayInput.addEventListener('change', (e) => {
                    let value = parseFloat(e.target.value);
                    if (isNaN(value) || value < 0) value = 0;
                    if (value > 9999) value = 9999;
                    value = Math.round(value * 10) / 10;
                    e.target.value = value;
                    setTrainProperty('spawnDelay', value);
                });
            }

            const fontSizeInput = document.getElementById('textFontSize');
            if (fontSizeInput) {
                fontSizeInput.addEventListener('change', (e) => {
                    let value = parseFloat(e.target.value);
                    const min = parseFloat(e.target.min);
                    const max = parseFloat(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    value = Math.round(value * 10) / 10;
                    e.target.value = value;
                    setTextFontSize(value);

                    // Redraw to update font size
                    draw();
                    drawInspectorGrid();
                });
            }

            // Setup stepper buttons. Scoped to the inspector, whose markup is
            // rebuilt each time — a page-wide query would stack duplicate
            // listeners on the palette's stepper on every inspector refresh.
            document.querySelectorAll('#inspectorContent .stepper button').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const inputId = button.dataset.input;
                    const action = button.dataset.action;
                    const input = document.getElementById(inputId);

                    if (!input) return;

                    let value = parseFloat(input.value);
                    const min = parseFloat(input.min);
                    const max = parseFloat(input.max);
                    const step = parseFloat(input.step) || 1;

                    if (action === 'increment' && value < max) {
                        value = Math.min(value + step, max);
                    } else if (action === 'decrement' && value > min) {
                        value = Math.max(value - step, min);
                    }

                    // Round to avoid floating point issues
                    value = Math.round(value * 10) / 10;
                    input.value = value;

                    // Trigger change event to save the value
                    input.dispatchEvent(new Event('change'));
                });
            });

            // Setup direction checkboxes
            document.querySelectorAll('.direction-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        const direction = e.target.dataset.direction;
                        setTrainProperty('direction', direction);

                        // Uncheck all other checkboxes
                        document.querySelectorAll('.direction-checkbox').forEach(cb => {
                            if (cb !== e.target) {
                                cb.checked = false;
                            }
                        });

                        // Redraw grids
                        draw();
                        drawInspectorGrid();
                    } else {
                        // Don't allow unchecking - at least one must be selected
                        e.target.checked = true;
                    }
                });
            });

            // Setup spacing inputs
            document.querySelectorAll('.spacing-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    let value = parseInt(e.target.value);
                    const min = parseInt(e.target.min);
                    const max = parseInt(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    e.target.value = value;
                    setSpacingValue(index, value);

                    draw();
                    drawInspectorGrid();
                });
            });

            // Setup drag checkboxes
            document.querySelectorAll('#dragCheckboxes .drag-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.carIndex);
                    setDragValue(index, e.target.checked);

                    // Redraw to show/hide drag lines
                    draw();
                    drawInspectorGrid();
                });
            });

            document.querySelectorAll('#mathfactsCheckboxes .drag-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.carIndex);
                    setMathFactValue(index, e.target.checked);
                    draw();
                    drawInspectorGrid();
                    rebuildMathFactsCheckboxes();
                });
            });

            // Setup text inputs
            document.querySelectorAll('.text-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    setTextValue(index, e.target.value);
                });

                input.addEventListener('input', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    setTextValue(index, e.target.value);
                });
            });
        }

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) return; // Don't update hover while dragging

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isInGrid(mouseX, mouseY)) {
                const pos = getGridPosition(mouseX, mouseY);
                // Only check tiles on the current active layer
                const tile = getTileAtGrid(pos.x, pos.y, currentPaletteTab);

                if (tile) {
                    hoveredTile = { ...tile, layer: currentPaletteTab };
                    canvas.style.cursor = 'grab';
                } else {
                    hoveredTile = null;
                    canvas.style.cursor = 'pointer';
                }
            } else {
                hoveredTile = null;
                canvas.style.cursor = 'pointer';
            }

            draw();
        });

        canvas.addEventListener('mouseleave', () => {
            if (!isDragging) {
                hoveredTile = null;
                draw();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            // Flush any half-typed field before the selection moves
            commitPendingInspectorEdits();

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if clicking on existing tile on grid (only on current layer)
            if (isInGrid(mouseX, mouseY)) {
                const pos = getGridPosition(mouseX, mouseY);
                const tile = pickTileForClick(pos.x, pos.y);

                if (tile) {
                    // Select the tile
                    selectedTile = {
                        gridX: tile.gridX,
                        gridY: tile.gridY,
                        tileType: tile.tileType,
                        layer: currentPaletteTab,
                        trainId: tile.trainId // Preserve train ID
                    };
                    updateInspector();

                    isDragging = true;
                    draggedTile = {
                        tileType: tile.tileType,
                        color: tile.color, // Legacy support
                        fromPalette: false,
                        originalGridX: tile.gridX,
                        originalGridY: tile.gridY,
                        layer: currentPaletteTab,
                        trainId: tile.trainId, // Preserve train ID when dragging existing tile
                        fadeIn: tile.fadeIn, // Preserve fade in when moving a track piece
                        burnOutOn: tile.burnOutOn,
                        burnOutDelay: tile.burnOutDelay
                    };
                    // Remove from appropriate layer while dragging
                    if (currentPaletteTab === 'tracks') {
                        trackTiles = trackTiles.filter(t => t !== tile);
                    } else {
                        objectTiles = objectTiles.filter(t => t !== tile);
                    }
                    dragPixelX = mouseX - TILE_SIZE / 2;
                    dragPixelY = mouseY - TILE_SIZE / 2;
                    hoveredTile = null;
                    canvas.style.cursor = 'grabbing';
                    draw();
                } else {
                    // Clicking on empty space deselects
                    selectedTile = null;
                    updateInspector();
                    draw();
                }
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !draggedTile) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Update pixel position while dragging
            dragPixelX = mouseX - TILE_SIZE / 2;
            dragPixelY = mouseY - TILE_SIZE / 2;

            draw();
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging || !draggedTile) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if dropped on grid
            if (isInGrid(mouseX, mouseY)) {
                const pos = getGridPosition(mouseX, mouseY);

                // Determine which layer to add to based on tile type
                const targetLayer = draggedTile.tileType && draggedTile.tileType.layer ?
                    draggedTile.tileType.layer : currentPaletteTab;

                // Remove any existing tile at this position on this layer
                if (targetLayer === 'tracks') {
                    trackTiles = trackTiles.filter(tile =>
                        tile.gridX !== pos.x || tile.gridY !== pos.y
                    );
                    // Add new tile to tracks layer
                    const newTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        color: draggedTile.color, // Legacy support
                        trainId: draggedTile.trainId // Preserve train ID
                    };
                    if (supportsFadeIn(draggedTile.tileType)) {
                        // New tiles adopt the palette's "Fade in" value; tiles
                        // dragged around the grid keep the value they already had.
                        newTile.fadeIn = draggedTile.fromPalette
                            ? getDefaultFadeIn()
                            : (draggedTile.fadeIn != null ? draggedTile.fadeIn : 0);
                    }
                    if (!draggedTile.fromPalette) {
                        // Tiles dragged around the grid keep their burn out settings.
                        newTile.burnOutOn = draggedTile.burnOutOn;
                        newTile.burnOutDelay = draggedTile.burnOutDelay;
                    }
                    trackTiles.push(newTile);

                    // Update selection to new position
                    selectedTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        layer: targetLayer,
                        trainId: draggedTile.trainId
                    };
                } else {
                    // Trains stack: any number can share a square, so dropping one
                    // displaces nothing. Anything else still replaces the square.
                    if (!draggedTile.tileType || draggedTile.tileType.id !== 'train') {
                        objectTiles = objectTiles.filter(tile =>
                            tile.gridX !== pos.x || tile.gridY !== pos.y
                        );
                    }
                    // Add new tile to objects layer
                    const newTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        color: draggedTile.color, // Legacy support
                        trainId: draggedTile.trainId // Preserve train ID
                    };
                    objectTiles.push(newTile);

                    // Update selection to new position
                    selectedTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        layer: targetLayer,
                        trainId: draggedTile.trainId
                    };

                    // If this is a train, validate direction for the new track
                    if (draggedTile.tileType && draggedTile.tileType.id === 'train' && draggedTile.trainId) {
                        const trackUnder = getTileAtGrid(pos.x, pos.y, 'tracks');
                        const availableDirections = getDirectionOptionsForTrack(trackUnder);
                        const currentDirection = trainProperties[draggedTile.trainId] && trainProperties[draggedTile.trainId].direction;

                        // If current direction is not available for this track, choose a new one
                        if (availableDirections.length > 0 && !availableDirections.includes(currentDirection)) {
                            if (!trainProperties[draggedTile.trainId]) {
                                trainProperties[draggedTile.trainId] = {};
                            }
                            trainProperties[draggedTile.trainId].direction = availableDirections[0];
                        }

                        if (draggedTile.fromPalette) {
                            applyDefaultMathFact(draggedTile.trainId);
                        }
                    }
                }

                updateInspector();
            } else {
                // Dragged off grid, deselect
                selectedTile = null;
                updateInspector();
            }

            isDragging = false;
            draggedTile = null;
            hoveredTile = null;
            canvas.style.cursor = 'pointer';
            draw();
        });

        // Level management functions
        function saveLevel() {
            // Make sure a field still being edited is included in the save
            commitPendingInspectorEdits();

            const name = document.getElementById('levelName').value.trim() || 'Untitled Level';

            const isNewLevel = !levels[name];

            // Save tiles with only the tile type ID (not the full object with render function)
            const trackTilesToSave = trackTiles.map(tile => ({
                gridX: tile.gridX,
                gridY: tile.gridY,
                tileTypeId: tile.tileType ? tile.tileType.id : null,
                color: tile.color,  // Legacy support for old color-only tiles
                trainId: tile.trainId,
                fadeIn: tile.fadeIn,
                burnOutOn: tile.burnOutOn,
                burnOutDelay: tile.burnOutDelay
            }));

            const objectTilesToSave = objectTiles.map(tile => ({
                gridX: tile.gridX,
                gridY: tile.gridY,
                tileTypeId: tile.tileType ? tile.tileType.id : null,
                color: tile.color,  // Legacy support for old color-only tiles
                trainId: tile.trainId
            }));

            levels[name] = {
                name: name,
                trackTiles: trackTilesToSave,
                objectTiles: objectTilesToSave,
                tiles: trackTilesToSave, // Legacy support for old saves
                trainProperties: trainProperties, // Save train properties
                nextTrainId: nextTrainId, // Save next train ID
                lightPoleProperties: window.lightPoleProperties || {}, // Save light pole properties
                timestamp: Date.now()
            };

            if (isNewLevel) {
                levelOrder.push(name);
            }

            currentLevelName = name;
            saveLevelToFile(name);
            if (isNewLevel) {
                saveLevelOrder();
            }
            updateLevelList();
        }

        function newLevel() {
            if ((trackTiles.length > 0 || objectTiles.length > 0) && !confirm('Create a new level? Unsaved changes will be lost.')) {
                return;
            }

            trackTiles = [];
            objectTiles = [];
            selectedTile = null;
            trainProperties = {};
            nextTrainId = 1;
            window.lightPoleProperties = {};
            currentLevelName = 'Untitled Level';
            document.getElementById('levelName').value = currentLevelName;
            updateInspector();
            draw();
        }

        function loadLevel(name) {
            if (!levels[name]) return;

            // Commit a half-typed field against the level it belongs to
            commitPendingInspectorEdits();

            // Load track tiles
            const savedTrackTiles = levels[name].trackTiles || levels[name].tiles || [];
            trackTiles = savedTrackTiles.map(tile => {
                // Find the tile type definition by ID
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);

                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    color: tile.color,  // Legacy support for old color-only tiles
                    trainId: tile.trainId,
                    fadeIn: tile.fadeIn,
                    burnOutOn: tile.burnOutOn,
                    burnOutDelay: tile.burnOutDelay
                };
            });

            // Load object tiles
            const savedObjectTiles = levels[name].objectTiles || [];
            objectTiles = savedObjectTiles.map(tile => {
                // Find the tile type definition by ID
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);

                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    color: tile.color,  // Legacy support for old color-only tiles
                    trainId: tile.trainId
                };
            });

            // Load train properties and next ID
            trainProperties = levels[name].trainProperties || {};
            nextTrainId = levels[name].nextTrainId || 1;

            // Load light pole properties
            window.lightPoleProperties = levels[name].lightPoleProperties || {};

            selectedTile = null;
            currentLevelName = name;
            document.getElementById('levelName').value = name;
            updateInspector();
            draw();
            updateLevelList();
        }

        function deleteLevel(name) {
            if (!confirm(`Delete level "${name}"?`)) {
                return;
            }

            delete levels[name];
            levelOrder = levelOrder.filter(n => n !== name);
            deleteLevelFile(name);
            saveLevelOrder();

            if (currentLevelName === name) {
                newLevel();
            }

            updateLevelList();
        }

        function autoScrollLoop() {
            if (!autoScrollActive) return;

            const listEl = document.getElementById('levelList');
            if (listEl && autoScrollSpeed !== 0) {
                listEl.scrollTop += autoScrollSpeed;
            }

            scrollAnimationFrame = requestAnimationFrame(autoScrollLoop);
        }

        function handleListDragOver(e) {
            e.preventDefault();

            const listEl = document.getElementById('levelList');
            const rect = listEl.getBoundingClientRect();
            const mouseY = e.clientY;
            const scrollThreshold = 150;

            // Scroll down if near bottom
            if (mouseY > rect.bottom - scrollThreshold && mouseY <= rect.bottom) {
                const distance = rect.bottom - mouseY;
                const speedMultiplier = 1 - (distance / scrollThreshold);
                autoScrollSpeed = 3 + (speedMultiplier * 30); // Speed ranges from 3 to 33

                if (!autoScrollActive) {
                    autoScrollActive = true;
                    autoScrollLoop();
                }
            }
            // Scroll up if near top
            else if (mouseY < rect.top + scrollThreshold && mouseY >= rect.top) {
                const distance = mouseY - rect.top;
                const speedMultiplier = 1 - (distance / scrollThreshold);
                autoScrollSpeed = -(3 + (speedMultiplier * 30)); // Speed ranges from -3 to -33

                if (!autoScrollActive) {
                    autoScrollActive = true;
                    autoScrollLoop();
                }
            }
            else {
                autoScrollSpeed = 0;
                autoScrollActive = false;
                if (scrollAnimationFrame) {
                    cancelAnimationFrame(scrollAnimationFrame);
                    scrollAnimationFrame = null;
                }
            }
        }

        function updateLevelList() {
            const listEl = document.getElementById('levelList');
            listEl.innerHTML = '';

            // Remove old event listeners by cloning
            const newListEl = listEl.cloneNode(false);
            listEl.parentNode.replaceChild(newListEl, listEl);

            if (levelOrder.length === 0) {
                newListEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">No saved levels</div>';
                return;
            }

            // Add dragover to the list container
            newListEl.addEventListener('dragover', handleListDragOver);
            newListEl.addEventListener('dragleave', (e) => {
                if (e.target === newListEl) {
                    autoScrollSpeed = 0;
                    autoScrollActive = false;
                    if (scrollAnimationFrame) {
                        cancelAnimationFrame(scrollAnimationFrame);
                        scrollAnimationFrame = null;
                    }
                }
            });
            newListEl.addEventListener('drop', (e) => {
                autoScrollSpeed = 0;
                autoScrollActive = false;
                if (scrollAnimationFrame) {
                    cancelAnimationFrame(scrollAnimationFrame);
                    scrollAnimationFrame = null;
                }

                // Handle dropping on the container itself (for top/bottom placement)
                if (e.target === newListEl || e.target.id === 'levelList') {
                    const draggedName = e.dataTransfer.getData('text/plain');
                    if (draggedName) {
                        const rect = newListEl.getBoundingClientRect();
                        const mouseY = e.clientY;

                        // Remove from current position
                        const draggedIndex = levelOrder.indexOf(draggedName);
                        if (draggedIndex !== -1) {
                            levelOrder.splice(draggedIndex, 1);

                            // Add to top or bottom based on mouse position
                            if (mouseY < rect.top + rect.height / 2) {
                                // Drop at top
                                levelOrder.unshift(draggedName);
                            } else {
                                // Drop at bottom
                                levelOrder.push(draggedName);
                            }

                            saveLevelOrder();
                            updateLevelList();
                        }
                    }
                }
            });

            levelOrder.forEach((name, index) => {
                if (!levels[name]) return; // Skip if level was deleted

                const level = levels[name];
                const item = document.createElement('div');
                item.className = 'level-item';
                item.draggable = true;
                item.dataset.levelName = name;
                item.dataset.index = index;

                if (name === currentLevelName) {
                    item.classList.add('active');
                }

                const contentDiv = document.createElement('div');
                contentDiv.className = 'level-item-content';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'level-item-check';
                checkbox.checked = isLevelCheckedForExport(name);
                checkbox.title = 'Include in export';
                // Don't let ticking the box also load the level or start a drag.
                checkbox.addEventListener('mousedown', (e) => e.stopPropagation());
                checkbox.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setLevelCheckedForExport(name, checkbox.checked);
                });

                const nameDiv = document.createElement('div');
                nameDiv.className = 'level-item-name';
                nameDiv.textContent = name;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'danger';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    deleteLevel(name);
                };

                contentDiv.appendChild(checkbox);
                contentDiv.appendChild(nameDiv);
                contentDiv.appendChild(deleteBtn);
                item.appendChild(contentDiv);

                // Drag events
                item.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', name);
                });

                item.addEventListener('dragend', (e) => {
                    e.stopPropagation();
                    item.classList.remove('dragging');
                    document.querySelectorAll('.level-item').forEach(el => {
                        el.classList.remove('drag-over');
                    });

                    // Stop auto-scrolling
                    autoScrollSpeed = 0;
                    autoScrollActive = false;
                    if (scrollAnimationFrame) {
                        cancelAnimationFrame(scrollAnimationFrame);
                        scrollAnimationFrame = null;
                    }
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    e.dataTransfer.dropEffect = 'move';

                    const dragging = document.querySelector('.level-item.dragging');
                    if (dragging && dragging !== item) {
                        item.classList.add('drag-over');
                    }
                });

                item.addEventListener('dragleave', (e) => {
                    e.stopPropagation();
                    item.classList.remove('drag-over');
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    item.classList.remove('drag-over');

                    const draggedName = e.dataTransfer.getData('text/plain');
                    const targetName = name;

                    if (draggedName !== targetName) {
                        // Reorder the levelOrder array
                        const draggedIndex = levelOrder.indexOf(draggedName);
                        const targetIndex = levelOrder.indexOf(targetName);

                        levelOrder.splice(draggedIndex, 1);
                        levelOrder.splice(targetIndex, 0, draggedName);

                        saveLevelOrder();
                        updateLevelList();
                    }
                });

                item.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                        loadLevel(name);
                    }
                });

                newListEl.appendChild(item);
            });
        }

        // Which levels are ticked for export. Levels are included by default, so
        // an untouched list exports everything; unticking is what's remembered.
        const uncheckedForExport = new Set();

        function isLevelCheckedForExport(name) {
            return !uncheckedForExport.has(name);
        }

        function setLevelCheckedForExport(name, checked) {
            if (checked) {
                uncheckedForExport.delete(name);
            } else {
                uncheckedForExport.add(name);
            }
        }

        // Build a standalone html file from the ticked levels, in list order.
        async function exportLevels() {
            const btn = document.getElementById('exportBtn');
            const names = levelOrder.filter(name => levels[name] && isLevelCheckedForExport(name));

            if (names.length === 0) {
                alert('Tick at least one level to export.');
                return;
            }

            const exportName = document.getElementById('exportName').value.trim() || 'test_game';
            const originalLabel = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Exporting…';

            try {
                const res = await fetch('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: exportName, levels: names })
                });
                const result = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(result.error || `Server responded ${res.status}`);

                btn.textContent = 'Exported!';
                setTimeout(() => { btn.textContent = originalLabel; }, 1500);
                console.log(`Exported ${result.levels} level(s) to ${result.file}`);
            } catch (e) {
                btn.textContent = originalLabel;
                levelApiError(`export levels to "${exportName}"`, e);
            } finally {
                btn.disabled = false;
            }
        }

        // Levels live as JSON files in the levels/ folder, served by server.js.
        function levelApiError(action, e) {
            console.error(`Failed to ${action}:`, e);
            alert(`Failed to ${action}.\n\n${e.message}\n\nMake sure the game is opened through the level server:\n  python3 server.py\n  http://localhost:8080/game.html`);
        }

        async function saveLevelToFile(name) {
            try {
                const res = await fetch(`/api/levels/${encodeURIComponent(name)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(levels[name])
                });
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
            } catch (e) {
                levelApiError(`save level "${name}"`, e);
            }
        }

        async function deleteLevelFile(name) {
            try {
                const res = await fetch(`/api/levels/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
            } catch (e) {
                levelApiError(`delete level "${name}"`, e);
            }
        }

        async function saveLevelOrder() {
            try {
                const res = await fetch('/api/order', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(levelOrder)
                });
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
            } catch (e) {
                levelApiError('save level order', e);
            }
        }

        async function loadLevelsFromFiles() {
            try {
                const res = await fetch('/api/levels');
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
                const data = await res.json();
                levels = data.levels || {};
                levelOrder = (data.order || []).filter(name => levels[name]);
                for (const name of Object.keys(levels)) {
                    if (!levelOrder.includes(name)) levelOrder.push(name);
                }
                return true;
            } catch (e) {
                levels = {};
                levelOrder = [];
                levelApiError('load levels from the levels/ folder', e);
                return false;
            }
        }

        // One-time migration: push any levels still sitting in localStorage
        // (from before file storage) into the levels/ folder.
        async function migrateLocalStorageLevels() {
            const stored = localStorage.getItem('gameLevels');
            if (!stored) return false;

            let oldLevels, oldOrder;
            try {
                oldLevels = JSON.parse(stored);
                oldOrder = JSON.parse(localStorage.getItem('gameLevelOrder') || 'null');
            } catch (e) {
                console.error('Could not parse legacy localStorage levels:', e);
                return false;
            }

            const names = Object.keys(oldLevels || {});
            if (names.length === 0) {
                localStorage.removeItem('gameLevels');
                localStorage.removeItem('gameLevelOrder');
                return false;
            }

            const migrated = [];
            for (const name of names) {
                if (levels[name]) continue; // A file already exists, leave it alone
                levels[name] = oldLevels[name];
                if (!levelOrder.includes(name)) levelOrder.push(name);
                await saveLevelToFile(name);
                migrated.push(name);
            }

            if (Array.isArray(oldOrder)) {
                const ordered = oldOrder.filter(name => levels[name]);
                for (const name of levelOrder) {
                    if (!ordered.includes(name)) ordered.push(name);
                }
                levelOrder = ordered;
            }
            await saveLevelOrder();

            localStorage.removeItem('gameLevels');
            localStorage.removeItem('gameLevelOrder');

            if (migrated.length > 0) {
                console.log(`Migrated ${migrated.length} level(s) from browser storage to levels/`);
            }
            return migrated.length > 0;
        }

        function runLevel() {
            // Serialize current level data
            const levelData = {
                trackTiles: trackTiles.map(tile => ({
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileTypeId: tile.tileType ? tile.tileType.id : null,
                    trainId: tile.trainId,
                    fadeIn: tile.fadeIn,
                    burnOutOn: tile.burnOutOn,
                    burnOutDelay: tile.burnOutDelay
                })),
                objectTiles: objectTiles.map(tile => ({
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileTypeId: tile.tileType ? tile.tileType.id : null,
                    trainId: tile.trainId
                })),
                trainProperties: trainProperties,
                nextTrainId: nextTrainId,
                lightPoleProperties: window.lightPoleProperties || {}
            };

            // Store in sessionStorage for the new window to access
            sessionStorage.setItem('runLevelData', JSON.stringify(levelData));

            // Open new window in run mode
            const runUrl = window.location.href.split('?')[0] + '?mode=run';
            window.open(runUrl, '_blank');
        }

        // Populate trackTiles/objectTiles/trainProperties/etc. (run mode) from a
        // serialized level in the shape produced by runLevel() above.
        function applyRunLevelData(levelData) {
            trackTiles = levelData.trackTiles.map(tile => {
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);
                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    trainId: tile.trainId,
                    fadeIn: tile.fadeIn,
                    burnOutOn: tile.burnOutOn,
                    burnOutDelay: tile.burnOutDelay
                };
            });

            objectTiles = levelData.objectTiles.map(tile => {
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);
                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    trainId: tile.trainId
                };
            });

            trainProperties = levelData.trainProperties || {};
            nextTrainId = levelData.nextTrainId || 1;
            window.lightPoleProperties = levelData.lightPoleProperties || {};
        }

        // Restore run mode back to the level as it was when this window opened.
        // --- Tile fade-in -------------------------------------------------
        // How visible a tile currently is. Only run mode hides anything; the
        // editor always shows every tile at full opacity.
        function getTileAlpha(tile) {
            if (!isRunMode || !tile) return 1;
            return tile.fadeAlpha != null ? tile.fadeAlpha : 1;
        }

        function isTileVisible(tile) {
            return getTileAlpha(tile) > 0;
        }

        // Hide every tile waiting on a solve count. Call before computing lit
        // points so hidden lights and rails don't light the level early.
        function initTileFadeIn() {
            tileFadeAnim = null;
            trackTiles.forEach(tile => {
                tile.fadeAlpha = (tile.fadeIn && tile.fadeIn > 0) ? 0 : 1;
            });
        }

        // Reveal every hidden tile whose "fade in" matches the new solve count.
        // Returns true if a reveal started.
        function startTileFadeIn() {
            const revealing = trackTiles.filter(tile =>
                tile.fadeIn === solved_count && getTileAlpha(tile) < 1);

            if (revealing.length === 0) return false;

            revealing.forEach(tile => { tile.fadeAlpha = 0; });
            tileFadeAnim = { tiles: revealing, frame: 0 };
            return true;
        }

        // Trains already running keep moving through a reveal, but the player
        // can't touch anything until the track they'd be acting on is there.
        function isTileFadeBlockingInput() {
            return isRunMode && tileFadeAnim !== null;
        }

        function updateTileFadeIn() {
            if (!tileFadeAnim) return;

            tileFadeAnim.frame += dt;
            const progress = Math.min(1, tileFadeAnim.frame / TILE_FADE_IN_DURATION);
            tileFadeAnim.tiles.forEach(tile => { tile.fadeAlpha = progress; });

            if (progress >= 1) {
                tileFadeAnim = null;
                // Newly visible track and lights change the lighting.
                persistentLitPoints = addInterpolatedLitPoints(computeLitPoints());
            }
        }

        function resetLevel() {
            if (!initialRunLevelData) return;

            applyRunLevelData(JSON.parse(JSON.stringify(initialRunLevelData)));

            solved_count = 0; // Reset before initLightBurnoutAnimations() checks burn out triggers against it

            initTileFadeIn();
            initLightBurnoutAnimations();
            persistentLitPoints = computeLitPoints();
            persistentLitPoints = addInterpolatedLitPoints(persistentLitPoints);
            initTrainAnimations();

            runModeState = 'gameplay';
            selectedRunMathFact = null;
            feedbackAnim = null;

            keypadVisible = false;
            keypadInputValue = '';
            keypadSlideProgress = 0;
            keypadTargetWorldX = null;
            keypadStartCameraX = null;
            keypadClosingFromCameraX = null;
            keypadClosingFromCameraY = null;
            keypadPressedButton = null;
            keypadHoveredButton = null;

            runDragTrain = null;

        // One-time run-mode bootstrap (sprite load, canvas sizing, camera,
        // drag listeners, game loop) - callable on demand so a page can drop
        // into run mode from its own UI (e.g. a standalone export's level
        // select screen) instead of only at page load from a ?mode=run URL.
        let runModeBootstrapped = false;
        function ensureRunModeReady(callback) {
            if (runModeBootstrapped) { callback(); return; }
            loadSprites(() => {
                document.querySelector('.main-wrapper').classList.add('run-mode');

                // Scale canvas to fill window preserving aspect ratio; this also
                // sizes the backing store to CSS size * devicePixelRatio
                resizeRunCanvas();
                window.addEventListener('resize', resizeRunCanvas);

                // Center camera on the grid
                baseCameraX = (gridWidth - CAMERA_WIDTH) / 2;
                baseCameraY = (gridHeight - CAMERA_HEIGHT) / 2;
                cameraX = baseCameraX;
                cameraY = baseCameraY;

                // Setup drag interaction for player-controlled trains
                canvas.addEventListener('mousedown', handleRunMouseDown);
                canvas.addEventListener('mousemove', handleRunMouseMove);
                canvas.addEventListener('mouseup', handleRunMouseUp);
                canvas.addEventListener('mouseleave', handleRunMouseUp);
                canvas.addEventListener('wheel', handleRunWheel, { passive: false });

                requestAnimationFrame(gameLoop);
                runModeBootstrapped = true;
                callback();
            });
        }

        // Loads a specific level's data into run mode, bootstrapping first if
        // this is the first level played this page load.
        function startRunLevel(levelData) {
            initialRunLevelData = levelData;
            ensureRunModeReady(resetLevel);
        }

        // Button event listeners (only in edit mode)
        if (!isRunMode) {
            document.getElementById('runBtn').addEventListener('click', runLevel);
            document.getElementById('saveBtn').addEventListener('click', saveLevel);
            document.getElementById('newBtn').addEventListener('click', newLevel);
            document.getElementById('exportBtn').addEventListener('click', exportLevels);
            document.getElementById('testLevelSelectBtn').addEventListener('click', () => {
                const levelSelectUrl = window.location.href.split('?')[0] + '?mode=levelselect';
                window.open(levelSelectUrl, '_blank');
            });
            setupStepper('fadeInDefault');

            // Palette tab event listeners
            document.querySelectorAll('.palette-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    switchPaletteTab(tab.dataset.tab);
                });
            });
        }

        function resizeRunCanvas() {
            const aspect = CAMERA_WIDTH / CAMERA_HEIGHT;
            const pad = 0;
            const maxW = window.innerWidth - pad;
            const maxH = window.innerHeight - pad;

            let w, h;
            if (maxW / maxH > aspect) {
                h = maxH;
                w = h * aspect;
            } else {
                w = maxW;
                h = w / aspect;
            }

            document.documentElement.style.setProperty('--run-canvas-width', w + 'px');
            document.documentElement.style.setProperty('--run-canvas-height', h + 'px');

            // Backing store matches CSS size * devicePixelRatio for crisp rendering,
            // capped at MAX_CANVAS_RENDER_SCALE x the logical size so a large/high-DPI
            // window doesn't blow up the pixel count actually rasterized every frame;
            // the logical drawing/coordinate space stays CAMERA_WIDTH x CAMERA_HEIGHT
            // via the base transform below.
            const dpr = window.devicePixelRatio || 1;
            const renderScale = Math.min(dpr * (w / CAMERA_WIDTH), MAX_CANVAS_RENDER_SCALE);
            canvas.width = Math.round(CAMERA_WIDTH * renderScale);
            canvas.height = Math.round(CAMERA_HEIGHT * renderScale);
            ctx.setTransform(renderScale, 0, 0, renderScale, 0, 0);
        }

                const img = new Image();
                img.onload = () => {
                    loadedCount++;
                    if (loadedCount === totalSprites && callback) {
                        callback();
                    }
                };
                img.src = sprite.src;
                if (sprite.target === 'keypadDeleteSprite') keypadDeleteSprite = img;
                if (sprite.target === 'keypadSubmitSprite') keypadSubmitSprite = img;
                if (sprite.target === 'keypadResetSprite') keypadResetSprite = img;
                if (sprite.target === 'keypadLevelSelectSprite') keypadLevelSelectSprite = img;
            });
        }

        // Initialize
        if (isLevelSelectMode) {
            document.querySelector('.main-wrapper').style.display = 'none';
            document.getElementById('levelSelectScreen').classList.add('active');
            initLevelSelectScreen();
        } else if (isRunMode) {
            // Run mode: bootstrap, then load the level from sessionStorage.
            ensureRunModeReady(() => {
                const runLevelData = sessionStorage.getItem('runLevelData');
                if (runLevelData) {
                    sessionStorage.removeItem('runLevelData');
                    startRunLevel(JSON.parse(runLevelData));
                }
            });
        } else {
            // Edit mode: load sprites first, then initialize
            loadSprites(async () => {
                createPalette();
                const online = await loadLevelsFromFiles();
                if (online) {
                    await migrateLocalStorageLevels();
                }
                updateLevelList();
                draw();
            });
        }

    <script>
        // ------------------------------------------------------------------
        // Standalone export: shows a level-select "title" screen built from
        // the embedded levels (one button per level, titled from its name).
        // Pressing a button plays that level using whatever math settings are
        // currently selected on the title screen (operationsList/secondTermList
        // and equationSettingsState are shared, global game state, so they
        // carry over as-is); finishing a level plays a star-themed transition
        // back to the title screen with that level starred.
        // ------------------------------------------------------------------

        function exportPrettifyLevelName(name) {
            return String(name).replace(/[_-]+/g, ' ').trim()
                .replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
        }

        // levelSelectButtons/LEVEL_SELECT_TITLES already hold mocked-up slots
        // from initLevelSelectScreen() (called above, before this script runs)
        // - trim to the real level count and relabel from the real names.
        // The existing layout only has 9 slots; more levels than that just
        // don't get a button past the 9th (out of scope to add a bigger grid).
        if (EXPORT_LEVELS.length > levelSelectButtons.length) {
            console.warn(`Only the first ${levelSelectButtons.length} of ${EXPORT_LEVELS.length} levels get a button.`);
        }
        levelSelectButtons.length = Math.min(levelSelectButtons.length, EXPORT_LEVELS.length);
        LEVEL_SELECT_TITLES.length = 0;
        EXPORT_LEVELS.forEach(level => LEVEL_SELECT_TITLES.push(exportPrettifyLevelName(level.name)));

        function exportShowRunScreen() {
            document.getElementById('levelSelectScreen').classList.remove('active');
            const wrapper = document.querySelector('.main-wrapper');
            wrapper.style.display = '';
            wrapper.classList.add('run-mode');
        }

        function exportShowLevelSelectScreen() {
            document.querySelector('.main-wrapper').style.display = 'none';
            document.getElementById('levelSelectScreen').classList.add('active');
        }

        // Bootstrap run mode immediately (sprite load, canvas sizing, game
        // loop) instead of waiting for the first level press, so that first
        // press has no async sprite-load gap to flash through - by the time
        // anyone clicks, loadSprites()'s images (decoded from embedded data
        // URIs, so near-instant anyway) have long since finished.
        ensureRunModeReady(() => {});

        let exportPlayingLevelIndex = null;

        function exportPlayLevel(index) {
            isRunMode = true; // flips every isRunMode check over from editor-style to live gameplay
            exportPlayingLevelIndex = index;
            exportShowRunScreen();
            // Paint solid black immediately: the next real draw() (with the
            // fade-in overlay) only happens on the following animation frame,
            // and without this the browser's very next paint would show
            // whatever was already on the run canvas for one frame - a flash.
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();
            startRunLevel(EXPORT_LEVELS[index].data);
        }

        // Manual "return to level select" (the keypad's button, not the
        // level-complete celebration): fades out over the run board using
        // game.html's generic run-fade helper, swaps screens once black, then
        // fades the level-select board in from black. Kept separate from the
        // win celebration's star sequence and the level-select -> run fade.
        let exportManualReturnFadeInPhase = false;
        let exportManualReturnFadeInStart = 0;

        returnToLevelSelect = function () {
            if (runFadePhase || exportFadePhase || exportCompletionPhase) return;
            startRunFadeOut(() => {
                exportShowLevelSelectScreen();
                // Paint the level-select canvas solid black immediately so the
                // screen swap doesn't flash its last pre-transition frame
                // before levelSelectLoop's next tick starts fading it in.
                const lsCanvas = document.getElementById('levelSelectCanvas');
                const lsCtx = lsCanvas.getContext('2d');
                lsCtx.save();
                lsCtx.setTransform(1, 0, 0, 1, 0, 0);
                lsCtx.fillStyle = '#000000';
                lsCtx.fillRect(0, 0, lsCanvas.width, lsCanvas.height);
                lsCtx.restore();
                exportPlayingLevelIndex = null;
                exportManualReturnFadeInPhase = true;
                exportManualReturnFadeInStart = performance.now();
            });
        };

        // A level is done once nothing solvable is left: no math facts on any
        // train, no tile reveal or spawn animation in flight, and no train
        // template (e.g. a respawning train with "spawn on" 0,1,2,...) still
        // has a future respawn still to come.
        function exportLevelIsComplete() {
            if (runModeState !== 'gameplay' || feedbackAnim) return false;
            if (tileFadeAnim || spawnAnimations.length > 0 || pendingSpawnTemplates.length > 0) return false;
            for (const template of trainSpawnTemplates) {
                if (template.spawnOnValues.some(v => v > solved_count)) return false;
            }
            for (const train of trainAnimations) {
                if (train.mathFacts && train.mathFacts.some(v => v)) return false;
            }
            return true;
        }

        // A black overlay fades in over the level-select screen once the big
        // train's pick-a-level shuffle finishes, then the chosen level loads
        // behind it and it fades back out over the board.
        const EXPORT_FADE_DURATION = 350; // ms, each direction
        let exportFadePhase = null; // 'out' | 'in' | null
        let exportFadeStart = 0;
        let exportFadeToIndex = null;

        function exportFadeAlpha() {
            if (!exportFadePhase) return 0;
            const t = Math.min(1, (performance.now() - exportFadeStart) / EXPORT_FADE_DURATION);
            return exportFadePhase === 'out' ? t : (1 - t);
        }

        function exportDrawScrim(overlayCtx, width, height, alpha) {
            if (alpha <= 0) return;
            overlayCtx.save();
            overlayCtx.globalAlpha = alpha;
            overlayCtx.fillStyle = '#000000';
            overlayCtx.fillRect(0, 0, width, height);
            overlayCtx.restore();
        }

        // Level-complete celebration, in order:
        //   1. big star grows, centered, over the still-fully-visible board
        //   2. the board fades to black behind the (now full-size) star
        //   3. the level-select screen is swapped in already in its DARKENED
        //      pre-intro state (own dark overlay fully opaque) and our own
        //      scrim clears to reveal it - dark fading into dark, so there's
        //      no bright flash/snap the instant the screen swaps
        //   4. the screen's own train-intro overlay fade (already ticking
        //      underneath since step 3, same mechanism as a normal page load)
        //      continues to play out
        //   5. the star shrinks into the just-finished level's button
        //   6. the train animation itself (rolling in, dropping off every
        //      math-settings button, rolling back out) finishes playing
        // Steps 4 and 6 are one continuous, already-triggered animation
        // (the overlay fade is driven by the train's own position) rather
        // than something we step through ourselves.

        const EXPORT_STAR_SHRINK_DURATION = 300;   // ms, step 5 ("quickly")
        const EXPORT_STAR_MAX_SIZE = 125;          // px wide, at the peak of the grow phase

        let exportCompletionPhase = null; // null | 'starGrow' | 'boardFadeOut' | 'selectReveal' | 'starShrink'
        let exportCompletionPhaseStart = 0;
        let exportCompletionLevelIndex = null;

        function exportCompletionDuration() {
            if (exportCompletionPhase === 'starGrow') return EXPORT_STAR_GROW_DURATION;
            if (exportCompletionPhase === 'boardFadeOut') return EXPORT_BOARD_FADE_DURATION;
            if (exportCompletionPhase === 'selectReveal') return EXPORT_SELECT_REVEAL_DURATION;
            return EXPORT_STAR_SHRINK_DURATION;
        }

        function exportCompletionT() {
            return Math.min(1, (performance.now() - exportCompletionPhaseStart) / exportCompletionDuration());
        }

        function exportDrawBigStar(overlayCtx, cx, cy, size) {
            if (!exportStarBigSprite.complete || !exportStarBigSprite.naturalWidth || size <= 0) return;
            const aspect = exportStarBigSprite.naturalHeight / exportStarBigSprite.naturalWidth;
            const w = size, h = size * aspect;
            overlayCtx.drawImage(exportStarBigSprite, cx - w / 2, cy - h / 2, w, h);
        }

        // Re-plays the entrance sequence (big train rolling in, dropping off
        // every math-settings button, rolling back out) exactly as it plays
        // on first load - same state, just reset. The dark overlay div it
        // fades out gets removed from the DOM once fully transparent, so a
        // replay needs a fresh one spliced back into the same layer position.
        function exportReplayTrainIntro() {
            const screen = document.getElementById('levelSelectScreen');
            if (!screen.querySelector('.level-select-dark')) {
                const darkDiv = document.createElement('div');
                darkDiv.className = 'level-select-dark';
                screen.insertBefore(darkDiv, document.getElementById('levelSelectBigTrainCanvas'));
            }
            level_select_dark_fade = 1;

            bigTrainAnimStartTimestamp = null;
            bigTrainAnimDone = false;
            bigTrainDoorOpenAmount = 0;
            bigTrainPauseElapsed = 0;
            bigTrainButtonsAssigned = false;
            bigTrainDoorHoldDuration = 0;
            bigTrainPauseDuration = BIG_TRAIN_DOOR_OPEN_DURATION + BIG_TRAIN_DOOR_CLOSE_DURATION;
            mathSettingsButtons.forEach(btn => {
                btn.bigTrainDoorIndex = -1;
                btn.bigTrainWalkDelay = 0;
                btn.bigTrainArrived = !btn.on;
                btn.bigTrainDoorJitterX = 0;
                btn.bigTrainDoorJitterY = 0;
            });
            levelSelectInputLocked = true;
        }

        function exportSetCompletionPhase(phase) {
            exportCompletionPhase = phase;
            exportCompletionPhaseStart = performance.now();
        }

        // Watch for the current level finishing, then kick off the
        // celebration sequence; also draws (and clears) the fade-in half of
        // the level-select -> run transition, and the star-grow half of the
        // celebration, both of which play out over the run-mode board.
        const exportOriginalDraw = draw;
        draw = function () {
            exportOriginalDraw();

            if (exportFadePhase === 'in') {
                exportDrawScrim(ctx, CAMERA_WIDTH, CAMERA_HEIGHT, exportFadeAlpha());
                if (performance.now() - exportFadeStart >= EXPORT_FADE_DURATION) {
                    exportFadePhase = null;
                }
            }

            if (exportPlayingLevelIndex === null) return;

            if (exportCompletionPhase === null) {
                if (exportLevelIsComplete()) {
                    exportCompletionLevelIndex = exportPlayingLevelIndex;
                    exportSetCompletionPhase('starGrow');
                }
                return;
            }

            if (exportCompletionPhase === 'starGrow') {
                const t = exportCompletionT();
                exportDrawBigStar(ctx, CAMERA_WIDTH / 2, CAMERA_HEIGHT / 2, EXPORT_STAR_MAX_SIZE * t);
                if (t >= 1) exportSetCompletionPhase('boardFadeOut');
            } else if (exportCompletionPhase === 'boardFadeOut') {
                const t = exportCompletionT();
                exportDrawScrim(ctx, CAMERA_WIDTH, CAMERA_HEIGHT, t);
                exportDrawBigStar(ctx, CAMERA_WIDTH / 2, CAMERA_HEIGHT / 2, EXPORT_STAR_MAX_SIZE);
                if (t >= 1) {
                    // Put the level-select screen into its darkened,
                    // pre-intro state before swapping to it, so our own
                    // scrim (about to clear) reveals dark rather than the
                    // fully-lit screen snapping in.
                    exportReplayTrainIntro();
                    exportShowLevelSelectScreen();
                    exportSetCompletionPhase('selectReveal');
                    // Paint the level-select canvas's very first frame of
                    // 'selectReveal' (t=0: fully black + full-size star)
                    // synchronously - levelSelectLoop is a separate rAF
                    // chain from this one, so without this the browser's
                    // next paint could show that canvas's last (bright,
                    // pre-transition) frame for an instant before it ticks.
                    const lsCanvas = document.getElementById('levelSelectCanvas');
                    const lsCtx = lsCanvas.getContext('2d');
                    lsCtx.save();
                    lsCtx.setTransform(1, 0, 0, 1, 0, 0);
                    lsCtx.fillStyle = '#000000';
                    lsCtx.fillRect(0, 0, lsCanvas.width, lsCanvas.height);
                    lsCtx.restore();
                    exportDrawBigStar(lsCtx, LEVEL_SELECT_IMAGE_WIDTH / 2, LEVEL_SELECT_IMAGE_HEIGHT / 2, EXPORT_STAR_MAX_SIZE);
                }
            }
        };

        // Drives everything that happens on the level-select screen: the
        // pick-a-level sequence (wait for the big train's shuffle, fade to
        // black, swap in the chosen level), and the back half of the level-
        // complete celebration (select screen fading in, then the star
        // shrinking into its button, then the train intro replaying).
        let exportPendingLevelIndex = null;
        const exportOriginalLevelSelectLoop = levelSelectLoop;
        levelSelectLoop = function (timestamp) {
            exportOriginalLevelSelectLoop(timestamp);

            if (exportPendingLevelIndex !== null && !bigTrainShuffleActive) {
                exportFadeToIndex = exportPendingLevelIndex;
                exportPendingLevelIndex = null;
                exportFadePhase = 'out';
                exportFadeStart = performance.now();
            }

            if (exportFadePhase === 'out') {
                const lsCtx = document.getElementById('levelSelectCanvas').getContext('2d');
                exportDrawScrim(lsCtx, LEVEL_SELECT_IMAGE_WIDTH, LEVEL_SELECT_IMAGE_HEIGHT, exportFadeAlpha());
                if (performance.now() - exportFadeStart >= EXPORT_FADE_DURATION) {
                    exportFadePhase = 'in';
                    exportFadeStart = performance.now();
                    exportPlayLevel(exportFadeToIndex);
                }
            }

            if (exportManualReturnFadeInPhase) {
                const lsCtx = document.getElementById('levelSelectCanvas').getContext('2d');
                const t = Math.min(1, (performance.now() - exportManualReturnFadeInStart) / EXPORT_FADE_DURATION);
                exportDrawScrim(lsCtx, LEVEL_SELECT_IMAGE_WIDTH, LEVEL_SELECT_IMAGE_HEIGHT, 1 - t);
                if (t >= 1) exportManualReturnFadeInPhase = false;
            }

            if (exportCompletionPhase !== 'selectReveal' && exportCompletionPhase !== 'starShrink') return;

            const lsCtx = document.getElementById('levelSelectCanvas').getContext('2d');
            const centerX = LEVEL_SELECT_IMAGE_WIDTH / 2;
            const centerY = LEVEL_SELECT_IMAGE_HEIGHT / 2;
            const btn = levelSelectButtons[exportCompletionLevelIndex];
            const btnX = btn ? btn.x : centerX;
            const btnY = btn ? btn.y - settingsCameraY : centerY;
            const btnSize = LEVEL_SELECT_BUTTON_RADIUS * 2;

            if (exportCompletionPhase === 'selectReveal') {
                // The screen's own train-intro overlay (reset by
                // exportReplayTrainIntro() just before this phase started) is
                // already ticking underneath via the normal levelSelectLoop
                // call above - this just clears OUR scrim on top of it, dark
                // fading into dark rather than a bright snap.
                const t = exportCompletionT();
                exportDrawScrim(lsCtx, LEVEL_SELECT_IMAGE_WIDTH, LEVEL_SELECT_IMAGE_HEIGHT, 1 - t);
                exportDrawBigStar(lsCtx, centerX, centerY, EXPORT_STAR_MAX_SIZE);
                if (t >= 1) exportSetCompletionPhase('starShrink');
            } else if (exportCompletionPhase === 'starShrink') {
                const t = exportCompletionT();
                const x = centerX + (btnX - centerX) * t;
                const y = centerY + (btnY - centerY) * t;
                const size = EXPORT_STAR_MAX_SIZE + (btnSize - EXPORT_STAR_MAX_SIZE) * t;
                exportDrawBigStar(lsCtx, x, y, size);
                if (t >= 1) {
                    if (btn) btn.finished = true;
                    exportPlayingLevelIndex = null;
                    exportCompletionLevelIndex = null;
                    exportCompletionPhase = null;
                }
            }
        };

        // Own press/release tracking for level buttons, bypassing
        // hitTestLevelSelectScreen()'s levelSelectInputLocked gate: the
        // screen's own mouseup handler (registered before this script runs)
        // triggers the big-train shuffle synchronously on the same mouseup,
        // which sets that lock immediately - a listener added after it would
        // otherwise see every click as already locked out.
        let exportPressedLevelBtn = null;
        const exportLevelSelectCanvas = document.getElementById('levelSelectCanvas');

        function exportHitTestLevelButton(e) {
            const coords = getLevelSelectCanvasCoords(e);
            return hitTestLevelSelectButton(coords.x, coords.y + settingsCameraY);
        }

        exportLevelSelectCanvas.addEventListener('mousedown', (e) => {
            exportPressedLevelBtn = null;
            if (levelSelectInputLocked || exportPendingLevelIndex !== null || exportFadePhase) return;
            exportPressedLevelBtn = exportHitTestLevelButton(e);
        });
        exportLevelSelectCanvas.addEventListener('mouseup', (e) => {
            const hitBtn = exportHitTestLevelButton(e);
            if (hitBtn && hitBtn === exportPressedLevelBtn &&
                isMathSettingsValid() && hitBtn.index < EXPORT_LEVELS.length) {
                exportPendingLevelIndex = hitBtn.index;
            }
            exportPressedLevelBtn = null;
        });
    </script>
</body>
</html>
