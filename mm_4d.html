        function switchInspectorTab(tabName) {
            currentInspectorTab = tabName;
            updateInspector();
        }

        // Wire one stepper's +/- buttons and its input. Used for steppers outside
        // the train inspector, which does its own blanket wiring.
        function setupStepper(inputId, onChange) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const min = parseFloat(input.min);
            const max = parseFloat(input.max);
            const step = parseFloat(input.step) || 1;
            const clamp = (value) => isNaN(value) ? min : Math.max(min, Math.min(max, value));

            const commit = (value) => {
                input.value = value;
                if (onChange) onChange(value);
            };

            input.addEventListener('change', () => commit(clamp(parseInt(input.value, 10))));

            document.querySelectorAll(`.stepper button[data-input="${inputId}"]`).forEach(button => {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const delta = button.dataset.action === 'increment' ? step : -step;
                    commit(clamp(parseFloat(input.value) + delta));
                });
            });
        }

        // Value new track pieces get for "fade in" when dragged out of the palette.
        function getDefaultFadeIn() {
            const input = document.getElementById('fadeInDefault');
            if (!input) return 0;
            const value = parseInt(input.value, 10);
            return isNaN(value) ? 0 : value;
        }

        // Tiles that carry a per-tile "fade in" value: track pieces, lights and stops.
        function supportsFadeIn(tileType) {
            if (!tileType) return false;
            return tileType.type === 'track' ||
                   tileType.id === 'light_pole' ||
                   tileType.id === 'stop';
        }

        // The tile object at a selection's position, so edits hit the real tile.
        // Lights and stops declare layer 'tracks', so they live here too.
        function findGridTile(ref) {
            if (!ref) return null;
            return trackTiles.find(t => t.gridX === ref.gridX &&
                                        t.gridY === ref.gridY) || null;
        }

        function getSelectedFadeIn() {
            const tile = findGridTile(selectedTile);
            return tile && tile.fadeIn != null ? tile.fadeIn : 0;
        }

        // Writes to the tile the inspector was built for, not the live selection
        function setSelectedFadeIn(value) {
            const tile = findGridTile(inspectorTile);
            if (tile) tile.fadeIn = value;
        }

        // Shared "Fade in" inspector row, used by track pieces, lights and stops.
        function renderFadeInField() {
            if (!selectedTile || !supportsFadeIn(selectedTile.tileType)) return '';
            return `
                        <div class="inspector-field">
                            <label for="tileFadeIn">Fade in:</label>
                            <div class="stepper">
                                <button type="button" data-input="tileFadeIn" data-action="decrement">−</button>
                                <input type="number" id="tileFadeIn" min="0" max="50" step="1" value="${getSelectedFadeIn()}">
                                <button type="button" data-input="tileFadeIn" data-action="increment">+</button>
                            </div>
                        </div>`;
        }

        function getTrainId(tile) {
            if (!tile || !tile.trainId) return null;
            return tile.trainId;
        }

        function getTrainProperty(property, defaultValue) {
            if (!selectedTile) return defaultValue;
            const trainId = getTrainId(selectedTile);
            if (!trainId || !trainProperties[trainId]) return defaultValue;
            return trainProperties[trainId][property] !== undefined ? trainProperties[trainId][property] : defaultValue;
        }

        function setTrainProperty(property, value) {
            if (!inspectorTile) return;
            const trainId = getTrainId(inspectorTile);
            if (!trainId) return;

            if (!trainProperties[trainId]) {
                trainProperties[trainId] = {};
            }
            trainProperties[trainId][property] = value;
        }

        function setupTrainInputListeners() {
            const carsInput = document.getElementById('trainCars');
            const speedInput = document.getElementById('trainSpeed');

            if (carsInput) {
                carsInput.addEventListener('change', (e) => {
                    let value = parseInt(e.target.value);
                    const min = parseInt(e.target.min);
                    const max = parseInt(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    e.target.value = value;
                    setTrainProperty('cars', value);

                    // Rebuild inspector to update spacing inputs
                    draw();
                    updateInspector();
                });
            }

            if (speedInput) {
                speedInput.addEventListener('change', (e) => {
                    let value = parseFloat(e.target.value);
                    const min = parseFloat(e.target.min);
                    const max = parseFloat(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    value = Math.round(value * 10) / 10;
                    e.target.value = value;
                    setTrainProperty('speed', value);
                });
            }

            const spawnOnInput = document.getElementById('trainSpawnOn');
            if (spawnOnInput) {
                spawnOnInput.addEventListener('change', (e) => {
                    setTrainProperty('spawnOn', e.target.value);
                });
                spawnOnInput.addEventListener('input', (e) => {
                    setTrainProperty('spawnOn', e.target.value);
                });
            }

            const spawnDelayInput = document.getElementById('trainSpawnDelay');
            if (spawnDelayInput) {
                spawnDelayInput.addEventListener('change', (e) => {
                    let value = parseFloat(e.target.value);
                    if (isNaN(value) || value < 0) value = 0;
                    if (value > 9999) value = 9999;
                    value = Math.round(value * 10) / 10;
                    e.target.value = value;
                    setTrainProperty('spawnDelay', value);
                });
            }

            const fontSizeInput = document.getElementById('textFontSize');
            if (fontSizeInput) {
                fontSizeInput.addEventListener('change', (e) => {
                    let value = parseFloat(e.target.value);
                    const min = parseFloat(e.target.min);
                    const max = parseFloat(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    value = Math.round(value * 10) / 10;
                    e.target.value = value;
                    setTextFontSize(value);

                    // Redraw to update font size
                    draw();
                    drawInspectorGrid();
                });
            }

            // Setup stepper buttons. Scoped to the inspector, whose markup is
            // rebuilt each time — a page-wide query would stack duplicate
            // listeners on the palette's stepper on every inspector refresh.
            document.querySelectorAll('#inspectorContent .stepper button').forEach(button => {
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    const inputId = button.dataset.input;
                    const action = button.dataset.action;
                    const input = document.getElementById(inputId);

                    if (!input) return;

                    let value = parseFloat(input.value);
                    const min = parseFloat(input.min);
                    const max = parseFloat(input.max);
                    const step = parseFloat(input.step) || 1;

                    if (action === 'increment' && value < max) {
                        value = Math.min(value + step, max);
                    } else if (action === 'decrement' && value > min) {
                        value = Math.max(value - step, min);
                    }

                    // Round to avoid floating point issues
                    value = Math.round(value * 10) / 10;
                    input.value = value;

                    // Trigger change event to save the value
                    input.dispatchEvent(new Event('change'));
                });
            });

            // Setup direction checkboxes
            document.querySelectorAll('.direction-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    if (e.target.checked) {
                        const direction = e.target.dataset.direction;
                        setTrainProperty('direction', direction);

                        // Uncheck all other checkboxes
                        document.querySelectorAll('.direction-checkbox').forEach(cb => {
                            if (cb !== e.target) {
                                cb.checked = false;
                            }
                        });

                        // Redraw grids
                        draw();
                        drawInspectorGrid();
                    } else {
                        // Don't allow unchecking - at least one must be selected
                        e.target.checked = true;
                    }
                });
            });

            // Setup spacing inputs
            document.querySelectorAll('.spacing-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    let value = parseInt(e.target.value);
                    const min = parseInt(e.target.min);
                    const max = parseInt(e.target.max);

                    if (isNaN(value) || value < min) value = min;
                    if (value > max) value = max;

                    e.target.value = value;
                    setSpacingValue(index, value);

                    draw();
                    drawInspectorGrid();
                });
            });

            // Setup drag checkboxes
            document.querySelectorAll('#dragCheckboxes .drag-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.carIndex);
                    setDragValue(index, e.target.checked);

                    // Redraw to show/hide drag lines
                    draw();
                    drawInspectorGrid();
                });
            });

            document.querySelectorAll('#mathfactsCheckboxes .drag-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.carIndex);
                    setMathFactValue(index, e.target.checked);
                    draw();
                    drawInspectorGrid();
                    rebuildMathFactsCheckboxes();
                });
            });

            // Setup text inputs
            document.querySelectorAll('.text-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    setTextValue(index, e.target.value);
                });

                input.addEventListener('input', (e) => {
                    const index = parseInt(e.target.dataset.index);
                    setTextValue(index, e.target.value);
                });
            });
        }

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) return; // Don't update hover while dragging

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isInGrid(mouseX, mouseY)) {
                const pos = getGridPosition(mouseX, mouseY);
                // Only check tiles on the current active layer
                const tile = getTileAtGrid(pos.x, pos.y, currentPaletteTab);

                if (tile) {
                    hoveredTile = { ...tile, layer: currentPaletteTab };
                    canvas.style.cursor = 'grab';
                } else {
                    hoveredTile = null;
                    canvas.style.cursor = 'pointer';
                }
            } else {
                hoveredTile = null;
                canvas.style.cursor = 'pointer';
            }

            draw();
        });

        canvas.addEventListener('mouseleave', () => {
            if (!isDragging) {
                hoveredTile = null;
                draw();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            // Flush any half-typed field before the selection moves
            commitPendingInspectorEdits();

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if clicking on existing tile on grid (only on current layer)
            if (isInGrid(mouseX, mouseY)) {
                const pos = getGridPosition(mouseX, mouseY);
                const tile = pickTileForClick(pos.x, pos.y);

                if (tile) {
                    // Select the tile
                    selectedTile = {
                        gridX: tile.gridX,
                        gridY: tile.gridY,
                        tileType: tile.tileType,
                        layer: currentPaletteTab,
                        trainId: tile.trainId // Preserve train ID
                    };
                    updateInspector();

                    isDragging = true;
                    draggedTile = {
                        tileType: tile.tileType,
                        color: tile.color, // Legacy support
                        fromPalette: false,
                        originalGridX: tile.gridX,
                        originalGridY: tile.gridY,
                        layer: currentPaletteTab,
                        trainId: tile.trainId, // Preserve train ID when dragging existing tile
                        fadeIn: tile.fadeIn // Preserve fade in when moving a track piece
                    };
                    // Remove from appropriate layer while dragging
                    if (currentPaletteTab === 'tracks') {
                        trackTiles = trackTiles.filter(t => t !== tile);
                    } else {
                        objectTiles = objectTiles.filter(t => t !== tile);
                    }
                    dragPixelX = mouseX - TILE_SIZE / 2;
                    dragPixelY = mouseY - TILE_SIZE / 2;
                    hoveredTile = null;
                    canvas.style.cursor = 'grabbing';
                    draw();
                } else {
                    // Clicking on empty space deselects
                    selectedTile = null;
                    updateInspector();
                    draw();
                }
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging || !draggedTile) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Update pixel position while dragging
            dragPixelX = mouseX - TILE_SIZE / 2;
            dragPixelY = mouseY - TILE_SIZE / 2;

            draw();
        });

        document.addEventListener('mouseup', (e) => {
            if (!isDragging || !draggedTile) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if dropped on grid
            if (isInGrid(mouseX, mouseY)) {
                const pos = getGridPosition(mouseX, mouseY);

                // Determine which layer to add to based on tile type
                const targetLayer = draggedTile.tileType && draggedTile.tileType.layer ?
                    draggedTile.tileType.layer : currentPaletteTab;

                // Remove any existing tile at this position on this layer
                if (targetLayer === 'tracks') {
                    trackTiles = trackTiles.filter(tile =>
                        tile.gridX !== pos.x || tile.gridY !== pos.y
                    );
                    // Add new tile to tracks layer
                    const newTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        color: draggedTile.color, // Legacy support
                        trainId: draggedTile.trainId // Preserve train ID
                    };
                    if (supportsFadeIn(draggedTile.tileType)) {
                        // New tiles adopt the palette's "Fade in" value; tiles
                        // dragged around the grid keep the value they already had.
                        newTile.fadeIn = draggedTile.fromPalette
                            ? getDefaultFadeIn()
                            : (draggedTile.fadeIn != null ? draggedTile.fadeIn : 0);
                    }
                    trackTiles.push(newTile);

                    // Update selection to new position
                    selectedTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        layer: targetLayer,
                        trainId: draggedTile.trainId
                    };
                } else {
                    // Trains stack: any number can share a square, so dropping one
                    // displaces nothing. Anything else still replaces the square.
                    if (!draggedTile.tileType || draggedTile.tileType.id !== 'train') {
                        objectTiles = objectTiles.filter(tile =>
                            tile.gridX !== pos.x || tile.gridY !== pos.y
                        );
                    }
                    // Add new tile to objects layer
                    const newTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        color: draggedTile.color, // Legacy support
                        trainId: draggedTile.trainId // Preserve train ID
                    };
                    objectTiles.push(newTile);

                    // Update selection to new position
                    selectedTile = {
                        gridX: pos.x,
                        gridY: pos.y,
                        tileType: draggedTile.tileType,
                        layer: targetLayer,
                        trainId: draggedTile.trainId
                    };

                    // If this is a train, validate direction for the new track
                    if (draggedTile.tileType && draggedTile.tileType.id === 'train' && draggedTile.trainId) {
                        const trackUnder = getTileAtGrid(pos.x, pos.y, 'tracks');
                        const availableDirections = getDirectionOptionsForTrack(trackUnder);
                        const currentDirection = trainProperties[draggedTile.trainId] && trainProperties[draggedTile.trainId].direction;

                        // If current direction is not available for this track, choose a new one
                        if (availableDirections.length > 0 && !availableDirections.includes(currentDirection)) {
                            if (!trainProperties[draggedTile.trainId]) {
                                trainProperties[draggedTile.trainId] = {};
                            }
                            trainProperties[draggedTile.trainId].direction = availableDirections[0];
                        }

                        if (draggedTile.fromPalette) {
                            applyDefaultMathFact(draggedTile.trainId);
                        }
                    }
                }

                updateInspector();
            } else {
                // Dragged off grid, deselect
                selectedTile = null;
                updateInspector();
            }

            isDragging = false;
            draggedTile = null;
            hoveredTile = null;
            canvas.style.cursor = 'pointer';
            draw();
        });

        // Level management functions
        function saveLevel() {
            // Make sure a field still being edited is included in the save
            commitPendingInspectorEdits();

            const name = document.getElementById('levelName').value.trim() || 'Untitled Level';

            const isNewLevel = !levels[name];

            // Save tiles with only the tile type ID (not the full object with render function)
            const trackTilesToSave = trackTiles.map(tile => ({
                gridX: tile.gridX,
                gridY: tile.gridY,
                tileTypeId: tile.tileType ? tile.tileType.id : null,
                color: tile.color,  // Legacy support for old color-only tiles
                trainId: tile.trainId,
                fadeIn: tile.fadeIn
            }));

            const objectTilesToSave = objectTiles.map(tile => ({
                gridX: tile.gridX,
                gridY: tile.gridY,
                tileTypeId: tile.tileType ? tile.tileType.id : null,
                color: tile.color,  // Legacy support for old color-only tiles
                trainId: tile.trainId
            }));

            levels[name] = {
                name: name,
                trackTiles: trackTilesToSave,
                objectTiles: objectTilesToSave,
                tiles: trackTilesToSave, // Legacy support for old saves
                trainProperties: trainProperties, // Save train properties
                nextTrainId: nextTrainId, // Save next train ID
                lightPoleProperties: window.lightPoleProperties || {}, // Save light pole properties
                timestamp: Date.now()
            };

            if (isNewLevel) {
                levelOrder.push(name);
            }

            currentLevelName = name;
            saveLevelToFile(name);
            if (isNewLevel) {
                saveLevelOrder();
            }
            updateLevelList();
        }

        function newLevel() {
            if ((trackTiles.length > 0 || objectTiles.length > 0) && !confirm('Create a new level? Unsaved changes will be lost.')) {
                return;
            }

            trackTiles = [];
            objectTiles = [];
            selectedTile = null;
            trainProperties = {};
            nextTrainId = 1;
            window.lightPoleProperties = {};
            currentLevelName = 'Untitled Level';
            document.getElementById('levelName').value = currentLevelName;
            updateInspector();
            draw();
        }

        function loadLevel(name) {
            if (!levels[name]) return;

            // Commit a half-typed field against the level it belongs to
            commitPendingInspectorEdits();

            // Load track tiles
            const savedTrackTiles = levels[name].trackTiles || levels[name].tiles || [];
            trackTiles = savedTrackTiles.map(tile => {
                // Find the tile type definition by ID
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);

                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    color: tile.color,  // Legacy support for old color-only tiles
                    trainId: tile.trainId,
                    fadeIn: tile.fadeIn
                };
            });

            // Load object tiles
            const savedObjectTiles = levels[name].objectTiles || [];
            objectTiles = savedObjectTiles.map(tile => {
                // Find the tile type definition by ID
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);

                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    color: tile.color,  // Legacy support for old color-only tiles
                    trainId: tile.trainId
                };
            });

            // Load train properties and next ID
            trainProperties = levels[name].trainProperties || {};
            nextTrainId = levels[name].nextTrainId || 1;

            // Load light pole properties
            window.lightPoleProperties = levels[name].lightPoleProperties || {};

            selectedTile = null;
            currentLevelName = name;
            document.getElementById('levelName').value = name;
            updateInspector();
            draw();
            updateLevelList();
        }

        function deleteLevel(name) {
            if (!confirm(`Delete level "${name}"?`)) {
                return;
            }

            delete levels[name];
            levelOrder = levelOrder.filter(n => n !== name);
            deleteLevelFile(name);
            saveLevelOrder();

            if (currentLevelName === name) {
                newLevel();
            }

            updateLevelList();
        }

        function autoScrollLoop() {
            if (!autoScrollActive) return;

            const listEl = document.getElementById('levelList');
            if (listEl && autoScrollSpeed !== 0) {
                listEl.scrollTop += autoScrollSpeed;
            }

            scrollAnimationFrame = requestAnimationFrame(autoScrollLoop);
        }

        function handleListDragOver(e) {
            e.preventDefault();

            const listEl = document.getElementById('levelList');
            const rect = listEl.getBoundingClientRect();
            const mouseY = e.clientY;
            const scrollThreshold = 150;

            // Scroll down if near bottom
            if (mouseY > rect.bottom - scrollThreshold && mouseY <= rect.bottom) {
                const distance = rect.bottom - mouseY;
                const speedMultiplier = 1 - (distance / scrollThreshold);
                autoScrollSpeed = 3 + (speedMultiplier * 30); // Speed ranges from 3 to 33

                if (!autoScrollActive) {
                    autoScrollActive = true;
                    autoScrollLoop();
                }
            }
            // Scroll up if near top
            else if (mouseY < rect.top + scrollThreshold && mouseY >= rect.top) {
                const distance = mouseY - rect.top;
                const speedMultiplier = 1 - (distance / scrollThreshold);
                autoScrollSpeed = -(3 + (speedMultiplier * 30)); // Speed ranges from -3 to -33

                if (!autoScrollActive) {
                    autoScrollActive = true;
                    autoScrollLoop();
                }
            }
            else {
                autoScrollSpeed = 0;
                autoScrollActive = false;
                if (scrollAnimationFrame) {
                    cancelAnimationFrame(scrollAnimationFrame);
                    scrollAnimationFrame = null;
                }
            }
        }

        function updateLevelList() {
            const listEl = document.getElementById('levelList');
            listEl.innerHTML = '';

            // Remove old event listeners by cloning
            const newListEl = listEl.cloneNode(false);
            listEl.parentNode.replaceChild(newListEl, listEl);

            if (levelOrder.length === 0) {
                newListEl.innerHTML = '<div style="padding: 20px; text-align: center; color: #888;">No saved levels</div>';
                return;
            }

            // Add dragover to the list container
            newListEl.addEventListener('dragover', handleListDragOver);
            newListEl.addEventListener('dragleave', (e) => {
                if (e.target === newListEl) {
                    autoScrollSpeed = 0;
                    autoScrollActive = false;
                    if (scrollAnimationFrame) {
                        cancelAnimationFrame(scrollAnimationFrame);
                        scrollAnimationFrame = null;
                    }
                }
            });
            newListEl.addEventListener('drop', (e) => {
                autoScrollSpeed = 0;
                autoScrollActive = false;
                if (scrollAnimationFrame) {
                    cancelAnimationFrame(scrollAnimationFrame);
                    scrollAnimationFrame = null;
                }

                // Handle dropping on the container itself (for top/bottom placement)
                if (e.target === newListEl || e.target.id === 'levelList') {
                    const draggedName = e.dataTransfer.getData('text/plain');
                    if (draggedName) {
                        const rect = newListEl.getBoundingClientRect();
                        const mouseY = e.clientY;

                        // Remove from current position
                        const draggedIndex = levelOrder.indexOf(draggedName);
                        if (draggedIndex !== -1) {
                            levelOrder.splice(draggedIndex, 1);

                            // Add to top or bottom based on mouse position
                            if (mouseY < rect.top + rect.height / 2) {
                                // Drop at top
                                levelOrder.unshift(draggedName);
                            } else {
                                // Drop at bottom
                                levelOrder.push(draggedName);
                            }

                            saveLevelOrder();
                            updateLevelList();
                        }
                    }
                }
            });

            levelOrder.forEach((name, index) => {
                if (!levels[name]) return; // Skip if level was deleted

                const level = levels[name];
                const item = document.createElement('div');
                item.className = 'level-item';
                item.draggable = true;
                item.dataset.levelName = name;
                item.dataset.index = index;

                if (name === currentLevelName) {
                    item.classList.add('active');
                }

                const contentDiv = document.createElement('div');
                contentDiv.className = 'level-item-content';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'level-item-check';
                checkbox.checked = isLevelCheckedForExport(name);
                checkbox.title = 'Include in export';
                // Don't let ticking the box also load the level or start a drag.
                checkbox.addEventListener('mousedown', (e) => e.stopPropagation());
                checkbox.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setLevelCheckedForExport(name, checkbox.checked);
                });

                const nameDiv = document.createElement('div');
                nameDiv.className = 'level-item-name';
                nameDiv.textContent = name;

                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = 'Delete';
                deleteBtn.className = 'danger';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    deleteLevel(name);
                };

                contentDiv.appendChild(checkbox);
                contentDiv.appendChild(nameDiv);
                contentDiv.appendChild(deleteBtn);
                item.appendChild(contentDiv);

                // Drag events
                item.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', name);
                });

                item.addEventListener('dragend', (e) => {
                    e.stopPropagation();
                    item.classList.remove('dragging');
                    document.querySelectorAll('.level-item').forEach(el => {
                        el.classList.remove('drag-over');
                    });

                    // Stop auto-scrolling
                    autoScrollSpeed = 0;
                    autoScrollActive = false;
                    if (scrollAnimationFrame) {
                        cancelAnimationFrame(scrollAnimationFrame);
                        scrollAnimationFrame = null;
                    }
                });

                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    e.dataTransfer.dropEffect = 'move';

                    const dragging = document.querySelector('.level-item.dragging');
                    if (dragging && dragging !== item) {
                        item.classList.add('drag-over');
                    }
                });

                item.addEventListener('dragleave', (e) => {
                    e.stopPropagation();
                    item.classList.remove('drag-over');
                });

                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    item.classList.remove('drag-over');

                    const draggedName = e.dataTransfer.getData('text/plain');
                    const targetName = name;

                    if (draggedName !== targetName) {
                        // Reorder the levelOrder array
                        const draggedIndex = levelOrder.indexOf(draggedName);
                        const targetIndex = levelOrder.indexOf(targetName);

                        levelOrder.splice(draggedIndex, 1);
                        levelOrder.splice(targetIndex, 0, draggedName);

                        saveLevelOrder();
                        updateLevelList();
                    }
                });

                item.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') {
                        loadLevel(name);
                    }
                });

                newListEl.appendChild(item);
            });
        }

        // Which levels are ticked for export. Levels are included by default, so
        // an untouched list exports everything; unticking is what's remembered.
        const uncheckedForExport = new Set();

        function isLevelCheckedForExport(name) {
            return !uncheckedForExport.has(name);
        }

        function setLevelCheckedForExport(name, checked) {
            if (checked) {
                uncheckedForExport.delete(name);
            } else {
                uncheckedForExport.add(name);
            }
        }

        // Build a standalone html file from the ticked levels, in list order.
        async function exportLevels() {
            const btn = document.getElementById('exportBtn');
            const names = levelOrder.filter(name => levels[name] && isLevelCheckedForExport(name));

            if (names.length === 0) {
                alert('Tick at least one level to export.');
                return;
            }

            const exportName = document.getElementById('exportName').value.trim() || 'test_game';
            const originalLabel = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Exporting…';

            try {
                const res = await fetch('/api/export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: exportName, levels: names })
                });
                const result = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(result.error || `Server responded ${res.status}`);

                btn.textContent = 'Exported!';
                setTimeout(() => { btn.textContent = originalLabel; }, 1500);
                console.log(`Exported ${result.levels} level(s) to ${result.file}`);
            } catch (e) {
                btn.textContent = originalLabel;
                levelApiError(`export levels to "${exportName}"`, e);
            } finally {
                btn.disabled = false;
            }
        }

        // Levels live as JSON files in the levels/ folder, served by server.js.
        function levelApiError(action, e) {
            console.error(`Failed to ${action}:`, e);
            alert(`Failed to ${action}.\n\n${e.message}\n\nMake sure the game is opened through the level server:\n  python3 server.py\n  http://localhost:8080/game.html`);
        }

        async function saveLevelToFile(name) {
            try {
                const res = await fetch(`/api/levels/${encodeURIComponent(name)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(levels[name])
                });
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
            } catch (e) {
                levelApiError(`save level "${name}"`, e);
            }
        }

        async function deleteLevelFile(name) {
            try {
                const res = await fetch(`/api/levels/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
            } catch (e) {
                levelApiError(`delete level "${name}"`, e);
            }
        }

        async function saveLevelOrder() {
            try {
                const res = await fetch('/api/order', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(levelOrder)
                });
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
            } catch (e) {
                levelApiError('save level order', e);
            }
        }

        async function loadLevelsFromFiles() {
            try {
                const res = await fetch('/api/levels');
                if (!res.ok) throw new Error(`Server responded ${res.status}`);
                const data = await res.json();
                levels = data.levels || {};
                levelOrder = (data.order || []).filter(name => levels[name]);
                for (const name of Object.keys(levels)) {
                    if (!levelOrder.includes(name)) levelOrder.push(name);
                }
                return true;
            } catch (e) {
                levels = {};
                levelOrder = [];
                levelApiError('load levels from the levels/ folder', e);
                return false;
            }
        }

        // One-time migration: push any levels still sitting in localStorage
        // (from before file storage) into the levels/ folder.
        async function migrateLocalStorageLevels() {
            const stored = localStorage.getItem('gameLevels');
            if (!stored) return false;

            let oldLevels, oldOrder;
            try {
                oldLevels = JSON.parse(stored);
                oldOrder = JSON.parse(localStorage.getItem('gameLevelOrder') || 'null');
            } catch (e) {
                console.error('Could not parse legacy localStorage levels:', e);
                return false;
            }

            const names = Object.keys(oldLevels || {});
            if (names.length === 0) {
                localStorage.removeItem('gameLevels');
                localStorage.removeItem('gameLevelOrder');
                return false;
            }

            const migrated = [];
            for (const name of names) {
                if (levels[name]) continue; // A file already exists, leave it alone
                levels[name] = oldLevels[name];
                if (!levelOrder.includes(name)) levelOrder.push(name);
                await saveLevelToFile(name);
                migrated.push(name);
            }

            if (Array.isArray(oldOrder)) {
                const ordered = oldOrder.filter(name => levels[name]);
                for (const name of levelOrder) {
                    if (!ordered.includes(name)) ordered.push(name);
                }
                levelOrder = ordered;
            }
            await saveLevelOrder();

            localStorage.removeItem('gameLevels');
            localStorage.removeItem('gameLevelOrder');

            if (migrated.length > 0) {
                console.log(`Migrated ${migrated.length} level(s) from browser storage to levels/`);
            }
            return migrated.length > 0;
        }

        function runLevel() {
            // Serialize current level data
            const levelData = {
                trackTiles: trackTiles.map(tile => ({
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileTypeId: tile.tileType ? tile.tileType.id : null,
                    trainId: tile.trainId,
                    fadeIn: tile.fadeIn
                })),
                objectTiles: objectTiles.map(tile => ({
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileTypeId: tile.tileType ? tile.tileType.id : null,
                    trainId: tile.trainId
                })),
                trainProperties: trainProperties,
                nextTrainId: nextTrainId,
                lightPoleProperties: window.lightPoleProperties || {}
            };

            // Store in sessionStorage for the new window to access
            sessionStorage.setItem('runLevelData', JSON.stringify(levelData));

            // Open new window in run mode
            const runUrl = window.location.href.split('?')[0] + '?mode=run';
            window.open(runUrl, '_blank');
        }

        // Populate trackTiles/objectTiles/trainProperties/etc. (run mode) from a
        // serialized level in the shape produced by runLevel() above.
        function applyRunLevelData(levelData) {
            trackTiles = levelData.trackTiles.map(tile => {
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);
                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    trainId: tile.trainId,
                    fadeIn: tile.fadeIn
                };
            });

            objectTiles = levelData.objectTiles.map(tile => {
                const tileType = TILE_TYPES.find(t => t.id === tile.tileTypeId);
                return {
                    gridX: tile.gridX,
                    gridY: tile.gridY,
                    tileType: tileType || null,
                    trainId: tile.trainId
                };
            });

            trainProperties = levelData.trainProperties || {};
            nextTrainId = levelData.nextTrainId || 1;
            window.lightPoleProperties = levelData.lightPoleProperties || {};
        }

        // Restore run mode back to the level as it was when this window opened.
        // --- Tile fade-in -------------------------------------------------
        // How visible a tile currently is. Only run mode hides anything; the
        // editor always shows every tile at full opacity.
        function getTileAlpha(tile) {
            if (!isRunMode || !tile) return 1;
            return tile.fadeAlpha != null ? tile.fadeAlpha : 1;
        }

        function isTileVisible(tile) {
            return getTileAlpha(tile) > 0;
        }

        // Hide every tile waiting on a solve count. Call before computing lit
        // points so hidden lights and rails don't light the level early.
        function initTileFadeIn() {
            tileFadeAnim = null;
            trackTiles.forEach(tile => {
                tile.fadeAlpha = (tile.fadeIn && tile.fadeIn > 0) ? 0 : 1;
            });
        }

        // Reveal every hidden tile whose "fade in" matches the new solve count.
        // Returns true if a reveal started.
        function startTileFadeIn() {
            const revealing = trackTiles.filter(tile =>
                tile.fadeIn === solved_count && getTileAlpha(tile) < 1);

            if (revealing.length === 0) return false;

            revealing.forEach(tile => { tile.fadeAlpha = 0; });
            tileFadeAnim = { tiles: revealing, frame: 0 };
            return true;
        }

        // Trains already running keep moving through a reveal, but the player
        // can't touch anything until the track they'd be acting on is there.
        function isTileFadeBlockingInput() {
            return isRunMode && tileFadeAnim !== null;
        }

        function updateTileFadeIn() {
            if (!tileFadeAnim) return;

            tileFadeAnim.frame += dt;
            const progress = Math.min(1, tileFadeAnim.frame / TILE_FADE_IN_DURATION);
            tileFadeAnim.tiles.forEach(tile => { tile.fadeAlpha = progress; });

            if (progress >= 1) {
                tileFadeAnim = null;
                // Newly visible track and lights change the lighting.
                persistentLitPoints = addInterpolatedLitPoints(computeLitPoints());
            }
        }

        function resetLevel() {

            if (maxW / maxH > aspect) {

    <script>
        // ------------------------------------------------------------------
        // Standalone export: plays the embedded levels back to back, with a
        // "Level X" card before each one and "Nice job!" after the last.
        // ------------------------------------------------------------------
        const EXPORT_TITLE_FADE_IN = 550;   // ms, scrim + text fading up
        const EXPORT_TITLE_HOLD = 950;      // ms the card sits at full opacity
        const EXPORT_TITLE_FADE_OUT = 550;  // ms fading back to the board
        const EXPORT_CLEAR_PAUSE = 850;     // ms beat after a level is solved
        const EXPORT_FINISH_FADE_IN = 900;  // ms for the "Nice job!" card

        let exportLevelIndex = 0;
        let exportPendingLevelIndex = null; // level to swap in mid-card
        let exportTitleNumber = 1;          // number shown on the current card
        let exportPhase = 'title';          // title | playing | clearing | finished
        let exportPhaseStart = 0;
        let exportSwapDone = false;
        let exportPendingSpawns = 0;
        let exportGeneration = 0;           // invalidates timers from an old level
        let exportIsFirstTitle = true;      // the very first card: nothing behind it yet

        function exportSetPhase(phase) {
            exportPhase = phase;
            exportPhaseStart = performance.now();
            exportSwapDone = false;
        }

        function exportLoadLevel(index) {
            exportLevelIndex = index;
            exportGeneration++;
            exportPendingSpawns = 0;
            // resetLevel() rebuilds the board from initialRunLevelData and clears
            // keypad/selection/drag state, which is exactly what a level swap needs.
            initialRunLevelData = EXPORT_LEVELS[index].data;
            resetLevel();
        }

        function exportStartSequence() {
            exportLevelIndex = 0;
            exportTitleNumber = 1;
            exportPendingLevelIndex = null;
            exportSetPhase('title');
        }

        // A level is done once nothing solvable is left: no math facts on any
        // train and no delayed spawn still in flight.
        //
        // Deliberately does NOT wait on templates whose spawnOn is above the
        // current solved_count. solved_count only rises by solving a fact, so
        // once the board holds no facts those spawns can never fire — waiting on
        // them hangs the level. (A train set to spawnOn "0,2" whose second
        // trigger is unreachable is exactly this case.)
        function exportLevelIsComplete() {
            if (runModeState !== 'gameplay' || feedbackAnim) return false;
            if (exportPendingSpawns > 0) return false;
            // A tile reveal is playing, or a spawn animation is still running
            // before its train appears.
            if (tileFadeAnim || spawnAnimations.length > 0) return false;
            for (const train of trainAnimations) {
                if (train.mathFacts && train.mathFacts.some(v => v)) return false;
            }
            return true;
        }

        function exportUpdatePhase() {
            const elapsed = performance.now() - exportPhaseStart;

            if (exportPhase === 'title') {
                // Swap the board while the card is fully opaque, so the change
                // happens behind the scrim rather than in front of the player.
                if (!exportSwapDone && elapsed >= EXPORT_TITLE_FADE_IN) {
                    if (exportPendingLevelIndex !== null) {
                        exportLoadLevel(exportPendingLevelIndex);
                        exportPendingLevelIndex = null;
                    }
                    exportSwapDone = true;
                }
                if (elapsed >= EXPORT_TITLE_FADE_IN + EXPORT_TITLE_HOLD + EXPORT_TITLE_FADE_OUT) {
                    exportSetPhase('playing');
                    exportIsFirstTitle = false;
                }
            } else if (exportPhase === 'playing') {
                if (exportLevelIsComplete()) exportSetPhase('clearing');
            } else if (exportPhase === 'clearing') {
                if (elapsed >= EXPORT_CLEAR_PAUSE) {
                    if (exportLevelIndex + 1 < EXPORT_LEVELS.length) {
                        exportPendingLevelIndex = exportLevelIndex + 1;
                        exportTitleNumber = exportLevelIndex + 2;
                        exportSetPhase('title');
                    } else {
                        exportSetPhase('finished');
                    }
                }
            }
        }

        function exportOverlayAlpha() {
            const elapsed = performance.now() - exportPhaseStart;
            if (exportPhase === 'title') {
                if (elapsed < EXPORT_TITLE_FADE_IN) return elapsed / EXPORT_TITLE_FADE_IN;
                if (elapsed < EXPORT_TITLE_FADE_IN + EXPORT_TITLE_HOLD) return 1;
                const out = elapsed - EXPORT_TITLE_FADE_IN - EXPORT_TITLE_HOLD;
                return Math.max(0, 1 - out / EXPORT_TITLE_FADE_OUT);
            }
            if (exportPhase === 'finished') {
                return Math.min(1, elapsed / EXPORT_FINISH_FADE_IN);
            }
            return 0;
        }

        // The scrim behind the text. Normally it crossfades in step with the
        // text (exportOverlayAlpha), covering whatever level was just cleared.
        // For the very first card there's nothing to cover yet, so instead of
        // fading up from a transparent board it snaps straight to opaque and
        // only the text fades in on top of it.
        function exportScrimAlpha() {
            if (exportPhase === 'title' && exportIsFirstTitle) {
                const elapsed = performance.now() - exportPhaseStart;
                if (elapsed < EXPORT_TITLE_FADE_IN + EXPORT_TITLE_HOLD) return 1;
                const out = elapsed - EXPORT_TITLE_FADE_IN - EXPORT_TITLE_HOLD;
                return Math.max(0, 1 - out / EXPORT_TITLE_FADE_OUT);
            }
            return exportOverlayAlpha();
        }

        function exportDrawOverlay(ctx) {
            const textAlpha = exportOverlayAlpha();
            const scrimAlpha = exportScrimAlpha();
            if (textAlpha <= 0 && scrimAlpha <= 0) return;

            const text = exportPhase === 'finished' ? 'Nice job!' : ('Level ' + exportTitleNumber);

            ctx.save();
            ctx.globalAlpha = scrimAlpha;
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, CAMERA_WIDTH, CAMERA_HEIGHT);
            ctx.restore();

            ctx.save();
            ctx.globalAlpha = textAlpha;
            ctx.font = "600 46pt 'Nunito'";
            ctx.fillStyle = '#4ECEC5';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            // Optically centre using real glyph metrics, as the keypad does.
            const metrics = ctx.measureText(text);
            const ascent = metrics.actualBoundingBoxAscent;
            const descent = metrics.actualBoundingBoxDescent;
            ctx.fillText(text, CAMERA_WIDTH / 2, CAMERA_HEIGHT / 2 + ascent - (ascent + descent) / 2);
            ctx.restore();
        }

        // Trains only move while the board is actually being played.
        const exportOriginalUpdateTrains = updateTrainAnimations;
        updateTrainAnimations = function () {
            if (exportPhase === 'playing') exportOriginalUpdateTrains();
        };

        // Likewise hold spawn animations, so a level's opening spawn plays in
        // full once the "Level X" card lifts rather than behind it.
        const exportOriginalUpdateSpawns = updateSpawnAnimations;
        updateSpawnAnimations = function () {
            if (exportPhase === 'playing') exportOriginalUpdateSpawns();
        };

        // Same spawn behaviour as the original, plus tracking of delayed spawns
        // so a level isn't called complete while one is still pending.
        checkSpawnOnSolvedCount = function () {
            const generation = exportGeneration;
            trainSpawnTemplates.forEach(template => {
                if (!template.spawnOnValues.includes(solved_count)) return;
                if (template.spawnDelay > 0) {
                    exportPendingSpawns++;
                    setTimeout(() => {
                        if (generation !== exportGeneration) return; // level changed
                        exportPendingSpawns--;
                        spawnTrainInstance(template);
                    }, template.spawnDelay * 1000);
                } else {
                    spawnTrainInstance(template);
                }
            });
        };

        // Advance the sequence and paint the card on top of the finished frame.
        const exportOriginalDraw = draw;
        draw = function () {
            exportUpdatePhase();
            exportOriginalDraw();
            exportDrawOverlay(ctx);
        };

        // Swallow input unless the level is actually in play. Capture phase on
        // window runs before the canvas listeners regardless of setup order.
        ['mousedown', 'mousemove', 'mouseup', 'click', 'contextmenu'].forEach(type => {
            window.addEventListener(type, e => {
                if (exportPhase !== 'playing') e.stopPropagation();
            }, true);
        });
        window.addEventListener('wheel', e => {
            if (exportPhase !== 'playing') {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
            }
        }, { capture: true, passive: false });
    </script>
</body>
</html>
