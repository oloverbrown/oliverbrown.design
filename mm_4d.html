                    const trainData = getTrainCarPixelPositions(tile, trainId);
                    const carPixelPositions = trainData.positions;

                    // Draw gray connection stroke beneath cars
                    if (carPixelPositions.length > 1 && trainData.path.length >= 2) {
                        drawPathStroke(ctx, trainData.path, 0, trainData.lastCarDistance, '#252525', 14);
                    }

                    // Draw each car with orientation
                    const dragLinesType = TILE_TYPES.find(t => t.id === 'drag_lines_car');
                    carPixelPositions.forEach((pos, i) => {
                        if (pos.x >= offsetX - TILE_SIZE && pos.x < offsetX + gridWidth + TILE_SIZE &&
                            pos.y >= offsetY - TILE_SIZE && pos.y < offsetY + gridHeight + TILE_SIZE) {
                            const size = TILE_SIZE - 4;
                            ctx.save();
                            ctx.translate(pos.x, pos.y);
                            ctx.rotate(pos.angle || 0);
                            tile.tileType.render(ctx, -size / 2, -size / 2, size);
                            ctx.restore();
                        }
                    });

                    // Draw black connection stroke on top of cars
                    if (carPixelPositions.length > 1 && trainData.path.length >= 2) {
                        drawPathStroke(ctx, trainData.path, 0, trainData.lastCarDistance);
                    }

                    // Draw drag lines on top of everything
                    carPixelPositions.forEach((pos, i) => {
                        if (pos.x >= offsetX - TILE_SIZE && pos.x < offsetX + gridWidth + TILE_SIZE &&
                            pos.y >= offsetY - TILE_SIZE && pos.y < offsetY + gridHeight + TILE_SIZE) {
                            const dragEnabled = trainId && trainProperties[trainId] && trainProperties[trainId].drag && trainProperties[trainId].drag[i];
                            if (dragEnabled && dragLinesType) {
                                const size = TILE_SIZE - 4;
                                ctx.save();
                                ctx.translate(pos.x, pos.y);
                                ctx.rotate(pos.angle || 0);
                                dragLinesType.render(ctx, -size / 2, -size / 2, size);
                                ctx.restore();
                            }
                        }
                    });

                } else if (tile.tileType) {
                    if (tile.tileType.type === 'solid') {
                        ctx.fillStyle = tile.tileType.color;
                        ctx.fillRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (tile.tileType.type === 'custom' && tile.tileType.render) {
                        tile.tileType.render(ctx, pixelX + 2, pixelY + 2, TILE_SIZE - 4);
                    }
                } else {
                    // Legacy color-only tiles
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                }

                // Draw border if this tile is hovered and we're on objects tab
                if (hoveredTile && hoveredTile.gridX === tile.gridX && hoveredTile.gridY === tile.gridY &&
                    hoveredTile.layer === 'objects' && currentPaletteTab === 'objects') {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                }

                // Draw border if this tile is selected
                if (selectedTile && selectedTile.gridX === tile.gridX && selectedTile.gridY === tile.gridY &&
                    selectedTile.layer === 'objects') {
                    ctx.strokeStyle = '#4ecdc4';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                }
            });

            // Draw dragged tile
            if (isDragging && draggedTile) {
                if (draggedTile.tileType) {
                    // Use the original grid position if dragging from grid, otherwise null
                    const dragGridX = draggedTile.originalGridX !== undefined ? draggedTile.originalGridX : null;
                    const dragGridY = draggedTile.originalGridY !== undefined ? draggedTile.originalGridY : null;

                    if (draggedTile.tileType.type === 'solid') {
                        ctx.fillStyle = draggedTile.tileType.color;
                        ctx.fillRect(dragPixelX, dragPixelY, TILE_SIZE, TILE_SIZE);
                    } else if (draggedTile.tileType.type === 'track' && draggedTile.tileType.render) {
                        // Track tiles render edge to edge
                        draggedTile.tileType.render(ctx, dragPixelX, dragPixelY, TILE_SIZE, false, dragGridX, dragGridY);
                    } else if (draggedTile.tileType.type === 'custom' && draggedTile.tileType.render) {
                        draggedTile.tileType.render(ctx, dragPixelX, dragPixelY, TILE_SIZE, false, dragGridX, dragGridY);
                    }
                } else {
                    // Legacy color-only
                    ctx.fillStyle = draggedTile.color;
                    ctx.fillRect(dragPixelX, dragPixelY, TILE_SIZE, TILE_SIZE);
                }

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(dragPixelX, dragPixelY, TILE_SIZE, TILE_SIZE);
            }

            // Draw animated trains in run mode
            if (isRunMode) {
                drawAnimatedTrains(ctx);
            }

            // Compute lit value for each train car
            computeTrainCarLit(litPoints);

            // Draw lighting overlay on train connectors and cars in run mode
            if (isRunMode) {
                lightTrainConnectors(ctx, litPoints);
                lightTrainCars(ctx);
            }

            // Draw train text as the very last layer
            drawTrainText(ctx);

            // Stack badges go above the train text, which would otherwise be
            // drawn straight over the number in the middle of the square
            drawTrainStackBadges(ctx);

            // Spawn animations sit on top, still in world space
            if (isRunMode) {
                drawSpawnAnimations(ctx);
            }

            // Restore transform in run mode
            if (isRunMode) {
                ctx.restore();

                // Draw keypad UI in screen space
                updateKeypadAnimation();
                drawKeypad(ctx);

                // Draw feedback animation in screen space
                drawFeedbackAnimation(ctx);
            }
        }

        function getGridPosition(mouseX, mouseY) {
            const gridX = Math.floor((mouseX - offsetX) / TILE_SIZE);
            const gridY = Math.floor((mouseY - offsetY) / TILE_SIZE);

            // Clamp to grid bounds
            const clampedX = Math.max(0, Math.min(GRID_COLS - 1, gridX));
            const clampedY = Math.max(0, Math.min(GRID_ROWS - 1, gridY));

            return { x: clampedX, y: clampedY };
        }

        function isInGrid(mouseX, mouseY) {
            return mouseX >= offsetX && mouseX < offsetX + gridWidth &&
                   mouseY >= offsetY && mouseY < offsetY + gridHeight;
        }

        let paletteTiles = [];
        let currentPaletteTab = 'objects';

        function createPalette() {
            // Create tracks palette
            const tracksGrid = document.getElementById('tracksGrid');
            tracksGrid.innerHTML = '';

            // Create objects palette
            const objectsGrid = document.getElementById('objectsGrid');
            objectsGrid.innerHTML = '';

            TILE_TYPES.forEach((tileType, index) => {
                // Skip drag_lines_car - it's only used as an overlay, not a placeable tile
                if (tileType.id === 'drag_lines_car') return;
                // Skip sprite-only tiles - they're only used as sprites, not placeable tiles
                if (tileType.id === 'mm_light_pole' || tileType.id === 'mm_light' ||
                    tileType.id === 'lit_rails_straight' || tileType.id === 'lit_rails_curve' ||
                    tileType.id === 'mm_stop_background' || tileType.id === 'mm_stop_light1' || tileType.id === 'mm_stop_light2') return;

                const tile = document.createElement('canvas');
                tile.className = 'palette-tile';
                tile.width = 60;
                tile.height = 60;
                tile.dataset.tileIndex = index;

                const tileCtx = tile.getContext('2d');

                // Draw tile preview
                tileCtx.fillStyle = '#1a1a1a';
                tileCtx.fillRect(0, 0, 60, 60);

                if (tileType.type === 'solid') {
                    tileCtx.fillStyle = tileType.color;
                    tileCtx.fillRect(2, 2, 56, 56);
                } else if (tileType.type === 'track' && tileType.render) {
                    // Track tiles render edge to edge in preview too
                    tileType.render(tileCtx, 0, 0, 60, true, null, null);
                } else if (tileType.type === 'custom' && tileType.render) {
                    tileType.render(tileCtx, 2, 2, 56, true, null, null);
                }

                // Add to appropriate grid based on layer
                if (tileType.layer === 'tracks') {
                    tracksGrid.appendChild(tile);
                } else if (tileType.layer === 'objects') {
                    objectsGrid.appendChild(tile);
                }

                // Store position info
                paletteTiles.push({
                    element: tile,
                    tileType: tileType,
                    index: index
                });

                // Add mouse events
                tile.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    draggedTile = {
                        tileType: tileType,
                        fromPalette: true,
                        // Assign new train ID if dragging a train from palette
                        trainId: tileType.id === 'train' ? nextTrainId++ : undefined
                    };

                    const rect = canvas.getBoundingClientRect();
                    dragPixelX = e.clientX - rect.left - TILE_SIZE / 2;
                    dragPixelY = e.clientY - rect.top - TILE_SIZE / 2;

                    draw();
                });
            });
        }

        function switchPaletteTab(tabName) {
            currentPaletteTab = tabName;

            // Update tab buttons
            document.querySelectorAll('.palette-tab').forEach(tab => {
                if (tab.dataset.tab === tabName) {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            // Update panel visibility
            document.querySelectorAll('.palette-panel').forEach(panel => {
                if (panel.id === tabName + 'Panel') {
                    panel.classList.add('active');
                } else {
                    panel.classList.remove('active');
                }
            });
        }

        function getTileAtGrid(gridX, gridY, layer) {
            const tiles = layer === 'tracks' ? trackTiles : objectTiles;
            return tiles.find(tile => tile.gridX === gridX && tile.gridY === gridY);
        }

        // Any number of trains can share a square on the objects layer. Sorted by
        // train ID so the stack order — and therefore click cycling — stays put
        // even as tiles are pulled out of the array and pushed back while dragging.
        function getTrainStackAt(gridX, gridY) {
            return objectTiles
                .filter(tile => tile.gridX === gridX && tile.gridY === gridY &&
                                tile.tileType && tile.tileType.id === 'train')
                .sort((a, b) => (a.trainId || 0) - (b.trainId || 0));
        }

        // Authoring aid for squares holding more than one train: a count badge in
        // the upper left, plus which one of them the inspector is showing.
        function drawTrainStackBadges(ctx) {
            if (isRunMode) return;

            const drawn = new Set();
            objectTiles.forEach(tile => {
                if (!tile.tileType || tile.tileType.id !== 'train') return;

                const key = tile.gridX + ',' + tile.gridY;
                if (drawn.has(key)) return;
                drawn.add(key);

                const stack = getTrainStackAt(tile.gridX, tile.gridY);
                if (stack.length < 2) return;

                const pixelX = offsetX + tile.gridX * TILE_SIZE;
                const pixelY = offsetY + tile.gridY * TILE_SIZE;

                ctx.save();
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Count badge, upper left corner
                const radius = 9;
                const badgeX = pixelX + radius + 3;
                const badgeY = pixelY + radius + 3;
                ctx.fillStyle = '#4ecdc4';
                ctx.beginPath();
                ctx.arc(badgeX, badgeY, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#1a1a1a';
                ctx.font = "600 12px 'Nunito', Arial, sans-serif";
                ctx.fillText(String(stack.length), badgeX, badgeY);

                // Selected train's position in the stack, centred on the square
                const selectedIndex = getSelectedStackIndex(tile.gridX, tile.gridY);
                if (selectedIndex > 0) {
                    const centerX = pixelX + TILE_SIZE / 2;
                    const centerY = pixelY + TILE_SIZE / 2;
                    ctx.fillStyle = 'rgba(26, 26, 26, 0.8)';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#4ecdc4';
                    ctx.font = "600 18px 'Nunito', Arial, sans-serif";
                    ctx.fillText(String(selectedIndex), centerX, centerY);
                }

                ctx.restore();
            });
        }

        // Which tile a click on this square should grab. Clicking a stack that is
        // already selected advances to the next train in it, so repeated clicks
        // cycle through the whole stack and wrap around.
        function pickTileForClick(gridX, gridY) {
            if (currentPaletteTab === 'objects') {
                const stack = getTrainStackAt(gridX, gridY);
                if (stack.length > 0) {
                    let index = 0;
                    if (selectedTile && selectedTile.layer === 'objects' &&
                        selectedTile.gridX === gridX && selectedTile.gridY === gridY) {
                        const current = stack.findIndex(t => t.trainId === selectedTile.trainId);
                        if (current >= 0) index = (current + 1) % stack.length;
                    }
                    return stack[index];
                }
            }
            return getTileAtGrid(gridX, gridY, currentPaletteTab);
        }

        // 1-based position of the selected train within the stack on that square,
        // or 0 when the square's stack isn't the current selection.
        function getSelectedStackIndex(gridX, gridY) {
            if (!selectedTile || selectedTile.layer !== 'objects') return 0;
            if (selectedTile.gridX !== gridX || selectedTile.gridY !== gridY) return 0;

            const index = getTrainStackAt(gridX, gridY)
                .findIndex(tile => tile.trainId === selectedTile.trainId);
            return index >= 0 ? index + 1 : 0;
        }

        function getTrackUnderTrain(trainTile) {
            if (!trainTile || trainTile.layer !== 'objects') return null;
            return getTileAtGrid(trainTile.gridX, trainTile.gridY, 'tracks');
        }

        function getDirectionOptionsForTrack(trackTile) {
            if (!trackTile || !trackTile.tileType) return [];

            const trackId = trackTile.tileType.id;

            // Directions represent the side of the tile the train can EXIT from.
            // The checkbox is placed on the corresponding side of the direction grid square.
            // Based on actual arc geometry (where tracks meet tile edges):
            //   BR: arc centered bottom-right, track exits at right edge and bottom edge
            //   BL: arc centered bottom-left, track exits at left edge and bottom edge
            //   TR: arc centered top-right, track exits at right edge and top edge
            //   TL: arc centered top-left, track exits at left edge and top edge
            switch(trackId) {
                case 'horizontal_track':
                    return ['left', 'right'];
                case 'vertical_track':
                    return ['top', 'bottom'];
                case 'curved_track_br':
                    return ['right', 'bottom'];
                case 'curved_track_bl':
                    return ['left', 'bottom'];
                case 'curved_track_tr':
                    return ['right', 'top'];
                case 'curved_track_tl':
                    return ['left', 'top'];
                case 'cross_track':
                    return ['top', 'right', 'bottom', 'left'];
                default:
                    return [];
            }
        }

        function getOppositeDirection(direction) {
            const opposites = {
                'top': 'bottom',
                'bottom': 'top',
                'left': 'right',
                'right': 'left'
            };
            return opposites[direction];
        }

        function getNextPositionInDirection(gridX, gridY, direction) {
            switch(direction) {
                case 'top': return { x: gridX, y: gridY - 1 };
                case 'bottom': return { x: gridX, y: gridY + 1 };
                case 'left': return { x: gridX - 1, y: gridY };
                case 'right': return { x: gridX + 1, y: gridY };
                default: return { x: gridX, y: gridY };
            }
        }

        function getExitDirection(trackTile, entryDirection) {
            if (!trackTile || !trackTile.tileType) return null;

            const trackId = trackTile.tileType.id;

            // Map of track types to their connections (entry side → exit side)
            // Based on actual geometry of where arcs meet tile edges:
            // BR: arc centered bottom-right, connects right edge and bottom edge
            // BL: arc centered bottom-left, connects left edge and bottom edge
            // TR: arc centered top-right, connects right edge and top edge
            // TL: arc centered top-left, connects left edge and top edge
            const connections = {
                'horizontal_track': { 'left': 'right', 'right': 'left' },
                'vertical_track': { 'top': 'bottom', 'bottom': 'top' },
                'curved_track_br': { 'right': 'bottom', 'bottom': 'right' },
                'curved_track_bl': { 'left': 'bottom', 'bottom': 'left' },
                'curved_track_tr': { 'right': 'top', 'top': 'right' },
                'curved_track_tl': { 'left': 'top', 'top': 'left' },
                'cross_track': { 'top': 'bottom', 'bottom': 'top', 'left': 'right', 'right': 'left' }
            };

            const trackConnections = connections[trackId];
            if (!trackConnections) return null;

            return trackConnections[entryDirection] || null;
        }

        function getActualExitSide(trackId, directionValue) {
            // The direction UI checkbox position indicates where the train is HEADING.
            // For curved tracks the checkbox positions (from getDirectionOptionsForTrack)
            // are placed at the opposite visual side, so we map them to the actual
            // tile edge the train exits from.
            //
            // Curved track connections (actual tile edges):
            //   BR: right edge and bottom edge
            //   BL: left edge and bottom edge
            //   TR: right edge and top edge
            //   TL: left edge and top edge
            //
            // UI checkbox positions (from getDirectionOptionsForTrack):
            //   BR: 'right', 'bottom'  → actual exit sides: right, bottom
            //   BL: 'left', 'bottom'   → actual exit sides: left, bottom
            //   TR: 'right', 'top'     → actual exit sides: right, top
            //   TL: 'left', 'top'      → actual exit sides: left, top

            // For all track types, the direction value maps directly to the exit side
            return directionValue;
        }

        function drawTrainConnection(ctx, fromX, fromY, toX, toY, offsetX, offsetY) {
            const fromPixelX = offsetX + fromX * TILE_SIZE + TILE_SIZE / 2;
            const fromPixelY = offsetY + fromY * TILE_SIZE + TILE_SIZE / 2;
            const toPixelX = offsetX + toX * TILE_SIZE + TILE_SIZE / 2;
            const toPixelY = offsetY + toY * TILE_SIZE + TILE_SIZE / 2;

            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';

            const dx = toX - fromX;
            const dy = toY - fromY;

            if (dx === 0 || dy === 0) {
                ctx.beginPath();
                ctx.moveTo(fromPixelX, fromPixelY);
                ctx.lineTo(toPixelX, toPixelY);
                ctx.stroke();
            } else {
                // Diagonal: a curved track is involved at one of the two positions.
                let curvedTile = null;
                let curvedX = fromX, curvedY = fromY;
                const trackAtFrom = getTileAtGrid(fromX, fromY, 'tracks');
                const trackAtTo = getTileAtGrid(toX, toY, 'tracks');

                if (trackAtFrom && trackAtFrom.tileType && trackAtFrom.tileType.id.startsWith('curved_track_')) {
                    curvedTile = trackAtFrom;
                    curvedX = fromX;
                    curvedY = fromY;
                } else if (trackAtTo && trackAtTo.tileType && trackAtTo.tileType.id.startsWith('curved_track_')) {
                    curvedTile = trackAtTo;
                    curvedX = toX;
                    curvedY = toY;
                }

                if (curvedTile) {
                    const trackId = curvedTile.tileType.id;
                    const tilePixelX = offsetX + curvedX * TILE_SIZE;
                    const tilePixelY = offsetY + curvedY * TILE_SIZE;

                    // Arc center is at the tile corner. All adjacent tile centers
                    // (including the curved tile itself) are at the same distance
                    // from this corner: TILE_SIZE * sqrt(2) / 2.
                    // A single arc at this radius produces a smooth quarter circle
                    // passing through both tile centers with no straight segments.
                    let arcCenterX, arcCenterY;

                    switch(trackId) {
                        case 'curved_track_br':
                            arcCenterX = tilePixelX + TILE_SIZE;
                            arcCenterY = tilePixelY + TILE_SIZE;
                            break;
                        case 'curved_track_bl':
                            arcCenterX = tilePixelX;
                            arcCenterY = tilePixelY + TILE_SIZE;
                            break;
                        case 'curved_track_tr':
                            arcCenterX = tilePixelX + TILE_SIZE;
                            arcCenterY = tilePixelY;
                            break;
                        case 'curved_track_tl':
                            arcCenterX = tilePixelX;
                            arcCenterY = tilePixelY;
                            break;
                    }

                    const radius = TILE_SIZE * Math.SQRT2 / 2;
                    const fromAngle = Math.atan2(fromPixelY - arcCenterY, fromPixelX - arcCenterX);
                    const toAngle = Math.atan2(toPixelY - arcCenterY, toPixelX - arcCenterX);

                    // Take the shorter arc (should be PI/2)
                    let diff = toAngle - fromAngle;
                    while (diff > Math.PI) diff -= 2 * Math.PI;
                    while (diff < -Math.PI) diff += 2 * Math.PI;

                    ctx.beginPath();
                    ctx.arc(arcCenterX, arcCenterY, radius, fromAngle, toAngle, diff < 0);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(fromPixelX, fromPixelY);
                    ctx.lineTo(toPixelX, toPixelY);
                    ctx.stroke();
                }
            }
        }

        function getTrainCarPositions(trainTile, numCars, direction) {
            const positions = [];

            let currentX = trainTile.gridX;
            let currentY = trainTile.gridY;

            const trainTrack = getTileAtGrid(currentX, currentY, 'tracks');
            let currentDirection;

            if (trainTrack && trainTrack.tileType) {
                const actualExit = getActualExitSide(trainTrack.tileType.id, direction);
                const entrySide = getExitDirection(trainTrack, actualExit);

                if (entrySide) {
                    currentDirection = entrySide;
                } else {
                    currentDirection = getOppositeDirection(direction);
                }
            } else {
                currentDirection = getOppositeDirection(direction);
            }

            for (let i = 0; i < numCars; i++) {
                const nextPos = getNextPositionInDirection(currentX, currentY, currentDirection);
                currentX = nextPos.x;
                currentY = nextPos.y;

                if (currentX < 0 || currentX >= GRID_COLS || currentY < 0 || currentY >= GRID_ROWS) {
                    break;
                }

                positions.push({ x: currentX, y: currentY });

                const trackAtPosition = getTileAtGrid(currentX, currentY, 'tracks');
                if (!trackAtPosition) {
                    break;
                }

                const entryDirection = getOppositeDirection(currentDirection);
                const exitDirection = getExitDirection(trackAtPosition, entryDirection);

                if (!exitDirection) {
                    break;
                }

                currentDirection = exitDirection;
            }

            return positions;
        }

        function drawPathStroke(ctx, path, startDist, endDist, strokeStyle = '#000000', lineWidth = 12) {
            if (path.length < 2 || endDist <= startDist) return;

            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();

            let dist = 0;
            let started = false;

            for (let i = 0; i < path.length - 1; i++) {
                const dx = path[i + 1].x - path[i].x;
                const dy = path[i + 1].y - path[i].y;
                const segLen = Math.sqrt(dx * dx + dy * dy);

                const segStart = dist;
                const segEnd = dist + segLen;

                if (segEnd <= startDist) {
                    dist = segEnd;
                    continue;
                }

                if (segStart >= endDist) {
                    break;
                }

                // Clip segment to [startDist, endDist]
                const clipStart = Math.max(startDist, segStart);
                const clipEnd = Math.min(endDist, segEnd);

                const t0 = (clipStart - segStart) / segLen;
                const t1 = (clipEnd - segStart) / segLen;

                const x0 = path[i].x + dx * t0;
                const y0 = path[i].y + dy * t0;
                const x1 = path[i].x + dx * t1;
                const y1 = path[i].y + dy * t1;

                if (!started) {
                    ctx.moveTo(x0, y0);
                    started = true;
                }

                ctx.lineTo(x1, y1);
                dist = segEnd;
            }

            ctx.stroke();
        }

        function directionToAngle(dir) {
            switch(dir) {
                case 'right': return 0;
                case 'left': return Math.PI;
                case 'down': case 'bottom': return Math.PI / 2;
                case 'up': case 'top': return -Math.PI / 2;
                default: return 0;
            }
        }

        function getTrainCarPixelPositions(trainTile, trainId) {
            const numCars = trainId && trainProperties[trainId] && trainProperties[trainId].cars !== undefined
                ? trainProperties[trainId].cars : 3;
            const direction = trainId && trainProperties[trainId] && trainProperties[trainId].direction
                ? trainProperties[trainId].direction : 'right';
            const spacing = trainId && trainProperties[trainId] && trainProperties[trainId].spacing
                ? trainProperties[trainId].spacing : [];

            const headAngle = directionToAngle(direction);

            const firstTrack = getTileAtGrid(trainTile.gridX, trainTile.gridY, 'tracks');
            if (!firstTrack || !firstTrack.tileType) {
                const headX = offsetX + trainTile.gridX * TILE_SIZE + TILE_SIZE / 2;
                const headY = offsetY + trainTile.gridY * TILE_SIZE + TILE_SIZE / 2;
                return { positions: [{ x: headX, y: headY, angle: headAngle }], path: [], lastCarDistance: 0 };
            }

            const actualExit = getActualExitSide(firstTrack.tileType.id, direction);
            const entrySide = getExitDirection(firstTrack, actualExit);

            let backwardPath = [];
            if (entrySide) {
                backwardPath = buildTrackPath(trainTile.gridX, trainTile.gridY, entrySide, firstTrack.tileType.id);
            }

            if (backwardPath.length < 2) {
                const headX = offsetX + trainTile.gridX * TILE_SIZE + TILE_SIZE / 2;
                const headY = offsetY + trainTile.gridY * TILE_SIZE + TILE_SIZE / 2;
                return { positions: [{ x: headX, y: headY, angle: headAngle }], path: backwardPath, lastCarDistance: 0 };
            }

            const positions = [{ x: backwardPath[0].x, y: backwardPath[0].y, angle: headAngle }];
            const totalPathLength = getTotalPathLength(backwardPath);

            let cumulativeDistance = 0;
            for (let i = 1; i < numCars; i++) {
                const spacingVal = spacing[i - 1] != null ? spacing[i - 1] : 59;
                cumulativeDistance += spacingVal;

                if (cumulativeDistance > totalPathLength) {
                    const lastPt = backwardPath[backwardPath.length - 1];
                    const lastSeg = backwardPath.length - 1;
                    const ldx = backwardPath[lastSeg].x - backwardPath[lastSeg - 1].x;
                    const ldy = backwardPath[lastSeg].y - backwardPath[lastSeg - 1].y;
                    positions.push({ x: lastPt.x, y: lastPt.y, angle: Math.atan2(ldy, ldx) + Math.PI });
                } else {
                    const pos = getPositionAlongPath(backwardPath, cumulativeDistance);
                    // Backward path angle points away from head; flip for car facing direction
                    positions.push({ x: pos.x, y: pos.y, angle: pos.angle + Math.PI });
                }
            }

            return { positions: positions, path: backwardPath, lastCarDistance: Math.min(cumulativeDistance, totalPathLength) };
        }

        function renderDirectionControl() {
            if (!selectedTile || selectedTile.tileType.id !== 'train') return '';

            const trackTile = getTrackUnderTrain(selectedTile);
            const directions = getDirectionOptionsForTrack(trackTile);
            const currentDirection = getTrainProperty('direction', directions[0] || 'right');

            let checkboxesHtml = '';

            if (directions.includes('top')) {
                checkboxesHtml += `<input type="checkbox" class="direction-checkbox top" data-direction="top" ${currentDirection === 'top' ? 'checked' : ''}>`;
            }
            if (directions.includes('bottom')) {
                checkboxesHtml += `<input type="checkbox" class="direction-checkbox bottom" data-direction="bottom" ${currentDirection === 'bottom' ? 'checked' : ''}>`;
            }
            if (directions.includes('left')) {
                checkboxesHtml += `<input type="checkbox" class="direction-checkbox left" data-direction="left" ${currentDirection === 'left' ? 'checked' : ''}>`;
            }
            if (directions.includes('right')) {
                checkboxesHtml += `<input type="checkbox" class="direction-checkbox right" data-direction="right" ${currentDirection === 'right' ? 'checked' : ''}>`;
            }

            return `
                <div class="direction-control">
                    <label>Direction:</label>
                    <div class="direction-grid">
                        ${checkboxesHtml}
                    </div>
                </div>
            `;
        }

        function getTrainSpacing() {
            if (!selectedTile) return [];
            const trainId = getTrainId(selectedTile);
            if (!trainId || !trainProperties[trainId]) return [];
            return trainProperties[trainId].spacing || [];
        }

        function getSpacingValue(index) {
            const spacing = getTrainSpacing();
            return spacing[index] != null ? spacing[index] : 59;
        }

        function setSpacingValue(index, value) {
            if (!inspectorTile) return;
            const trainId = getTrainId(inspectorTile);
            if (!trainId) return;

            if (!trainProperties[trainId]) {
                trainProperties[trainId] = {};
            }
            if (!trainProperties[trainId].spacing) {
                trainProperties[trainId].spacing = [];
            }

            trainProperties[trainId].spacing[index] = value;
        }

        function getDragValue(index) {
            if (!selectedTile) return false;
            const trainId = getTrainId(selectedTile);
            if (!trainId || !trainProperties[trainId]) return false;
            const drag = trainProperties[trainId].drag;
            if (!drag) return false;
            return !!drag[index];
        }

        function setDragValue(index, value) {
            if (!inspectorTile) return;
            const trainId = getTrainId(inspectorTile);
            if (!trainId) return;

            if (!trainProperties[trainId]) {
                trainProperties[trainId] = {};
            }
            if (!trainProperties[trainId].drag) {
                trainProperties[trainId].drag = [];
            }

            trainProperties[trainId].drag[index] = value;
        }

        function renderSpacingInputs() {
            const numCars = getTrainProperty('cars', 3);
            if (numCars <= 1) return '';

            let html = '';
            for (let i = 0; i < numCars - 1; i++) {
                const value = getSpacingValue(i);
                html += `<div class="spacing-field">
                    <input type="number" class="spacing-input" data-index="${i}" min="1" max="200" value="${value}">
                </div>`;
            }
            return html;
        }

        function getTextFontSize() {
            if (!selectedTile) return 25;
            const trainId = getTrainId(selectedTile);
            if (!trainId || !trainProperties[trainId]) return 22;
            return trainProperties[trainId].textFontSize != null ? trainProperties[trainId].textFontSize : 22;
        }

        function setTextFontSize(value) {
            if (!inspectorTile) return;
            const trainId = getTrainId(inspectorTile);
            if (!trainId) return;

            if (!trainProperties[trainId]) {
                trainProperties[trainId] = {};
            }

            trainProperties[trainId].textFontSize = value;
        }

        function getTextValue(index) {
            if (!selectedTile) return '';
            const trainId = getTrainId(selectedTile);
            if (!trainId || !trainProperties[trainId]) return '';
            const text = trainProperties[trainId].text;
            if (!text) return '';
            return text[index] || '';
        }

        function setTextValue(index, value) {
            if (!inspectorTile) return;
            const trainId = getTrainId(inspectorTile);
            if (!trainId) return;

            if (!trainProperties[trainId]) {
                trainProperties[trainId] = {};
            }
            if (!trainProperties[trainId].text) {
                trainProperties[trainId].text = [];
            }

            trainProperties[trainId].text[index] = value;
        }

        function renderTextInputs() {
            const numCars = getTrainProperty('cars', 3);

            let html = '';
            for (let i = 0; i < numCars; i++) {
                const value = getTextValue(i);
                html += `<div class="spacing-field">
                    <input type="text" class="text-input" data-index="${i}" value="${value}" maxlength="2">
                </div>`;
            }
            return html;
        }

        function renderDragCheckboxes() {
            const numCars = getTrainProperty('cars', 3);
            const inspectorTileCols = 23;
            const canvasWidth = inspectorTileCols * TILE_SIZE;
            const centerY = TILE_SIZE / 2;

            let totalTrainWidth = TILE_SIZE;
            for (let i = 0; i < numCars - 1; i++) {
                totalTrainWidth += getSpacingValue(i);
            }
            const startX = (canvasWidth - totalTrainWidth) / 2;

            const carPositions = [startX];
            for (let i = 1; i < numCars; i++) {
                carPositions.push(carPositions[i - 1] + getSpacingValue(i - 1));
            }

            let html = '';
            for (let i = 0; i < numCars; i++) {
                const carCenterX = carPositions[i] + TILE_SIZE / 2;
                const left = carCenterX - 8;
                const top = centerY - 8;
                const checked = getDragValue(i) ? ' checked' : '';
                html += `<input type="checkbox" class="drag-checkbox" data-car-index="${i}"${checked} style="left: ${left}px; top: ${top}px;">`;
            }
            return html;
        }

        function renderMathFactsCheckboxes() {
            const numCars = getTrainProperty('cars', 3);
            if (numCars <= 2) return '';

            const inspectorTileCols = 23;
            const canvasWidth = inspectorTileCols * TILE_SIZE;
            const centerY = TILE_SIZE / 2;

            let totalTrainWidth = TILE_SIZE;
            for (let i = 0; i < numCars - 1; i++) {
                totalTrainWidth += getSpacingValue(i);
            }
            const startX = (canvasWidth - totalTrainWidth) / 2;

            const carPositions = [startX];
            for (let i = 1; i < numCars; i++) {
                carPositions.push(carPositions[i - 1] + getSpacingValue(i - 1));
            }

            // Determine which cars are "highlighted" (adjacent to a checked car)
            const highlightedByCheked = new Set();
            for (let i = 1; i < numCars - 1; i++) {
                if (getMathFactValue(i)) {
                    highlightedByCheked.add(i - 1);
                    highlightedByCheked.add(i);
                    highlightedByCheked.add(i + 1);
                }
            }

            let html = '';
            for (let i = 0; i < numCars; i++) {
                // Rule 1: must have at least 1 car before and 1 car after
                if (i === 0 || i === numCars - 1) continue;
                // Rule 2: neither the car before nor after is highlighted by another checkbox
                if (highlightedByCheked.has(i - 1) && !getMathFactValue(i)) continue;
                if (highlightedByCheked.has(i + 1) && !getMathFactValue(i)) continue;

                const carCenterX = carPositions[i] + TILE_SIZE / 2;
                const left = carCenterX - 8;
                const top = centerY - 8;
                const checked = getMathFactValue(i) ? ' checked' : '';
                html += `<input type="checkbox" class="drag-checkbox" data-car-index="${i}"${checked} style="left: ${left}px; top: ${top}px;">`;
            }
            return html;
        }

        function getMathFactValue(index) {
            if (!selectedTile) return false;
            const trainId = getTrainId(selectedTile);
            if (!trainId || !trainProperties[trainId]) return false;
            return trainProperties[trainId].mathFacts && trainProperties[trainId].mathFacts[index] || false;
        }

        function generateMathFact() {
            const op = Math.random() < 0.5 ? '+' : '−';
            let a, b;
            if (op === '+') {
                // Addition: 0-12 range, answer must be > 0, so at least one term must be > 0
                // Generate numbers from 0-12 such that sum is > 0 and sum <= 12
                do {
                    a = Math.floor(Math.random() * 13); // 0-12
                    b = Math.floor(Math.random() * (13 - a)); // ensure sum <= 12
                } while (a + b === 0); // ensure answer > 0
            } else {
                // Subtraction: 0-12 range, answer must be > 0, so a must be > b
                // Pick a from 1-12 (not 0), and b from 0 to a-1
                a = Math.floor(Math.random() * 12) + 1; // 1-12
                b = Math.floor(Math.random() * a); // 0 to a-1, ensures a > b
            }
            return { term1: String(a), operation: op, term2: String(b) };
        }

        // A newly placed train starts with its first math fact checked. Index 1
        // is the first car that can be the middle of a triplet, since a fact
        // needs a car either side of it.
        function applyDefaultMathFact(trainId) {
            if (!trainId) return;

            const props = trainProperties[trainId] || (trainProperties[trainId] = {});
            if (props.mathFacts && props.mathFacts.some(v => v)) return; // already has one

            const index = 1;
            const fact = generateMathFact();
            props.mathFacts = [];
            props.mathFacts[index] = true;
            props.text = props.text || [];
            props.text[index - 1] = fact.term1;
            props.text[index] = fact.operation;
            props.text[index + 1] = fact.term2;
            if (props.textFontSize == null) props.textFontSize = 22;
        }

        function setMathFactValue(index, value) {
            if (!inspectorTile) return;
            const trainId = getTrainId(inspectorTile);
            if (!trainId) return;
            if (!trainProperties[trainId]) trainProperties[trainId] = {};
            if (!trainProperties[trainId].mathFacts) trainProperties[trainId].mathFacts = [];
            if (!trainProperties[trainId].text) trainProperties[trainId].text = [];
            trainProperties[trainId].mathFacts[index] = value;

            if (value) {
                const fact = generateMathFact();
                trainProperties[trainId].text[index - 1] = fact.term1;
                trainProperties[trainId].text[index] = fact.operation;
                trainProperties[trainId].text[index + 1] = fact.term2;
                // Ensure font size is set to the default if not already set
                if (trainProperties[trainId].textFontSize == null) {
                    trainProperties[trainId].textFontSize = 22;
                }
            } else {
                trainProperties[trainId].text[index - 1] = '';
                trainProperties[trainId].text[index] = '';
                trainProperties[trainId].text[index + 1] = '';
            }
        }

        function rebuildMathFactsCheckboxes() {
            const container = document.getElementById('mathfactsCheckboxes');
            if (!container) return;
            container.innerHTML = renderMathFactsCheckboxes();
            container.querySelectorAll('.drag-checkbox').forEach(cb => {
                cb.addEventListener('change', (ev) => {
                    const idx = parseInt(ev.target.dataset.carIndex);
                    setMathFactValue(idx, ev.target.checked);
                    draw();
                    drawInspectorGrid();
                    rebuildMathFactsCheckboxes();
                });
            });
        }

        function renderLightPoleDirectionCheckboxes() {
            // Render checkboxes for 8 directions centered over the light pole in a square arrangement
            const inspectorTileCols = 23;
            const canvasWidth = inspectorTileCols * TILE_SIZE;
            const middleCol = Math.floor(inspectorTileCols / 2);
            const centerX = middleCol * TILE_SIZE + TILE_SIZE / 2;
            const centerY = TILE_SIZE / 2;

            // Get current direction value
            const currentDirection = getLightPoleDirection();

            const distance = 29.5; // Distance from center for square arrangement

            let html = '';

            // Cardinal directions (edges of the square)
            // Top checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="top"${currentDirection === 'top' ? ' checked' : ''} style="left: ${centerX - 8}px; top: ${centerY - distance - 8}px;">`;

            // Bottom checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="bottom"${currentDirection === 'bottom' ? ' checked' : ''} style="left: ${centerX - 8}px; top: ${centerY + distance - 8}px;">`;

            // Left checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="left"${currentDirection === 'left' ? ' checked' : ''} style="left: ${centerX - distance - 8}px; top: ${centerY - 8}px;">`;

            // Right checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="right"${currentDirection === 'right' ? ' checked' : ''} style="left: ${centerX + distance - 8}px; top: ${centerY - 8}px;">`;

            // Diagonal directions (corners of the square)
            // Top-left checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="top-left"${currentDirection === 'top-left' ? ' checked' : ''} style="left: ${centerX - distance - 8}px; top: ${centerY - distance - 8}px;">`;

            // Top-right checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="top-right"${currentDirection === 'top-right' ? ' checked' : ''} style="left: ${centerX + distance - 8}px; top: ${centerY - distance - 8}px;">`;

            // Bottom-left checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="bottom-left"${currentDirection === 'bottom-left' ? ' checked' : ''} style="left: ${centerX - distance - 8}px; top: ${centerY + distance - 8}px;">`;

            // Bottom-right checkbox
            html += `<input type="checkbox" class="drag-checkbox" data-direction="bottom-right"${currentDirection === 'bottom-right' ? ' checked' : ''} style="left: ${centerX + distance - 8}px; top: ${centerY + distance - 8}px;">`;

            return html;
        }

        function getLightPoleDirection() {
            if (!selectedTile) return 'bottom';

            // Use gridX and gridY as unique identifier for light poles
            const key = `${selectedTile.gridX},${selectedTile.gridY}`;

            // Initialize light pole properties if not exists
            if (!window.lightPoleProperties) {
                window.lightPoleProperties = {};
            }

            return window.lightPoleProperties[key] || 'bottom';
        }

        function getLightPoleDirectionByPosition(gridX, gridY) {
            // Get direction for a specific grid position (used during rendering)
            const key = `${gridX},${gridY}`;

            if (!window.lightPoleProperties) {
                window.lightPoleProperties = {};
            }

            return window.lightPoleProperties[key] || 'bottom';
        }

        function lightPoleDirectionToAngle(direction) {
            // Convert light pole direction to rotation angle (in radians)
            // The sprite is oriented for "bottom" by default, so bottom = 0 degrees
            const angles = {
                'bottom': 0,
                'bottom-right': Math.PI / 4,
                'right': Math.PI / 2,
                'top-right': Math.PI * 3 / 4,
                'top': Math.PI,
                'top-left': Math.PI * 5 / 4,
                'left': Math.PI * 3 / 2,
                'bottom-left': Math.PI * 7 / 4
            };
            return angles[direction] || 0;
        }

        function setLightPoleDirection(direction) {
            if (!inspectorTile) return;

            const key = `${inspectorTile.gridX},${inspectorTile.gridY}`;

            if (!window.lightPoleProperties) {
                window.lightPoleProperties = {};
            }

            // Set the single direction value
            window.lightPoleProperties[key] = direction;
            draw();
            drawInspectorGrid(); // Redraw inspector to show updated direction
        }

        function setupLightPoleDirectionListeners() {
            const checkboxes = document.querySelectorAll('#directionCheckboxes .drag-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const direction = e.target.dataset.direction;

                    if (e.target.checked) {
                        // Uncheck all other checkboxes (radio button behavior)
                        checkboxes.forEach(cb => {
                            if (cb !== e.target) {
                                cb.checked = false;
                            }
                        });

                        // Set the selected direction
                        setLightPoleDirection(direction);
                    } else {
                        // If unchecking, clear the direction
                        setLightPoleDirection(null);
                    }
                });
            });
        }

        // Lighting system: compute lit_points each frame
        function computeLitPoints() {
            const litPoints = [];

            // Find all light_pole tiles on the grid
            const lightPoles = trackTiles.filter(t => t.tileType && t.tileType.id === 'light_pole');

            lightPoles.forEach(pole => {
                // A pole that hasn't faded in yet casts no light
                if (!isTileVisible(pole)) return;

                // Get the center of the light pole tile in pixel coordinates
                const poleCenterX = offsetX + pole.gridX * TILE_SIZE + TILE_SIZE / 2;
                const poleCenterY = offsetY + pole.gridY * TILE_SIZE + TILE_SIZE / 2;

                // Get the direction this light is facing
                const direction = getLightPoleDirectionByPosition(pole.gridX, pole.gridY);

                // Convert direction to a unit vector
                // lightPoleDirectionToAngle: bottom=0, clockwise. So:
                // dx = sin(angle), dy = cos(angle) gives the correct direction vector
                const angle = lightPoleDirectionToAngle(direction);
                const dx = Math.sin(angle);
                const dy = Math.cos(angle);

                // The beam endpoint
                const endX = poleCenterX + dx * beam_length;
                const endY = poleCenterY + dy * beam_length;

                // Check intersection with the center line of each track tile
                trackTiles.forEach(track => {
                    if (!track.tileType || track.tileType.id === 'light_pole') return;
                    if (track.tileType.type !== 'track') return;
                    if (!isTileVisible(track)) return; // hasn't faded in yet

                    const trackPixelX = offsetX + track.gridX * TILE_SIZE;
                    const trackPixelY = offsetY + track.gridY * TILE_SIZE;
                    const trackCenterX = trackPixelX + TILE_SIZE / 2;
                    const trackCenterY = trackPixelY + TILE_SIZE / 2;

                    const trackId = track.tileType.id;

                    if (trackId === 'horizontal_track') {
                        // Center line is horizontal at trackCenterY, from trackPixelX to trackPixelX + TILE_SIZE
                        const intersection = lineSegmentIntersection(
                            poleCenterX, poleCenterY, endX, endY,
                            trackPixelX, trackCenterY, trackPixelX + TILE_SIZE, trackCenterY
                        );
                        if (intersection) {
                            litPoints.push({ x: intersection.x, y: intersection.y, trackId: trackId });
                        }
                    } else if (trackId === 'vertical_track') {
                        // Center line is vertical at trackCenterX, from trackPixelY to trackPixelY + TILE_SIZE
                        const intersection = lineSegmentIntersection(
                            poleCenterX, poleCenterY, endX, endY,
                            trackCenterX, trackPixelY, trackCenterX, trackPixelY + TILE_SIZE
                        );
                        if (intersection) {
                            litPoints.push({ x: intersection.x, y: intersection.y, trackId: trackId });
                        }
                    } else if (trackId === 'cross_track') {
                        // Cross track has both horizontal and vertical center lines
                        const hIntersection = lineSegmentIntersection(
                            poleCenterX, poleCenterY, endX, endY,
                            trackPixelX, trackCenterY, trackPixelX + TILE_SIZE, trackCenterY
                        );
                        if (hIntersection) {
                            litPoints.push({ x: hIntersection.x, y: hIntersection.y, trackId: trackId });
                        }
                        const vIntersection = lineSegmentIntersection(
                            poleCenterX, poleCenterY, endX, endY,
                            trackCenterX, trackPixelY, trackCenterX, trackPixelY + TILE_SIZE
                        );
                        if (vIntersection) {
                            litPoints.push({ x: vIntersection.x, y: vIntersection.y, trackId: trackId });
                        }
                    } else if (trackId.startsWith('curved_track_')) {
                        // Curved track center line is an arc at radius TILE_SIZE/2 from the corner
                        const arcRadius = TILE_SIZE / 2;
                        let arcCenterX, arcCenterY, startAngle, endAngle;

                        if (trackId === 'curved_track_br') {
                            arcCenterX = trackPixelX + TILE_SIZE;
                            arcCenterY = trackPixelY + TILE_SIZE;
                            startAngle = Math.PI;
                            endAngle = Math.PI * 3 / 2;
                        } else if (trackId === 'curved_track_bl') {
                            arcCenterX = trackPixelX;
                            arcCenterY = trackPixelY + TILE_SIZE;
                            startAngle = -Math.PI / 2;
                            endAngle = 0;
                        } else if (trackId === 'curved_track_tr') {
                            arcCenterX = trackPixelX + TILE_SIZE;
                            arcCenterY = trackPixelY;
                            startAngle = Math.PI / 2;
                            endAngle = Math.PI;
                        } else if (trackId === 'curved_track_tl') {
                            arcCenterX = trackPixelX;
                            arcCenterY = trackPixelY;
                            startAngle = 0;
                            endAngle = Math.PI / 2;
                        }

                        // Find intersection of beam line with the arc
                        const arcIntersection = lineArcIntersection(
                            poleCenterX, poleCenterY, endX, endY,
                            arcCenterX, arcCenterY, arcRadius, startAngle, endAngle
                        );
                        if (arcIntersection) {
                            litPoints.push({ x: arcIntersection.x, y: arcIntersection.y, trackId: trackId, tileCenterX: trackCenterX, tileCenterY: trackCenterY });
                        }
                    }
                });
            });

            return litPoints;
        }

        // Add interpolated lit_points between nearby existing points
        function addInterpolatedLitPoints(litPoints) {
            const newPoints = [];

            // Check all pairs of lit_points
            for (let i = 0; i < litPoints.length; i++) {
                for (let j = i + 1; j < litPoints.length; j++) {
                    const p1 = litPoints[i];
                    const p2 = litPoints[j];

                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    // If distance is one grid square or less, fill with points full_lit_dist apart
                    if (dist <= TILE_SIZE && dist > full_lit_dist) {
                        const numPoints = Math.floor(dist / full_lit_dist);
                        for (let k = 1; k <= numPoints; k++) {
                            const t = k / (numPoints + 1);
                            newPoints.push({
                                x: p1.x + dx * t,
                                y: p1.y + dy * t
                            });
                        }
                    }
                }
            }

            // Add all new points to the original array
            return litPoints.concat(newPoints);
        }

        // Compute lit value for each train car based on distance to closest lit_point
        // lit = 1 if within full_lit_dist, lit = 0 if beyond not_lit_dist, interpolated in between
        let trainCarLitValues = []; // Array of {trainId, carIndex, lit}
        function computeTrainCarLit(litPoints) {
            trainCarLitValues = [];

            if (isRunMode && typeof trainAnimations !== 'undefined') {
                // Run mode: use animated train positions
                trainAnimations.forEach(train => {
                    for (let i = 0; i < train.numCars; i++) {
                        const cumulativeSpacing = (() => {
                            let s = 0;
                            for (let j = 0; j < i; j++) {
                                s += (train.spacing[j] != null ? train.spacing[j] : 59);
                            }
                            return s;
                        })();
                        const carDist = train.headDistance - cumulativeSpacing;
                        if (carDist < 0 || !train.path || train.path.length < 2) continue;
                        const pos = getPositionAlongPath(train.path, carDist);

                        const lit = computeLitValueForPoint(pos.x, pos.y, litPoints);
                        trainCarLitValues.push({ trainId: train.trainId, carIndex: i, lit: lit });
                    }
                });
            } else if (!isRunMode) {
                // Edit mode: use static train positions
                objectTiles.forEach(tile => {
                    if (!tile.tileType || tile.tileType.id !== 'train') return;
                    const trainId = getTrainId(tile);
                    const trainData = getTrainCarPixelPositions(tile, trainId);

                    trainData.positions.forEach((pos, i) => {
                        const lit = computeLitValueForPoint(pos.x, pos.y, litPoints);
                        trainCarLitValues.push({ trainId: trainId, carIndex: i, lit: lit });
                    });
                });
            }
        }

        function computeLitValueForPoint(x, y, litPoints) {
            // Find closest lit_point
            let minDist = Infinity;
            litPoints.forEach(pt => {
                const dx = x - pt.x;
                const dy = y - pt.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) minDist = dist;
            });

            if (minDist > not_lit_dist) return 0;
            if (minDist < full_lit_dist) return 1;

            // Interpolate between full_lit_dist and not_lit_dist
            return 1 - (minDist - full_lit_dist) / (not_lit_dist - full_lit_dist);
        }

        // Line segment intersection helper
        function lineSegmentIntersection(x1, y1, x2, y2, x3, y3, x4, y4) {
            const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
            if (Math.abs(denom) < 0.0001) return null; // Parallel

            const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
            const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;

            if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
                return {
                    x: x1 + t * (x2 - x1),
                    y: y1 + t * (y2 - y1)
                };
            }
            return null;
        }

        // Line segment to arc intersection helper
        function lineArcIntersection(x1, y1, x2, y2, cx, cy, r, arcStart, arcEnd) {
            // Find intersection points of line segment with circle, then filter by arc range
            const dx = x2 - x1;
            const dy = y2 - y1;
            const fx = x1 - cx;
            const fy = y1 - cy;

            const a = dx * dx + dy * dy;
            const b = 2 * (fx * dx + fy * dy);
            const c = fx * fx + fy * fy - r * r;

            let discriminant = b * b - 4 * a * c;
            if (discriminant < 0) return null;

            discriminant = Math.sqrt(discriminant);
            let closest = null;
            let closestDist = Infinity;

            for (let sign = -1; sign <= 1; sign += 2) {
                const t = (-b + sign * discriminant) / (2 * a);
                if (t < 0 || t > 1) continue;

                const ix = x1 + t * dx;
                const iy = y1 + t * dy;

                // Check if the intersection point is within the arc angle range
                let angle = Math.atan2(iy - cy, ix - cx);

                // Normalize arc range check
                let normStart = arcStart;
                let normEnd = arcEnd;

                // Normalize angle to be within a comparable range
                while (angle < normStart) angle += Math.PI * 2;
                while (angle > normStart + Math.PI * 2) angle -= Math.PI * 2;

                if (angle >= normStart && angle <= normEnd) {
                    const dist = t;
                    if (dist < closestDist) {
                        closestDist = dist;
                        closest = { x: ix, y: iy };
                    }
                }
            }

            return closest;
        }

        function drawSingleInspectorCanvas(canvasEl) {
            if (!canvasEl) return;

            const inspectorCtx = canvasEl.getContext('2d');
            const inspectorTileCols = 23;
            const inspectorTileRows = 1;
            const middleCol = Math.floor(inspectorTileCols / 2);

            // Clear canvas
            inspectorCtx.fillStyle = '#1a1a1a';
            inspectorCtx.fillRect(0, 0, canvasEl.width, canvasEl.height);

            // Draw grid lines
            inspectorCtx.strokeStyle = '#333';
            inspectorCtx.lineWidth = 1;

            for (let row = 0; row <= inspectorTileRows; row++) {
                const y = row * TILE_SIZE;
                inspectorCtx.beginPath();
                inspectorCtx.moveTo(0, y);
                inspectorCtx.lineTo(inspectorTileCols * TILE_SIZE, y);
                inspectorCtx.stroke();
            }

            for (let col = 0; col <= inspectorTileCols; col++) {
                const x = col * TILE_SIZE;
                inspectorCtx.beginPath();
                inspectorCtx.moveTo(x, 0);
                inspectorCtx.lineTo(x, inspectorTileRows * TILE_SIZE);
                inspectorCtx.stroke();
            }

            // If train is selected, draw horizontal tracks across all tiles
            if (selectedTile && selectedTile.tileType && selectedTile.tileType.id === 'train') {
                const horizontalTrackType = TILE_TYPES.find(t => t.id === 'horizontal_track');
                if (horizontalTrackType && horizontalTrackType.render) {
                    for (let col = 0; col < inspectorTileCols; col++) {
                        const pixelX = col * TILE_SIZE;
                        const pixelY = 0;
                        horizontalTrackType.render(inspectorCtx, pixelX, pixelY, TILE_SIZE, false);
                    }
                }
            }

            // Draw the selected tile in the middle
            if (selectedTile && selectedTile.tileType) {
                if (selectedTile.tileType.layer === 'tracks' && selectedTile.tileType.render) {
                    const pixelX = middleCol * TILE_SIZE;
                    const pixelY = 0;
                    selectedTile.tileType.render(inspectorCtx, pixelX, pixelY, TILE_SIZE, false, selectedTile.gridX, selectedTile.gridY);
                } else if (selectedTile.tileType.layer === 'objects') {
                    if (selectedTile.tileType.id === 'train') {
                        const numCars = getTrainProperty('cars', 3);
                        const canvasWidth = inspectorTileCols * TILE_SIZE;
                        const centerY = TILE_SIZE / 2;

                        // Calculate total width using per-car spacing
                        let totalTrainWidth = TILE_SIZE;
                        for (let i = 0; i < numCars - 1; i++) {
                            totalTrainWidth += getSpacingValue(i);
                        }
                        const startX = (canvasWidth - totalTrainWidth) / 2;

                        // Build car positions based on spacing
                        const carPositions = [startX];
                        for (let i = 1; i < numCars; i++) {
                            carPositions.push(carPositions[i - 1] + getSpacingValue(i - 1));
                        }

                        // Draw single connection stroke from first to last car
                        if (numCars > 1) {
                            const firstCenter = carPositions[0] + TILE_SIZE / 2;
                            const lastCenter = carPositions[numCars - 1] + TILE_SIZE / 2;
                            // Straight horizontal path for inspector preview
                            const previewPath = [
                                { x: firstCenter, y: centerY },
                                { x: lastCenter, y: centerY }
                            ];
                            drawPathStroke(inspectorCtx, previewPath, 0, lastCenter - firstCenter);
                        }

                        // Draw each car
                        const dragLinesType = TILE_TYPES.find(t => t.id === 'drag_lines_car');
                        for (let i = 0; i < numCars; i++) {
                            const carPixelX = carPositions[i];
                            if (carPixelX >= 0 && carPixelX + TILE_SIZE <= canvasWidth) {
                                selectedTile.tileType.render(inspectorCtx, carPixelX + 2, 2, TILE_SIZE - 4);
                            }
                        }

                        // Draw drag lines on top of everything
                        for (let i = 0; i < numCars; i++) {
                            const carPixelX = carPositions[i];
                            if (carPixelX >= 0 && carPixelX + TILE_SIZE <= canvasWidth) {
                                const dragEnabled = getDragValue(i);
                                if (dragEnabled && dragLinesType) {
                                    dragLinesType.render(inspectorCtx, carPixelX + 2, 2, TILE_SIZE - 4);
                                }
                            }
                        }

                        // Draw text on top of everything (upright)
                        for (let i = 0; i < numCars; i++) {
                            const carPixelX = carPositions[i];
                            if (carPixelX >= 0 && carPixelX + TILE_SIZE <= canvasWidth) {
                                const text = getTextValue(i);
                                if (text) {
                                    const fontSize = getTextFontSize();
                                    inspectorCtx.save();
                                    inspectorCtx.font = `600 ${fontSize}pt 'Nunito'`;
                                    inspectorCtx.fillStyle = '#000000';
                                    inspectorCtx.textAlign = 'center';
                                    inspectorCtx.textBaseline = 'alphabetic';
                                    const metrics = inspectorCtx.measureText(text);
                                    const textHeight = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent;
                                    inspectorCtx.fillText(text, carPixelX + TILE_SIZE / 2, centerY + textHeight / 2);
                                    inspectorCtx.restore();
                                }
                            }
                        }

                        // Draw math facts highlights on the mathfacts canvas
                        if (canvasEl.id === 'inspectorCanvasMathfacts') {
                            for (let i = 1; i < numCars - 1; i++) {
                                if (getMathFactValue(i)) {
                                    // Highlight the checked car and its neighbors (i-1, i, i+1)
                                    const highlightIndices = [i - 1, i, i + 1].filter(idx => idx >= 0 && idx < numCars);
                                    for (const idx of highlightIndices) {
                                        const carPixelX = carPositions[idx];
                                        if (carPixelX >= 0 && carPixelX + TILE_SIZE <= canvasWidth) {
                                            inspectorCtx.save();
                                            inspectorCtx.strokeStyle = '#4ecdc4';
                                            inspectorCtx.lineWidth = 3;
                                            inspectorCtx.strokeRect(carPixelX + 1, 1, TILE_SIZE - 2, TILE_SIZE - 2);
                                            inspectorCtx.restore();
                                        }
                                    }
                                }
                            }
                        }
                    } else if (selectedTile.tileType.type === 'solid') {
                        const pixelX = middleCol * TILE_SIZE;
                        const pixelY = 0;
                        inspectorCtx.fillStyle = selectedTile.tileType.color;
                        inspectorCtx.fillRect(pixelX + 2, pixelY + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (selectedTile.tileType.type === 'custom' && selectedTile.tileType.render) {
                        const pixelX = middleCol * TILE_SIZE;
                        const pixelY = 0;
                        selectedTile.tileType.render(inspectorCtx, pixelX + 2, pixelY + 2, TILE_SIZE - 4);
                    }
                }
            }
        }

        function drawInspectorGrid() {
            const canvasIds = ['inspectorCanvas', 'inspectorCanvasMathfacts', 'inspectorCanvasLights', 'inspectorCanvasDrag'];
            canvasIds.forEach(id => {
                const el = document.getElementById(id);
                if (el) drawSingleInspectorCanvas(el);
